# Everything below ships inside the upstream quay.io/keycloak/keycloak
# server distribution, not in our event-listener provider jar (whose
# Keycloak deps are compileOnly and don't ship). There's nothing to bump
# in our layer and no fixed version available yet.
vulnerabilities:
  # mssql-jdbc (Keycloak bundles JDBC drivers for all supported DBs; Scout
  # uses postgres, so the SQL Server driver is never loaded)
  - id: CVE-2025-59250 # com.microsoft.sqlserver:mssql-jdbc 13.2.1
  # netty-handler (Keycloak/Quarkus bundles netty; our AWS SDK deps exclude the
  # netty client, so this is upstream only). Fixed in netty 4.1.137.Final, but no
  # Keycloak image ships it yet; drop this on the next base bump that carries it.
  - id: CVE-2026-75595 # io.netty:netty-handler 4.1.136.Final
  # bcprov-jdk18on (Keycloak bundles Bouncy Castle for its own X.509/crypto
  # operations). Fixed upstream in bcprov-jdk18on 1.85, but no Keycloak release
  # bundles it yet - confirmed still present even on keycloak/keycloak's main
  # branch and the current 26.7.4 tag (keycloak/keycloak#52971, #52973 as of
  # 2026-09). Drop these on the next base bump that carries it.
  - id: CVE-2026-8763 # org.bouncycastle:bcprov-jdk18on 1.84 - name constraints bypass
  - id: CVE-2026-13506 # org.bouncycastle:bcprov-jdk18on 1.84 - ASN.1 nesting-depth DoS
  # freemarker (Keycloak's templating engine for emails/themes). Fixed
  # upstream in freemarker 2.3.35, but no Keycloak release bundles it yet -
  # confirmed still present on the current 26.7.4 tag as of 2026-09. Drop
  # this on the next base bump that carries it.
  - id: CVE-2026-84939 # org.freemarker:freemarker 2.3.32

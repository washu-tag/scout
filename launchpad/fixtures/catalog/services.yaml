# Local-dev fixture standing in for the per-service catalog ConfigMaps the
# Ansible roles publish (open-webui, minio, temporal, grafana), so
# `npm run dev` renders a page comparable to a full deployment.
apiVersion: launchpad.scout.xnat.org/v1alpha1
kind: Catalog
chips:
  - id: chat
    title: Chat
    description: AI-powered assistance for Q & A style data queries
    icon: chat
    tone: emerald
    link: { subdomain: chat }
    group: core
    weight: 10
  - id: lake
    title: Lake
    description: Medical data lake storage
    icon: minio
    tone: red
    link: { subdomain: minio }
    group: admin
    weight: 20
    audience: admin
  - id: orchestrator
    title: Orchestrator
    description: Ingestion and characterization workflows
    icon: temporal
    tone: cyan
    link: { subdomain: temporal, path: /auth/sso }
    group: admin
    weight: 30
    audience: admin
  - id: monitor
    title: Monitor
    description: Metrics, logs, and dashboards
    icon: grafana
    tone: orange
    link: { subdomain: grafana }
    group: admin
    weight: 40
    audience: admin

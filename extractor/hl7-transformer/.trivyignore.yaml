# Everything below lives in the upstream spark:4.2.0 base image (its bundled
# jars or ubuntu packages). Revisit these exceptions when upgrading the
# supported Spark/Delta pair and scanning its complete bundled classpath.
vulnerabilities:
  # linux-libc-dev kernel-header CVEs are suppressed by package name in
  # .trivyignore.rego (Trivy ignore-policy), not enumerated here — see #478.
  # netty 4.2.13 family bundled by Spark (plus copies shaded into the
  # yarn-shuffle and connect client jars, which the worker never loads). Our
  # own added netty (in the AWS SDK bundle jar) is bumped to 4.1.138 in the
  # Dockerfile; these entries cover only Spark's copies.
  - id: CVE-2026-44249 # netty-handler
  - id: CVE-2026-45416 # netty-handler
  - id: CVE-2026-45674 # netty-resolver-dns
  - id: CVE-2026-47691 # netty-resolver-dns
  - id: CVE-2026-50010 # netty-handler
  - id: CVE-2026-55831 # netty-codec-http
  - id: CVE-2026-55833 # netty-codec-http
  - id: CVE-2026-56745 # netty-codec-http
  - id: CVE-2026-59901 # netty-codec-compression
  - id: CVE-2026-75595 # netty-handler
  # HTTP/2 decompression refcount leak (direct-memory DoS). Only reachable via
  # DelegatingDecompressorFrameListener, i.e. an HTTP/2 server/client doing
  # content decompression — Spark uses netty for its own RPC/block transfer, and
  # netty-codec-http2 is only on the classpath for the connect/gRPC path the
  # headless worker never starts. Fixed in 4.2.16.
  - id: CVE-2026-56819 # netty-codec-http2
  # derby backs Spark's embedded metastore, which Scout doesn't use (remote
  # HMS); the advisory's 10.16.1.2 was never published to Maven Central
  - id: CVE-2022-46337 # derby 10.16.1.1
  # ReDoS in JLine's interactive built-in `grep` (a REPL command). Spark bundles
  # jline 3.29.0 for spark-shell and hadoop-client-runtime shades 3.9.0; the
  # headless worker never starts a REPL, and neither upstream has moved yet.
  - id: CVE-2026-77422 # org.jline:jline-builtins 3.29.0 (Spark) / 3.9.0 (shaded in hadoop-client-runtime)
  # jackson bundled by Spark (2.21.2, also in the yarn-shuffle jar), parquet-jackson
  # (2.19.2) and hadoop-client-runtime (2.18.6). Fixed in 2.21.7 / 2.22.3; no
  # Spark release ships a fixed Jackson yet.
  - id: CVE-2026-54512 # jackson-databind
  - id: CVE-2026-54513 # jackson-databind
  - id: CVE-2026-68497 # jackson-databind
  # Temporary upstream-bundle risk acceptance, not false positives. See
  # docs/internal/ci-security-scanning.md for exposure and removal conditions.
  - id: CVE-2026-68494
    paths:
      - opt/spark/jars/hadoop-client-runtime-3.5.0.jar
      - opt/spark/jars/parquet-jackson-1.17.0.jar
      - opt/spark/jars/jackson-core-2.21.2.jar
      - opt/spark/yarn/spark-4.2.0-yarn-shuffle.jar
    expired_at: 2026-12-01
    statement: >-
      Upstream Jackson async-parser limit bypass (GHSA-r7wm-3cxj-wff9).
      Scout reads HL7 as text and uses Delta, without an async JSON request
      parser. Accept residual parser DoS risk pending a supported Spark rebuild.
  - id: CVE-2026-89407
    paths:
      - opt/spark/jars/hadoop-client-runtime-3.5.0.jar
      - opt/spark/jars/parquet-jackson-1.17.0.jar
      - opt/spark/jars/jackson-core-2.21.2.jar
      - opt/spark/yarn/spark-4.2.0-yarn-shuffle.jar
    expired_at: 2026-12-01
    statement: >-
      Upstream Jackson numeric-string coercion can consume excessive CPU.
      No JSON request body is ingested by the worker, but transitive parser
      reachability is not ruled out. Accept this risk pending a Spark rebuild.
  - id: CVE-2026-89425
    paths:
      - opt/spark/jars/hadoop-client-runtime-3.5.0.jar
      - opt/spark/jars/parquet-jackson-1.17.0.jar
      - opt/spark/jars/jackson-core-2.21.2.jar
      - opt/spark/yarn/spark-4.2.0-yarn-shuffle.jar
    expired_at: 2026-12-01
    statement: >-
      Upstream Jackson DataInput parsing can exhaust memory on malformed tokens.
      Scout does not directly create DataInput JSON parsers; accept residual
      transitive parser DoS risk pending a supported Spark rebuild.
  - id: CVE-2026-91776
    paths:
      - opt/spark/jars/hadoop-client-runtime-3.5.0.jar
      - opt/spark/jars/parquet-jackson-1.17.0.jar
      - opt/spark/jars/jackson-databind-2.21.2.jar
      - opt/spark/yarn/spark-4.2.0-yarn-shuffle.jar
    expired_at: 2026-12-01
    statement: >-
      Upstream Jackson retains unknown polymorphic type IDs with a fallback.
      Scout does not configure this JSON mapping; accept residual transitive
      deserialization risk pending a supported Spark rebuild.
  - id: CVE-2026-91777
    paths:
      - opt/spark/jars/hadoop-client-runtime-3.5.0.jar
      - opt/spark/jars/parquet-jackson-1.17.0.jar
      - opt/spark/jars/jackson-databind-2.21.2.jar
      - opt/spark/yarn/spark-4.2.0-yarn-shuffle.jar
    expired_at: 2026-12-01
    statement: >-
      Upstream Jackson identity-enabled collections can cause quadratic CPU work.
      Scout does not configure identity-enabled JSON mappings; accept residual
      transitive deserialization risk pending a supported Spark rebuild.
  # jetty-http shaded inside hadoop-client-runtime (jetty 9.4); the fix exists
  # only in jetty 12, which hadoop has not moved to
  - id: CVE-2026-2332 # jetty-http 9.4.58 (shaded in hadoop-client-runtime)
  - id: CVE-2026-10050 # jetty-security 12.1.8 (shaded in spark-core)
  # libthrift fix is a major bump (0.16 → 0.24) coupled to Spark's hive thrift
  # client; every Spark line through master still ships 0.16.0, so there is no
  # base image to move to. The client only ever talks to our own in-cluster
  # metastore, and Spark's HiveThriftServer is never started by the worker.
  - id: CVE-2026-43869 # libthrift 0.16.0
  - id: CVE-2026-43871 # libthrift 0.16.0 (same Thrift advisory batch)
  # jline-remote-telnet (JLine's telnet-server transport, pulled in by Spark's
  # spark-shell / connect REPL and never launched by the headless worker) is
  # suppressed by package name in .trivyignore.rego — its advisory IDs churn
  # (the GHSA aliases flipped to CVE-2026-56740/56741), so per-ID entries here
  # kept going stale.
  # quinn-proto QUIC crate vendored inside the temporalio wheel's compiled Rust
  # bridge (site-packages/temporalio/bridge) — not a Python dep we can override,
  # and the QUIC path is unused (the SDK talks gRPC/HTTP2 to the frontend). The
  # in-range temporalio still bundles 0.11.14; drop when a rebuilt wheel ships 0.11.15.
  - id: GHSA-4w2j-m93h-cj5j # quinn-proto 0.11.14 (vendored in temporalio wheel)

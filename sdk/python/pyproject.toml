[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scout"
version = "0.1.0"
description = "Scout platform Python SDK for notebooks and playbooks"
requires-python = ">= 3.10"
dependencies = [
    "requests>=2.28",
    "sqlalchemy>=2",
    "trino>=0.330",
]

[tool.setuptools.packages.find]
where = ["src"]

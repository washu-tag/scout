name: Renovate

on:
  schedule:
    - cron: '0 6 * * 1' # Weekly Monday 6am UTC
  issues:
    types: [edited]
  pull_request_target:
    types: [edited, closed]
  workflow_dispatch:

permissions: {}

jobs:
  renovate:
    runs-on: ubuntu-latest
    # Refresh after PR closure, Renovate rebase requests, or dashboard edits.
    # Use the base repository's secrets without checking out or running PR code.
    if: >-
      (github.event_name != 'issues' && github.event_name != 'pull_request_target') ||
      (github.event_name == 'issues' && github.event.issue.title == 'Dependency Dashboard') ||
      (github.event_name == 'pull_request_target' && github.event.action == 'closed') ||
      (github.event_name == 'pull_request_target' && github.event.action == 'edited' && startsWith(github.event.pull_request.head.ref, 'renovate/'))
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - uses: renovatebot/github-action@6d26fcf0275dc65624cbc3d51fe78bc773f98321 # v46.3.6
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          LOG_LEVEL: info
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: optional
          RENOVATE_REPOSITORIES: '["washu-tag/scout"]'

name: Recover Release Promotion

# Reuses the exact original identities. This workflow never stamps versions or
# rebuilds artifacts; it can resume a draft, partial aliases, or an already
# published release only when the verified release record agrees.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to resume (X.Y.Z)'
        required: true
        type: string
      revision:
        description: 'Exact stamped source commit (40-character SHA)'
        required: true
        type: string
      producer_run_id:
        description: 'Original successful Post-Commit Tasks run ID'
        required: true
        type: string
      producer_run_attempt:
        description: 'Original successful producer attempt number'
        required: true
        type: string
      boundary_sha:
        description: 'Original lightweight release boundary commit (40-character SHA)'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  promote:
    name: Revalidate and resume exact release promotion
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Identical to release.yaml's mutation job. It is intentionally not the
    # producer CI lock or release.yaml's workflow-wide stamp/build wait lock.
    concurrency:
      group: scout-release-promotion
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Require the trusted main workflow
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          if [ "$REPO" != washu-tag/scout ] || [ "$REF" != refs/heads/main ]; then
            echo "::error::Release recovery requires the trusted washu-tag/scout main workflow."
            exit 1
          fi
      - name: Checkout trusted recovery tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - uses: ./.github/actions/install-hauler-oras
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.0.6'
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Generate the release writer token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Resume verified promotion
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_GH_TOKEN: ${{ steps.app_token.outputs.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          COMMIT_SHA: ${{ inputs.revision }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ inputs.producer_run_attempt }}
          BOUNDARY_SHA: ${{ inputs.boundary_sha }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          python3 tooling/release/promote.py promote \
            --repository "$REPO" --version "$VERSION" --revision "$COMMIT_SHA" \
            --producer-run-id "$PRODUCER_RUN_ID" --producer-run-attempt "$PRODUCER_RUN_ATTEMPT" \
            --boundary-sha "$BOUNDARY_SHA" --public-key cosign.pub \
            --work-dir "$RUNNER_TEMP/promotion"
      - name: Clear only this release PR's pending label
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          REPO: ${{ github.repository }}
          BOUNDARY_SHA: ${{ inputs.boundary_sha }}
        run: |
          set -euo pipefail
          prs="$(gh pr list --repo "$REPO" --state merged \
            --label 'autorelease: pending' --json number,mergeCommit | \
            jq -r --arg boundary "$BOUNDARY_SHA" '.[] | select(.mergeCommit.oid == $boundary) | .number')"
          for pr in $prs; do
            gh pr edit "$pr" --repo "$REPO" --remove-label 'autorelease: pending'
          done
      - name: Record the remaining dev-reset check
        run: |
          {
            echo 'Release promotion was verified and completed.'
            echo 'This recovery workflow does not reset main automatically. If main is still stamped, confirm it is stamped for this release and follow the guarded reset procedure in docs/internal/versions-and-releases.md.'
          } >> "$GITHUB_STEP_SUMMARY"

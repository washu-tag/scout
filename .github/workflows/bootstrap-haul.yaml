# One-time bootstrap for the build-lane haul (ADR 0033, roadmap step 5b-2).
#
# The steady-state publish-haul job (in ci.yaml) carries unchanged components
# from the previous haul, but the FIRST haul has no predecessor, and the publish
# job only pushes CHANGED images, so no normal run ever has all 8 fresh. This
# dispatch resolves every image's current digest, signs it, and builds + publishes
# the first full haul so subsequent builds have a predecessor to carry from.
#
# Run once (again only to re-seed from scratch). Dispatch after the predecessor-
# carry + haul-job PR is merged (it provides build_haul --predecessor).
#
# The sync/save/publish tail is the `.github/actions/publish-haul` composite,
# shared with ci.yaml's publish-haul job and seed-charts.yaml.
name: Bootstrap build-lane haul

on:
  workflow_dispatch:
    inputs:
      superset_tag:
        description: 'Optional override for the superset seed tag; defaults to helm/superset/VERSION'
        default: ''
      keycloak_tag:
        description: 'Optional override for the keycloak seed tag; defaults to keycloak/VERSION'
        default: ''

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  MANIFEST_REPO: ghcr.io/washu-tag/manifests/scout-manifest
  BUNDLE_REPO: ghcr.io/washu-tag/manifests/scout

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install hauler and oras
        uses: ./.github/actions/install-hauler-oras
      - name: Resolve current image digests, sign, and record as fresh
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          SUPERSET_TAG: ${{ inputs.superset_tag }}
          KEYCLOAK_TAG: ${{ inputs.keycloak_tag }}
        run: |
          set -euo pipefail
          mkdir -p digests
          # superset/keycloak have a real semver VERSION file (overridable). The 6
          # Scout images are versioned "latest" in-repo, so seed the newest build-lane
          # tag (0.YYYYMMDD.N), not :latest, or stamp_config fail-closes downstream.
          for name in hl7log-extractor hl7-transformer hl7-listener scout-notebook \
                      launchpad report-viewer superset keycloak; do
            case "${name}" in
              superset) src="${SUPERSET_TAG:-$(cat helm/superset/VERSION)}" ;;
              keycloak) src="${KEYCLOAK_TAG:-$(cat keycloak/VERSION)}" ;;
              # newest build-lane tag (oras reuses the GHCR login + follows pagination).
              # Separate the registry call from the filter so an oras/auth failure is
              # not misreported as a missing tag.
              *)
                tags="$(oras repo tags "${REGISTRY}/washu-tag/${name}")" \
                  || { echo "::error::oras repo tags failed for ${name} (registry/auth error, not a missing tag)"; exit 1; }
                src="$(printf '%s\n' "${tags}" | grep -E '^0\.[0-9]{8}\.[0-9]+$' | sort -V | tail -1 || true)"
                [ -n "${src}" ] || { echo "::error::no build-lane tag (0.YYYYMMDD.N) published for ${name}"; exit 1; } ;;
            esac
            repo="${REGISTRY}/washu-tag/${name}"
            digest="$(docker buildx imagetools inspect "${repo}:${src}" --format '{{json .Manifest}}' | jq -r '.digest')"
            if [ "${digest#sha256:}" = "${digest}" ]; then
              echo "::error::${repo}:${src} not found in ghcr (tag vanished between listing and inspect, or VERSION ahead of last build). Re-run; superset/keycloak also take the *_tag override."
              exit 1
            fi
            cosign sign --key env://COSIGN_PRIVATE_KEY \
              --use-signing-config=false --tlog-upload=false --yes "${repo}@${digest}"
            printf '%s %s@%s\n' "${name}" "${repo}:${src}" "${digest}" > "digests/${name}.txt"
            echo "seeded ${repo}:${src}@${digest}"
          done
      - name: Render the first haul manifest (no predecessor)
        run: |
          set -euo pipefail
          echo "VERSION=0.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          # The OCI charts (in components.txt since #618) aren't published until
          # seed-charts.yaml runs, so the first haul seeds ONLY the 8 images and has
          # no predecessor to carry charts from. Render the images-only subset; the
          # charts/ repos would else fail resolve_refs closed ("neither rebuilt nor
          # carried"). seed-charts then carries these images and folds the charts in.
          grep -v '/charts/' tooling/manifest/components.txt > images-only.txt
          python3 tooling/manifest/build_haul.py \
            --digests-dir digests \
            --components images-only.txt \
            --predecessor "" \
            --name scout > haul.yaml
          echo "--- haul.yaml ---"; cat haul.yaml
      - name: Publish the first haul
        uses: ./.github/actions/publish-haul
        with:
          version: ${{ env.VERSION }}
          core-manifest: haul.yaml
          manifest-repo: ${{ env.MANIFEST_REPO }}
          bundle-repo: ${{ env.BUNDLE_REPO }}
          cosign-private-key: ${{ secrets.COSIGN_PRIVATE_KEY }}
          cosign-password: ${{ secrets.COSIGN_PASSWORD }}

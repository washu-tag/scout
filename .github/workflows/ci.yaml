name: Post-Commit Tasks

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
      - 'ci-**'
      - 'demo**'
    # Skip the release-please PR merge (manifest/CHANGELOG/version.txt only): it publishes
    # nothing and would race version-bump's publish-charts. Push trigger only, so PR checks stand.
    paths-ignore:
      - .release-please-manifest.json
      - CHANGELOG.md
      - version.txt
  # Force a full rebuild and rescan when requested. The frozen plan still binds
  # every build and scan to this attempt, and publication still requires tests.
  workflow_dispatch:
    inputs:
      rebuild_images:
        description: 'Force all images to rebuild; on main, also publish all images and charts'
        type: boolean
        default: false
      values:
        description: 'How Flux receives scout-secret-values'
        type: choice
        options: [sops, plain]
        default: sops

# Hold the main producer lock from predecessor selection through config publication.
# Pending replacement is safe: each surviving run diffs the frozen predecessor,
# including changes from failed/skipped pushes. PRs retain superseded cancellation.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'scout-main-producer' || format('{0}-{1}', github.workflow, github.head_ref || github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JAVA_DIST: 'zulu'
  JAVA_VERSION: '21'
  REGISTRY: ghcr.io
  # /mnt is the runner's large scratch disk (Azure temp); the root fs is smaller
  # and half-full of preinstalled tooling. No built-in env var points at it
  # (RUNNER_TEMP / RUNNER_TOOL_CACHE are on root fs), so name it once and template
  # it into the CI inventory's k3s data-dir -- keeps k3s's image store + PVs off
  # root fs so large pulls don't trigger DiskPressure eviction.
  K3S_DATA_DIR: /mnt/k3s

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      packages: read
    outputs:
      # Every candidate uses the same frozen predecessor and component plan.
      e2e: ${{ steps.plan.outputs.publish == 'true' || steps.filter.outputs.e2e == 'true' }}
      publish: ${{ steps.plan.outputs.publish }}
      release_pr: ${{ steps.filter.outputs.release_pr }}
      hl7log-extractor: ${{ steps.plan.outputs.hl7log-extractor }}
      hl7-transformer: ${{ steps.plan.outputs.hl7-transformer }}
      hl7-listener: ${{ steps.plan.outputs.hl7-listener }}
      scout-notebook: ${{ steps.plan.outputs.scout-notebook }}
      launchpad: ${{ steps.plan.outputs.launchpad }}
      superset: ${{ steps.plan.outputs.superset }}
      keycloak: ${{ steps.plan.outputs.keycloak }}
      report-viewer: ${{ steps.plan.outputs.report-viewer }}
      keycloak-fragment-reconciler: ${{ steps.plan.outputs.keycloak-fragment-reconciler }}
      hl7-transformer-chart: ${{ steps.plan.outputs.hl7-transformer-chart }}
      dcm4chee-chart: ${{ steps.plan.outputs.dcm4chee-chart }}
      hive-metastore-chart: ${{ steps.plan.outputs.hive-metastore-chart }}
      hl7-listener-chart: ${{ steps.plan.outputs.hl7-listener-chart }}
      hl7log-extractor-chart: ${{ steps.plan.outputs.hl7log-extractor-chart }}
      keycloak-config-cli-chart: ${{ steps.plan.outputs.keycloak-config-cli-chart }}
      keycloak-fragment-reconciler-chart: ${{ steps.plan.outputs.keycloak-fragment-reconciler-chart }}
      launchpad-chart: ${{ steps.plan.outputs.launchpad-chart }}
      open-webui-bootstrap-chart: ${{ steps.plan.outputs.open-webui-bootstrap-chart }}
      orthanc-chart: ${{ steps.plan.outputs.orthanc-chart }}
      report-viewer-chart: ${{ steps.plan.outputs.report-viewer-chart }}
      scout-dashboards-chart: ${{ steps.plan.outputs.scout-dashboards-chart }}
      scout-opa-chart: ${{ steps.plan.outputs.scout-opa-chart }}
      temporal-bootstrap-chart: ${{ steps.plan.outputs.temporal-bootstrap-chart }}
      voila-chart: ${{ steps.plan.outputs.voila-chart }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          predicate-quantifier: 'some-with-excludes'
          filters: |
            # Run the deploy/smoke e2e unless the PR touches only docs, markdown,
            # examples, or non-ci workflow files (some-with-excludes makes '!'
            # subtractive). ci.yaml is kept in scope (the exclude spares it): it wires
            # the e2e, so a PR editing it must revalidate. e2e machinery under
            # .github/actions + .github/ci_resources runs too. examples/ is reference
            # material -- nothing deploys it, so it cannot change what the e2e covers.
            e2e:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!examples/**'
              - '!.github/workflows/!(ci.yaml)'
            # release-please's PR is the only thing that touches the manifest, so this
            # is an exact "this is the release PR" signal (release-dispatch.yaml keys off
            # the same file). It turns on scan-published, so a CVE fails the release PR
            # rather than the stamped commit after it.
            release_pr:
              - '.release-please-manifest.json'
            hl7log-extractor:
              - 'extractor/hl7log-extractor/**'
              - 'linting_java_checkstyle.xml'
            hl7-transformer:
              - 'extractor/hl7-transformer/**'
            hl7-listener:
              - 'hl7-listener/**'
            scout-notebook:
              - 'helm/scout-notebook/**'
              - 'sdk/python/**'
              # Built from the repo root, so the root .dockerignore governs its context.
              - '.dockerignore'
            launchpad:
              - 'launchpad/**'
            superset:
              - 'helm/superset/**'
            keycloak:
              - 'keycloak/**'
            report-viewer:
              - 'report-viewer/**'
            keycloak-fragment-reconciler:
              - 'keycloak-fragment-reconciler/**'
            hl7-transformer-chart:
              - 'helm/extractor/hl7-transformer/**'
            dcm4chee-chart:
              - 'helm/dcm4chee/**'
            hive-metastore-chart:
              - 'helm/hive-metastore/**'
            hl7-listener-chart:
              - 'helm/hl7-listener/**'
            hl7log-extractor-chart:
              - 'helm/extractor/hl7log-extractor/**'
            keycloak-config-cli-chart:
              - 'helm/keycloak-config-cli/**'
            keycloak-fragment-reconciler-chart:
              - 'helm/keycloak-fragment-reconciler/**'
            launchpad-chart:
              - 'helm/launchpad/**'
            open-webui-bootstrap-chart:
              - 'helm/open-webui-bootstrap/**'
            orthanc-chart:
              - 'helm/orthanc/**'
            report-viewer-chart:
              - 'helm/report-viewer/**'
            scout-dashboards-chart:
              - 'helm/scout-dashboards/**'
            scout-opa-chart:
              - 'helm/scout-opa/**'
            temporal-bootstrap-chart:
              - 'helm/temporal-bootstrap/**'
            voila-chart:
              - 'helm/voila/**'
      - name: 'Mint build version'
        id: version
        shell: bash
        # 0.YYYYMMDD.<run> ADR 0030 build lane. Computed once (UTC) so every chart
        # in this run shares one version. run_number is scoped to this workflow
        # file, so chart-publish must stay in ci.yaml; moving/renaming it resets
        # the counter and inverts tag order.
        run: echo "version=0.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR for the frozen predecessor
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/install-hauler-oras
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: pip install pyyaml
      - name: Freeze signed predecessor and plan all accumulated changes
        id: plan
        env:
          VERSION: ${{ steps.version.outputs.version }}
          FORCE: ${{ inputs.rebuild_images == true }}
        run: |
          set -euo pipefail
          bash .github/scripts/freeze-predecessor.sh predecessor
          args=()
          if [ "$FORCE" = true ]; then args+=(--force); fi
          python3 tooling/manifest/producer_plan.py create --snapshot predecessor \
            --github-output "$GITHUB_OUTPUT" --predecessor-repository washu-tag/scout "${args[@]}"
      - name: Save this attempt's frozen predecessor and plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: producer-plan-${{ github.run_attempt }}
          path: predecessor/
          if-no-files-found: error
          retention-days: 90
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ ENV.JAVA_DIST }}
          java-version: ${{ ENV.JAVA_VERSION }}
          cache: 'gradle'
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
  verify-cosign-pubkey:
    # cosign.pub in the repo root is the public half of COSIGN_PRIVATE_KEY, and
    # nothing else checks it: derive the key and diff, so a missed rotation or the
    # authoring placeholder fails here instead of breaking verification downstream.
    # No paths filter, since the file goes stale without being touched.
    # Skipped on Dependabot and fork PRs: Dependabot runs only get Dependabot
    # secrets and fork runs get none, so COSIGN_PRIVATE_KEY is empty. The push to
    # main still runs it. Checking the event too, since the auto-merge push actor
    # is also dependabot[bot].
    if: ${{ github.event_name != 'pull_request' || (github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: cosign.pub matches the signing key
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          cosign public-key --key env://COSIGN_PRIVATE_KEY > cosign.pub.derived
          if ! diff -u cosign.pub cosign.pub.derived; then
            echo "::error file=cosign.pub::cosign.pub does not match the signing key. Refresh it (run the export-cosign-pubkey workflow) after a rotation, or replace the authoring placeholder with the real key."
            exit 1
          fi
          echo "cosign.pub matches the derived public key."
  build-and-upload:
    runs-on: ubuntu-latest
    needs: changes
    permissions:
      contents: read
      # check-image-exists reads ghcr for the derived tag; private packages need auth
      packages: read
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: &image-matrix
          - image-name: hl7log-extractor
            subproject: extractor/hl7log-extractor
          - image-name: hl7-transformer
            subproject: extractor/hl7-transformer
          - image-name: hl7-listener
            subproject: hl7-listener
          - image-name: scout-notebook
            subproject: helm/scout-notebook
            # build from repo root so the Dockerfile can COPY sdk/python/ (the
            # Dockerfile path derives from `subproject`; see docker-build-cache)
            context: '.'
          - image-name: launchpad
            subproject: launchpad
          - image-name: superset
            subproject: helm/superset
            allow-failure: true
          - image-name: keycloak
            subproject: keycloak
          - image-name: report-viewer
            subproject: report-viewer
          - image-name: keycloak-fragment-reconciler
            subproject: keycloak-fragment-reconciler
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Build/Cache Image - ${{ matrix.image-name }}'
        if: needs.changes.outputs[matrix.image-name] == 'true'
        uses: ./.github/actions/docker-build-cache
        with:
          subproject: ${{ matrix.subproject }}
          image-name: ${{ matrix.image-name }}
          context: ${{ matrix.context || '' }}
  unit-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ ENV.JAVA_DIST }}
          java-version: ${{ ENV.JAVA_VERSION }}
          cache: 'gradle'
      - name: 'Unit tests: hl7log-extractor'
        shell: bash
        run: cd extractor/hl7log-extractor && ./gradlew test
      - name: 'Unit tests: keycloak event-listener'
        shell: bash
        run: cd keycloak/event-listener && ./gradlew test
  hl7-transformer-unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Spark 4.1.x runs on Java 17 or 21; use the repo default JAVA_VERSION (21) like
      # every other Java job. Spark/Delta versions are read from the package's
      # pyproject.toml, so this job pins no versions.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ ENV.JAVA_DIST }}
          java-version: ${{ ENV.JAVA_VERSION }}
      # Python pinned to 3.10 to match the runtime image (spark:4.1.1-...-python3),
      # so tests hit the shipping interpreter -- matters for version-sensitive
      # behavior like concurrent.futures TimeoutError (a distinct class before 3.11).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'extractor/hl7-transformer/pyproject.toml'
      - name: 'Unit tests: hl7-transformer'
        shell: bash
        # Same install path as the runtime image and local runs: deps (incl.
        # pinned Spark/Delta) resolve from pyproject.toml via pip.
        run: cd extractor/hl7-transformer && python -m pip install '.[test]' && python -m pytest tests/ -v
  ansible-and-python-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: report_viewer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install Molecule and dependencies
        run: |
          pip install molecule ansible-core pytest pydantic tiktoken httpx pytest-asyncio trino requests
      - name: 'Unit tests: build manifest'
        shell: bash
        run: cd tooling/manifest && pytest -v
      - name: 'Unit tests: config-artifact tooling'
        shell: bash
        run: cd tooling/deploy && pytest -v
      - name: 'Version copies agree with versions.yaml'
        shell: bash
        run: cd tooling/versions && pytest -v
      - name: 'Unit tests: filter plugins'
        shell: bash
        run: cd ansible && pytest tests/unit/filter_plugins/ -v
      - name: 'Unit tests: Open WebUI link sanitizer filter'
        shell: bash
        run: cd helm/open-webui-bootstrap && PYTHONPATH=files/payloads pytest tests/test_link_sanitizer_filter.py -v
      - name: 'Unit tests: Open WebUI ui-defaults event function'
        shell: bash
        run: cd helm/open-webui-bootstrap && PYTHONPATH=files/payloads pytest tests/test_scout_ui_defaults_event.py -v
      - name: 'Unit tests: Open WebUI report-viewer tool'
        shell: bash
        run: cd helm/open-webui-bootstrap && PYTHONPATH=files/payloads pytest tests/test_scout_report_viewer_tool.py -v
      - name: 'Unit tests: report-viewer'
        shell: bash
        env:
          REPORT_VIEWER_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/report_viewer_test
        run: cd report-viewer && pip install -e '.[dev]' && pytest -v
      - name: 'Unit tests: keycloak-fragment-reconciler'
        shell: bash
        run: cd keycloak-fragment-reconciler && pip install -e '.[test]' && pytest -v
      - name: 'Example pluggable app: fragment passes the reconciler'
        shell: bash
        run: .github/scripts/check-example-fragment.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            report-viewer/frontend/package-lock.json
            launchpad/package-lock.json
      - name: 'Frontend build: report-viewer SPA'
        shell: bash
        run: cd report-viewer/frontend && npm ci && npm run build
      - name: 'Unit tests: launchpad'
        shell: bash
        run: cd launchpad && npm ci && npm test
      - name: 'Unit tests: verify-node'
        shell: bash
        run: cd verify-node && pytest tests/ -v
      - name: 'Unit tests: scout SDK'
        shell: bash
        run: cd sdk/python && PYTHONPATH=src pytest tests/ -v
      # Separate invocation: conftest.py stubs trino/requests in sys.modules at
      # collection; the contract tests need the real ones.
      - name: 'Contract tests: scout SDK vs trino-python-client'
        shell: bash
        run: cd sdk/python && pytest tests_contract/ -v
      - name: 'Unit tests: Voila chart helpers'
        shell: bash
        run: cd helm/voila && PYTHONPATH=files pytest tests/ -v
      - name: 'Install OPA'
        shell: bash
        # Pinned to the deployed OPA image (opa_image_tag in versions.yaml):
        # builtin behavior (regex.match, http.send) drifts across versions, so
        # test against the same binary prod evaluates under.
        run: |
          OPA_VERSION=$(yq '.opa_image_tag' ansible/group_vars/all/versions.yaml)
          # openpolicyagent.org/downloads proxies to this asset but has been 502ing; fetch it directly.
          curl -fsSL --retry 3 --retry-all-errors -o /tmp/opa \
            "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static"
          chmod +x /tmp/opa
          sudo mv /tmp/opa /usr/local/bin/opa
          opa version
      - name: 'Unit tests: OPA policy (Trino AuthZ)'
        shell: bash
        run: opa test policy/ -v
      - name: 'Molecule tests: postgres role'
        shell: bash
        run: cd ansible/roles/postgres && molecule test -s default
      - name: 'Molecule tests: scout_common role'
        shell: bash
        run: cd ansible/roles/scout_common && molecule test -s default
  scan-images:
    runs-on: ubuntu-latest
    needs: [changes, build-and-upload]
    env:
      VERSION: ${{ needs.changes.outputs.version }}
    if: ${{ !cancelled() && needs.build-and-upload.result == 'success' }}
    permissions:
      contents: read
      # An image that build-and-upload did not rebuild is scanned from the
      # registry instead; packages are private, so the pull needs a token.
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include: *image-matrix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Download this attempt's frozen producer plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: producer-plan-${{ github.run_attempt }}
          path: predecessor
      - uses: ./.github/actions/trivy-scan-image
        with:
          image-name: ${{ matrix.image-name }}
          subproject: ${{ matrix.subproject }}
          scan-published: ${{ needs.changes.outputs.release_pr }}
          allow-vulnerabilities: ${{ matrix.allow-failure == true }}
  prepare-flux-artifacts:
    runs-on: ubuntu-latest
    needs:
      - changes
      - build-and-upload
    if: ${{ success() && (github.event_name != 'pull_request' || needs.changes.outputs.e2e == 'true') }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      VERSION: ${{ needs.changes.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Free candidate storage
        run: |-
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/share/swift /opt/ghc
          sudo apt-get clean
          docker system prune -af --volumes
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: ./.github/actions/install-hauler-oras
      - uses: ./.github/actions/start-registry
      - name: Download this attempt's producer plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: producer-plan-${{ github.run_attempt }}
          path: predecessor
      - name: Download this attempt's built images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: '*-attempt-${{ github.run_attempt }}'
          path: images
          merge-multiple: true
      - name: Assemble immutable images, charts and config
        run: python3 .github/scripts/prepare-flux-artifacts.py --images images --predecessor predecessor --output candidate --registry "$CI_REGISTRY"
      - name: Save candidate metadata, charts and config
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flux-candidate-${{ github.run_attempt }}
          path: |
            candidate/
            !candidate/images/**
          if-no-files-found: error
          retention-days: 7
      - name: Save canonical candidate images
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flux-images-${{ github.run_attempt }}
          path: candidate/images/
          if-no-files-found: error
          retention-days: 7

  deploy-and-test-flux:
    name: deploy-and-test-flux (${{ matrix.leg }})
    needs:
      - changes
      - prepare-flux-artifacts
    if: ${{ success() && (github.event_name != 'pull_request' || needs.changes.outputs.e2e == 'true') }}
    permissions:
      contents: read
      packages: read
    env:
      VERSION: ${{ needs.changes.outputs.version }}
      LEG: ${{ matrix.leg }}
      ARTIFACT_MODE: candidate
      IDENTITY_REPOSITORY: ${{ github.repository }}
      IDENTITY_RUN_ID: ${{ github.run_id }}
      IDENTITY_RUN_ATTEMPT: ${{ github.run_attempt }}
      TESTED_SHA: ${{ github.sha }}
      VALUES_MODE: ${{ inputs.values || 'sops' }}
      MANIFEST_REPO: ghcr.io/washu-tag/manifests/scout-manifest
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        leg:
          - ingest
          - auth
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Free candidate storage
        run: |-
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/share/swift /opt/ghc
          sudo apt-get clean
          docker system prune -af --volumes
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Download the tested candidate metadata and charts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: flux-candidate-${{ github.run_attempt }}
          path: candidate
      - name: Download the tested candidate images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: flux-images-${{ github.run_attempt }}
          path: candidate/images
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Check the leg against the DAG
        run: python3 .github/ci_resources/flux/check_legs.py
      - uses: ./.github/actions/install-flux
      - uses: ./.github/actions/install-sops-age
      - uses: ./.github/actions/install-hauler-oras
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Set up Java for Gradle cache warming
        if: matrix.leg == 'ingest'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: ${{ env.JAVA_DIST }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Start Gradle cache warming
        if: matrix.leg == 'ingest'
        shell: bash
        run: |
          (if bash -c '
            set -e
            (cd tests/ingest && ./gradlew --no-daemon --console=plain testClasses resolveTestDeps)
            sudo mkdir -p /mnt/scout-gradle-cache
            sudo cp -a "${HOME}/.gradle/." /mnt/scout-gradle-cache/
            sudo chmod -R a+rwX /mnt/scout-gradle-cache
            rm -rf tests/ingest/build tests/ingest/.gradle  # keep pod mount a clean checkout
          ' >/tmp/gradle-warm.log 2>&1; then echo 0; else echo 1; fi >/tmp/gradle-warm.rc) </dev/null >/dev/null 2>&1 &
      - name: Prepare inventory.yaml
        shell: bash
        run: |
          NODE_IP=$(hostname -I | awk '{print $1}')
          echo "NODE_IP=${NODE_IP}" >> "$GITHUB_ENV"
          sed -e "s/HOSTNAME/$(hostname)/" -e "s/K3S_TOKEN/$(openssl rand -hex 16)/" \
            -e "s:WORK_DIR:$(pwd):" -e "s/NODE_IP/$NODE_IP/g" \
            -e "s:K3S_DATA_DIR:$K3S_DATA_DIR:g" \
            .github/ci_resources/inventory.yaml > ansible/inventory.yaml
      - name: ansible-galaxy dependencies
        shell: bash
        run: cd ansible && sudo -E /opt/pipx_bin/ansible-galaxy install -r collections/requirements.yaml
      - name: Install Python dependencies for Ansible Kubernetes modules
        run: /opt/pipx/venvs/ansible-core/bin/python -m pip install kubernetes
      - uses: ./.github/actions/start-registry
        with:
          host: ${{ env.NODE_IP }}
      - name: Require the current attempt's candidate
        run: python3 .github/scripts/copy-flux-artifacts.py validate --candidate candidate
      - name: Load the candidate into the test registry
        run: |-
          python3 .github/scripts/copy-flux-artifacts.py test --candidate candidate --registry "$CI_REGISTRY"
      - name: Install k3s
        shell: bash
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        run: |
          set -euo pipefail
          (cd ansible && sudo -E /opt/pipx_bin/ansible-playbook -v -i inventory.yaml --diff playbooks/k3s.yaml)
          # The playbook (run as root with the runner's HOME) leaves ~/.kube root-owned.
          sudo mkdir -p "$HOME/.kube"
          sudo cp /etc/rancher/k3s/k3s.yaml "$HOME/.kube/config"
          sudo chown -R "$(id -u):$(id -g)" "$HOME/.kube"
          chmod 600 "$HOME/.kube/config"
          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"
          # The playbook removes registry mirrors when no staging node is configured.
          printf 'mirrors:\n  "ghcr.io":\n    endpoint: ["http://%s"]\n' "$CI_REGISTRY" | sudo tee /etc/rancher/k3s/registries.yaml >/dev/null
          sudo systemctl restart k3s
          export KUBECONFIG="$HOME/.kube/config"
          timeout 120 bash -c 'until kubectl get nodes >/dev/null 2>&1; do sleep 2; done'
          kubectl wait --for=condition=Ready nodes --all --timeout=5m
          KUBECONFIG="$HOME/.kube/config" kubectl get nodes -o wide
      - name: Bootstrap authentication TLS and ingress
        if: matrix.leg == 'auth'
        run: bash .github/ci_resources/flux/bootstrap_auth.sh
      - name: Set up Node for authentication tests
        if: matrix.leg == 'auth'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/auth/package-lock.json
      - name: Install browser test dependencies
        if: matrix.leg == 'auth'
        working-directory: tests/auth
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify and sign the exact candidate config
        shell: bash
        run: |-
          set -euo pipefail
          export CONFIG_SOURCE="${CI_REGISTRY}/washu-tag/manifests/scout-config" CONFIG_INSECURE=true
          export CONFIG_DIGEST="$(jq -er .config.digest candidate/index.json)"
          export MANIFEST_DIGEST="$(jq -er .manifest.digest candidate/index.json)"
          export COSIGN_PASSWORD="$(openssl rand -hex 16)"
          (cd "$RUNNER_TEMP" && cosign generate-key-pair)
          cosign sign --key "$RUNNER_TEMP/cosign.key" --allow-http-registry \
            --use-signing-config=false --tlog-upload=false --yes "${CONFIG_SOURCE}@${CONFIG_DIGEST}"
          rm -f "$RUNNER_TEMP/cosign.key"
          bash .github/ci_resources/flux/verify_config.sh
      - name: Install Flux
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/flux-system"; rm -rf "$dir"; mkdir -p "$dir"
          cp .github/ci_resources/flux/flux-system/*.yaml "$dir/"
          cp -R deploy/bootstrap/sops-guard "$dir/sops-guard"
          flux install --export > "$dir/gotk-components.yaml"
          kubectl apply --server-side -k "$dir"
          for d in source-controller kustomize-controller helm-controller notification-controller; do
            kubectl -n flux-system rollout status "deploy/$d" --timeout=5m
          done
          # The flags the proof depends on are live, not just rendered.
          kubectl -n flux-system get deploy kustomize-controller -o jsonpath='{.spec.template.spec.containers[0].args}' \
            | grep -q 'StrictPostBuildSubstitutions=true'
          kubectl -n flux-system get deploy helm-controller -o jsonpath='{.spec.template.spec.containers[0].args}' \
            | grep -q 'UseHelm3Defaults=true'
          flux check
      - name: Build, sign and push the site artifact
        shell: bash
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site"; neg="$RUNNER_TEMP/negative"
          rm -rf "$site" "$neg"; mkdir -p "$site" "$neg"
          cp .github/ci_resources/flux/site/kustomization.yaml "$site/"
          sed -e "s|@CONFIG_SOURCE@|${CONFIG_SOURCE}|g" \
            -e "s|@CONFIG_DIGEST@|${CONFIG_DIGEST}|g" \
            -e "s|insecure: false|insecure: ${CONFIG_INSECURE}|g" \
            .github/ci_resources/flux/site/scout-config-source.yaml > "$site/scout-config-source.yaml"
          kubectl create secret generic scout-cosign-pub -n flux-system \
            --from-file=cosign.pub="$RUNNER_TEMP/cosign.pub"
          jq -s --arg extractor_data_dir "$PWD/tests/ingest/staging_test_data" \
            '.[0] * .[1] | del(._comment) | .extractor_data_dir = $extractor_data_dir' \
            tooling/deploy/fixtures/cluster-vars.values.json \
            .github/ci_resources/flux/cluster-vars.values.json > "$RUNNER_TEMP/cluster-vars.values.json"
          python3 tooling/deploy/gen_cluster_vars.py --values "$RUNNER_TEMP/cluster-vars.values.json" \
            --namespace flux-system -o "$site/cluster-vars.yaml"
          # Ephemeral age key: the private half ends up only in the sops-age Secret.
          umask 077
          age-keygen -o "$RUNNER_TEMP/age.agekey" 2>/dev/null
          recipient="$(age-keygen -y "$RUNNER_TEMP/age.agekey")"
          kubectl -n flux-system create secret generic sops-age --from-file=age.agekey="$RUNNER_TEMP/age.agekey"
          rm -f "$RUNNER_TEMP/age.agekey"
          # Values Secrets are generated owner-only and never printed; an encrypted one is
          # checked for ciphertext only before it leaves this step.
          gen() {  # <file> <name> <namespace>
            python3 tooling/deploy/gen_secret_values.py \
              --values .github/ci_resources/flux/secret-values.json \
              --cluster-vars-values "$RUNNER_TEMP/cluster-vars.values.json" \
              --name "$2" --namespace "$3" -o "$1"
          }
          encrypt() {  # <file>
            sops --disable-version-check --encrypt --age "$recipient" \
              --encrypted-regex '^(data|stringData)$' --in-place "$1"
            python3 .github/ci_resources/flux/assert_encrypted.py "$1" .github/ci_resources/flux/secret-values.json
          }
          if [ "$VALUES_MODE" = plain ]; then
            # Written straight to the cluster, as the vault side would; not in the artifact.
            gen "$RUNNER_TEMP/scout-secret-values.yaml" scout-secret-values flux-system
            kubectl apply -f "$RUNNER_TEMP/scout-secret-values.yaml"
            rm -f "$RUNNER_TEMP/scout-secret-values.yaml"
            sed -i '/scout-secret-values.yaml/d' "$site/kustomization.yaml"
          else
            gen "$site/scout-secret-values.yaml" scout-secret-values flux-system
            encrypt "$site/scout-secret-values.yaml"
          fi
          # The no-decryption negative case's copy, in its own namespace.
          gen "$neg/ci-neg-encrypted.yaml" ci-neg-encrypted ci-negative
          encrypt "$neg/ci-neg-encrypted.yaml"
          flux push artifact "oci://${CI_REGISTRY}/ci-negative:${VERSION}" --path="$neg" \
            --source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --revision="${VERSION}@sha1:${TESTED_SHA}" --insecure-registry
          if [ "$LEG" = auth ]; then
            python3 .github/ci_resources/flux/prepare_auth_site.py \
              --site "$site" --ca "$PLATFORM_CA_CERT" \
              --roots .github/ci_resources/flux/roots-apps-auth.yaml \
              --output "$RUNNER_TEMP/roots-apps.yaml"
          else
            cp .github/ci_resources/flux/roots-apps.yaml "$RUNNER_TEMP/roots-apps.yaml"
          fi
          python3 .github/scripts/copy-flux-artifacts.py patch-roots --candidate candidate \
            --registry "$CI_REGISTRY" --roots "$RUNNER_TEMP/roots-apps.yaml"
          bash .github/ci_resources/flux/publish_site.sh
      - name: Reconcile the verified site and config sources
        shell: bash
        run: |
          set -euo pipefail
          sed -e "s|@REGISTRY@|${CI_REGISTRY}|g" -e "s|@SITE_DIGEST@|${SITE_DIGEST}|g" \
            .github/ci_resources/flux/roots-site.yaml | kubectl apply -f -
          python3 .github/ci_resources/flux/wait_ready.py scout-site-source 600
          # scout-site-source has created scout-config; both sources must verify.
          kubectl -n flux-system wait --for=condition=SourceVerified --timeout=5m \
            ocirepository/scout-site ocirepository/scout-config
          kubectl -n flux-system wait --for=condition=Ready --timeout=5m \
            ocirepository/scout-site ocirepository/scout-config
          # Prove the deployed sources resolved the exact digests selected above.
          check_source() {  # <name> <source> <digest> <public-key-secret>
            kubectl -n flux-system get ocirepository "$1" -o json | jq -e \
              --arg source "oci://$2" --arg digest "$3" --arg key "$4" '
              .spec.url == $source and .spec.ref == {digest: $digest} and
              .spec.verify == {provider: "cosign", secretRef: {name: $key}} and
              .status.observedGeneration == .metadata.generation and
              .status.artifact.revision == $digest' > /dev/null
          }
          check_source scout-site "$SITE_SOURCE" "$SITE_DIGEST" scout-site-cosign-pub
          check_source scout-config "$CONFIG_SOURCE" "$CONFIG_DIGEST" scout-cosign-pub
          # The values Secret holds every key in plaintext (decrypted by kustomize-controller
          # in sops mode). Counts only; no value is printed.
          kubectl -n flux-system get secret scout-secret-values -o json | python3 -c '
          import base64, json, sys
          d = json.load(sys.stdin)["data"]
          enc = [k for k, v in d.items() if base64.b64decode(v).startswith(b"ENC[")]
          print(len(d), "values in Secret flux-system/scout-secret-values,", len(enc), "still ciphertext")
          sys.exit(1 if enc else 0)
          '
      - name: Negative cases
        id: negative
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          sed -e "s|@REGISTRY@|${CI_REGISTRY}|g" -e "s|@VERSION@|${VERSION}|g" \
            .github/ci_resources/flux/negative.yaml > "$RUNNER_TEMP/negative.yaml"
          python3 .github/ci_resources/flux/negative_cases.py "$RUNNER_TEMP/negative.yaml" \
            .github/ci_resources/flux/secret-values.json
      - name: Reconcile the selected leg
        id: reconcile
        shell: bash
        run: |
          set -euo pipefail
          kubectl apply -f "$RUNNER_TEMP/roots-apps.yaml"
          python3 .github/ci_resources/flux/wait_ready.py "$(cat ".github/ci_resources/flux/${LEG}-kustomizations.txt")" 2700
      - name: Images come from mirrored registries
        id: images
        continue-on-error: true
        run: python3 .github/ci_resources/flux/check_images.py
      - name: Wait for Gradle cache warming
        if: matrix.leg == 'ingest'
        shell: bash
        run: |
          while [ ! -f /tmp/gradle-warm.rc ]; do sleep 5; done
          cat /tmp/gradle-warm.log
          exit "$(cat /tmp/gradle-warm.rc)"
      - name: Run ingest tests
        if: matrix.leg == 'ingest'
        shell: bash
        run: |
          cp .github/ci_resources/test_config_template.json tests/ingest/src/test/resources/config/local.json
          sed -i "s:WORK_DIR:$(pwd):" .github/ci_resources/tests-job.yaml
          kubectl apply -f .github/ci_resources/tests-job.yaml
          kubectl wait --for=condition=complete --timeout=1800s job/ci-tests -n scout-extractor &
          completion_pid=$!
          kubectl wait --for=condition=failed --timeout=1800s job/ci-tests -n scout-extractor && exit 1 &
          failure_pid=$!
          wait -n $completion_pid $failure_pid
      - name: Test Logs
        if: always() && matrix.leg == 'ingest' && steps.reconcile.outcome == 'success'
        shell: bash
        run: kubectl -n scout-extractor logs job/ci-tests
      - name: Test Summary
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5
        if: always() && matrix.leg == 'ingest' && steps.reconcile.outcome == 'success'
        with:
          paths: tests/ingest/**/TEST-*.xml
          show: fail, skip
      - name: Logging (extractor)
        if: always() && matrix.leg == 'ingest' && steps.reconcile.outcome == 'success'
        shell: bash
        run: |
          kubectl -n scout-extractor logs deployment/hl7log-extractor --tail=200
          kubectl -n scout-extractor logs deployment/hl7-transformer --tail=200
      - name: Run authentication and data authorization tests
        if: matrix.leg == 'auth'
        env:
          NODE_EXTRA_CA_CERTS: ${{ env.PLATFORM_CA_CERT }}
        run: bash .github/ci_resources/flux/run_auth_tests.sh
      - name: Authentication Job logs
        if: always() && matrix.leg == 'auth' && steps.reconcile.outcome == 'success'
        run: |
          kubectl -n scout-data logs job/data-authz-seed --tail=200 || true
          kubectl -n scout-analytics logs job/data-authz-tests --tail=500 || true
      - name: Authentication browser report
        if: always() && matrix.leg == 'auth'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report-flux-auth-${{ github.run_attempt }}
          path: tests/auth/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Diagnostics
        if: failure() || cancelled() || steps.negative.outcome == 'failure' || steps.images.outcome == 'failure'
        shell: bash
        run: bash .github/ci_resources/flux/diagnose.sh
      - name: Node capacity
        if: always() && steps.reconcile.outcome != 'skipped'
        shell: bash
        run: |
          kubectl describe node | sed -n '/Allocated resources/,/Events:/p'
          kubectl top pods -A --sort-by=memory 2>&1 | head -40
          free -m
      - name: Verdict
        if: always()
        shell: bash
        env:
          NEGATIVE: ${{ steps.negative.outcome }}
          IMAGES: ${{ steps.images.outcome }}
        run: |
          rc=0
          if [ "$NEGATIVE" = "failure" ]; then echo "::error::the negative cases failed (see that step)"; rc=1; fi
          if [ "$IMAGES" = "failure" ]; then echo "::error::an image comes from an unmirrored registry"; rc=1; fi
          exit $rc

  deploy-and-test-e2e:
    runs-on: ubuntu-latest
    needs:
      - changes
      - lint
      - build-and-upload
      - unit-test
      - hl7-transformer-unit
      - ansible-and-python-tests
    # Skip on PRs that change only docs/markdown (see the e2e filter). Always runs
    # on push/schedule/dispatch so main and releases get the full validation.
    if: ${{ success() && (github.event_name != 'pull_request' || needs.changes.outputs.e2e == 'true') }}
    permissions:
      contents: read
      packages: read
    env:
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Prepare inventory.yaml'
        shell: bash
        run: |
          NODE_IP=$(hostname -I | awk '{print $1}')
          sed -e "s/HOSTNAME/$(hostname)/" -e "s/K3S_TOKEN/$(openssl rand -hex 16)/" \
            -e "s:WORK_DIR:$(pwd):" -e "s/NODE_IP/$NODE_IP/g" \
            -e "s:K3S_DATA_DIR:$K3S_DATA_DIR:g" \
            .github/ci_resources/inventory.yaml > ansible/inventory.yaml
      - name: 'ansible-galaxy dependencies'
        shell: bash
        run: cd ansible && sudo -E /opt/pipx_bin/ansible-galaxy install -r collections/requirements.yaml
      - name: Install Python dependencies for Ansible Kubernetes modules
        run: |
          /opt/pipx/venvs/ansible-core/bin/python -m pip install kubernetes
      - name: Install apache2-utils for htpasswd
        # roles/trino/templates/password.db.j2 shells out to `htpasswd -bnBC 10`;
        # ubuntu-latest doesn't ship it.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends apache2-utils
      - name: 'Set up Java for Gradle cache warming'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ ENV.JAVA_DIST }}
          java-version: ${{ ENV.JAVA_VERSION }}
          cache: 'gradle'
      # Resolves ingest test deps for the in-cluster --offline test Job, in the
      # background during the deploy; "Wait for Gradle cache warming" joins it.
      - name: 'Start Gradle cache warming'
        shell: bash
        run: |
          (if bash -c '
            set -e
            (cd tests/ingest && ./gradlew --no-daemon --console=plain testClasses resolveTestDeps)
            sudo mkdir -p /mnt/scout-gradle-cache
            sudo cp -a "${HOME}/.gradle/." /mnt/scout-gradle-cache/
            sudo chmod -R a+rwX /mnt/scout-gradle-cache
            rm -rf tests/ingest/build tests/ingest/.gradle  # keep pod mount a clean checkout
          ' >/tmp/gradle-warm.log 2>&1; then echo 0; else echo 1; fi >/tmp/gradle-warm.rc) </dev/null >/dev/null 2>&1 &
      - name: 'Install k3s'
        shell: bash
        run: |
          cd ansible && sudo -E /opt/pipx_bin/ansible-playbook -v -i inventory.yaml --diff playbooks/k3s.yaml
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ ENV.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 'Push image to k3s - hl7log-extractor'
        uses: ./.github/actions/k3s-image-import-or-pull
        with:
          subproject: extractor/hl7log-extractor
          image-name: hl7log-extractor
      - name: 'Push image to k3s - hl7-transformer'
        uses: ./.github/actions/k3s-image-import-or-pull
        with:
          subproject: extractor/hl7-transformer
          image-name: hl7-transformer
      - name: 'Install helm and helm diff'
        shell: bash
        run: cd ansible && sudo -E /opt/pipx_bin/ansible-playbook -v -i inventory.yaml --diff playbooks/helm.yaml
      - name: 'Install postgres'
        shell: bash
        run: |
          cd ansible && sudo -E /opt/pipx_bin/ansible-playbook -v -i inventory.yaml --diff playbooks/postgres.yaml
      - name: 'Install lake + orchestrator'
        shell: bash
        run: |
          cd ansible && bash ../.github/scripts/run-playbooks.sh "lake+orchestrator"
          sudo -E kubectl describe pod -l v1.min.io/tenant=minio-scout -n scout-data
      - name: 'Install extractor'
        shell: bash
        run: |
          cd ansible && sudo -E /opt/pipx_bin/ansible-playbook -i inventory.yaml --diff playbooks/extractor.yaml
      - name: 'Wait for Gradle cache warming'
        shell: bash
        run: |
          while [ ! -f /tmp/gradle-warm.rc ]; do sleep 5; done
          cat /tmp/gradle-warm.log
          exit "$(cat /tmp/gradle-warm.rc)"
      - name: 'Run tests'
        shell: bash
        run: |
          cp .github/ci_resources/test_config_template.json tests/ingest/src/test/resources/config/local.json
          sed -i "s:WORK_DIR:$(pwd):" .github/ci_resources/tests-job.yaml
          sudo -E kubectl apply -f .github/ci_resources/tests-job.yaml
          sudo -E kubectl wait --for=condition=complete --timeout=1800s job/ci-tests -n scout-extractor &
          completion_pid=$!
          sudo -E kubectl wait --for=condition=failed --timeout=1800s job/ci-tests -n scout-extractor && exit 1 &
          failure_pid=$!
          wait -n $completion_pid $failure_pid
      - name: Test Logs
        shell: bash
        if: always()
        run: |
          sudo -E kubectl -n scout-extractor logs job/ci-tests
      - name: Test Summary
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
        if: always()
        with:
          paths: 'tests/ingest/**/TEST-*.xml'
          show: 'fail, skip'
      - name: Logging (hl7log-extractor)
        shell: bash
        if: always()
        run: |
          sudo -E kubectl -n scout-extractor logs deployment/hl7log-extractor
      - name: Logging (hl7-transformer)
        shell: bash
        if: always()
        run: |
          sudo -E kubectl -n scout-extractor logs deployment/hl7-transformer
  # Required-check gate. deploy-and-test-e2e is conditional, so this always-run
  # job reports the `deploy-and-test` context the ruleset requires: it passes when
  # the e2e succeeded or was legitimately skipped (docs-only PR), and fails when
  # the e2e ran (or should have) and did not succeed.
  deploy-and-test:
    name: deploy-and-test
    needs: [changes, deploy-and-test-e2e, deploy-and-test-flux]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: 'Gate on the e2e result'
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          E2E: ${{ needs.changes.outputs.e2e }}
          EVENT: ${{ github.event_name }}
          RESULT: ${{ needs.deploy-and-test-e2e.result }}
          FLUX: ${{ needs.deploy-and-test-flux.result }}
        run: |
          # Only take the skip-pass path when changes succeeded and definitively
          # reported e2e=false for a PR; otherwise require a real e2e success so a
          # failure or a failed prerequisite (skipped e2e) still blocks the merge.
          if [ "$CHANGES" = "success" ] && [ "$EVENT" = "pull_request" ] && [ "$E2E" = "false" ]; then
            echo "PR changes no deploy/test surface; e2e skipped, gate passes."
            exit 0
          fi
          if [ "$RESULT" = "success" ] && [ "$FLUX" = "success" ]; then
            echo "e2e succeeded."
            exit 0
          fi
          echo "::error::deployment results: Ansible=$RESULT Flux=$FLUX (changes=$CHANGES e2e=$E2E); gate fails."
          exit 1
  # Split across two runners: the full Scout stack + image pinning ran the 72 GB
  # runner into DiskPressure during chatbot's ollama+open-webui pulls, so each
  # side deploys only what it tests. Both install common infra (k3s, traefik,
  # postgres, valkey, auth, lake, trino, launchpad); trino on both so
  # jupyter/voila and chat/superset each query a real coordinator.
  #   analytics  -> superset, chatbot       (+ data-authz, trino-rw netpol)
  #   notebooks  -> voila, jupyter, monitor (+ full netpol incl. voila-ingress)
  # data-authz seed+run is analytics-only (needs superset+chatbot for the full
  # OPA -> Trino-JWT -> row-filter pipeline). auth-curl + NetworkPolicy run on
  # both, each --include-filtered to what it deploys (notebooks adds voila-ingress,
  # which needs the voila Service to resolve its target URL).
  # Playbook names assume PR #409 splits analytics.yaml into trino.yaml + superset.yaml;
  # update matrix.playbooks if naming lands differently.
  # smoke-test's `name:` is explicit so the per-side checks stay
  # smoke-test-analytics / smoke-test-notebooks. They are not required checks (the
  # ruleset requires deploy-and-test + CodeQL), so gating them here is safe: a
  # docs-only PR skips them without blocking the merge.
  smoke-test:
    name: smoke-test-${{ matrix.side }}
    runs-on: ubuntu-latest
    needs:
      - changes
      - lint
      - build-and-upload
    if: ${{ success() && (github.event_name != 'pull_request' || needs.changes.outputs.e2e == 'true') }}
    permissions:
      contents: read
      packages: read
    env:
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    strategy:
      fail-fast: false
      matrix:
        include:
          - side: analytics
            subdomains: superset,chat,keycloak,auth,minio,report-viewer
            san_extra: ''
            # '+' runs playbooks concurrently (.github/scripts/run-playbooks.sh)
            playbooks: k3s traefik postgres valkey auth+lake trino superset+chatbot+report-viewer+launchpad
            netpol_include: '--include trino-rw,opa-trino,report-viewer-ingress'
          - side: notebooks
            # testuser.jupyter is the per-user singleuser pod ingress
            subdomains: jupyter,grafana,keycloak,auth,playbooks,testuser.jupyter
            san_extra: ',DNS:*.jupyter.scout.test'
            playbooks: k3s traefik postgres valkey auth+lake trino voila+jupyter+monitor+launchpad
            netpol_include: '--include trino-rw,opa-trino,voila-ingress'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Generate TLS certificates and configure /etc/hosts'
        shell: bash
        env:
          SUBDOMAINS: ${{ matrix.subdomains }}
          SAN_EXTRA: ${{ matrix.san_extra }}
        run: |
          # Self-signed wildcard cert for *.scout.test (+ *.jupyter.scout.test on
          # the notebook side for the per-user singleuser ingress).
          mkdir -p /tmp/scout-ci-tls
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/scout-ci-tls/key.pem \
            -out /tmp/scout-ci-tls/cert.pem -days 1 -nodes \
            -subj "/CN=scout.test" \
            -addext "subjectAltName=DNS:scout.test,DNS:*.scout.test${SAN_EXTRA}"
          sudo cp /tmp/scout-ci-tls/cert.pem /usr/local/share/ca-certificates/scout-ci.crt
          sudo update-ca-certificates
          # Subdomains this side deploys (root scout.test = launchpad)
          {
            echo "127.0.0.1 scout.test"
            for sub in $(echo "$SUBDOMAINS" | tr ',' ' '); do
              echo "127.0.0.1 ${sub}.scout.test"
            done
          } | sudo tee -a /etc/hosts
      - name: 'Prepare inventory.yaml'
        shell: bash
        run: |
          NODE_IP=$(hostname -I | awk '{print $1}')
          echo "Node IP for CoreDNS: $NODE_IP"
          sed -e "s/HOSTNAME/$(hostname)/" -e "s/K3S_TOKEN/$(openssl rand -hex 16)/" \
            -e "s:WORK_DIR:$(pwd):" -e "s/NODE_IP/$NODE_IP/g" \
            -e "s:K3S_DATA_DIR:$K3S_DATA_DIR:g" \
            .github/ci_resources/inventory.yaml > ansible/inventory.yaml
      - name: 'ansible-galaxy dependencies'
        shell: bash
        run: cd ansible && sudo -E /opt/pipx_bin/ansible-galaxy install -r collections/requirements.yaml
      - name: Install Python dependencies for Ansible Kubernetes modules
        run: /opt/pipx/venvs/ansible-core/bin/python -m pip install kubernetes
      - name: Install apache2-utils for htpasswd
        # roles/trino/templates/password.db.j2 shells out to `htpasswd -bnBC 10`;
        # ubuntu-latest doesn't ship it.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends apache2-utils
      - name: 'Install k3s'
        shell: bash
        run: cd ansible && sudo -E /opt/pipx_bin/ansible-playbook -v -i inventory.yaml --diff playbooks/k3s.yaml
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pre-import only the images each side deploys (common: keycloak,
      # keycloak-fragment-reconciler, launchpad; per-side pushes gate on
      # matrix.side).
      - name: 'Push image to k3s - keycloak'
        uses: ./.github/actions/k3s-image-import-or-pull
        with:
          subproject: keycloak
          image-name: keycloak
      # Not gated on matrix.side: both sides run the auth playbook, which
      # deploys the reconciler unconditionally.
      - name: 'Push image to k3s - keycloak-fragment-reconciler'
        uses: ./.github/actions/k3s-image-import-or-pull
        with:
          subproject: keycloak-fragment-reconciler
          image-name: keycloak-fragment-reconciler
      - name: 'Push image to k3s - launchpad'
        uses: ./.github/actions/k3s-image-import-or-pull
        with:
          subproject: launchpad
          image-name: launchpad
      - name: 'Push image to k3s - superset'
        if: matrix.side == 'analytics'
        uses: ./.github/actions/k3s-image-import-or-pull
        with:
          subproject: helm/superset
          image-name: superset
      - name: 'Push image to k3s - report-viewer'
        if: matrix.side == 'analytics'
        uses: ./.github/actions/k3s-image-import-or-pull
        with:
          subproject: report-viewer
          image-name: report-viewer
      # hl7-transformer image is the vehicle for the data-authz seed Job's Spark +
      # Delta + s3a + Hive client (writes the synthetic test_reports Delta table);
      # the transformer itself isn't deployed here (no extractor playbook).
      - name: 'Push image to k3s - hl7-transformer'
        if: matrix.side == 'analytics'
        uses: ./.github/actions/k3s-image-import-or-pull
        with:
          subproject: extractor/hl7-transformer
          image-name: hl7-transformer
      - name: 'Push image to k3s - scout-notebook'
        if: matrix.side == 'notebooks'
        uses: ./.github/actions/k3s-image-import-or-pull
        with:
          subproject: helm/scout-notebook
          image-name: scout-notebook
      - name: 'Install helm and helm diff'
        shell: bash
        run: cd ansible && sudo -E /opt/pipx_bin/ansible-playbook -v -i inventory.yaml --diff playbooks/helm.yaml
      - name: 'Deploy Scout services'
        shell: bash
        env:
          PLAYBOOKS: ${{ matrix.playbooks }}
        run: |
          cd ansible && bash ../.github/scripts/run-playbooks.sh "$PLAYBOOKS"
      - name: 'Service health checks'
        shell: bash
        env:
          SIDE: ${{ matrix.side }}
        run: |
          echo "=== Checking Hive Metastore ==="
          sudo -E kubectl rollout status deployment/hive-metastore -n scout-data --timeout=180s
          echo "=== Checking Trino ==="
          sudo -E kubectl rollout status deployment/trino-coordinator -n scout-analytics --timeout=180s
          sudo -E kubectl rollout status deployment/trino-worker -n scout-analytics --timeout=180s
          if [ "$SIDE" = "analytics" ]; then
            echo "=== Checking Report Viewer ==="
            sudo -E kubectl rollout status deployment/report-viewer -n scout-analytics --timeout=180s
          fi
          if [ "$SIDE" = "notebooks" ]; then
            echo "=== Checking Voila ==="
            sudo -E kubectl rollout status deployment/voila -n scout-analytics --timeout=180s
            echo "=== Checking Prometheus ==="
            sudo -E kubectl rollout status deployment/prometheus-server -n scout-monitoring --timeout=180s
            echo "=== Checking Grafana ==="
            sudo -E kubectl rollout status deployment/grafana -n scout-monitoring --timeout=180s
            echo "=== Checking Loki ==="
            sudo -E kubectl rollout status statefulset/loki -n scout-monitoring --timeout=180s
          fi
          echo "=== All pods ==="
          sudo -E kubectl get pods -A
      # Auth (PASSWORD,JWT) is required, so the CLI's default http://localhost:8080
      # returns 403. Hit /v1/info on the HTTPS listener (the kubelet readiness
      # endpoint, no auth) to catch "coordinator up but HTTPS not listening". The
      # data-authz Job below exercises the full authenticated query path with a JWT.
      - name: 'Trino connectivity check'
        if: matrix.side == 'analytics'
        shell: bash
        run: |
          sudo -E kubectl exec -n scout-analytics deployment/trino-coordinator -- \
            curl -sk -f https://localhost:8443/v1/info
      # Data authorization tests: seed a synthetic delta.default.test_reports table,
      # then exercise the end-to-end AuthZ pipeline (Keycloak admin -> SPI listener
      # -> MinIO bundle -> OPA pull -> Trino JWT auth + impersonation -> row filter
      # + column mask). See tests/data-authorization/.
      - name: 'Derive hl7-transformer image version'
        if: matrix.side == 'analytics'
        id: hl7-transformer-version
        uses: ./.github/actions/derive-version
        with:
          subproject: extractor/hl7-transformer
      - name: 'Data authorization tests - seed'
        if: matrix.side == 'analytics'
        shell: bash
        env:
          # docker.io/local/... is the in-cluster tag k3s-image-import-or-pull
          # imports under; the production ghcr.io/... ref isn't loaded into k3s.
          IMAGE: docker.io/local/washu-tag/hl7-transformer:${{ steps.hl7-transformer-version.outputs.raw-version }}
        run: |
          set -euo pipefail
          # lake_bucket differs prod ("lake") vs CI ("ci-lake"); read the rendered
          # inventory so the Delta warehouse path matches the provisioned bucket.
          export WAREHOUSE_DIR="s3a://$(yq '.k3s_cluster.vars.lake_bucket' ansible/inventory.yaml)/delta"

          # script in a ConfigMap verbatim (kubectl handles multi-line file
          # content); no template substitution for seed.py.
          sudo -E kubectl create configmap data-authz-seed-script \
            -n scout-data \
            --from-file=seed.py=tests/data-authorization/seed/seed.py \
            --dry-run=client -o yaml | sudo -E kubectl apply -f -

          yq '.spec.template.spec.containers[0].image = strenv(IMAGE)
            | (.spec.template.spec.containers[0].env[]
               | select(.name == "SPARK_SQL_WAREHOUSE_DIR")).value = strenv(WAREHOUSE_DIR)' \
            tests/data-authorization/seed/job.yaml \
            | sudo -E kubectl apply -f -

          KUBECTL='sudo -E kubectl' bash tests/data-authorization/wait-for-job.sh \
            scout-data data-authz-seed 300
      - name: 'Data authorization tests - logs (seed)'
        if: ${{ always() && matrix.side == 'analytics' }}
        shell: bash
        run: |
          sudo -E kubectl -n scout-data logs job/data-authz-seed --tail=200 || true
      - name: 'Data authorization tests - run'
        if: matrix.side == 'analytics'
        shell: bash
        run: |
          set -euo pipefail
          KC_ADMIN_PW=$(yq '.k3s_cluster.vars.keycloak_bootstrap_admin_password' ansible/inventory.yaml)
          SUPERSET_SVC_SECRET=$(yq '.k3s_cluster.vars.keycloak_superset_svc_client_secret' ansible/inventory.yaml)
          REPORT_VIEWER_SVC_SECRET=$(yq '.k3s_cluster.vars.keycloak_report_viewer_svc_client_secret' ansible/inventory.yaml)

          # script in a ConfigMap, secrets in a Secret; the Job references both by
          # name -- no template substitution.
          sudo -E kubectl create configmap data-authz-test-script \
            -n scout-analytics \
            --from-file=run.sh=tests/data-authorization/authz-tests/run.sh \
            --dry-run=client -o yaml | sudo -E kubectl apply -f -

          sudo -E kubectl create secret generic data-authz-test-creds \
            -n scout-analytics \
            --from-literal=KC_ADMIN_PASSWORD="$KC_ADMIN_PW" \
            --from-literal=SUPERSET_SVC_CLIENT_SECRET="$SUPERSET_SVC_SECRET" \
            --from-literal=REPORT_VIEWER_SVC_CLIENT_SECRET="$REPORT_VIEWER_SVC_SECRET" \
            --dry-run=client -o yaml | sudo -E kubectl apply -f -

          sudo -E kubectl apply -f tests/data-authorization/authz-tests/job.yaml

          KUBECTL='sudo -E kubectl' bash tests/data-authorization/wait-for-job.sh \
            scout-analytics data-authz-tests 300
      - name: 'Data authorization tests - logs (run)'
        if: ${{ always() && matrix.side == 'analytics' }}
        shell: bash
        run: |
          sudo -E kubectl -n scout-analytics logs job/data-authz-tests --tail=500 || true
      # Verify OAuth2 Proxy blocks unauthenticated access for this side's
      # subdomains (the script always includes launchpad root).
      - name: 'Auth curl tests'
        shell: bash
        env:
          SUBDOMAINS: ${{ matrix.subdomains }}
        run: bash tests/auth/auth-curl-tests.sh scout.test --include "$SUBDOMAINS"
      - name: 'Auth playwright tests: OWUI iframe defaults'
        if: matrix.side == 'analytics'
        shell: bash
        working-directory: tests/auth
        env:
          SCOUT_HOSTNAME: scout.test
          KEYCLOAK_ADMIN_USER: admin
          NODE_EXTRA_CA_CERTS: /tmp/scout-ci-tls/cert.pem
          PLAYWRIGHT_IGNORE_HTTPS_ERRORS: 'true'
          UNAUTHORIZED_USER_USERNAME: scout-unauthorized-ci-user
          AUTHORIZED_USER_USERNAME: scout-authorized-ci-user
          TEST_USER_PASSWORD: ci-test-user-password-1234
        run: |
          set -euo pipefail
          export KEYCLOAK_ADMIN_PASSWORD=$(yq '.k3s_cluster.vars.keycloak_bootstrap_admin_password' ../../ansible/inventory.yaml)
          npm ci
          npx playwright test owui-iframe-seed.spec.ts
      - name: 'Auth playwright report'
        if: ${{ failure() && matrix.side == 'analytics' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.side }}
          path: tests/auth/playwright-report/
          retention-days: 7
      # Analytics filters to trino-rw (voila not deployed there, so the
      # Traefik->voila allow-path test would 000 on a missing Service); notebooks
      # runs the full suite.
      # TODO: add jupyter-singleuser egress tests once the JupyterHub singleuser
      # pod-selector labels are settled.
      - name: 'NetworkPolicy tests'
        shell: bash
        env:
          NETPOL_INCLUDE: ${{ matrix.netpol_include }}
        run: KUBECTL='sudo -E kubectl' bash tests/network/network-policy-tests.sh $NETPOL_INCLUDE
      - name: 'Debug - pod status'
        if: failure()
        shell: bash
        run: |
          sudo -E kubectl get pods -A
          sudo -E kubectl get events -A --sort-by='.lastTimestamp' | tail -50
      - name: 'Debug - all pod logs'
        if: failure()
        shell: bash
        run: |
          for ns in $(sudo -E kubectl get ns -o jsonpath='{.items[*].metadata.name}'); do
            for pod in $(sudo -E kubectl get pods -n "$ns" -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
              echo "=== $ns/$pod ==="
              sudo -E kubectl logs -n "$ns" "$pod" --all-containers --tail=30 --previous 2>/dev/null || \
              sudo -E kubectl logs -n "$ns" "$pod" --all-containers --tail=30 2>/dev/null || true
            done
          done
  publish:
    if: github.ref_name == 'main' && needs.changes.outputs.publish == 'true' && needs.deploy-and-test.result == 'success' && needs.smoke-test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    needs:
      - changes
      - deploy-and-test
      - scan-images
      - smoke-test
      - prepare-flux-artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Free candidate storage
        run: |-
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/share/swift /opt/ghc
          sudo apt-get clean
          docker system prune -af --volumes
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: ./.github/actions/install-hauler-oras
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Download the tested candidate metadata and charts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: flux-candidate-${{ github.run_attempt }}
          path: candidate
      - name: Download the tested candidate images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: flux-images-${{ github.run_attempt }}
          path: candidate/images
      - name: Require the current attempt's candidate
        run: python3 .github/scripts/copy-flux-artifacts.py validate --candidate candidate
      - name: Publish and sign the tested images
        env:
          GH_TOKEN: ${{ github.token }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: python3 .github/scripts/copy-flux-artifacts.py publish-images --candidate candidate
    env:
      VERSION: ${{ needs.changes.outputs.version }}

  publish-charts:
    if: github.ref_name == 'main' && needs.deploy-and-test.result == 'success' && needs.smoke-test.result == 'success' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs:
      - changes
      - deploy-and-test
      - smoke-test
      - publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - chart-name: hl7-transformer
            image-name: hl7-transformer
            chart-dir: helm/extractor/hl7-transformer
            changed: hl7-transformer-chart
          - chart-name: dcm4chee
            chart-dir: helm/dcm4chee
            changed: dcm4chee-chart
          - chart-name: hive-metastore
            chart-dir: helm/hive-metastore
            changed: hive-metastore-chart
          - chart-name: hl7-listener
            image-name: hl7-listener
            chart-dir: helm/hl7-listener
            changed: hl7-listener-chart
          - chart-name: hl7log-extractor
            image-name: hl7log-extractor
            chart-dir: helm/extractor/hl7log-extractor
            changed: hl7log-extractor-chart
          - chart-name: keycloak-config-cli
            chart-dir: helm/keycloak-config-cli
            changed: keycloak-config-cli-chart
          - chart-name: keycloak-fragment-reconciler
            image-name: keycloak-fragment-reconciler
            chart-dir: helm/keycloak-fragment-reconciler
            changed: keycloak-fragment-reconciler-chart
          - chart-name: launchpad
            image-name: launchpad
            chart-dir: helm/launchpad
            changed: launchpad-chart
          - chart-name: open-webui-bootstrap
            chart-dir: helm/open-webui-bootstrap
            changed: open-webui-bootstrap-chart
          - chart-name: orthanc
            chart-dir: helm/orthanc
            changed: orthanc-chart
          - chart-name: report-viewer
            image-name: report-viewer
            chart-dir: helm/report-viewer
            changed: report-viewer-chart
          - chart-name: scout-dashboards
            image-name: superset
            chart-dir: helm/scout-dashboards
            changed: scout-dashboards-chart
          - chart-name: scout-opa
            chart-dir: helm/scout-opa
            changed: scout-opa-chart
          - chart-name: temporal-bootstrap
            chart-dir: helm/temporal-bootstrap
            changed: temporal-bootstrap-chart
          - chart-name: voila
            image-name: scout-notebook
            chart-dir: helm/voila
            changed: voila-chart
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: ./.github/actions/install-hauler-oras
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Download the tested candidate metadata and charts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: flux-candidate-${{ github.run_attempt }}
          path: candidate
      - name: Require the current attempt's candidate
        run: python3 .github/scripts/copy-flux-artifacts.py validate --candidate candidate
      - name: Publish and sign the tested chart
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: python3 .github/scripts/copy-flux-artifacts.py publish-chart --candidate candidate --chart "$CHART_NAME"
    env:
      VERSION: ${{ needs.changes.outputs.version }}
      CHART_NAME: ${{ matrix.chart-name }}

  publish-demo:
    if: startsWith(github.ref_name, 'demo') && needs.deploy-and-test.result == 'success' && needs.smoke-test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    needs: [changes, deploy-and-test, scan-images, smoke-test]
    steps:
      - name: Checkout GitHub Action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ ENV.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Free up disk space
        shell: bash
        run: |
          echo "Disk space before cleanup:"
          df -h

          echo "Removing unnecessary tools to free up disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/ghc
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          docker system prune -af --volumes

          echo "Disk space after cleanup:"
          df -h
      - name: 'Push Image - scout-notebook'
        if: needs.changes.outputs.scout-notebook == 'true'
        uses: ./.github/actions/docker-push
        with:
          image-name: scout-notebook
      - name: 'Push Image - hl7log-extractor'
        if: needs.changes.outputs.hl7log-extractor == 'true'
        uses: ./.github/actions/docker-push
        with:
          image-name: hl7log-extractor
      - name: 'Push Image - hl7-transformer'
        if: needs.changes.outputs.hl7-transformer == 'true'
        uses: ./.github/actions/docker-push
        with:
          image-name: hl7-transformer
      - name: 'Push Image - hl7-listener'
        if: needs.changes.outputs.hl7-listener == 'true'
        uses: ./.github/actions/docker-push
        with:
          image-name: hl7-listener
      - name: 'Push Image - launchpad'
        if: needs.changes.outputs.launchpad == 'true'
        uses: ./.github/actions/docker-push
        with:
          image-name: launchpad
      - name: 'Push Image - superset'
        if: needs.changes.outputs.superset == 'true'
        uses: ./.github/actions/docker-push
        with:
          image-name: superset
      - name: 'Push Image - keycloak'
        if: needs.changes.outputs.keycloak == 'true'
        uses: ./.github/actions/docker-push
        with:
          image-name: keycloak
      - name: 'Push Image - report-viewer'
        if: needs.changes.outputs.report-viewer == 'true'
        uses: ./.github/actions/docker-push
        with:
          image-name: report-viewer
      - name: 'Push Image - keycloak-fragment-reconciler'
        if: needs.changes.outputs.keycloak-fragment-reconciler == 'true'
        uses: ./.github/actions/docker-push
        with:
          image-name: keycloak-fragment-reconciler

  haul-guard-canary:
    # publish-haul's sync fails closed by counting hauler's "signature verified for
    # image [" log lines; a hauler bump that reworded that would zero the count and
    # block every publish. Assert the string is in the pinned binary here on every
    # PR, so a bump fails RED up front instead of as a cryptic 0/N on a main build.
    # Runs unconditionally (cheap) so it always reports and is safe to mark required.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install-hauler-oras
      - name: Assert the verification success string is present
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -aqF 'signature verified for image [' "$(command -v hauler)"; then
            echo "::error::this hauler build lacks the 'signature verified for image [' success string; update the verified-line guard in publish-haul's sync step to match this version"
            exit 1
          fi
  publish-haul:
    if: github.ref_name == 'main' && needs.publish.result == 'success' && needs.publish-charts.result == 'success'
    runs-on: ubuntu-latest
    needs:
      - changes
      - publish
      - publish-charts
    outputs:
      ready: 'true'
      manifest-digest: ${{ steps.haul.outputs.manifest-digest }}
      bundle-digest: ${{ steps.haul.outputs.bundle-digest }}
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.changes.outputs.version }}
      MANIFEST_REPO: ghcr.io/washu-tag/manifests/scout-manifest
      BUNDLE_REPO: ghcr.io/washu-tag/manifests/scout
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download this attempt's frozen producer plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: producer-plan-${{ github.run_attempt }}
          path: predecessor
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Require a complete current-attempt producer plan
        run: python3 tooling/manifest/producer_plan.py validate --snapshot predecessor
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker Hub
        if: ${{ env.DH_USER != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Install hauler and oras
        uses: ./.github/actions/install-hauler-oras
      - name: Download the tested candidate metadata and charts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: flux-candidate-${{ github.run_attempt }}
          path: candidate
      - name: Require the current attempt's candidate
        run: python3 .github/scripts/copy-flux-artifacts.py validate --candidate candidate
      - name: Publish the haul
        id: haul
        uses: ./.github/actions/publish-haul
        with:
          version: ${{ env.VERSION }}
          core-manifest: candidate/haul.yaml
          upstream-manifest: candidate/haul-upstream.yaml
          manifest-repo: ${{ env.MANIFEST_REPO }}
          bundle-repo: ${{ env.BUNDLE_REPO }}
          producer-plan: predecessor
          advance-main: 'true'
          cosign-private-key: ${{ secrets.COSIGN_PRIVATE_KEY }}
          cosign-password: ${{ secrets.COSIGN_PASSWORD }}
          manifest-layout: candidate/manifest
      - name: Surface the build version for the release lane
        run: echo "${VERSION}" > haul-version.txt
      # Remove this compatibility artifact when the legacy release alias job is replaced.
      - name: Upload the build version
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: haul-version
          overwrite: true
          path: haul-version.txt
          retention-days: 90

  config-artifact-publish:
    if: github.ref_name == 'main' && needs.publish-haul.result == 'success' && needs.publish-haul.outputs.ready == 'true'
    runs-on: ubuntu-latest
    needs:
      - changes
      - publish-haul
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.changes.outputs.version }}
      MANIFEST_REPO: ghcr.io/washu-tag/manifests/scout-manifest
      CONFIG_REPO: ghcr.io/washu-tag/manifests/scout-config
      MANIFEST_DIGEST: ${{ needs.publish-haul.outputs.manifest-digest }}
      BUNDLE_DIGEST: ${{ needs.publish-haul.outputs.bundle-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: ./.github/actions/install-hauler-oras
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Download the tested candidate metadata and charts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: flux-candidate-${{ github.run_attempt }}
          path: candidate
      - name: Require the current attempt's candidate
        run: python3 .github/scripts/copy-flux-artifacts.py validate --candidate candidate
      - name: Publish and sign the tested config
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |-
          set -euo pipefail
          python3 .github/scripts/copy-flux-artifacts.py publish-config --candidate candidate
          config_digest="$(jq -er .config.digest candidate/index.json)"
          python3 tooling/deploy/artifact_identity.py create \
            --repository "$GITHUB_REPOSITORY" --revision "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --version "$VERSION" --manifest-digest "$MANIFEST_DIGEST" \
            --config-digest "$config_digest" --bundle-digest "$BUNDLE_DIGEST" \
            --output "$RUNNER_TEMP/scout-config-ref.json"
      - name: Save the signed build outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scout-config-ref-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scout-config-ref.json
          if-no-files-found: error
          retention-days: 90

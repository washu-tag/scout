name: Post-Commit Tasks

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
      - 'ci-**'
      - 'demo**'
    # Skip the release-please PR merge (manifest/CHANGELOG/version.txt only): it publishes
    # nothing and would race version-bump's publish-charts. Push trigger only, so PR checks stand.
    paths-ignore:
      - .release-please-manifest.json
      - CHANGELOG.md
      - version.txt
  # Manual escape hatch (the narrowed image_build trigger otherwise leaves no way to
  # force one): rebuild + rescan every image even when the path filter wouldn't. Bypasses
  # the filter via the image_build output below; publish still gates on tests, so a manual
  # rebuild can't skip them.
  workflow_dispatch:
    inputs:
      rebuild_images:
        description: 'Force a full image rebuild + rescan'
        type: boolean
        default: false

# Cancel a PR's superseded runs. Keyed on head_ref (set only for pull_request);
# push events (main / ci-** / demo**) fall back to a unique run_id group and are
# never cancelled, so an in-flight publish on main isn't killed mid-release.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  JAVA_DIST: 'zulu'
  JAVA_VERSION: '21'
  REGISTRY: ghcr.io
  # /mnt is the runner's large scratch disk (Azure temp); the root fs is smaller
  # and half-full of preinstalled tooling. No built-in env var points at it
  # (RUNNER_TEMP / RUNNER_TOOL_CACHE are on root fs), so name it once and template
  # it into the CI inventory's k3s data-dir -- keeps k3s's image store + PVs off
  # root fs so large pulls don't trigger DiskPressure eviction.
  K3S_DATA_DIR: /mnt/k3s

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # A workflow_dispatch with rebuild_images bypasses the path filter (paths-filter has
      # no base to diff on a manual run, so the input is OR'd in here rather than fed to it).
      image_build: ${{ steps.filter.outputs.image_build == 'true' || github.event.inputs.rebuild_images == 'true' }}
      e2e: ${{ steps.filter.outputs.e2e }}
      hl7log-extractor: ${{ steps.filter.outputs.hl7log-extractor }}
      hl7-transformer: ${{ steps.filter.outputs.hl7-transformer }}
      hl7-listener: ${{ steps.filter.outputs.hl7-listener }}
      scout-notebook: ${{ steps.filter.outputs.scout-notebook }}
      launchpad: ${{ steps.filter.outputs.launchpad }}
      superset: ${{ steps.filter.outputs.superset }}
      keycloak: ${{ steps.filter.outputs.keycloak }}
      report-viewer: ${{ steps.filter.outputs.report-viewer }}
      hl7-transformer-chart: ${{ steps.filter.outputs.hl7-transformer-chart }}
      dcm4chee-chart: ${{ steps.filter.outputs.dcm4chee-chart }}
      hive-metastore-chart: ${{ steps.filter.outputs.hive-metastore-chart }}
      hl7-listener-chart: ${{ steps.filter.outputs.hl7-listener-chart }}
      hl7log-extractor-chart: ${{ steps.filter.outputs.hl7log-extractor-chart }}
      keycloak-config-cli-chart: ${{ steps.filter.outputs.keycloak-config-cli-chart }}
      launchpad-chart: ${{ steps.filter.outputs.launchpad-chart }}
      open-webui-bootstrap-chart: ${{ steps.filter.outputs.open-webui-bootstrap-chart }}
      orthanc-chart: ${{ steps.filter.outputs.orthanc-chart }}
      report-viewer-chart: ${{ steps.filter.outputs.report-viewer-chart }}
      scout-dashboards-chart: ${{ steps.filter.outputs.scout-dashboards-chart }}
      scout-opa-chart: ${{ steps.filter.outputs.scout-opa-chart }}
      temporal-bootstrap-chart: ${{ steps.filter.outputs.temporal-bootstrap-chart }}
      voila-chart: ${{ steps.filter.outputs.voila-chart }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          predicate-quantifier: 'some-with-excludes'
          filters: |
            # Run the deploy/smoke e2e unless the PR touches only docs, markdown, or
            # non-ci workflow files (some-with-excludes makes '!' subtractive). ci.yaml is
            # kept in scope (the exclude spares it): it wires the e2e, so a PR editing it
            # must revalidate. e2e machinery under .github/actions + .github/ci_resources runs too.
            e2e:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!.github/workflows/!(ci.yaml)'
            # Only the shared build action changes what EVERY image's build does, so only
            # it forces a full rebuild+rescan. Editing ci.yaml or the scan/import/publish/
            # version actions no longer rebuilds every image (unchanged ones are pulled), so
            # a CI edit won't surface a fresh CVE across all images. The root .dockerignore
            # only affects the scout-notebook build (its context is the repo root), so it
            # lives in that image's filter, not here.
            image_build:
              - '.github/actions/docker-build-cache/**'
            hl7log-extractor:
              - 'extractor/hl7log-extractor/**'
              - 'linting_java_checkstyle.xml'
            hl7-transformer:
              - 'extractor/hl7-transformer/**'
            hl7-listener:
              - 'hl7-listener/**'
            scout-notebook:
              - 'helm/scout-notebook/**'
              - 'sdk/python/**'
              # Built from the repo root, so the root .dockerignore governs its context.
              - '.dockerignore'
            launchpad:
              - 'launchpad/**'
            superset:
              - 'helm/superset/**'
            keycloak:
              - 'keycloak/**'
            report-viewer:
              - 'report-viewer/**'
            hl7-transformer-chart:
              - 'helm/extractor/hl7-transformer/**'
            dcm4chee-chart:
              - 'helm/dcm4chee/**'
            hive-metastore-chart:
              - 'helm/hive-metastore/**'
            hl7-listener-chart:
              - 'helm/hl7-listener/**'
            hl7log-extractor-chart:
              - 'helm/extractor/hl7log-extractor/**'
            keycloak-config-cli-chart:
              - 'helm/keycloak-config-cli/**'
            launchpad-chart:
              - 'helm/launchpad/**'
            open-webui-bootstrap-chart:
              - 'helm/open-webui-bootstrap/**'
            orthanc-chart:
              - 'helm/orthanc/**'
            report-viewer-chart:
              - 'helm/report-viewer/**'
            scout-dashboards-chart:
              - 'helm/scout-dashboards/**'
            scout-opa-chart:
              - 'helm/scout-opa/**'
            temporal-bootstrap-chart:
              - 'helm/temporal-bootstrap/**'
            voila-chart:
              - 'helm/voila/**'
      - name: 'Mint build version'
        id: version
        shell: bash
        # 0.YYYYMMDD.<run> ADR 0030 build lane. Computed once (UTC) so every chart
        # in this run shares one version. run_number is scoped to this workflow
        # file, so chart-publish must stay in ci.yaml; moving/renaming it resets
        # the counter and inverts tag order.
        run: echo "version=0.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: ${{ ENV.JAVA_DIST }}
          java-version: ${{ ENV.JAVA_VERSION }}
          cache: 'gradle'
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
  verify-cosign-pubkey:
    # The repo-root cosign.pub is the published mirror of the public half of
    # COSIGN_PRIVATE_KEY. It's an unchecked mirror otherwise: derive the real key
    # and diff it, so a stale key (a rotation that didn't refresh the file) or the
    # authoring placeholder fails here, red and self-announcing, instead of
    # verification silently breaking for every consumer in the field. Standalone
    # (no paths filter) so rotation drift is caught even when cosign.pub is
    # untouched; same-repo PRs have the secret.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: cosign.pub matches the signing key
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          cosign public-key --key env://COSIGN_PRIVATE_KEY > cosign.pub.derived
          if ! diff -u cosign.pub cosign.pub.derived; then
            echo "::error file=cosign.pub::cosign.pub does not match the signing key. Refresh it (run the export-cosign-pubkey workflow) after a rotation, or replace the authoring placeholder with the real key."
            exit 1
          fi
          echo "cosign.pub matches the derived public key."
  build-and-upload:
    runs-on: ubuntu-latest
    needs: changes
    permissions:
      contents: read
      # check-image-exists reads ghcr for the derived tag; private packages need auth
      packages: read
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: &image-matrix
          - image-name: hl7log-extractor
            subproject: extractor/hl7log-extractor
          - image-name: hl7-transformer
            subproject: extractor/hl7-transformer
          - image-name: hl7-listener
            subproject: hl7-listener
          - image-name: scout-notebook
            subproject: helm/scout-notebook
            # build from repo root so the Dockerfile can COPY sdk/python/ (the
            # Dockerfile path derives from `subproject`; see docker-build-cache)
            context: '.'
          - image-name: launchpad
            subproject: launchpad
          - image-name: superset
            subproject: helm/superset
            allow-failure: true
          - image-name: keycloak
            subproject: keycloak
          - image-name: report-viewer
            subproject: report-viewer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Check if image exists'
        id: check-image
        uses: ./.github/actions/check-image-exists
        with:
          subproject: ${{ matrix.subproject }}
          image-name: ${{ matrix.image-name }}
      - name: 'Build/Cache Image - ${{ matrix.image-name }}'
        if: needs.changes.outputs[matrix.image-name] == 'true' || steps.check-image.outputs.exists == 'false' || needs.changes.outputs.image_build == 'true'
        uses: ./.github/actions/docker-build-cache
        with:
          subproject: ${{ matrix.subproject }}
          image-name: ${{ matrix.image-name }}
          context: ${{ matrix.context || '' }}
  unit-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: ${{ ENV.JAVA_DIST }}
          java-version: ${{ ENV.JAVA_VERSION }}
          cache: 'gradle'
      - name: 'Unit tests: hl7log-extractor'
        shell: bash
        run: cd extractor/hl7log-extractor && ./gradlew test
      - name: 'Unit tests: keycloak event-listener'
        shell: bash
        run: cd keycloak/event-listener && ./gradlew test
  hl7-transformer-unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Spark 4.1.x runs on Java 17 or 21; use the repo default JAVA_VERSION (21) like
      # every other Java job. Spark/Delta versions are read from the package's
      # pyproject.toml, so this job pins no versions.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: ${{ ENV.JAVA_DIST }}
          java-version: ${{ ENV.JAVA_VERSION }}
      # Python pinned to 3.10 to match the runtime image (spark:4.1.1-...-python3),
      # so tests hit the shipping interpreter -- matters for version-sensitive
      # behavior like concurrent.futures TimeoutError (a distinct class before 3.11).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'extractor/hl7-transformer/pyproject.toml'
      - name: 'Unit tests: hl7-transformer'
        shell: bash
        # Same install path as the runtime image and local runs: deps (incl.
        # pinned Spark/Delta) resolve from pyproject.toml via pip.
        run: cd extractor/hl7-transformer && python -m pip install '.[test]' && python -m pytest tests/ -v
  ansible-and-python-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: report_viewer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install Molecule and dependencies
        run: |
          pip install molecule ansible-core pytest pydantic tiktoken httpx pytest-asyncio trino requests
      - name: 'Unit tests: build manifest'
        shell: bash
        run: cd tooling/manifest && pytest -v
      - name: 'Unit tests: config-artifact tooling'
        shell: bash
        run: cd tooling/deploy && pytest -v
      - name: 'Unit tests: filter plugins'
        shell: bash
        run: cd ansible && pytest tests/unit/filter_plugins/ -v
      - name: 'Unit tests: Open WebUI link sanitizer filter'
        shell: bash
        run: cd helm/open-webui-bootstrap && PYTHONPATH=files/payloads pytest tests/test_link_sanitizer_filter.py -v
      - name: 'Unit tests: Open WebUI iframe-defaults event function'
        shell: bash
        run: cd helm/open-webui-bootstrap && PYTHONPATH=files/payloads pytest tests/test_scout_iframe_defaults_event.py -v
      - name: 'Unit tests: report-viewer'
        shell: bash
        env:
          REPORT_VIEWER_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/report_viewer_test
        run: cd report-viewer && pip install -e '.[dev]' && pytest -v
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            report-viewer/frontend/package-lock.json
            launchpad/package-lock.json
      - name: 'Frontend build: report-viewer SPA'
        shell: bash
        run: cd report-viewer/frontend && npm ci && npm run build
      - name: 'Unit tests: launchpad'
        shell: bash
        run: cd launchpad && npm ci && npm test
      - name: 'Unit tests: verify-node'
        shell: bash
        run: cd verify-node && pytest tests/ -v
      - name: 'Unit tests: scout SDK'
        shell: bash
        run: cd sdk/python && PYTHONPATH=src pytest tests/ -v
      # Separate invocation: conftest.py stubs trino/requests in sys.modules at
      # collection; the contract tests need the real ones.
      - name: 'Contract tests: scout SDK vs trino-python-client'
        shell: bash
        run: cd sdk/python && pytest tests_contract/ -v
      - name: 'Unit tests: Voila chart helpers'
        shell: bash
        run: cd helm/voila && PYTHONPATH=files pytest tests/ -v
      - name: 'Install OPA'
        shell: bash
        # Pinned to the deployed OPA image (opa_image_tag in versions.yaml):
        # builtin behavior (regex.match, http.send) drifts across versions, so
        # test against the same binary prod evaluates under.
        run: |
          OPA_VERSION=$(yq '.opa_image_tag' ansible/group_vars/all/versions.yaml)
          # openpolicyagent.org/downloads proxies to this asset but has been 502ing; fetch it directly.
          curl -fsSL --retry 3 --retry-all-errors -o /tmp/opa \
            "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static"
          chmod +x /tmp/opa
          sudo mv /tmp/opa /usr/local/bin/opa
          opa version
      - name: 'Unit tests: OPA policy (Trino AuthZ)'
        shell: bash
        run: opa test policy/ -v
      - name: 'Molecule tests: postgres role'
        shell: bash
        run: cd ansible/roles/postgres && molecule test -s default
      - name: 'Molecule tests: scout_common role'
        shell: bash
        run: cd ansible/roles/scout_common && molecule test -s default
  scan-images:
    runs-on: ubuntu-latest
    needs: build-and-upload
    if: ${{ !cancelled() && needs.build-and-upload.result == 'success' }}
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include: *image-matrix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/trivy-scan-image
        with:
          image-name: ${{ matrix.image-name }}
          subproject: ${{ matrix.subproject }}
        continue-on-error: ${{ matrix.allow-failure == true }}
  deploy-and-test-e2e:
    runs-on: ubuntu-latest
    needs:
      - changes
      - lint
      - build-and-upload
      - unit-test
      - hl7-transformer-unit
      - ansible-and-python-tests
    # Skip on PRs that change only docs/markdown (see the e2e filter). Always runs
    # on push/schedule/dispatch so main and releases get the full validation.
    if: ${{ success() && (github.event_name != 'pull_request' || needs.changes.outputs.e2e == 'true') }}
    permissions:
      contents: read
      packages: read
    env:
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Free up disk space'
        shell: bash
        run: |
          echo "Disk space before cleanup:"
          df -h

          echo "Removing unnecessary tools to free up disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/ghc
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          docker system prune -af --volumes

          echo "Disk space after cleanup:"
          df -h
      - name: 'Prepare inventory.yaml'
        shell: bash
        run: |
          NODE_IP=$(hostname -I | awk '{print $1}')
          sed -e "s/HOSTNAME/$(hostname)/" -e "s/K3S_TOKEN/$(openssl rand -hex 16)/" \
            -e "s:WORK_DIR:$(pwd):" -e "s/NODE_IP/$NODE_IP/g" \
            -e "s:K3S_DATA_DIR:$K3S_DATA_DIR:g" \
            .github/ci_resources/inventory.yaml > ansible/inventory.yaml
      - name: 'ansible-galaxy dependencies'
        shell: bash
        run: cd ansible && sudo -E /opt/pipx_bin/ansible-galaxy install -r collections/requirements.yaml
      - name: Install Python dependencies for Ansible Kubernetes modules
        run: |
          /opt/pipx/venvs/ansible-core/bin/python -m pip install kubernetes
      - name: Install apache2-utils for htpasswd
        # roles/trino/templates/password.db.j2 shells out to `htpasswd -bnBC 10`;
        # ubuntu-latest doesn't ship it.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends apache2-utils
      - name: 'Install k3s'
        shell: bash
        run: |
          cd ansible && sudo -E /opt/pipx_bin/ansible-playbook -v -i inventory.yaml --diff playbooks/k3s.yaml
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ ENV.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 'Push image to k3s - hl7log-extractor'
        uses: ./.github/actions/k3s-image-import-or-pull
        with:
          subproject: extractor/hl7log-extractor
          image-name: hl7log-extractor
      - name: 'Push image to k3s - hl7-transformer'
        uses: ./.github/actions/k3s-image-import-or-pull
        with:
          subproject: extractor/hl7-transformer
          image-name: hl7-transformer
      - name: 'Install helm and helm diff'
        shell: bash
        run: cd ansible && sudo -E /opt/pipx_bin/ansible-playbook -v -i inventory.yaml --diff playbooks/helm.yaml
      - name: 'Install postgres'
        shell: bash
        run: |
          cd ansible && sudo -E /opt/pipx_bin/ansible-playbook -v -i inventory.yaml --diff playbooks/postgres.yaml
      - name: 'Install lake'
        shell: bash
        run: |
          cd ansible && sudo -E /opt/pipx_bin/ansible-playbook -v -i inventory.yaml --diff playbooks/lake.yaml
          sudo -E kubectl describe pod -l v1.min.io/tenant=minio-scout -n scout-data
      - name: 'Install orchestrator'
        shell: bash
        run: |
          cd ansible && sudo -E /opt/pipx_bin/ansible-playbook -i inventory.yaml --diff playbooks/orchestrator.yaml
      - name: 'Install extractor'
        shell: bash
        run: |
          cd ansible && sudo -E /opt/pipx_bin/ansible-playbook -i inventory.yaml --diff playbooks/extractor.yaml
      - name: 'Set up Java for Gradle cache warming'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: ${{ ENV.JAVA_DIST }}
          java-version: ${{ ENV.JAVA_VERSION }}
          cache: 'gradle'
      - name: 'Warm Gradle cache for ingest tests'
        shell: bash
        # Resolve ingest test deps (Spark4 graph + Gradle dist) on the runner
        # (setup-java caches them), then hand a world-writable copy to the
        # in-cluster test Job so it runs --offline. Removes the ~5 min cold
        # download from the timed "Run tests" step.
        run: |
          (cd tests/ingest && ./gradlew --no-daemon --console=plain testClasses resolveTestDeps)
          sudo mkdir -p /mnt/scout-gradle-cache
          sudo cp -a "${HOME}/.gradle/." /mnt/scout-gradle-cache/
          sudo chmod -R a+rwX /mnt/scout-gradle-cache
          rm -rf tests/ingest/build tests/ingest/.gradle  # keep pod mount a clean checkout
      - name: 'Run tests'
        shell: bash
        run: |
          cp .github/ci_resources/test_config_template.json tests/ingest/src/test/resources/config/local.json
          sed -i "s:WORK_DIR:$(pwd):" .github/ci_resources/tests-job.yaml
          sudo -E kubectl apply -f .github/ci_resources/tests-job.yaml
          sudo -E kubectl wait --for=condition=complete --timeout=1800s job/ci-tests -n scout-extractor &
          completion_pid=$!
          sudo -E kubectl wait --for=condition=failed --timeout=1800s job/ci-tests -n scout-extractor && exit 1 &
          failure_pid=$!
          wait -n $completion_pid $failure_pid
      - name: Test Logs
        shell: bash
        if: always()
        run: |
          sudo -E kubectl -n scout-extractor logs job/ci-tests
      - name: Test Summary
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
        if: always()
        with:
          paths: 'tests/ingest/**/TEST-*.xml'
          show: 'fail, skip'
      - name: Logging (hl7log-extractor)
        shell: bash
        if: always()
        run: |
          sudo -E kubectl -n scout-extractor logs deployment/hl7log-extractor
      - name: Logging (hl7-transformer)
        shell: bash
        if: always()
        run: |
          sudo -E kubectl -n scout-extractor logs deployment/hl7-transformer
  # Required-check gate. deploy-and-test-e2e is conditional, so this always-run
  # job reports the `deploy-and-test` context the ruleset requires: it passes when
  # the e2e succeeded or was legitimately skipped (docs-only PR), and fails when
  # the e2e ran (or should have) and did not succeed.
  deploy-and-test:
    name: deploy-and-test
    needs: [changes, deploy-and-test-e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: 'Gate on the e2e result'
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          E2E: ${{ needs.changes.outputs.e2e }}
          EVENT: ${{ github.event_name }}
          RESULT: ${{ needs.deploy-and-test-e2e.result }}
        run: |
          # Only take the skip-pass path when changes succeeded and definitively
          # reported e2e=false for a PR; otherwise require a real e2e success so a
          # failure or a failed prerequisite (skipped e2e) still blocks the merge.
          if [ "$CHANGES" = "success" ] && [ "$EVENT" = "pull_request" ] && [ "$E2E" = "false" ]; then
            echo "PR changes no deploy/test surface; e2e skipped, gate passes."
            exit 0
          fi
          if [ "$RESULT" = "success" ]; then
            echo "e2e succeeded."
            exit 0
          fi
          echo "::error::deploy-and-test-e2e result=$RESULT (changes=$CHANGES e2e=$E2E); gate fails."
          exit 1
  # Split across two runners: the full Scout stack + image pinning ran the 72 GB
  # runner into DiskPressure during chatbot's ollama+open-webui pulls, so each
  # side deploys only what it tests. Both install common infra (k3s, traefik,
  # postgres, valkey, auth, lake, trino, launchpad); trino on both so
  # jupyter/voila and chat/superset each query a real coordinator.
  #   analytics  -> superset, chatbot       (+ data-authz, trino-rw netpol)
  #   notebooks  -> voila, jupyter, monitor (+ full netpol incl. voila-ingress)
  # data-authz seed+run is analytics-only (needs superset+chatbot for the full
  # OPA -> Trino-JWT -> row-filter pipeline). auth-curl + NetworkPolicy run on
  # both, each --include-filtered to what it deploys (notebooks adds voila-ingress,
  # which needs the voila Service to resolve its target URL).
  # Playbook names assume PR #409 splits analytics.yaml into trino.yaml + superset.yaml;
  # update matrix.playbooks if naming lands differently.
  # smoke-test's `name:` is explicit so the per-side checks stay
  # smoke-test-analytics / smoke-test-notebooks. They are not required checks (the
  # ruleset requires deploy-and-test + CodeQL), so gating them here is safe: a
  # docs-only PR skips them without blocking the merge.
  smoke-test:
    name: smoke-test-${{ matrix.side }}
    runs-on: ubuntu-latest
    needs:
      - changes
      - lint
      - build-and-upload
    if: ${{ success() && (github.event_name != 'pull_request' || needs.changes.outputs.e2e == 'true') }}
    permissions:
      contents: read
      packages: read
    env:
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    strategy:
      fail-fast: false
      matrix:
        include:
          - side: analytics
            subdomains: superset,chat,keycloak,auth,minio,report-viewer
            san_extra: ''
            playbooks: k3s traefik postgres valkey auth lake trino superset chatbot report-viewer launchpad
            netpol_include: '--include trino-rw,opa-trino,report-viewer-ingress'
          - side: notebooks
            # testuser.jupyter is the per-user singleuser pod ingress
            subdomains: jupyter,grafana,keycloak,auth,playbooks,testuser.jupyter
            san_extra: ',DNS:*.jupyter.scout.test'
            playbooks: k3s traefik postgres valkey auth lake trino voila jupyter monitor launchpad
            netpol_include: '--include trino-rw,opa-trino,voila-ingress'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Free up disk space'
        shell: bash
        run: |
          echo "Disk space before cleanup:"
          df -h
          echo "Removing unnecessary tools to free up disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/ghc
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          docker system prune -af --volumes
          echo "Disk space after cleanup:"
          df -h
      - name: 'Generate TLS certificates and configure /etc/hosts'
        shell: bash
        env:
          SUBDOMAINS: ${{ matrix.subdomains }}
          SAN_EXTRA: ${{ matrix.san_extra }}
        run: |
          # Self-signed wildcard cert for *.scout.test (+ *.jupyter.scout.test on
          # the notebook side for the per-user singleuser ingress).
          mkdir -p /tmp/scout-ci-tls
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/scout-ci-tls/key.pem \
            -out /tmp/scout-ci-tls/cert.pem -days 1 -nodes \
            -subj "/CN=scout.test" \
            -addext "subjectAltName=DNS:scout.test,DNS:*.scout.test${SAN_EXTRA}"
          sudo cp /tmp/scout-ci-tls/cert.pem /usr/local/share/ca-certificates/scout-ci.crt
          sudo update-ca-certificates
          # Subdomains this side deploys (root scout.test = launchpad)
          {
            echo "127.0.0.1 scout.test"
            for sub in $(echo "$SUBDOMAINS" | tr ',' ' '); do
              echo "127.0.0.1 ${sub}.scout.test"
            done
          } | sudo tee -a /etc/hosts
      - name: 'Prepare inventory.yaml'
        shell: bash
        run: |
          NODE_IP=$(hostname -I | awk '{print $1}')
          echo "Node IP for CoreDNS: $NODE_IP"
          sed -e "s/HOSTNAME/$(hostname)/" -e "s/K3S_TOKEN/$(openssl rand -hex 16)/" \
            -e "s:WORK_DIR:$(pwd):" -e "s/NODE_IP/$NODE_IP/g" \
            -e "s:K3S_DATA_DIR:$K3S_DATA_DIR:g" \
            .github/ci_resources/inventory.yaml > ansible/inventory.yaml
      - name: 'ansible-galaxy dependencies'
        shell: bash
        run: cd ansible && sudo -E /opt/pipx_bin/ansible-galaxy install -r collections/requirements.yaml
      - name: Install Python dependencies for Ansible Kubernetes modules
        run: /opt/pipx/venvs/ansible-core/bin/python -m pip install kubernetes
      - name: Install apache2-utils for htpasswd
        # roles/trino/templates/password.db.j2 shells out to `htpasswd -bnBC 10`;
        # ubuntu-latest doesn't ship it.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends apache2-utils
      - name: 'Install k3s'
        shell: bash
        run: cd ansible && sudo -E /opt/pipx_bin/ansible-playbook -v -i inventory.yaml --diff playbooks/k3s.yaml
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pre-import only the images each side deploys (common: keycloak, launchpad;
      # per-side pushes gate on matrix.side).
      - name: 'Push image to k3s - keycloak'
        uses: ./.github/actions/k3s-image-import-or-pull
        with:
          subproject: keycloak
          image-name: keycloak
      - name: 'Push image to k3s - launchpad'
        uses: ./.github/actions/k3s-image-import-or-pull
        with:
          subproject: launchpad
          image-name: launchpad
      - name: 'Push image to k3s - superset'
        if: matrix.side == 'analytics'
        uses: ./.github/actions/k3s-image-import-or-pull
        with:
          subproject: helm/superset
          image-name: superset
      - name: 'Push image to k3s - report-viewer'
        if: matrix.side == 'analytics'
        uses: ./.github/actions/k3s-image-import-or-pull
        with:
          subproject: report-viewer
          image-name: report-viewer
      # hl7-transformer image is the vehicle for the data-authz seed Job's Spark +
      # Delta + s3a + Hive client (writes the synthetic test_reports Delta table);
      # the transformer itself isn't deployed here (no extractor playbook).
      - name: 'Push image to k3s - hl7-transformer'
        if: matrix.side == 'analytics'
        uses: ./.github/actions/k3s-image-import-or-pull
        with:
          subproject: extractor/hl7-transformer
          image-name: hl7-transformer
      - name: 'Push image to k3s - scout-notebook'
        if: matrix.side == 'notebooks'
        uses: ./.github/actions/k3s-image-import-or-pull
        with:
          subproject: helm/scout-notebook
          image-name: scout-notebook
      - name: 'Install helm and helm diff'
        shell: bash
        run: cd ansible && sudo -E /opt/pipx_bin/ansible-playbook -v -i inventory.yaml --diff playbooks/helm.yaml
      - name: 'Deploy Scout services'
        shell: bash
        env:
          PLAYBOOKS: ${{ matrix.playbooks }}
        run: |
          cd ansible
          for playbook in $PLAYBOOKS; do
            echo "=== Deploying $playbook ==="
            sudo -E /opt/pipx_bin/ansible-playbook -i inventory.yaml --diff "playbooks/${playbook}.yaml"
          done
      - name: 'Service health checks'
        shell: bash
        env:
          SIDE: ${{ matrix.side }}
        run: |
          echo "=== Checking Hive Metastore ==="
          sudo -E kubectl rollout status deployment/hive-metastore -n scout-data --timeout=180s
          echo "=== Checking Trino ==="
          sudo -E kubectl rollout status deployment/trino-coordinator -n scout-analytics --timeout=180s
          sudo -E kubectl rollout status deployment/trino-worker -n scout-analytics --timeout=180s
          if [ "$SIDE" = "analytics" ]; then
            echo "=== Checking Report Viewer ==="
            sudo -E kubectl rollout status deployment/report-viewer -n scout-analytics --timeout=180s
          fi
          if [ "$SIDE" = "notebooks" ]; then
            echo "=== Checking Voila ==="
            sudo -E kubectl rollout status deployment/voila -n scout-analytics --timeout=180s
            echo "=== Checking Prometheus ==="
            sudo -E kubectl rollout status deployment/prometheus-server -n scout-monitoring --timeout=180s
            echo "=== Checking Grafana ==="
            sudo -E kubectl rollout status deployment/grafana -n scout-monitoring --timeout=180s
            echo "=== Checking Loki ==="
            sudo -E kubectl rollout status statefulset/loki -n scout-monitoring --timeout=180s
          fi
          echo "=== All pods ==="
          sudo -E kubectl get pods -A
      # Auth (PASSWORD,JWT) is required, so the CLI's default http://localhost:8080
      # returns 403. Hit /v1/info on the HTTPS listener (the kubelet readiness
      # endpoint, no auth) to catch "coordinator up but HTTPS not listening". The
      # data-authz Job below exercises the full authenticated query path with a JWT.
      - name: 'Trino connectivity check'
        if: matrix.side == 'analytics'
        shell: bash
        run: |
          sudo -E kubectl exec -n scout-analytics deployment/trino-coordinator -- \
            curl -sk -f https://localhost:8443/v1/info
      # Data authorization tests: seed a synthetic delta.default.test_reports table,
      # then exercise the end-to-end AuthZ pipeline (Keycloak admin -> SPI listener
      # -> MinIO bundle -> OPA pull -> Trino JWT auth + impersonation -> row filter
      # + column mask). See tests/data-authorization/.
      - name: 'Derive hl7-transformer image version'
        if: matrix.side == 'analytics'
        id: hl7-transformer-version
        uses: ./.github/actions/derive-version
        with:
          subproject: extractor/hl7-transformer
      - name: 'Data authorization tests - seed'
        if: matrix.side == 'analytics'
        shell: bash
        env:
          # docker.io/local/... is the in-cluster tag k3s-image-import-or-pull
          # imports under; the production ghcr.io/... ref isn't loaded into k3s.
          IMAGE: docker.io/local/washu-tag/hl7-transformer:${{ steps.hl7-transformer-version.outputs.raw-version }}
        run: |
          set -euo pipefail
          # lake_bucket differs prod ("lake") vs CI ("ci-lake"); read the rendered
          # inventory so the Delta warehouse path matches the provisioned bucket.
          export WAREHOUSE_DIR="s3a://$(yq '.k3s_cluster.vars.lake_bucket' ansible/inventory.yaml)/delta"

          # script in a ConfigMap verbatim (kubectl handles multi-line file
          # content); no template substitution for seed.py.
          sudo -E kubectl create configmap data-authz-seed-script \
            -n scout-data \
            --from-file=seed.py=tests/data-authorization/seed/seed.py \
            --dry-run=client -o yaml | sudo -E kubectl apply -f -

          yq '.spec.template.spec.containers[0].image = strenv(IMAGE)
            | (.spec.template.spec.containers[0].env[]
               | select(.name == "SPARK_SQL_WAREHOUSE_DIR")).value = strenv(WAREHOUSE_DIR)' \
            tests/data-authorization/seed/job.yaml \
            | sudo -E kubectl apply -f -

          KUBECTL='sudo -E kubectl' bash tests/data-authorization/wait-for-job.sh \
            scout-data data-authz-seed 300
      - name: 'Data authorization tests - logs (seed)'
        if: ${{ always() && matrix.side == 'analytics' }}
        shell: bash
        run: |
          sudo -E kubectl -n scout-data logs job/data-authz-seed --tail=200 || true
      - name: 'Data authorization tests - run'
        if: matrix.side == 'analytics'
        shell: bash
        run: |
          set -euo pipefail
          KC_ADMIN_PW=$(yq '.k3s_cluster.vars.keycloak_bootstrap_admin_password' ansible/inventory.yaml)
          SUPERSET_SVC_SECRET=$(yq '.k3s_cluster.vars.keycloak_superset_svc_client_secret' ansible/inventory.yaml)
          REPORT_VIEWER_SVC_SECRET=$(yq '.k3s_cluster.vars.keycloak_report_viewer_svc_client_secret' ansible/inventory.yaml)

          # script in a ConfigMap, secrets in a Secret; the Job references both by
          # name -- no template substitution.
          sudo -E kubectl create configmap data-authz-test-script \
            -n scout-analytics \
            --from-file=run.sh=tests/data-authorization/authz-tests/run.sh \
            --dry-run=client -o yaml | sudo -E kubectl apply -f -

          sudo -E kubectl create secret generic data-authz-test-creds \
            -n scout-analytics \
            --from-literal=KC_ADMIN_PASSWORD="$KC_ADMIN_PW" \
            --from-literal=SUPERSET_SVC_CLIENT_SECRET="$SUPERSET_SVC_SECRET" \
            --from-literal=REPORT_VIEWER_SVC_CLIENT_SECRET="$REPORT_VIEWER_SVC_SECRET" \
            --dry-run=client -o yaml | sudo -E kubectl apply -f -

          sudo -E kubectl apply -f tests/data-authorization/authz-tests/job.yaml

          KUBECTL='sudo -E kubectl' bash tests/data-authorization/wait-for-job.sh \
            scout-analytics data-authz-tests 300
      - name: 'Data authorization tests - logs (run)'
        if: ${{ always() && matrix.side == 'analytics' }}
        shell: bash
        run: |
          sudo -E kubectl -n scout-analytics logs job/data-authz-tests --tail=500 || true
      # Verify OAuth2 Proxy blocks unauthenticated access for this side's
      # subdomains (the script always includes launchpad root).
      - name: 'Auth curl tests'
        shell: bash
        env:
          SUBDOMAINS: ${{ matrix.subdomains }}
        run: bash tests/auth/auth-curl-tests.sh scout.test --include "$SUBDOMAINS"
      - name: 'Auth playwright tests: OWUI iframe defaults'
        if: matrix.side == 'analytics'
        shell: bash
        working-directory: tests/auth
        env:
          SCOUT_HOSTNAME: scout.test
          KEYCLOAK_ADMIN_USER: admin
          NODE_EXTRA_CA_CERTS: /tmp/scout-ci-tls/cert.pem
          PLAYWRIGHT_IGNORE_HTTPS_ERRORS: 'true'
          UNAUTHORIZED_USER_USERNAME: scout-unauthorized-ci-user
          AUTHORIZED_USER_USERNAME: scout-authorized-ci-user
          TEST_USER_PASSWORD: ci-test-user-password-1234
        run: |
          set -euo pipefail
          export KEYCLOAK_ADMIN_PASSWORD=$(yq '.k3s_cluster.vars.keycloak_bootstrap_admin_password' ../../ansible/inventory.yaml)
          npm ci
          npx playwright test owui-iframe-seed.spec.ts
      - name: 'Auth playwright report'
        if: ${{ failure() && matrix.side == 'analytics' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.side }}
          path: tests/auth/playwright-report/
          retention-days: 7
      # Analytics filters to trino-rw (voila not deployed there, so the
      # Traefik->voila allow-path test would 000 on a missing Service); notebooks
      # runs the full suite.
      # TODO: add jupyter-singleuser egress tests once the JupyterHub singleuser
      # pod-selector labels are settled.
      - name: 'NetworkPolicy tests'
        shell: bash
        env:
          NETPOL_INCLUDE: ${{ matrix.netpol_include }}
        run: KUBECTL='sudo -E kubectl' bash tests/network/network-policy-tests.sh $NETPOL_INCLUDE
      - name: 'Debug - pod status'
        if: failure()
        shell: bash
        run: |
          sudo -E kubectl get pods -A
          sudo -E kubectl get events -A --sort-by='.lastTimestamp' | tail -50
      - name: 'Debug - all pod logs'
        if: failure()
        shell: bash
        run: |
          for ns in $(sudo -E kubectl get ns -o jsonpath='{.items[*].metadata.name}'); do
            for pod in $(sudo -E kubectl get pods -n "$ns" -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
              echo "=== $ns/$pod ==="
              sudo -E kubectl logs -n "$ns" "$pod" --all-containers --tail=30 --previous 2>/dev/null || \
              sudo -E kubectl logs -n "$ns" "$pod" --all-containers --tail=30 2>/dev/null || true
            done
          done
  publish:
    if: github.ref_name == 'main' && needs.deploy-and-test.result == 'success' && needs.smoke-test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    needs: [changes, deploy-and-test, scan-images, smoke-test]
    steps:
      - name: Checkout GitHub Action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ ENV.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Free up disk space
        shell: bash
        run: |
          echo "Disk space before cleanup:"
          df -h

          echo "Removing unnecessary tools to free up disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/ghc
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          docker system prune -af --volumes

          echo "Disk space after cleanup:"
          df -h
      # Publish when paths changed OR the derived tag is absent from the registry
      # (build-and-upload builds on both). Gating the push on paths-filter alone
      # dropped the second signal -- how v4.1.0 shipped with no 4.1.0 image tags.
      # Deliberately NOT gated on `ci`: that rebuilds everything to re-scan, and
      # publishing there would overwrite already-published upstream tags
      # (superset, keycloak) with rebuilt bits.
      - name: 'Check published - hl7log-extractor'
        id: published-hl7log-extractor
        uses: ./.github/actions/check-image-exists
        with:
          subproject: extractor/hl7log-extractor
          image-name: hl7log-extractor
      - name: 'Push Image - hl7log-extractor'
        if: needs.changes.outputs.hl7log-extractor == 'true' || steps.published-hl7log-extractor.outputs.exists == 'false'
        uses: ./.github/actions/docker-push
        with:
          image-name: hl7log-extractor
          version: ${{ needs.changes.outputs.version }}
      - name: 'Check published - hl7-transformer'
        id: published-hl7-transformer
        uses: ./.github/actions/check-image-exists
        with:
          subproject: extractor/hl7-transformer
          image-name: hl7-transformer
      - name: 'Push Image - hl7-transformer'
        if: needs.changes.outputs.hl7-transformer == 'true' || steps.published-hl7-transformer.outputs.exists == 'false'
        uses: ./.github/actions/docker-push
        with:
          image-name: hl7-transformer
          version: ${{ needs.changes.outputs.version }}
      - name: 'Check published - hl7-listener'
        id: published-hl7-listener
        uses: ./.github/actions/check-image-exists
        with:
          subproject: hl7-listener
          image-name: hl7-listener
      - name: 'Push Image - hl7-listener'
        if: needs.changes.outputs.hl7-listener == 'true' || steps.published-hl7-listener.outputs.exists == 'false'
        uses: ./.github/actions/docker-push
        with:
          image-name: hl7-listener
          version: ${{ needs.changes.outputs.version }}
      - name: 'Check published - scout-notebook'
        id: published-scout-notebook
        uses: ./.github/actions/check-image-exists
        with:
          subproject: helm/scout-notebook
          image-name: scout-notebook
      - name: 'Push Image - scout-notebook'
        if: needs.changes.outputs.scout-notebook == 'true' || steps.published-scout-notebook.outputs.exists == 'false'
        uses: ./.github/actions/docker-push
        with:
          image-name: scout-notebook
          version: ${{ needs.changes.outputs.version }}
      - name: 'Check published - launchpad'
        id: published-launchpad
        uses: ./.github/actions/check-image-exists
        with:
          subproject: launchpad
          image-name: launchpad
      - name: 'Push Image - launchpad'
        if: needs.changes.outputs.launchpad == 'true' || steps.published-launchpad.outputs.exists == 'false'
        uses: ./.github/actions/docker-push
        with:
          image-name: launchpad
          version: ${{ needs.changes.outputs.version }}
      - name: 'Check published - superset'
        id: published-superset
        uses: ./.github/actions/check-image-exists
        with:
          subproject: helm/superset
          image-name: superset
      - name: 'Push Image - superset'
        if: needs.changes.outputs.superset == 'true' || steps.published-superset.outputs.exists == 'false'
        uses: ./.github/actions/docker-push
        with:
          image-name: superset
          version: ${{ needs.changes.outputs.version }}
      - name: 'Check published - keycloak'
        id: published-keycloak
        uses: ./.github/actions/check-image-exists
        with:
          subproject: keycloak
          image-name: keycloak
      - name: 'Push Image - keycloak'
        if: needs.changes.outputs.keycloak == 'true' || steps.published-keycloak.outputs.exists == 'false'
        uses: ./.github/actions/docker-push
        with:
          image-name: keycloak
          version: ${{ needs.changes.outputs.version }}
      - name: 'Check published - report-viewer'
        id: published-report-viewer
        uses: ./.github/actions/check-image-exists
        with:
          subproject: report-viewer
          image-name: report-viewer
      - name: 'Push Image - report-viewer'
        if: needs.changes.outputs.report-viewer == 'true' || steps.published-report-viewer.outputs.exists == 'false'
        uses: ./.github/actions/docker-push
        with:
          image-name: report-viewer
          version: ${{ needs.changes.outputs.version }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign published build-lane images
        # Sign every image docker-push recorded this run (files hold
        # "<name> <repo>:<version>@<digest>") with the keyed cosign pair, so the
        # build-lane haul verifies signatures at sync time (ADR 0033); the @digest
        # is what cosign signs. Keyed, no transparency log: cosign v3 defaults
        # --use-signing-config=true which conflicts with --tlog-upload=false, so
        # both flags are needed; keeps private image digests off public Rekor.
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          shopt -s nullglob
          signed=0
          for f in "${RUNNER_TEMP}"/image-digests/*.txt; do
            ref="$(awk '{print $2}' "$f")"
            echo "signing ${ref}"
            cosign sign --key env://COSIGN_PRIVATE_KEY \
              --use-signing-config=false --tlog-upload=false --yes "${ref}"
            signed=$((signed + 1))
          done
          echo "signed ${signed} image(s)"
  # Publish changed Helm charts as versioned OCI artifacts (ADR 0030/0031 phase 0),
  # gated like the image `publish` job.
  publish-charts:
    if: github.ref_name == 'main' && needs.deploy-and-test.result == 'success' && needs.smoke-test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: [changes, deploy-and-test, smoke-test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - chart-name: hl7-transformer
            chart-dir: helm/extractor/hl7-transformer
            changed: hl7-transformer-chart
          - chart-name: dcm4chee
            chart-dir: helm/dcm4chee
            changed: dcm4chee-chart
          - chart-name: hive-metastore
            chart-dir: helm/hive-metastore
            changed: hive-metastore-chart
          - chart-name: hl7-listener
            chart-dir: helm/hl7-listener
            changed: hl7-listener-chart
          - chart-name: hl7log-extractor
            chart-dir: helm/extractor/hl7log-extractor
            changed: hl7log-extractor-chart
          - chart-name: keycloak-config-cli
            chart-dir: helm/keycloak-config-cli
            changed: keycloak-config-cli-chart
          - chart-name: launchpad
            chart-dir: helm/launchpad
            changed: launchpad-chart
          - chart-name: open-webui-bootstrap
            chart-dir: helm/open-webui-bootstrap
            changed: open-webui-bootstrap-chart
          - chart-name: orthanc
            chart-dir: helm/orthanc
            changed: orthanc-chart
          - chart-name: report-viewer
            chart-dir: helm/report-viewer
            changed: report-viewer-chart
          - chart-name: scout-dashboards
            chart-dir: helm/scout-dashboards
            changed: scout-dashboards-chart
          - chart-name: scout-opa
            chart-dir: helm/scout-opa
            changed: scout-opa-chart
          - chart-name: temporal-bootstrap
            chart-dir: helm/temporal-bootstrap
            changed: temporal-bootstrap-chart
          - chart-name: voila
            chart-dir: helm/voila
            changed: voila-chart
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to GHCR (for the imagetools digest read-back)
        if: needs.changes.outputs[matrix.changed] == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 'Publish chart - ${{ matrix.chart-name }}'
        if: needs.changes.outputs[matrix.changed] == 'true'
        shell: bash
        # helm preinstalled (OCI push needs >= 3.8). Only --version is stamped;
        # Chart.yaml keeps its 0.0.0-dev / appVersion "latest" placeholders.
        # appVersion-to-image coupling is phase 2, so the default image tag stays
        # :latest and phase-0 consumers pin image.tag for immutability. Token via
        # stdin (never argv).
        env:
          CHART_DIR: ${{ matrix.chart-dir }}
          CHART_NAME: ${{ matrix.chart-name }}
          VERSION: ${{ needs.changes.outputs.version }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          helm version --short
          printf '%s' "${REGISTRY_TOKEN}" | helm registry login "${REGISTRY}" -u "${ACTOR}" --password-stdin
          helm package "${CHART_DIR}" --version "${VERSION}" --destination "${RUNNER_TEMP}"
          helm push "${RUNNER_TEMP}/${CHART_NAME}-${VERSION}.tgz" "oci://${REGISTRY}/washu-tag/charts"
          # Record the pushed chart by digest for the build-lane haul (ADR 0033),
          # read back via a stable --format contract (matching docker-push;
          # imagetools resolves OCI charts too).
          ref="${REGISTRY}/washu-tag/charts/${CHART_NAME}:${VERSION}"
          digest="$(docker buildx imagetools inspect "${ref}" --format '{{json .Manifest}}' | jq -r '.digest')"
          if [ "${digest#sha256:}" = "${digest}" ]; then
            echo "::error::could not resolve pushed digest for ${CHART_NAME}"
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/chart-digests"
          printf '%s %s@%s\n' "${CHART_NAME}" "${ref}" "${digest}" \
            > "${RUNNER_TEMP}/chart-digests/${CHART_NAME}.txt"
      - name: Install cosign
        if: needs.changes.outputs[matrix.changed] == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: 'Sign chart - ${{ matrix.chart-name }}'
        if: needs.changes.outputs[matrix.changed] == 'true'
        # Sign the pushed OCI chart by digest with the keyed cosign pair (matching
        # `publish`), so the build-lane haul verifies charts and images alike at
        # sync time (ADR 0033). Keyed, no transparency log.
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          CHART_NAME: ${{ matrix.chart-name }}
        run: |
          set -euo pipefail
          ref="$(awk '{print $2}' "${RUNNER_TEMP}/chart-digests/${CHART_NAME}.txt")"
          echo "signing ${ref}"
          cosign sign --key env://COSIGN_PRIVATE_KEY \
            --use-signing-config=false --tlog-upload=false --yes "${ref}"
      - name: 'Upload chart digest - ${{ matrix.chart-name }}'
        if: needs.changes.outputs[matrix.changed] == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chart-digest-${{ matrix.chart-name }}
          path: ${{ runner.temp }}/chart-digests/${{ matrix.chart-name }}.txt
  publish-demo:
    if: startsWith(github.ref_name, 'demo') && needs.deploy-and-test.result == 'success' && needs.smoke-test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    needs: [changes, deploy-and-test, scan-images, smoke-test]
    steps:
      - name: Checkout GitHub Action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ ENV.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Free up disk space
        shell: bash
        run: |
          echo "Disk space before cleanup:"
          df -h

          echo "Removing unnecessary tools to free up disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/ghc
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          docker system prune -af --volumes

          echo "Disk space after cleanup:"
          df -h
      - name: 'Push Image - scout-notebook'
        if: needs.changes.outputs.scout-notebook == 'true'
        uses: ./.github/actions/docker-push
        with:
          image-name: scout-notebook
      - name: 'Push Image - hl7log-extractor'
        if: needs.changes.outputs.hl7log-extractor == 'true'
        uses: ./.github/actions/docker-push
        with:
          image-name: hl7log-extractor
      - name: 'Push Image - hl7-transformer'
        if: needs.changes.outputs.hl7-transformer == 'true'
        uses: ./.github/actions/docker-push
        with:
          image-name: hl7-transformer
      - name: 'Push Image - hl7-listener'
        if: needs.changes.outputs.hl7-listener == 'true'
        uses: ./.github/actions/docker-push
        with:
          image-name: hl7-listener
      - name: 'Push Image - launchpad'
        if: needs.changes.outputs.launchpad == 'true'
        uses: ./.github/actions/docker-push
        with:
          image-name: launchpad
      - name: 'Push Image - superset'
        if: needs.changes.outputs.superset == 'true'
        uses: ./.github/actions/docker-push
        with:
          image-name: superset
      - name: 'Push Image - keycloak'
        if: needs.changes.outputs.keycloak == 'true'
        uses: ./.github/actions/docker-push
        with:
          image-name: keycloak
      - name: 'Push Image - report-viewer'
        if: needs.changes.outputs.report-viewer == 'true'
        uses: ./.github/actions/docker-push
        with:
          image-name: report-viewer

  haul-guard-canary:
    # publish-haul's sync fails closed by counting hauler's "signature verified for
    # image [" log lines; a hauler bump that reworded that would zero the count and
    # block every publish. Assert the string is in the pinned binary here on every
    # PR, so a bump fails RED up front instead of as a cryptic 0/N on a main build.
    # Runs unconditionally (cheap) so it always reports and is safe to mark required.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install-hauler-oras
      - name: Assert the verification success string is present
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -aqF 'signature verified for image [' "$(command -v hauler)"; then
            echo "::error::this hauler build lacks the 'signature verified for image [' success string; update the verified-line guard in publish-haul's sync step to match this version"
            exit 1
          fi
  publish-haul:
    # Build-lane haul (ADR 0033): render the manifest (fresh digests + carry), sync to a
    # signed .tar.zst, publish the bundle + manifest. GATES the build (no continue-on-error):
    # a broken/incomplete/unsigned air-gap haul must fail loud. Safe to merge only after
    # seed-charts.yaml has published all 14 charts (publish-charts is changed-only) and the
    # Docker Hub secret is seeded (the upstream pulls below are otherwise rate-limited).
    if: github.ref_name == 'main' && needs.publish.result == 'success' && needs.publish-charts.result == 'success'
    runs-on: ubuntu-latest
    needs: [changes, publish, publish-charts]
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.changes.outputs.version }}
      MANIFEST_REPO: ghcr.io/washu-tag/manifests/scout-manifest
      BUNDLE_REPO: ghcr.io/washu-tag/manifests/scout
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }} # job-level so the login step's if can read it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker Hub # authenticated pulls for the upstream images (8 of the 9 are on docker.io)
        # Skip cleanly when the secret is unset rather than hard-fail this now-gating job;
        # without the login hauler falls back to anonymous (rate-limited) docker.io pulls.
        if: ${{ env.DH_USER != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install hauler and oras
        uses: ./.github/actions/install-hauler-oras
      - name: Download this run's fresh image digests
        # A failed/partial download must fail the job (which now gates the build)
        # rather than be swallowed.
        # If it were swallowed, a just-rebuilt image would be missing from `fresh`
        # and silently carried from the predecessor at its STALE digest, producing
        # a valid-looking manifest that omits this run's new image. A pattern that
        # matches zero artifacts (no images changed) still succeeds, so the
        # legitimate carry-everything case is unaffected.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-digest-*
          path: digests
          merge-multiple: true
      - name: Download this run's fresh chart digests
        # SEPARATE subdir: 5 chart names (hl7-transformer, hl7-listener,
        # hl7log-extractor, launchpad, report-viewer) collide with image names, so
        # a flat merge would clobber their digest files. build_haul globs
        # digests/**/* and skips dirs. Same no-continue-on-error invariant as above.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: chart-digest-*
          path: digests/charts
          merge-multiple: true
      - name: Skip if the haul predecessor is not yet seeded
        id: seeded
        # publish-haul now gates the build, but a run before seed-charts.yaml has
        # published the 14 charts (incl. the first main run after this lands) has an
        # images-only predecessor, so build_haul would fail closed on the uncarried
        # charts and red main. Detect that pre-seed state and skip (warn); a genuine
        # drift (stray fresh digest, bad ref) still fails loudly in the render below.
        run: |
          set -euo pipefail
          mkdir -p digests predecessor
          oras pull "${MANIFEST_REPO}:main" -o predecessor \
            || echo "no predecessor haul yet (needs a bootstrap)"
          status="$(python3 tooling/manifest/build_haul.py --check \
            --digests-dir digests \
            --components tooling/manifest/components.txt \
            --predecessor predecessor/haul.yaml --name scout)"
          if [ "${status}" = ready ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::haul predecessor not fully seeded yet (run seed-charts once at go-live); skipping the haul publish this run"
          fi
      - name: Render the haul manifest (carry from the predecessor)
        if: steps.seeded.outputs.ready == 'true'
        run: |
          set -euo pipefail
          mkdir -p digests predecessor
          # Previous build's haul is the carry source; absent on first build.
          oras pull "${MANIFEST_REPO}:main" -o predecessor \
            || echo "no predecessor haul yet (first build must be a bootstrap)"
          python3 tooling/manifest/build_haul.py \
            --digests-dir digests \
            --components tooling/manifest/components.txt \
            --predecessor predecessor/haul.yaml \
            --name scout > haul.yaml
          echo "--- haul.yaml ---"; cat haul.yaml
          # Third-party upstream images: resolve each pinned tag from versions.yaml
          # (via resolve_upstream.py), pin to @digest, render a separate manifest --
          # synced WITHOUT --key below (can't sign registries we don't own; trust =
          # the immutable digest). Re-resolved every run, so no predecessor carry.
          : > upstream-refs.txt
          python3 tooling/manifest/resolve_upstream.py \
            tooling/manifest/upstream-images.txt \
            ansible/group_vars/all/versions.yaml > upstream-tags.txt
          while read -r ref; do
            [ -n "$ref" ] || continue
            d="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r '.digest')"
            [ "${d#sha256:}" != "$d" ] || { echo "::error::could not resolve a digest for ${ref}"; exit 1; }
            printf '%s@%s\n' "$ref" "$d" >> upstream-refs.txt
          done < upstream-tags.txt
          python3 -c 'import sys; sys.path.insert(0, "tooling/manifest"); from haul import render_images; refs=[l.strip() for l in open("upstream-refs.txt") if l.strip()]; sys.stdout.write(render_images(refs, name="scout-upstream"))' > haul-upstream.yaml
          echo "--- haul-upstream.yaml ---"; cat haul-upstream.yaml
      - name: Publish the haul
        if: steps.seeded.outputs.ready == 'true'
        uses: ./.github/actions/publish-haul
        with:
          version: ${{ env.VERSION }}
          core-manifest: haul.yaml
          upstream-manifest: haul-upstream.yaml
          manifest-repo: ${{ env.MANIFEST_REPO }}
          bundle-repo: ${{ env.BUNDLE_REPO }}
          cosign-private-key: ${{ secrets.COSIGN_PRIVATE_KEY }}
          cosign-password: ${{ secrets.COSIGN_PASSWORD }}
      - name: Surface the build version for the release lane
        if: steps.seeded.outputs.ready == 'true'
        # release.yaml's X.Y.Z->haul alias reads this from the CI run it waited on,
        # to oras-tag THIS haul to the release version. Written only after the
        # publish step above succeeded (:main advanced), so the alias can never
        # point at a partial haul.
        run: echo "${VERSION}" > haul-version.txt
      - name: Upload the build version
        if: steps.seeded.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: haul-version
          path: haul-version.txt
  config-artifact-publish:
    # Config artifact (ADR 0031): after the build-lane haul publishes, stamp a COPY
    # of deploy/ to the concrete chart/image tags in that haul, then publish the
    # stamped tree + required-vars.txt as the versioned scout-config OCI artifact a
    # cluster's Flux OCIRepository pins. cluster-vars stays site-owned (ADR 0031
    # 4/6): the artifact ships shared bases + the required-vars contract; each site
    # generates its own cluster-vars via gen_cluster_vars.py. The stamp+generate
    # logic runs on every PR in validate-deploy.yaml, so regressions fail RED there
    # before this job publishes.
    # Runs on main after publish-haul; needs the haul on concrete tags (bootstrap seed),
    # not :latest, or stamp_config fail-closes.
    if: github.ref_name == 'main' && needs.publish-haul.result == 'success'
    runs-on: ubuntu-latest
    needs: [changes, publish-haul]
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.changes.outputs.version }}
      MANIFEST_REPO: ghcr.io/washu-tag/manifests/scout-manifest
      CONFIG_REPO: ghcr.io/washu-tag/manifests/scout-config
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # setup-python is a bare interpreter; stamp_config.py imports PyYAML.
      - run: pip install pyyaml
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install hauler and oras
        uses: ./.github/actions/install-hauler-oras
      - name: Stamp deploy/ from the published haul
        run: |
          set -euo pipefail
          mkdir -p haul
          # The build lane's haul is the source of truth for concrete tags.
          oras pull "${MANIFEST_REPO}:main" -o haul
          cp -r deploy config-artifact
          # config-hash = sha256 of the realm config-cli imports (the chart's
          # files/scout-realm.json), so a realm change re-fires the import. A host-list
          # (albOidcHosts) change re-fires too via the HelmRelease values; rotating a
          # keycloak-client-secrets value alone does not (envFrom is by name), so that
          # lands on the next upgrade.
          python3 tooling/deploy/stamp_config.py \
            --deploy-dir config-artifact \
            --haul haul/haul.yaml \
            --realm-file helm/keycloak-config-cli/files/scout-realm.json
      - name: Publish + sign the scout-config artifact
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          # Stamped bases + the required-vars contract (ADR 0031 Appendix B).
          tar -C config-artifact -czf scout-config.tar.gz base flux modes required-vars.txt
          oras push "${CONFIG_REPO}:${VERSION}" scout-config.tar.gz:application/gzip
          cosign sign --key env://COSIGN_PRIVATE_KEY \
            --use-signing-config=false --tlog-upload=false --yes "${CONFIG_REPO}:${VERSION}"
          # Advance :main last, so it only moves after a complete signed publish.
          oras tag "${CONFIG_REPO}:${VERSION}" main

  deploy-and-test-flux:
    # The deploy switch (ADR 0031, Phase 3): stand up the ingest slice via Flux from
    # the published scout-config artifact instead of the Ansible playbooks, then run
    # the SAME tests/ingest suite -- the parallel proof the GitOps lane deploys what
    # Ansible deploys. Ansible deploy-and-test stays the green gate until Phase-5
    # cutover; this is additive.
    # PAUSED until the config artifact is published (config-artifact-publish live)
    # and the fixed-name Secrets + cnpg-role-* companions are seedable from CI
    # secrets. Re-enable by restoring:
    #   github.ref_name == 'main' && needs.config-artifact-publish.result == 'success'
    if: false
    runs-on: ubuntu-latest
    needs: [config-artifact-publish]
    permissions:
      contents: read
    env:
      CONFIG_REPO: ghcr.io/washu-tag/manifests/scout-config
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install k3s + Flux (pinned, sha256-verified)
        run: |
          set -euo pipefail
          # Download pinned binaries and verify sha256 before executing, so a hijacked
          # or corrupted release asset can't run in the job (same shape as
          # .github/actions/install-hauler-oras). No curl piped to a shell.
          K3S_VERSION='v1.31.5+k3s1'
          K3S_SHA256='399b87b432ce55013fa81adad572a8e4ecf56e0df97369cf02d4b8a41f039091'
          curl -fsSL -o k3s "https://github.com/k3s-io/k3s/releases/download/${K3S_VERSION/+/%2B}/k3s"
          echo "${K3S_SHA256}  k3s" | sha256sum -c -
          sudo install -m 0755 k3s /usr/local/bin/k3s
          sudo k3s server --write-kubeconfig-mode=644 &
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          timeout 180 bash -c 'until k3s kubectl get nodes 2>/dev/null | grep -q " Ready"; do sleep 3; done'
          FLUX_VERSION='2.4.0'
          FLUX_SHA256='7b70b75af20e28fc30ee66cf5372ec8d51dd466fd2ee21aa42690984de70b09b'
          curl -fsSL -o flux.tar.gz "https://github.com/fluxcd/flux2/releases/download/v${FLUX_VERSION}/flux_${FLUX_VERSION}_linux_amd64.tar.gz"
          echo "${FLUX_SHA256}  flux.tar.gz" | sha256sum -c -
          tar -xzf flux.tar.gz flux && sudo install -m 0755 flux /usr/local/bin/flux
          flux install --components-extra=image-reflector-controller,image-automation-controller
      - name: Seed secrets + cluster-vars + the scout-config source
        run: |
          set -euo pipefail
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          # Fixed-name Secrets the bases reference (superuser-secret, the five
          # cnpg-role-* companions, s3/keycloak/superset/hive) are SOPS/ESO in
          # production (Phase 4); seed from CI secrets here. Placeholder -- wire the
          # concrete `kubectl create secret` calls when enabled.
          # cluster-vars for postBuild substitution:
          python3 tooling/deploy/gen_cluster_vars.py \
            --values .github/ci_resources/cluster-vars.values.json \
            --namespace flux-system --name cluster-vars | kubectl apply -f -
          # Point Flux at the published config artifact.
          flux create source oci scout-config \
            --url="oci://${CONFIG_REPO}" --tag=main --interval=1m
      - name: Reconcile the ingest slice + run tests/ingest
        run: |
          set -euo pipefail
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          # Apply the Flux Kustomizations, let the DAG converge, then run the SAME
          # ingest suite Ansible deploy-and-test runs, against the Flux-reconciled
          # slice. Fleshed out when the artifact + secret seed land.
          # Shared DAG (flux/ holds only the shared set now) PLUS the on-prem mode set --
          # storage-ready=the real MinIO tenant, oauth2-proxy, the Traefik edge -- via `-k`
          # since that dir has a kustomization.yaml. Without the on-prem set the lake
          # consumers' dependsOn: storage-ready never resolves. The e2e cluster is on-prem k3s.
          FLUX_DIR=config-artifact/flux; MODES_DIR=config-artifact/modes
          [ -d "$FLUX_DIR" ] || { FLUX_DIR=deploy/flux; MODES_DIR=deploy/modes; }
          kubectl apply -f "$FLUX_DIR"/
          kubectl apply -k "$MODES_DIR"/on-prem
          flux reconcile kustomization extractor --with-source --timeout=15m

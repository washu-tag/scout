name: Validate deploy base

# Structural checks for the GitOps deployment base (deploy/, ADR 0031, Phase 3):
# every Kustomize base renders, Flux Kustomizations parse, and the dependsOn graph
# stays acyclic with no dangling refs. Purely static -- no cluster, no deploy.
on:
  pull_request:
    paths:
      - deploy/**
      - tooling/deploy/**
      # The realm config-cli imports + the config-hash it is stamped from live here.
      - helm/keycloak-config-cli/**
      # The per-mode S3A SSE render guard below.
      - helm/hive-metastore/**
      - helm/extractor/hl7-transformer/**
      - .github/workflows/validate-deploy.yaml
      - .github/workflows/deploy-flux.yaml
      - .github/workflows/ci.yaml
      - .github/ci_resources/flux/**
      - .github/actions/install-flux/**
      - .github/actions/publish-haul/**
      # OPA data-doc drift guard reads the Ansible source; re-run on those too.
      - ansible/roles/opa/defaults/main.yaml
      - ansible/roles/scout_common/defaults/main.yaml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python3 -m pip install pytest pyyaml
      - name: Install kustomize
        run: |
          set -euo pipefail
          VER=5.5.0
          # Pinned SHA256 (release checksums.txt); verify before extract so a
          # corrupted/tampered download fails closed.
          SHA=6703a3a70a0c47cf0b37694030b54f1175a9dfeb17b3818b623ed58b9dbc2a77
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${VER}/kustomize_v${VER}_linux_amd64.tar.gz" -o kustomize.tar.gz
          echo "${SHA}  kustomize.tar.gz" | sha256sum -c -
          sudo tar xz -C /usr/local/bin -f kustomize.tar.gz kustomize
          rm -f kustomize.tar.gz
          kustomize version

      # The on-prem floor (kustomize-controller v1.9.6); export and dry-run are offline.
      - uses: ./.github/actions/install-flux

      - name: Test deployment tooling and artifact identity
        run: python3 -m pytest -q tooling/deploy .github/ci_resources/flux/test_*.py

      - name: Validate the on-prem CI inputs
        run: |
          set -euo pipefail
          python3 .github/ci_resources/flux/check_legs.py
          python3 tooling/deploy/gen_cluster_vars.py \
            --values .github/ci_resources/flux/cluster-vars.values.json \
            --namespace flux-system > "$RUNNER_TEMP/ci-cluster-vars.yaml"
          trap 'rm -f "$RUNNER_TEMP/ci-secret-values.yaml"' EXIT
          python3 tooling/deploy/gen_secret_values.py \
            --values .github/ci_resources/flux/secret-values.json \
            --cluster-vars-values .github/ci_resources/flux/cluster-vars.values.json \
            --namespace flux-system -o "$RUNNER_TEMP/ci-secret-values.yaml"

      - name: Render the CI Flux installation
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/ci-flux-system"
          mkdir -p "$dir"
          cp .github/ci_resources/flux/flux-system/*.yaml "$dir/"
          flux install --export > "$dir/gotk-components.yaml"
          kustomize build "$dir" >/dev/null

      - name: Render every base
        run: |
          set -euo pipefail
          fail=0
          while read -r d; do
            grep -qx 'kind: Component' "$d/kustomization.yaml" && continue  # components build via their consumers
            if kustomize build "$d" >/dev/null; then
              echo "  ok   $d"
            else
              echo "::error file=$d::kustomize build failed for $d"; fail=1
            fi
          done < <(find deploy/base -name kustomization.yaml -exec dirname {} \; | sort)
          exit $fail

      - name: S3A SSE renders only for aws + s3_sse_type=S3
        run: |
          set -euo pipefail
          # #750 shipped an invalid S3A value (SSE-S3) that only failed on a live cluster.
          T=helm/extractor/hl7-transformer; H=helm/hive-metastore
          TSET="sparkDefaults.enabled=true,sparkDefaults.hiveMetastoreUri=thrift://h:9083,sparkDefaults.warehouseDir=s3a://b/d,sparkDefaults.s3Endpoint=http://m"
          T_PROP='^\s*spark\.hadoop\.fs\.s3a\.encryption\.algorithm '
          T_VAL='^\s*spark\.hadoop\.fs\.s3a\.encryption\.algorithm AES256\s*$'
          H_PROP='<name>fs\.s3a\.encryption\.algorithm</name>'
          H_VAL='<value>AES256</value>'
          fail=0
          check() {  # <want: 1|0> <property regex> <AES256 value regex> <helm template args...>
            want=$1 prop=$2 val=$3; shift 3
            out=$(helm template t "$@")
            got=$(grep -cE "$prop" <<<"$out" || true)
            ok=$(grep -cE "$val" <<<"$out" || true)
            if [ "$got" = "$want" ] && [ "$ok" = "$want" ]; then echo "  ok   want=$want $*"
            else echo "::error::want $want property+AES256 line(s), got property=$got value=$ok: $*"; fail=1; fi
          }
          check 1 "$T_PROP" "$T_VAL" $T --set "$TSET,sparkDefaults.mode=aws,sparkDefaults.sseType=S3"
          check 0 "$T_PROP" "$T_VAL" $T --set "$TSET,sparkDefaults.mode=aws,sparkDefaults.sseType=NONE"
          check 0 "$T_PROP" "$T_VAL" $T --set "$TSET,sparkDefaults.mode=on-prem,sparkDefaults.sseType=S3"
          check 1 "$H_PROP" "$H_VAL" $H --set mode=aws,sseType=S3
          check 0 "$H_PROP" "$H_VAL" $H --set mode=aws,sseType=NONE
          check 0 "$H_PROP" "$H_VAL" $H --set mode=on-prem,sseType=S3
          for c in "$T --set $TSET,sparkDefaults.mode=aws,sparkDefaults.sseType=KMS" "$H --set mode=aws,sseType=KMS"; do
            if err=$(helm template t $c 2>&1 >/dev/null) || ! grep -q 'sseType must be' <<<"$err"; then
              echo "::error::unknown sseType not rejected by the sseType guard: $c"; fail=1
            else echo "  ok   rejects KMS: ${c%% *}"; fi
          done
          exit $fail

      - name: Contract lists cover every substitution
        run: |
          python3 - <<'PY'
          import os, re, sys
          sys.path.insert(0, "tooling/deploy")
          from check_secret_templates import flux_files, kustomizations, kustomize_text
          from gen_cluster_vars import load_required
          # Each scout-config Kustomization's render may use only its own postBuild
          # sources (StrictPostBuildSubstitutions fails on the rest), and the Flux files
          # themselves only cluster-vars, which the site's parent substitutes. Unbraced
          # $NAME is matched too, so runtime shell vars stay $$-escaped.
          lists = {("ConfigMap", "cluster-vars"): set(load_required("deploy/required-vars.txt")),
                   ("Secret", "scout-secret-values"): set(load_required("deploy/required-secret-values.txt"))}
          cluster_vars = lists[("ConfigMap", "cluster-vars")]
          def used(text):
              text = text.replace("$$", "\x00")  # drop $$-escaped literals before matching
              return (set(re.findall(r'\$\{([A-Za-z0-9_]+)[:}]', text))  # ${NAME} / ${NAME:=def}
                      | set(re.findall(r'\$([A-Za-z0-9_]+)', text)))     # unbraced $NAME
          errs, paths = [], set()
          for mode in ("on-prem", "aws"):
              for f in flux_files(mode):
                  errs += [f"{os.path.relpath(f)}: {m} is not in required-vars.txt"
                           for m in sorted(used(f.read_text()) - cluster_vars)]
              for path, d in kustomizations(mode):
                  name, pb = d["metadata"]["name"], d["spec"].get("postBuild", {})
                  declared = set(pb.get("substitute", {}))
                  for s in pb.get("substituteFrom", []):
                      if (s["kind"], s["name"]) not in lists:
                          errs.append(f"{name}: substituteFrom {s['kind']}/{s['name']} has no contract list")
                      declared |= lists.get((s["kind"], s["name"]), set())
                  paths.add(path)
                  errs += [f"{name} ({path}) uses {m}, which none of its postBuild sources declares"
                           for m in sorted(used(kustomize_text(path)) - declared)]
          if errs:
              print("::error::Add site vars to required-vars.txt (on-prem secret values to required-secret-values.txt),")
              print("::error::or $$-escape runtime shell vars so Flux leaves them literal:")
              for e in dict.fromkeys(errs):  # shared files repeat per mode
                  print("::error::" + e)
              sys.exit(1)
          print(f"{len(paths)} rendered Flux paths: every substitution is declared by its own sources")
          PY

      - name: On-prem Secret templates render exactly through Flux
        # Fixture values only; flux build --dry-run never reads a cluster.
        run: python3 tooling/deploy/check_secret_templates.py

      - name: config-artifact tooling stamps + generates cleanly
        run: |
          set -euo pipefail
          # Canary for the Phase-3b tooling (config-artifact-publish runs these on
          # every main build). Both self-verify fail-closed: stamp_config asserts no
          # 0.0.0/latest/config-hash placeholder survives, gen_cluster_vars asserts
          # key set == required-vars.txt. Then confirm the STAMPED bases still build
          # (stamping is line-based -- catch a rewrite that broke YAML).
          rm -rf /tmp/stamped && cp -r deploy /tmp/stamped
          python3 tooling/deploy/stamp_config.py \
            --deploy-dir /tmp/stamped \
            --haul tooling/deploy/fixtures/haul.yaml \
            --realm-file helm/keycloak-config-cli/files/scout-realm.json
          python3 tooling/deploy/gen_cluster_vars.py \
            --values tooling/deploy/fixtures/cluster-vars.values.json \
            --required-vars deploy/required-vars.txt >/tmp/cluster-vars.yaml
          fail=0
          while read -r d; do
            grep -qx 'kind: Component' "$d/kustomization.yaml" && continue
            kustomize build "$d" >/dev/null || { echo "::error file=$d::stamped base failed to build"; fail=1; }
          done < <(find /tmp/stamped/base -name kustomization.yaml -exec dirname {} \; | sort)
          exit $fail

      - name: OPA data document matches the Ansible source
        run: |
          python3 - <<'PY'
          import yaml, json, sys
          # The OPA policy is single-sourced (.Files.Get), but the data document
          # (attribute_filters etc.) is still a git literal in deploy/base/opa while
          # the Keycloak half comes from the CI-seeded realm -- both derive from the
          # same ansible trino_* vars (scout_common trino_attribute_filters is "one
          # source for two roles"). Assert the deploy literal still matches the ansible
          # source so a divergence fails RED here. (Full single-source across OPA +
          # Keycloak is the config-artifact realm-generation follow-up.)
          TOKEN = "__REPORT_TABLE__"
          def norm(s):
              return s.replace("${report_delta_table_name}", TOKEN).replace("{{ report_delta_table_name }}", TOKEN)
          def canon(x):
              return json.loads(norm(json.dumps(x)))
          data_json = None
          for d in yaml.safe_load_all(open("deploy/base/opa/resources.yaml")):
              if d and d.get("kind") == "HelmRelease":
                  data_json = d["spec"]["values"]["data"]["json"]
          deploy = json.loads(norm(data_json))
          opa = yaml.safe_load(open("ansible/roles/opa/defaults/main.yaml"))
          common = yaml.safe_load(open("ansible/roles/scout_common/defaults/main.yaml"))
          expected = {
              "attribute_filters": canon(common["trino_attribute_filters"]),
              "view_owner_principals": canon(opa["trino_view_owner_principals"]),
              "masked_columns": canon(opa["trino_masked_columns"]),
              "filtered_tables": canon(opa["trino_filtered_tables"]),
              "hidden_tables": canon(opa["trino_hidden_tables"]),
          }
          mism = [(k, v, deploy.get(k)) for k, v in expected.items() if deploy.get(k) != v]
          if mism:
              print("::error::deploy/base/opa data document diverges from the Ansible trino_* source:")
              for k, exp, got in mism:
                  print(f"  {k}: ansible={exp} deploy={got}")
              sys.exit(1)
          print("OPA data document matches the Ansible trino_* source")
          PY

      - name: Parse Flux Kustomizations + check the DAG (per service_mode)
        run: |
          python3 - <<'PY'
          import yaml, glob, sys, collections
          # The DAG is mode-agnostic shared files (deploy/flux/*.yaml) UNION exactly one
          # mode set (deploy/modes/{aws,on-prem}/), since a site reconciles the shared set
          # + one mode (ADR 0035). The `storage-ready` gate + the ingress edge live only in
          # the mode sets, so check each mode's union: a lake consumer's
          # dependsOn: storage-ready must resolve in BOTH modes with no collision.
          def load(files):
              nodes = {}; edges = []; names = collections.Counter()
              for f in sorted(files):
                  if f.endswith("kustomization.yaml"):
                      continue  # kustomize aggregator, not a Flux Kustomization
                  try:
                      docs = list(yaml.safe_load_all(open(f)))
                  except Exception as e:
                      print(f"::error file={f}::YAML parse failed: {e}"); sys.exit(1)
                  for d in docs:
                      if not d:
                          continue
                      name = d["metadata"]["name"]
                      names[name] += 1
                      nodes[name] = f
                      for dep in d.get("spec", {}).get("dependsOn", []):
                          edges.append((name, dep["name"]))
              return nodes, edges, names
          # flux/ holds the shared set only; the mode sets are SIBLINGS (deploy/modes/),
          # so path: ./flux has no subdir to recurse into (the storage-ready collision).
          if glob.glob("deploy/flux/*/"):
              print("::error::deploy/flux/ must have no subdirs; mode sets live in deploy/modes/"); sys.exit(1)
          shared = glob.glob("deploy/flux/*.yaml")
          rc = 0
          for mode in ("on-prem", "aws"):
              nodes, edges, names = load(shared + glob.glob(f"deploy/modes/{mode}/*.yaml"))
              dups = sorted(n for n, c in names.items() if c > 1)
              if dups:
                  print(f"::error::[{mode}] duplicate Kustomization metadata.name (collide in "
                        f"flux-system, prune each other): {dups}"); rc = 1
              missing = sorted({b for _, b in edges if b not in nodes})
              if missing:
                  print(f"::error::[{mode}] dependsOn references a Kustomization that does not exist: {missing}"); rc = 1
              edges = [(a, b) for a, b in edges if b in nodes]
              g = collections.defaultdict(list); indeg = collections.Counter()
              for a, b in edges:
                  g[b].append(a); indeg[a] += 1
              q = [n for n in nodes if indeg[n] == 0]; seen = 0
              while q:
                  x = q.pop(); seen += 1
                  for y in g[x]:
                      indeg[y] -= 1
                      if indeg[y] == 0:
                          q.append(y)
              if seen != len(nodes):
                  print(f"::error::[{mode}] the Flux dependsOn graph has a cycle ({seen}/{len(nodes)} sortable)"); rc = 1
              if rc == 0:
                  print(f"[{mode}] {len(nodes)} Kustomizations, {len(edges)} edges: acyclic, no dup names, no dangling refs")
          sys.exit(rc)
          PY

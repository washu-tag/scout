name: Validate deploy base

# Structural checks for the GitOps deployment base (deploy/, ADR 0031, Phase 3):
# every Kustomize base renders, Flux Kustomizations parse, and the dependsOn graph
# stays acyclic with no dangling refs. Purely static -- no cluster, no deploy.
on:
  pull_request:
    paths:
      - deploy/**
      - tooling/deploy/**
      # The realm config-cli imports + the config-hash it is stamped from live here.
      - helm/keycloak-config-cli/**
      - .github/workflows/validate-deploy.yaml
      # OPA data-doc drift guard reads the Ansible source; re-run on those too.
      - ansible/roles/opa/defaults/main.yaml
      - ansible/roles/scout_common/defaults/main.yaml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install kustomize
        run: |
          set -euo pipefail
          VER=5.5.0
          # Pinned SHA256 (release checksums.txt); verify before extract so a
          # corrupted/tampered download fails closed.
          SHA=6703a3a70a0c47cf0b37694030b54f1175a9dfeb17b3818b623ed58b9dbc2a77
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${VER}/kustomize_v${VER}_linux_amd64.tar.gz" -o kustomize.tar.gz
          echo "${SHA}  kustomize.tar.gz" | sha256sum -c -
          sudo tar xz -C /usr/local/bin -f kustomize.tar.gz kustomize
          rm -f kustomize.tar.gz
          kustomize version

      - name: Render every base
        run: |
          set -euo pipefail
          fail=0
          while read -r d; do
            grep -qx 'kind: Component' "$d/kustomization.yaml" && continue  # components build via their consumers
            if kustomize build "$d" >/dev/null; then
              echo "  ok   $d"
            else
              echo "::error file=$d::kustomize build failed for $d"; fail=1
            fi
          done < <(find deploy/base -name kustomization.yaml -exec dirname {} \; | sort)
          exit $fail

      - name: required-vars covers every substitution
        run: |
          python3 - <<'PY'
          import re, glob, subprocess, sys
          # kustomize-controller runs drone/envsubst over the BUILT output,
          # substituting ${NAME} AND unbraced $NAME (any case), with $$ the literal-$
          # escape. So the surface is the rendered bases + flux/ files, not just
          # braced-lowercase source tokens. Assert required-vars.txt lists every
          # envsubst target; else it's green here but fails
          # StrictPostBuildSubstitutions (or substitutes empty) at deploy -- how
          # unbraced runtime shell vars like $HIVE_PW / $MINIO_ROOT_USER slipped through.
          blob = ""
          dirs = subprocess.run(
              ["bash", "-c", "find deploy/base -name kustomization.yaml -exec dirname {} \\;"],
              capture_output=True, text=True).stdout.split()
          dirs = [d for d in dirs if "kind: Component" not in open(d + "/kustomization.yaml").read()]
          for d in sorted(dirs):
              blob += subprocess.run(["kustomize", "build", d],
                                     capture_output=True, text=True).stdout + "\n"
          # shared DAG + both mode subdirs (flux/{aws,on-prem}/), so aws-only edge
          # vars (ALB, IRSA role-arns) are covered too and neither mode can rot.
          for f in glob.glob("deploy/flux/*.yaml") + glob.glob("deploy/flux/*/*.yaml"):
              if f.endswith("kustomization.yaml"):
                  continue
              blob += open(f).read() + "\n"
          blob = blob.replace("$$", "\x00")  # drop $$-escaped literals before matching
          used = set(re.findall(r'\$\{([A-Za-z0-9_]+)[:}]', blob))  # ${NAME} / ${NAME:-def}
          used |= set(re.findall(r'\$([A-Za-z0-9_]+)', blob))       # unbraced $NAME
          declared = {l.strip() for l in open("deploy/required-vars.txt")
                      if l.strip() and not l.lstrip().startswith("#")}
          missing = sorted(used - declared)
          if missing:
              print("::error::envsubst targets used in deploy/ but not in required-vars.txt.")
              print("::error::Add them as site vars, or $$-escape runtime shell vars so Flux leaves them literal:")
              for m in missing:
                  print("  " + m)
              sys.exit(1)
          print(f"required-vars.txt covers all {len(used)} envsubst targets")
          PY

      - name: config-artifact tooling stamps + generates cleanly
        run: |
          set -euo pipefail
          # Canary for the Phase-3b tooling (config-artifact-publish runs these on
          # every main build). Both self-verify fail-closed: stamp_config asserts no
          # 0.0.0/latest/config-hash placeholder survives, gen_cluster_vars asserts
          # key set == required-vars.txt. Then confirm the STAMPED bases still build
          # (stamping is line-based -- catch a rewrite that broke YAML).
          rm -rf /tmp/stamped && cp -r deploy /tmp/stamped
          python3 tooling/deploy/stamp_config.py \
            --deploy-dir /tmp/stamped \
            --haul tooling/deploy/fixtures/haul.yaml \
            --realm-file helm/keycloak-config-cli/files/scout-realm.json
          python3 tooling/deploy/gen_cluster_vars.py \
            --values tooling/deploy/fixtures/cluster-vars.values.json \
            --required-vars deploy/required-vars.txt >/tmp/cluster-vars.yaml
          fail=0
          while read -r d; do
            grep -qx 'kind: Component' "$d/kustomization.yaml" && continue
            kustomize build "$d" >/dev/null || { echo "::error file=$d::stamped base failed to build"; fail=1; }
          done < <(find /tmp/stamped/base -name kustomization.yaml -exec dirname {} \; | sort)
          exit $fail

      - name: OPA data document matches the Ansible source
        run: |
          python3 - <<'PY'
          import yaml, json, sys
          # The OPA policy is single-sourced (.Files.Get), but the data document
          # (attribute_filters etc.) is still a git literal in deploy/base/opa while
          # the Keycloak half comes from the CI-seeded realm -- both derive from the
          # same ansible trino_* vars (scout_common trino_attribute_filters is "one
          # source for two roles"). Assert the deploy literal still matches the ansible
          # source so a divergence fails RED here. (Full single-source across OPA +
          # Keycloak is the config-artifact realm-generation follow-up.)
          TOKEN = "__REPORT_TABLE__"
          def norm(s):
              return s.replace("${report_delta_table_name}", TOKEN).replace("{{ report_delta_table_name }}", TOKEN)
          def canon(x):
              return json.loads(norm(json.dumps(x)))
          data_json = None
          for d in yaml.safe_load_all(open("deploy/base/opa/resources.yaml")):
              if d and d.get("kind") == "HelmRelease":
                  data_json = d["spec"]["values"]["data"]["json"]
          deploy = json.loads(norm(data_json))
          opa = yaml.safe_load(open("ansible/roles/opa/defaults/main.yaml"))
          common = yaml.safe_load(open("ansible/roles/scout_common/defaults/main.yaml"))
          expected = {
              "attribute_filters": canon(common["trino_attribute_filters"]),
              "view_owner_principals": canon(opa["trino_view_owner_principals"]),
              "masked_columns": canon(opa["trino_masked_columns"]),
              "filtered_tables": canon(opa["trino_filtered_tables"]),
              "hidden_tables": canon(opa["trino_hidden_tables"]),
          }
          mism = [(k, v, deploy.get(k)) for k, v in expected.items() if deploy.get(k) != v]
          if mism:
              print("::error::deploy/base/opa data document diverges from the Ansible trino_* source:")
              for k, exp, got in mism:
                  print(f"  {k}: ansible={exp} deploy={got}")
              sys.exit(1)
          print("OPA data document matches the Ansible trino_* source")
          PY

      - name: Parse Flux Kustomizations + check the DAG (per service_mode)
        run: |
          python3 - <<'PY'
          import yaml, glob, sys, collections
          # The DAG is mode-agnostic shared files (deploy/flux/*.yaml) UNION exactly one
          # mode subdir (flux/{aws,on-prem}/), since a site reconciles the shared set +
          # one subdir (ADR 0035). The `storage-ready` gate + the ingress edge live only
          # in the subdirs, so check each mode's union: a lake consumer's
          # dependsOn: storage-ready must resolve in BOTH modes with no collision.
          def load(files):
              nodes = {}; edges = []; names = collections.Counter()
              for f in sorted(files):
                  if f.endswith("kustomization.yaml"):
                      continue  # kustomize aggregator, not a Flux Kustomization
                  try:
                      docs = list(yaml.safe_load_all(open(f)))
                  except Exception as e:
                      print(f"::error file={f}::YAML parse failed: {e}"); sys.exit(1)
                  for d in docs:
                      if not d:
                          continue
                      name = d["metadata"]["name"]
                      names[name] += 1
                      nodes[name] = f
                      for dep in d.get("spec", {}).get("dependsOn", []):
                          edges.append((name, dep["name"]))
              return nodes, edges, names
          shared = glob.glob("deploy/flux/*.yaml")
          rc = 0
          for mode in ("on-prem", "aws"):
              nodes, edges, names = load(shared + glob.glob(f"deploy/flux/{mode}/*.yaml"))
              dups = sorted(n for n, c in names.items() if c > 1)
              if dups:
                  print(f"::error::[{mode}] duplicate Kustomization metadata.name (collide in "
                        f"flux-system, prune each other): {dups}"); rc = 1
              missing = sorted({b for _, b in edges if b not in nodes})
              if missing:
                  print(f"::error::[{mode}] dependsOn references a Kustomization that does not exist: {missing}"); rc = 1
              edges = [(a, b) for a, b in edges if b in nodes]
              g = collections.defaultdict(list); indeg = collections.Counter()
              for a, b in edges:
                  g[b].append(a); indeg[a] += 1
              q = [n for n in nodes if indeg[n] == 0]; seen = 0
              while q:
                  x = q.pop(); seen += 1
                  for y in g[x]:
                      indeg[y] -= 1
                      if indeg[y] == 0:
                          q.append(y)
              if seen != len(nodes):
                  print(f"::error::[{mode}] the Flux dependsOn graph has a cycle ({seen}/{len(nodes)} sortable)"); rc = 1
              if rc == 0:
                  print(f"[{mode}] {len(nodes)} Kustomizations, {len(edges)} edges: acyclic, no dup names, no dangling refs")
          sys.exit(rc)
          PY

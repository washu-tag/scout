name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 2.1.0)'
        required: true
        type: string
      dry_run:
        description: 'Preview changelog without releasing'
        required: false
        type: boolean
        default: false
      skip_dev_reset:
        description: 'Skip resetting versions back to dev after release (use for releases from non-main branches)'
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: read
  actions: read
  attestations: write
  id-token: write

env:
  # The images update-versions.sh stamps, i.e. the ones a release retags. superset
  # and keycloak are built from a vendored upstream and keep their upstream version,
  # so they are published but never carry X.Y.Z.
  SCOUT_VERSIONED_IMAGES: 'hl7log-extractor hl7-transformer hl7-listener scout-notebook launchpad report-viewer'
  UPSTREAM_VERSIONED_IMAGES: 'superset keycloak'
  # The 14 charts publish-charts packages at X.Y.Z (mirrors its matrix); the release
  # verify step re-checks each is published before the Release is minted.
  RELEASE_CHARTS: 'hl7-transformer dcm4chee hive-metastore hl7-listener hl7log-extractor keycloak-config-cli launchpad open-webui-bootstrap orthanc report-viewer scout-dashboards scout-opa temporal-bootstrap voila'

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    outputs:
      version_bump_exists: ${{ steps.check_commits.outputs.version_bump_exists }}
      version_bump_sha: ${{ steps.check_commits.outputs.version_bump_sha }}
      release_exists: ${{ steps.check_release.outputs.release_exists }}
      reset_exists: ${{ steps.check_commits.outputs.reset_exists }}
    steps:
      - name: Validate version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format. Expected X.Y.Z (e.g., 2.1.0)"
            exit 1
          fi
          echo "Version format is valid: $VERSION"

      - name: Generate token from GitHub App
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check the version is not already released
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: |
          tag_exists=false; release_exists=false
          git tag -l "v${VERSION}" | grep -q . && tag_exists=true
          gh release view "v${VERSION}" >/dev/null 2>&1 && release_exists=true
          # A tag WITHOUT a release is expected and fine: release-dispatch.yaml
          # pre-creates the boundary tag v<version> on the merge commit so release-please
          # can scope its changelog during the build; the GitHub Release is minted last,
          # after image verification. It also covers resuming a release whose tag exists
          # but whose release step had not run. Only a tag AND a release together mean
          # the version is truly already published.
          if [ "$tag_exists" = true ] && [ "$release_exists" = true ]; then
            echo "::error::v${VERSION} is already released (tag and release both exist)"
            exit 1
          fi
          echo "v${VERSION}: tag_exists=${tag_exists} release_exists=${release_exists} (proceeding)"

      - name: Check for existing commits
        id: check_commits
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Check for version bump commit
          VERSION_BUMP_SHA=$(git log --grep="^Update to version $VERSION$" --format="%H" | head -1)
          if [[ -n "$VERSION_BUMP_SHA" ]]; then
            echo "Found existing version bump commit: $VERSION_BUMP_SHA"
            echo "version_bump_exists=true" >> "$GITHUB_OUTPUT"
            echo "version_bump_sha=$VERSION_BUMP_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "No existing version bump commit found"
            echo "version_bump_exists=false" >> "$GITHUB_OUTPUT"
            echo "version_bump_sha=" >> "$GITHUB_OUTPUT"
          fi

          # Check for reset commit (after version bump)
          if [[ -n "$VERSION_BUMP_SHA" ]]; then
            RESET_SHA=$(git log --grep="^Reset to dev versions$" --format="%H" "$VERSION_BUMP_SHA..HEAD" | head -1)
            if [[ -n "$RESET_SHA" ]]; then
              echo "Found existing reset commit: $RESET_SHA"
              echo "reset_exists=true" >> "$GITHUB_OUTPUT"
            else
              echo "No reset commit found after version bump"
              echo "reset_exists=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "reset_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if release exists
        id: check_release
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if gh release view "v${VERSION}" &>/dev/null; then
            echo "Release v${VERSION} already exists"
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release v${VERSION} does not exist"
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Preview changelog (dry run)
        if: inputs.dry_run
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          echo "## Changelog Preview for v${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 --match "v*" 2>/dev/null || echo "")

          if [[ -n "$PREV_TAG" ]]; then
            echo "Generating changelog since $PREV_TAG..." >> "$GITHUB_STEP_SUMMARY"

            # Use GitHub API to generate release notes preview
            NOTES=$(gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${REPO}/releases/generate-notes" \
              -f tag_name="v${VERSION}" \
              -f target_commitish="${SHA}" \
              -f previous_tag_name="$PREV_TAG" \
              --jq '.body')

            echo "$NOTES" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No previous tag found. This will be the first release." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo ""
          echo "::notice::Dry run complete. No commits, tags, or releases were created."

  version-bump:
    name: Version Bump
    runs-on: ubuntu-latest
    needs: validate
    # Create version bump if: (1) no bump exists, OR (2) a bump exists but was
    # followed by a reset (meaning a previous release failed and we're retrying)
    if: ${{ !inputs.dry_run && (needs.validate.outputs.version_bump_exists != 'true' || needs.validate.outputs.reset_exists == 'true') }}
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Generate token from GitHub App
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - name: Configure git
        run: |
          git config user.name "scout-release[bot]"
          git config user.email "scout-release[bot]@users.noreply.github.com"

      - name: Update version files
        env:
          VERSION: ${{ inputs.version }}
        run: |
          bash .github/scripts/update-versions.sh "$VERSION"

      - name: Update package-lock.json
        run: |
          cd launchpad
          npm install --package-lock-only
          cd ../tests/auth
          npm install --package-lock-only

      - name: Commit and push
        id: commit
        env:
          VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git add -A
          git commit -m "Update to version ${VERSION}"
          git push origin "${REF_NAME}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  wait-for-build:
    name: Wait for Build
    runs-on: ubuntu-latest
    needs: [validate, version-bump]
    # Run this job if:
    # - version-bump succeeded (new version bump commit was created), OR
    # - version-bump was skipped (version bump already exists, resuming after partial failure)
    # always() is required because GitHub Actions skips downstream jobs by default when
    # upstream jobs are skipped; without it, the 'skipped' result check would never be evaluated
    if: ${{ !inputs.dry_run && always() && !cancelled() && (needs.version-bump.result == 'success' || needs.version-bump.result == 'skipped') }}
    outputs:
      commit_sha: ${{ steps.target.outputs.sha }}
      ci_run_id: ${{ steps.wait.outputs.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine target commit
        id: target
        env:
          # Pin the release build to the version-bump (stamped) commit, not current HEAD.
          # This fixes the tag + changelog boundary: the tag can only move from the merge
          # commit to the stamp commit, so no Conventional Commit merged mid-release is
          # dropped from a changelog. It does NOT stop a mid-release merge from overwriting
          # the X.Y.Z images: ci.yaml's publish is changes-gated and the tag is mutable, so
          # a merge while main is stamped still republishes over them. Closing that needs a
          # release-in-progress lock (tracked follow-up); until then, hold merges during a
          # release. To fold a fix into a failed release: reset + re-dispatch, so version-bump
          # re-stamps the fixed HEAD.
          BUMP_SHA: ${{ needs.version-bump.outputs.commit_sha || needs.validate.outputs.version_bump_sha }}
        run: |
          if [ -z "${BUMP_SHA}" ]; then
            echo "::error::no version-bump commit to pin the release to"; exit 1
          fi
          echo "Pinning release build to ${BUMP_SHA}"
          echo "sha=${BUMP_SHA}" >> "$GITHUB_OUTPUT"

      - name: Wait for CI workflow
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          echo "Waiting for CI workflow to complete on $TARGET_SHA..."

          # Poll for up to 90 minutes (180 attempts * 30s)
          MAX_ATTEMPTS=180
          SLEEP_SECONDS=30
          RUN_ID=""

          for ((i=1; i<=MAX_ATTEMPTS; i++)); do
            # Find the workflow run if we haven't yet
            if [[ -z "$RUN_ID" ]]; then
              RUN_ID=$(gh run list \
                --workflow=ci.yaml \
                --branch="${REF_NAME}" \
                --json databaseId,headSha,status \
                --jq ".[] | select(.headSha == \"$TARGET_SHA\") | .databaseId" \
                | head -1)

              if [[ -n "$RUN_ID" ]]; then
                echo "Found workflow run: $RUN_ID"
              else
                echo "[$i/$MAX_ATTEMPTS] Waiting for CI workflow to start..."
                sleep "$SLEEP_SECONDS"
                continue
              fi
            fi

            # Poll run status (tolerate transient API errors)
            if ! STATUS=$(gh run view "$RUN_ID" --json status,conclusion --jq '.status + ":" + .conclusion'); then
              echo "[$i/$MAX_ATTEMPTS] API error, will retry..."
              sleep "$SLEEP_SECONDS"
              continue
            fi
            case "$STATUS" in
              completed:success)
                echo "CI workflow completed successfully"
                echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              completed:*)
                echo "::error::CI workflow failed (status: $STATUS)"
                echo "See: https://github.com/${REPO}/actions/runs/$RUN_ID"
                exit 1
                ;;
              *)
                echo "[$i/$MAX_ATTEMPTS] CI workflow status: $STATUS"
                sleep "$SLEEP_SECONDS"
                ;;
            esac
          done

          echo "::error::Timed out waiting for CI workflow"
          exit 1

  publish:
    name: Publish Images
    runs-on: ubuntu-latest
    needs: [wait-for-build]
    # On main, CI's publish job pushes images. On non-main branches, CI runs but its
    # publish job is gated to main only, so we push images here instead.
    # always() is required because version-bump (a transitive dependency) may be skipped
    # on re-runs, and GitHub Actions propagates skip status through the dependency graph.
    if: >-
      always() && !cancelled()
      && github.ref_name != 'main'
      && !inputs.dry_run
      && needs.wait-for-build.result == 'success'
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download and push all images
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.wait-for-build.outputs.ci_run_id }}
        run: |
          IMAGES="${SCOUT_VERSIONED_IMAGES} ${UPSTREAM_VERSIONED_IMAGES}"
          for IMAGE in $IMAGES; do
            echo "=== Publishing $IMAGE ==="
            gh run download "$RUN_ID" --repo "${{ github.repository }}" -n "$IMAGE" -D "${{ runner.temp }}/$IMAGE"
            FULL_TAG=$(docker load --input "${{ runner.temp }}/$IMAGE/$IMAGE.tar" | sed 's/.*: //g')
            rm -f "${{ runner.temp }}/$IMAGE/$IMAGE.tar"
            docker push "$FULL_TAG"
            docker rmi "$FULL_TAG"
          done

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [validate, wait-for-build, publish, publish-charts]
    if: >-
      !inputs.dry_run && always() && !cancelled()
      && needs.wait-for-build.result == 'success'
      && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
      && needs.publish-charts.result == 'success'
      && needs.validate.outputs.release_exists != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify the release images and charts were published
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        # wait-for-build only proves CI went green, not that it published
        # anything. On main the images come from ci.yaml's publish job, which
        # pushes an image only when that image needed pushing -- so a release
        # fixed forward on a later commit can go green having published nothing.
        # That is how v4.1.0 got a tag and a release with no 4.1.0 images. Assert
        # the tags exist before minting a release that claims them. Charts are gated
        # by publish-charts's success too, but re-check here so nothing is claimed
        # until every artifact is actually queryable (ghcr-tag-published takes the
        # name as a path segment, so charts/<name> works unmodified).
        run: |
          set -euo pipefail
          missing=()
          for image in ${SCOUT_VERSIONED_IMAGES}; do
            published="$(bash .github/scripts/ghcr-tag-published.sh "${image}" "${VERSION}")"
            echo "${image}:${VERSION} published=${published}"
            [ "${published}" = 'true' ] || missing+=("${image}")
          done
          for chart in ${RELEASE_CHARTS}; do
            published="$(bash .github/scripts/ghcr-tag-published.sh "charts/${chart}" "${VERSION}")"
            echo "charts/${chart}:${VERSION} published=${published}"
            [ "${published}" = 'true' ] || missing+=("charts/${chart}")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::not published at ${VERSION}: ${missing[*]}"
            echo "::error::refusing to create release v${VERSION}. The version bump commit is preserved, so re-run the release once the artifacts publish."
            exit 1
          fi
          echo "::notice::all ${VERSION} images and charts are published"

      - name: Generate token from GitHub App
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Anchor the tag to the built commit + create the release
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ needs.wait-for-build.outputs.commit_sha }}
        run: |
          set -euo pipefail
          # release-dispatch.yaml pre-creates the boundary tag v${VERSION} at the
          # release-PR merge commit so release-please can scope its changelog during
          # the build. Now that the built + image-verified commit exists, point the tag
          # at it so `git checkout v${VERSION}` reproduces the released source (parity
          # with the manual-dispatch path, where the tag does not pre-exist and we
          # create it). gh then anchors the Release to that tag, so no --target needed.
          # The built commit is a descendant of the merge commit and the only commit
          # between them ("Update to version X.Y.Z") is not a Conventional Commit, so
          # moving the tag forward does not disturb release-please's next-cycle scoping.
          if gh api "repos/${REPO}/git/ref/tags/v${VERSION}" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${REPO}/git/refs/tags/v${VERSION}" -f sha="${COMMIT_SHA}" -F force=true
          else
            gh api -X POST "repos/${REPO}/git/refs" -f ref="refs/tags/v${VERSION}" -f sha="${COMMIT_SHA}"
          fi
          gh release create "v${VERSION}" \
            --repo "${REPO}" \
            --title "Scout v${VERSION}" \
            --generate-notes

          echo "::notice::Created release v${VERSION}"

      - name: Clear the release PR's pending label
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          REPO: ${{ github.repository }}
        # release-please labels its release PR `autorelease: pending` and only clears
        # that label when IT creates the release -- which it never does, because
        # release-please.yaml sets skip-github-release and this lane owns the tag and
        # the Release. Left set, the merged release PR reads to release-please as an
        # untagged release forever, and every later run aborts with "There are
        # untagged, merged release PRs outstanding" instead of opening the next
        # release PR. Clear it here, once the release actually exists.
        run: |
          set -euo pipefail
          prs="$(gh pr list --repo "${REPO}" --state merged \
            --label 'autorelease: pending' --json number --jq '.[].number')"
          for pr in ${prs}; do
            gh pr edit "${pr}" --repo "${REPO}" --remove-label 'autorelease: pending'
            echo "::notice::cleared 'autorelease: pending' on #${pr}"
          done

  reset-dev:
    name: Reset to Dev Versions
    runs-on: ubuntu-latest
    needs: [validate, release]
    # Only reset after a successful release. If the release was skipped (e.g., build
    # failed) or failed (e.g., gh release create error), we preserve the version bump
    # commit so a re-run can reuse it.
    #
    # Deliberately does NOT consult validate's reset_exists. That is computed before
    # version-bump runs, so on a re-release of an already-released version it reports
    # the PREVIOUS cycle's reset and skips this one -- which is how v4.1.0's re-release
    # left main stamped at 4.1.0. version-bump still needs the flag (it is what tells
    # it to create a fresh bump); this job does not, because "Commit and push" below
    # already no-ops when the files are at dev versions.
    if: ${{ !inputs.dry_run && !inputs.skip_dev_reset && always() && !cancelled() && needs.release.result == 'success' }}
    steps:
      - name: Generate token from GitHub App
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - name: Pull latest
        env:
          REF_NAME: ${{ github.ref_name }}
        run: git pull origin "${REF_NAME}"

      - name: Configure git
        run: |
          git config user.name "scout-release[bot]"
          git config user.email "scout-release[bot]@users.noreply.github.com"

      - name: Reset to dev versions
        run: |
          bash .github/scripts/update-versions.sh dev

      - name: Update package-lock.json
        run: |
          cd launchpad
          npm install --package-lock-only
          cd ../tests/auth
          npm install --package-lock-only

      - name: Commit and push
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git add -A

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit (already at dev versions)"
          else
            git commit -m "Reset to dev versions"
            git push origin "${REF_NAME}"
            echo "::notice::Reset to dev versions complete"
          fi

  verify-dev-reset:
    name: Verify main returned to dev
    runs-on: ubuntu-latest
    needs: [validate, version-bump, wait-for-build, publish, release, reset-dev]
    # Runs ONLY when the release SUCCEEDED (so tag + Release exist): main must then be
    # back at dev placeholders. If it is not, reset-dev flaked (an npm hiccup, or a push
    # rejected by a concurrent merge) and main is silently stamped, so a dev deploy would
    # pull the pinned version instead of `latest`. Fail LOUD -- but the recovery here is a
    # MANUAL reset, NOT a re-dispatch (validate blocks re-dispatch once the version is
    # released). When the release did NOT succeed, the run is already red and the version
    # bump is intentionally kept for a re-dispatch retry, so this check stays out of the way.
    if: ${{ !inputs.dry_run && !inputs.skip_dev_reset && always() && !cancelled() && needs.release.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Assert VERSION files are back at dev placeholders
        env:
          VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # This runs right after reset-dev pushed, so a stale read could fail a
          # release that actually succeeded. Re-fetch a few times before believing
          # main is stamped. update-versions.sh dev is a no-op diff when already at dev.
          for attempt in 1 2 3; do
            git fetch origin "${REF_NAME}"
            git reset --hard "origin/${REF_NAME}"
            bash .github/scripts/update-versions.sh dev
            if git diff --quiet; then
              echo "${REF_NAME} is at dev versions."
              exit 0
            fi
            [ "${attempt}" -lt 3 ] && sleep 5
          done
          echo "::error::Release v${VERSION} succeeded but ${REF_NAME} is still STAMPED (reset-dev did not complete). A dev deploy would pull v${VERSION} instead of latest. Re-dispatch will NOT help (v${VERSION} is already released); reset manually:"
          echo "::error::  git checkout ${REF_NAME} && bash .github/scripts/update-versions.sh dev && git commit -am 'Reset to dev versions' && git push"
          git --no-pager diff --stat
          exit 1

  publish-charts:
    name: Publish charts at the release version
    runs-on: ubuntu-latest
    needs: [validate, version-bump, wait-for-build]
    # ADR 0030: a release publishes all charts at X.Y.Z (not just the build-lane
    # 0.YYYYMMDD.run). Packaged from the stamped commit so Chart.yaml is at X.Y.Z.
    # Runs BEFORE `release` (which needs + verifies it), so a failed chart leg blocks
    # the Release rather than leaving it published with charts partly missing.
    if: >-
      !inputs.dry_run && always() && !cancelled()
      && needs.wait-for-build.result == 'success'
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
    strategy:
      fail-fast: false
      matrix:
        chart:
          - { name: hl7-transformer, dir: helm/extractor/hl7-transformer }
          - { name: dcm4chee, dir: helm/dcm4chee }
          - { name: hive-metastore, dir: helm/hive-metastore }
          - { name: hl7-listener, dir: helm/hl7-listener }
          - { name: hl7log-extractor, dir: helm/extractor/hl7log-extractor }
          - { name: keycloak-config-cli, dir: helm/keycloak-config-cli }
          - { name: launchpad, dir: helm/launchpad }
          - { name: open-webui-bootstrap, dir: helm/open-webui-bootstrap }
          - { name: orthanc, dir: helm/orthanc }
          - { name: report-viewer, dir: helm/report-viewer }
          - { name: scout-dashboards, dir: helm/scout-dashboards }
          - { name: scout-opa, dir: helm/scout-opa }
          - { name: temporal-bootstrap, dir: helm/temporal-bootstrap }
          - { name: voila, dir: helm/voila }
    steps:
      - name: Checkout the stamped commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version-bump.outputs.commit_sha || needs.validate.outputs.version_bump_sha }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # cosign sign + the imagetools digest lookup below read ~/.docker/config.json,
      # which `helm registry login` doesn't populate; without this the sign step 401s.
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package, push, and sign ${{ matrix.chart.name }} at v${{ inputs.version }}
        env:
          CHART_DIR: ${{ matrix.chart.dir }}
          CHART_NAME: ${{ matrix.chart.name }}
          VERSION: ${{ inputs.version }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "${REGISTRY_TOKEN}" | helm registry login "${REGISTRY}" -u "${ACTOR}" --password-stdin
          helm package "${CHART_DIR}" --version "${VERSION}" --destination "${RUNNER_TEMP}"
          helm push "${RUNNER_TEMP}/${CHART_NAME}-${VERSION}.tgz" "oci://${REGISTRY}/washu-tag/charts"
          ref="${REGISTRY}/washu-tag/charts/${CHART_NAME}:${VERSION}"
          digest="$(docker buildx imagetools inspect "${ref}" --format '{{json .Manifest}}' | jq -r '.digest')"
          [ "${digest#sha256:}" != "${digest}" ] || { echo "::error::no digest for ${CHART_NAME}"; exit 1; }
          cosign sign --key env://COSIGN_PRIVATE_KEY --use-signing-config=false \
            --tlog-upload=false --yes "${REGISTRY}/washu-tag/charts/${CHART_NAME}@${digest}"

  alias-haul:
    name: Alias the build haul to the release version
    runs-on: ubuntu-latest
    needs: [validate, wait-for-build, release]
    # ADR 0030: a release must map to a transportable haul. The CI run wait-for-build
    # verified already published a signed build-lane haul (0.YYYYMMDD.run) and moved
    # :main onto it; oras-tag that exact manifest + bundle to X.Y.Z so an air-gapped
    # site can pull the release by version. cosign signatures are digest-keyed, so the
    # existing signature verifies through the alias -- no re-sign. main only: ci.yaml's
    # publish-haul (which uploads the haul-version artifact this reads) runs on main, so
    # a non-main release has no build haul to alias.
    if: >-
      !inputs.dry_run && always() && !cancelled()
      && github.ref_name == 'main'
      && needs.release.result == 'success'
    permissions:
      contents: read
      packages: write
    env:
      MANIFEST_REPO: ghcr.io/washu-tag/manifests/scout-manifest
      BUNDLE_REPO: ghcr.io/washu-tag/manifests/scout
      CONFIG_REPO: ghcr.io/washu-tag/manifests/scout-config
      RELEASE_VERSION: ${{ inputs.version }}
      RUN_ID: ${{ needs.wait-for-build.outputs.ci_run_id }}
    steps:
      # Needed so the local composite ./.github/actions/install-hauler-oras resolves.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install hauler and oras
        uses: ./.github/actions/install-hauler-oras
      - name: Read the build version from the release's CI run
        id: buildver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The build lane (ci.yaml publish-haul, #642) uploads haul-version on every
          # main build. Absent only in the window before #642 is live; skip the alias
          # with a loud warning + the manual command rather than red a release that
          # already succeeded (alias-haul runs post-mint and can't be re-dispatched).
          if gh run download "${RUN_ID}" --repo "${{ github.repository }}" -n haul-version -D haul-version 2>/dev/null; then
            BUILD_VERSION="$(cat haul-version/haul-version.txt)"
          else
            BUILD_VERSION=""
          fi
          if [ -z "${BUILD_VERSION}" ]; then
            echo "::warning::run ${RUN_ID} published no haul-version artifact (build lane not live yet?); skipping the ${RELEASE_VERSION} alias. Alias manually once it is: oras tag ${MANIFEST_REPO}:<build> ${RELEASE_VERSION} && oras tag ${BUNDLE_REPO}:<build> ${RELEASE_VERSION} && oras tag ${CONFIG_REPO}:<build> ${RELEASE_VERSION}"
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "build_version=${BUILD_VERSION}" >> "$GITHUB_OUTPUT"
          fi
      - name: Alias the manifest, bundle, and config artifact to the release version
        if: steps.buildver.outputs.found == 'true'
        env:
          BUILD_VERSION: ${{ steps.buildver.outputs.build_version }}
        run: |
          set -euo pipefail
          # oras tag adds :${RELEASE_VERSION} onto the same digest as the build tag; the
          # cosign signatures (digest-keyed) verify unchanged through the alias. scout-config
          # is the GitOps deploy artifact, aliased so a site can pin scout-config:X.Y.Z.
          oras tag "${MANIFEST_REPO}:${BUILD_VERSION}" "${RELEASE_VERSION}"
          oras tag "${BUNDLE_REPO}:${BUILD_VERSION}" "${RELEASE_VERSION}"
          oras tag "${CONFIG_REPO}:${BUILD_VERSION}" "${RELEASE_VERSION}"
          echo "::notice::aliased haul + config ${BUILD_VERSION} -> ${RELEASE_VERSION}"

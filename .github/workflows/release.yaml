name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 2.1.0)'
        required: true
        type: string
      dry_run:
        description: 'Preview changelog without releasing'
        required: false
        type: boolean
        default: false
      skip_dev_reset:
        description: 'Skip resetting versions back to dev after release (use for releases from non-main branches)'
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    outputs:
      version_bump_exists: ${{ steps.check_commits.outputs.version_bump_exists }}
      version_bump_sha: ${{ steps.check_commits.outputs.version_bump_sha }}
      boundary_sha: ${{ steps.resume.outputs.boundaryRevision || steps.boundary.outputs.sha }}
      resume: ${{ steps.resume.outputs.exists }}
      resume_revision: ${{ steps.resume.outputs.revision }}
      producer_run_id: ${{ steps.resume.outputs.runId }}
      producer_run_attempt: ${{ steps.resume.outputs.runAttempt }}
      reset_exists: ${{ steps.check_commits.outputs.reset_exists }}
    steps:
      - name: Validate version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[1-9][0-9]*\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Invalid version format. Expected X.Y.Z (e.g., 2.1.0)"
            exit 1
          fi
          echo "Version format is valid: $VERSION"

      - name: Require the upstream release repository
        if: ${{ !inputs.dry_run }}
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          if [ "$REPO" != washu-tag/scout ] || [[ "$REF" != refs/heads/* ]]; then
            echo "::error::Release publication requires a washu-tag/scout branch."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate token from GitHub App
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Preserve the release boundary
        if: ${{ !inputs.dry_run }}
        id: boundary
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/v${VERSION}"; then
            boundary=$(git rev-parse "refs/tags/v${VERSION}")
            if [ "$(git cat-file -t "$boundary")" != commit ]; then
              echo "::error::Release promotion requires a lightweight boundary tag; annotated tags are not rewritten."
              exit 1
            fi
          else
            boundary=$(git rev-parse HEAD)
          fi
          echo "sha=$boundary" >> "$GITHUB_OUTPUT"
      - name: Check for existing commits
        id: check_commits
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Check for version bump commit
          VERSION_BUMP_SHA=$(git log -1 --grep="^Update to version ${VERSION//./[.]}$" --format="%H")
          if [[ -n "$VERSION_BUMP_SHA" ]]; then
            echo "Found existing version bump commit: $VERSION_BUMP_SHA"
            echo "version_bump_exists=true" >> "$GITHUB_OUTPUT"
            echo "version_bump_sha=$VERSION_BUMP_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "No existing version bump commit found"
            echo "version_bump_exists=false" >> "$GITHUB_OUTPUT"
            echo "version_bump_sha=" >> "$GITHUB_OUTPUT"
          fi

          # Check for reset commit (after version bump)
          if [[ -n "$VERSION_BUMP_SHA" ]]; then
            RESET_SHA=$(git log -1 --grep="^Reset to dev versions$" --format="%H" "$VERSION_BUMP_SHA..HEAD")
            if [[ -n "$RESET_SHA" ]]; then
              echo "Found existing reset commit: $RESET_SHA"
              echo "reset_exists=true" >> "$GITHUB_OUTPUT"
            else
              echo "No reset commit found after version bump"
              echo "reset_exists=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "reset_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: ${{ !inputs.dry_run }}
        with:
          python-version: '3.12'
      - run: pip install pyyaml
        if: ${{ !inputs.dry_run }}
      - name: Select an existing release's original inputs
        if: ${{ !inputs.dry_run }}
        id: resume
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 tooling/release/promote.py resume --repository "$REPO" \
            --version "$VERSION" --branch "$REF_NAME" --github-output "$GITHUB_OUTPUT"
      - name: Require the recovered source on this branch
        if: steps.resume.outputs.exists == 'true'
        env:
          REVISION: ${{ steps.resume.outputs.revision }}
        run: git merge-base --is-ancestor "$REVISION" HEAD

      - name: Preview changelog (dry run)
        if: inputs.dry_run
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          echo "## Changelog Preview for v${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 --match "v*" 2>/dev/null || echo "")

          if [[ -n "$PREV_TAG" ]]; then
            echo "Generating changelog since $PREV_TAG..." >> "$GITHUB_STEP_SUMMARY"

            # Use GitHub API to generate release notes preview
            NOTES=$(gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${REPO}/releases/generate-notes" \
              -f tag_name="v${VERSION}" \
              -f target_commitish="${SHA}" \
              -f previous_tag_name="$PREV_TAG" \
              --jq '.body')

            echo "$NOTES" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No previous tag found. This will be the first release." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo ""
          echo "::notice::Dry run complete. No commits, tags, or releases were created."

  version-bump:
    name: Version Bump
    runs-on: ubuntu-latest
    needs: validate
    # Create version bump if: (1) no bump exists, OR (2) a bump exists but was
    # followed by a reset (meaning a previous release failed and we're retrying)
    if: ${{ !inputs.dry_run && needs.validate.outputs.resume != 'true' && (needs.validate.outputs.version_bump_exists != 'true' || needs.validate.outputs.reset_exists == 'true') }}
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Generate token from GitHub App
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - name: Configure git
        run: |
          git config user.name "scout-release[bot]"
          git config user.email "scout-release[bot]@users.noreply.github.com"

      - name: Update version files
        env:
          VERSION: ${{ inputs.version }}
        run: |
          bash .github/scripts/update-versions.sh "$VERSION"

      - name: Update package-lock.json
        run: |
          cd launchpad
          npm install --package-lock-only
          cd ../tests/auth
          npm install --package-lock-only

      - name: Commit and push
        id: commit
        env:
          VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git add -A
          git commit -m "Update to version ${VERSION}"
          git push origin "${REF_NAME}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  wait-for-build:
    name: Wait for the exact tested and published build
    runs-on: ubuntu-latest
    timeout-minutes: 185
    needs: [validate, version-bump]
    # Run this job if:
    # - version-bump succeeded (new version bump commit was created), OR
    # - version-bump was skipped (version bump already exists, resuming after partial failure)
    # always() is required because GitHub Actions skips downstream jobs by default when
    # upstream jobs are skipped; without it, the 'skipped' result check would never be evaluated
    if: ${{ !inputs.dry_run && always() && !cancelled() && needs.validate.result == 'success' && (needs.version-bump.result == 'success' || needs.version-bump.result == 'skipped') }}
    outputs:
      commit_sha: ${{ steps.target.outputs.sha }}
      ci_run_id: ${{ steps.saved.outputs.run_id || steps.wait.outputs.run_id }}
      ci_run_attempt: ${{ steps.saved.outputs.run_attempt || steps.wait.outputs.run_attempt }}
      build_version: ${{ steps.wait.outputs.build_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.resume_revision || needs.version-bump.outputs.commit_sha || needs.validate.outputs.version_bump_sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install pyyaml

      - name: Determine target commit
        id: target
        env:
          # Pin the release build to the version-bump (stamped) commit, not current HEAD.
          # This fixes the tag + changelog boundary: the tag can only move from the merge
          # commit to the stamp commit, so no Conventional Commit merged mid-release is
          # dropped from a changelog. Legacy X.Y.Z image tags remain mutable;
          # promotion compares them with the signed haul and rejects a mismatch.
          # Hold unrelated merges while main is stamped to avoid that conflict.
          # Before a draft exists, folding in a fix requires reset + re-dispatch
          # so version-bump re-stamps the fixed HEAD. Draft recovery never rebuilds.
          BUMP_SHA: ${{ needs.validate.outputs.resume_revision || needs.version-bump.outputs.commit_sha || needs.validate.outputs.version_bump_sha }}
        run: |
          if [ -z "${BUMP_SHA}" ]; then
            echo "::error::no version-bump commit to pin the release to"; exit 1
          fi
          echo "Pinning release build to ${BUMP_SHA}"
          echo "sha=${BUMP_SHA}" >> "$GITHUB_OUTPUT"

      - name: Reuse the original producer attempt
        if: needs.validate.outputs.resume == 'true'
        id: saved
        env:
          RUN_ID: ${{ needs.validate.outputs.producer_run_id }}
          RUN_ATTEMPT: ${{ needs.validate.outputs.producer_run_attempt }}
        run: |
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Wait for the exact successful CI attempt
        if: needs.validate.outputs.resume != 'true'
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          python3 tooling/release/promote.py wait \
            --repository "$REPO" --revision "$TARGET_SHA" --branch "$REF_NAME" --timeout 10800 \
            --github-output "$GITHUB_OUTPUT"

  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [validate, wait-for-build]
    if: >-
      !inputs.dry_run && always() && !cancelled()
      && needs.validate.result == 'success'
      && needs.wait-for-build.result == 'success'
    # Registry mutations remain separate from the producer CI lock.
    concurrency:
      group: scout-release-promotion
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Checkout the stamped release tooling and chart source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.wait-for-build.outputs.commit_sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - uses: ./.github/actions/install-hauler-oras
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.0.6'
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Generate the release writer token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Free candidate storage
        if: github.ref_name != 'main'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/share/swift /opt/ghc
          sudo apt-get clean
          docker system prune -af --volumes
      - name: Download the selected attempt's candidate
        if: github.ref_name != 'main'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.wait-for-build.outputs.ci_run_id }}
          name: flux-candidate-${{ needs.wait-for-build.outputs.ci_run_attempt }}
          path: candidate
      - name: Download the selected attempt's canonical images
        if: github.ref_name != 'main'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.wait-for-build.outputs.ci_run_id }}
          name: flux-images-${{ needs.wait-for-build.outputs.ci_run_attempt }}
          path: candidate/images
      - name: Recheck the successful attempt and publish its tested images
        if: github.ref_name != 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.wait-for-build.outputs.ci_run_id }}
          RUN_ATTEMPT: ${{ needs.wait-for-build.outputs.ci_run_attempt }}
          TARGET_SHA: ${{ needs.wait-for-build.outputs.commit_sha }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ inputs.version }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          VERSION="$(jq -er .version candidate/index.json)" \
          GITHUB_SHA="$TARGET_SHA" GITHUB_RUN_ID="$RUN_ID" GITHUB_RUN_ATTEMPT="$RUN_ATTEMPT" \
            python3 .github/scripts/copy-flux-artifacts.py publish-images --candidate candidate \
              --release-branch "$REF_NAME" --release-version "$RELEASE_VERSION"
      - name: Package and sign the Ansible compatibility charts
        env:
          VERSION: ${{ inputs.version }}
          REGISTRY_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          RESUME: ${{ needs.validate.outputs.resume }}
          STAMPED_SHA: ${{ needs.wait-for-build.outputs.commit_sha }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          # All chart writes share this job's promotion/recovery lock. The GitOps aliases
          # remain the unmodified artifacts tested by the same CI attempt.
          resume_args=()
          if [ "$RESUME" = true ]; then resume_args=(--resume); fi
          python3 tooling/release/promote.py charts --version "$VERSION" \
            --public-key cosign.pub --revision "$STAMPED_SHA" "${resume_args[@]}" > "$RUNNER_TEMP/release-charts.txt"
          while read -r name directory; do
            app_version="$(bash .github/scripts/chart-app-version.sh "$name" "$VERSION")"
            app_args=()
            if [ -n "$app_version" ]; then app_args=(--app-version "$app_version"); fi
            helm package "$directory" --version "$VERSION" "${app_args[@]}" --destination "$RUNNER_TEMP"
            archive="$RUNNER_TEMP/${name}-${VERSION}.tgz"
            bash .github/scripts/assert-chart-not-latest.sh "$archive" "$name"
            helm push "$archive" oci://ghcr.io/washu-tag/charts
            repository="ghcr.io/washu-tag/charts/$name"
            digest="$(oras manifest fetch --descriptor "$repository:$VERSION" | jq -r '.digest')"
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Release chart digest is invalid"
              exit 1
            fi
            cosign sign --key env://COSIGN_PRIVATE_KEY --use-signing-config=false \
              --tlog-upload=false --yes -a "org.opencontainers.image.revision=$STAMPED_SHA" "$repository@$digest"
          done < "$RUNNER_TEMP/release-charts.txt"
      - name: Promote verified digests and publish the signed release record
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_GH_TOKEN: ${{ steps.app_token.outputs.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          COMMIT_SHA: ${{ needs.wait-for-build.outputs.commit_sha }}
          PRODUCER_RUN_ID: ${{ needs.wait-for-build.outputs.ci_run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ needs.wait-for-build.outputs.ci_run_attempt }}
          BOUNDARY_SHA: ${{ needs.validate.outputs.boundary_sha }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          python3 tooling/release/promote.py promote \
            --repository "$REPO" --version "$VERSION" --revision "$COMMIT_SHA" \
            --producer-run-id "$PRODUCER_RUN_ID" --producer-run-attempt "$PRODUCER_RUN_ATTEMPT" \
            --boundary-sha "$BOUNDARY_SHA" --public-key cosign.pub \
            --work-dir "$RUNNER_TEMP/promotion"

      - name: Verify and publish the compatibility branch release
        if: github.ref_name != 'main'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ needs.wait-for-build.outputs.commit_sha }}
          BOUNDARY_SHA: ${{ needs.validate.outputs.boundary_sha }}
        run: |
          set -euo pipefail
          python3 tooling/release/promote.py images > "$RUNNER_TEMP/release-images.txt"
          python3 tooling/release/promote.py charts | awk '{print "charts/" $1}' >> "$RUNNER_TEMP/release-images.txt"
          while read -r artifact; do
            digest="$(oras manifest fetch --descriptor "ghcr.io/washu-tag/$artifact:$VERSION" | jq -er .digest)"
            cosign verify --key cosign.pub --insecure-ignore-tlog "ghcr.io/washu-tag/$artifact@$digest"
          done < "$RUNNER_TEMP/release-images.txt"
          if [ "$BOUNDARY_SHA" != "$COMMIT_SHA" ]; then
            gh api "repos/$REPO/compare/$BOUNDARY_SHA...$COMMIT_SHA" \
              | jq -e --arg boundary "$BOUNDARY_SHA" '.status == "ahead" and .merge_base_commit.sha == $boundary'
          fi
          if gh api "repos/$REPO/git/ref/tags/v$VERSION" > "$RUNNER_TEMP/release-tag.json"; then
            jq -e --arg boundary "$BOUNDARY_SHA" --arg source "$COMMIT_SHA" \
              '.object.type == "commit" and (.object.sha == $boundary or .object.sha == $source)' "$RUNNER_TEMP/release-tag.json"
            gh api -X PATCH "repos/$REPO/git/refs/tags/v$VERSION" -f sha="$COMMIT_SHA" -F force=false
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$COMMIT_SHA"
          fi
          gh release create "v$VERSION" --repo "$REPO" --title "Scout v$VERSION" --generate-notes

      - name: Clear the release PR's pending label
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          REPO: ${{ github.repository }}
          BOUNDARY_SHA: ${{ needs.validate.outputs.boundary_sha }}
        # release-please labels its release PR `autorelease: pending` and only clears
        # that label when IT creates the release -- which it never does, because
        # release-please.yaml sets skip-github-release and this lane owns the tag and
        # the Release. Left set, the merged release PR reads to release-please as an
        # untagged release forever, and every later run aborts with "There are
        # untagged, merged release PRs outstanding" instead of opening the next
        # release PR. Clear it here, once the release actually exists.
        run: |
          set -euo pipefail
          prs="$(gh pr list --repo "${REPO}" --state merged \
            --label 'autorelease: pending' --json number,mergeCommit | \
            jq -r --arg boundary "$BOUNDARY_SHA" '.[] | select(.mergeCommit.oid == $boundary) | .number')"
          for pr in ${prs}; do
            gh pr edit "${pr}" --repo "${REPO}" --remove-label 'autorelease: pending'
            echo "::notice::cleared 'autorelease: pending' on #${pr}"
          done

  reset-dev:
    name: Reset to Dev Versions
    runs-on: ubuntu-latest
    needs: [validate, release]
    # Only reset after a successful release. If the release was skipped (e.g., build
    # failed) or failed (e.g., gh release create error), we preserve the version bump
    # commit so a re-run can reuse it.
    #
    # Re-dispatch also reaches this idempotent step after verifying a published
    # main release. Never use the pre-bump reset_exists flag to skip a new reset.
    if: ${{ !inputs.dry_run && !inputs.skip_dev_reset && always() && !cancelled() && needs.release.result == 'success' }}
    steps:
      - name: Generate token from GitHub App
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - name: Pull latest
        env:
          REF_NAME: ${{ github.ref_name }}
        run: git pull origin "${REF_NAME}"

      - name: Configure git
        run: |
          git config user.name "scout-release[bot]"
          git config user.email "scout-release[bot]@users.noreply.github.com"

      - name: Reset to dev versions
        env:
          STAMPED_SHA: ${{ needs.validate.outputs.resume_revision }}
        run: |
          # A historical re-dispatch must never reset a newer release's stamp.
          latest_stamp=$(git log -1 --grep='^Update to version [0-9]' --format='%H')
          bash .github/scripts/update-versions.sh dev
          if [ -n "$STAMPED_SHA" ] && [ "$latest_stamp" != "$STAMPED_SHA" ] && ! git diff --quiet; then
            echo "::error::Branch carries a later release stamp; refusing to reset it."
            exit 1
          fi

      - name: Update package-lock.json
        run: |
          cd launchpad
          npm install --package-lock-only
          cd ../tests/auth
          npm install --package-lock-only

      - name: Commit and push
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git add -A

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit (already at dev versions)"
          else
            git commit -m "Reset to dev versions"
            git push origin "${REF_NAME}"
            echo "::notice::Reset to dev versions complete"
          fi

  verify-dev-reset:
    name: Verify main returned to dev
    runs-on: ubuntu-latest
    needs: [validate, version-bump, wait-for-build, release, reset-dev]
    # A same-version re-dispatch verifies the published record, then retries reset.
    if: ${{ !inputs.dry_run && !inputs.skip_dev_reset && always() && !cancelled() && needs.release.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Assert VERSION files are back at dev placeholders
        env:
          VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # This runs right after reset-dev pushed, so a stale read could fail a
          # release that actually succeeded. Re-fetch a few times before believing
          # main is stamped. update-versions.sh dev is a no-op diff when already at dev.
          for attempt in 1 2 3; do
            git fetch origin "${REF_NAME}"
            git reset --hard "origin/${REF_NAME}"
            bash .github/scripts/update-versions.sh dev
            if git diff --quiet; then
              echo "${REF_NAME} is at dev versions."
              exit 0
            fi
            [ "${attempt}" -lt 3 ] && sleep 5
          done
          echo "::error::Release v${VERSION} succeeded but ${REF_NAME} is still STAMPED (reset-dev did not complete). Follow the release recovery procedure to retry or repair the dev reset:"
          echo "::error::See docs/internal/versions-and-releases.md for recovery and the manual fallback."
          git --no-pager diff --stat
          exit 1

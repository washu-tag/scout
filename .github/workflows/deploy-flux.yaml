name: Deploy via Flux (on-prem)

# Consumer proof: the ingest leg runs from either the exact published config from a
# successful upstream main build, or a clearly separate locally built PR/prototype config.
# The workflow_run boundary is repeated in the read-only jobs and the status-only writer.
on:
  workflow_run:
    workflows: [Post-Commit Tasks]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - deploy/**
      - tooling/deploy/**
      - helm/**
      - .github/workflows/deploy-flux.yaml
      - .github/workflows/ci.yaml
      - .github/ci_resources/flux/**
      - .github/actions/install-flux/**
      - .github/actions/install-sops-age/**
      - .github/actions/install-hauler-oras/**
      - .github/actions/publish-haul/**
  push:
    branches:
      - plt/onprem-ci-proof
      - codex/onprem-ci-proof-handoff
  workflow_dispatch:
    inputs:
      values:
        description: 'How scout-secret-values reaches the cluster'
        type: choice
        options: [sops, plain]
        default: sops

permissions:
  contents: read

concurrency:
  # Published attempts and manual runs are independent; a newer PR push supersedes its proof.
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id || (github.event_name == 'workflow_dispatch' && github.run_id) || github.ref }}-${{ github.event.workflow_run.run_attempt || 'local' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_run' }}

env:
  JAVA_DIST: 'zulu'
  JAVA_VERSION: '21'
  K3S_DATA_DIR: /mnt/k3s
  MANIFEST_REPO: ghcr.io/washu-tag/manifests/scout-manifest
  CONFIG_REPO: ghcr.io/washu-tag/manifests/scout-config
  TESTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  VALUES_MODE: ${{ inputs.values || 'sops' }}

jobs:
  identity:
    name: Resolve exact published config
    if: >-
      github.event_name == 'workflow_run' &&
      github.repository == 'washu-tag/scout' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == 'washu-tag/scout'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      present: ${{ steps.select.outputs.present }}
      version: ${{ steps.validate.outputs.version }}
      config_digest: ${{ steps.validate.outputs.config_digest }}
      manifest_digest: ${{ steps.validate.outputs.manifest_digest }}
    env:
      PRODUCER_RUN_ID: ${{ github.event.workflow_run.id }}
      PRODUCER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Select the receipt for this producer attempt
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "/repos/washu-tag/scout/actions/runs/${PRODUCER_RUN_ID}/artifacts?per_page=100" \
            > "$RUNNER_TEMP/config-artifacts.json"
          python3 .github/ci_resources/flux/receipt_archive.py select \
            --listing "$RUNNER_TEMP/config-artifacts.json" \
            --run-id "$PRODUCER_RUN_ID" --run-attempt "$PRODUCER_RUN_ATTEMPT" \
            --revision "$TESTED_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Download only the selected receipt
        if: steps.select.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT_ARTIFACT_ID: ${{ steps.select.outputs.artifact_id }}
        run: |
          set -euo pipefail
          gh api "/repos/washu-tag/scout/actions/artifacts/${RECEIPT_ARTIFACT_ID}/zip" \
            > "$RUNNER_TEMP/config-receipt.zip"
          python3 .github/ci_resources/flux/receipt_archive.py extract \
            --archive "$RUNNER_TEMP/config-receipt.zip" --output "$RUNNER_TEMP/scout-config-ref.json"
      - name: Validate the producer identity
        id: validate
        if: steps.select.outputs.present == 'true'
        run: |
          python3 tooling/deploy/artifact_identity.py validate \
            --receipt "$RUNNER_TEMP/scout-config-ref.json" \
            --repository washu-tag/scout --revision "$TESTED_SHA" \
            --run-id "$PRODUCER_RUN_ID" --run-attempt "$PRODUCER_RUN_ATTEMPT" \
            --github-output "$GITHUB_OUTPUT"

  ingest:
    name: deploy-and-test-flux (ingest)
    needs: [identity]
    if: >-
      always() && (
        github.event_name != 'workflow_run' || (
          github.repository == 'washu-tag/scout' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_repository.full_name == 'washu-tag/scout' &&
          needs.identity.result == 'success' && needs.identity.outputs.present == 'true'
        )
      )
    permissions:
      contents: read
    env:
      ARTIFACT_MODE: ${{ github.event_name == 'workflow_run' && 'published' || 'local' }}
      IDENTITY_REPOSITORY: ${{ github.event_name == 'workflow_run' && 'washu-tag/scout' || github.repository }}
      IDENTITY_RUN_ID: ${{ github.event.workflow_run.id || github.run_id }}
      IDENTITY_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || github.run_attempt }}
      RECEIPT_VERSION: ${{ needs.identity.outputs.version }}
      RECEIPT_CONFIG_DIGEST: ${{ needs.identity.outputs.config_digest }}
      RECEIPT_MANIFEST_DIGEST: ${{ needs.identity.outputs.manifest_digest }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # stamp_config.py and the helpers import PyYAML.
      - run: pip install pyyaml
      - name: Check the leg against the DAG
        run: python3 .github/ci_resources/flux/check_legs.py
      - uses: ./.github/actions/install-flux
      - uses: ./.github/actions/install-sops-age
      - uses: ./.github/actions/install-hauler-oras
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.0.6'
      - name: Verify the exact published config before installing the cluster
        if: env.ARTIFACT_MODE == 'published'
        shell: bash
        run: |
          set -euo pipefail
          cp cosign.pub "$RUNNER_TEMP/cosign.pub"
          export VERSION="$RECEIPT_VERSION" MANIFEST_DIGEST="$RECEIPT_MANIFEST_DIGEST"
          export CONFIG_SOURCE="$CONFIG_REPO" CONFIG_DIGEST="$RECEIPT_CONFIG_DIGEST" CONFIG_INSECURE=false
          bash .github/ci_resources/flux/verify_config.sh
      - name: Install the registry
        shell: bash
        env:
          REGISTRY_VERSION: '3.1.2'
          REGISTRY_SHA256: '40df2224d410f72ae425c3371873b078bbdbda3b8b612be9571f0e6751f3acc8'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/registry.tar.gz \
            "https://github.com/distribution/distribution/releases/download/v${REGISTRY_VERSION}/registry_${REGISTRY_VERSION}_linux_amd64.tar.gz"
          echo "${REGISTRY_SHA256}  /tmp/registry.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/registry.tar.gz -C /usr/local/bin registry
          rm -f /tmp/registry.tar.gz

      - name: 'Set up Java for Gradle cache warming'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ env.JAVA_DIST }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'
      # Same as the e2e lane: resolve the ingest test deps for the in-cluster --offline
      # test Job in the background; "Wait for Gradle cache warming" joins it.
      - name: 'Start Gradle cache warming'
        shell: bash
        run: |
          (if bash -c '
            set -e
            (cd tests/ingest && ./gradlew --no-daemon --console=plain testClasses resolveTestDeps)
            sudo mkdir -p /mnt/scout-gradle-cache
            sudo cp -a "${HOME}/.gradle/." /mnt/scout-gradle-cache/
            sudo chmod -R a+rwX /mnt/scout-gradle-cache
            rm -rf tests/ingest/build tests/ingest/.gradle  # keep pod mount a clean checkout
          ' >/tmp/gradle-warm.log 2>&1; then echo 0; else echo 1; fi >/tmp/gradle-warm.rc) </dev/null >/dev/null 2>&1 &

      # Layer 0 as the e2e lane installs it: k3s from the Ansible playbook and the CI
      # inventory, so the k3s pin stays single-sourced in versions.yaml.
      - name: 'Prepare inventory.yaml'
        shell: bash
        run: |
          NODE_IP=$(hostname -I | awk '{print $1}')
          echo "NODE_IP=${NODE_IP}" >> "$GITHUB_ENV"
          sed -e "s/HOSTNAME/$(hostname)/" -e "s/K3S_TOKEN/$(openssl rand -hex 16)/" \
            -e "s:WORK_DIR:$(pwd):" -e "s/NODE_IP/$NODE_IP/g" \
            -e "s:K3S_DATA_DIR:$K3S_DATA_DIR:g" \
            .github/ci_resources/inventory.yaml > ansible/inventory.yaml
      - name: 'ansible-galaxy dependencies'
        shell: bash
        run: cd ansible && sudo -E /opt/pipx_bin/ansible-galaxy install -r collections/requirements.yaml
      - name: Install Python dependencies for Ansible Kubernetes modules
        run: /opt/pipx/venvs/ansible-core/bin/python -m pip install kubernetes
      - name: 'Install k3s'
        shell: bash
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        run: |
          set -euo pipefail
          (cd ansible && sudo -E /opt/pipx_bin/ansible-playbook -v -i inventory.yaml --diff playbooks/k3s.yaml)
          # The playbook (run as root with the runner's HOME) leaves ~/.kube root-owned.
          sudo mkdir -p "$HOME/.kube"
          sudo cp /etc/rancher/k3s/k3s.yaml "$HOME/.kube/config"
          sudo chown -R "$(id -u):$(id -g)" "$HOME/.kube"
          chmod 600 "$HOME/.kube/config"
          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"
          KUBECONFIG="$HOME/.kube/config" kubectl get nodes -o wide

      - name: Start the in-job registry
        shell: bash
        run: |
          set -euo pipefail
          # Plain HTTP on the node IP, which pods (source-controller) reach directly.
          sudo mkdir -p /mnt/registry && sudo chown "$(id -u):$(id -g)" /mnt/registry
          cat > "$RUNNER_TEMP/registry.yml" <<EOF
          version: 0.1
          log:
            level: warn
          storage:
            filesystem:
              rootdirectory: /mnt/registry
          http:
            addr: 0.0.0.0:5000
          EOF
          nohup registry serve "$RUNNER_TEMP/registry.yml" > "$RUNNER_TEMP/registry.log" 2>&1 &
          timeout 30 bash -c "until curl -fsS http://${NODE_IP}:5000/v2/ >/dev/null; do sleep 1; done"
          echo "CI_REGISTRY=${NODE_IP}:5000" >> "$GITHUB_ENV"

      # Local mode proves proposed deploy code using a snapshot of the released haul.
      # It does not claim to test a config published by the triggering build.
      - name: Build, push and sign the local scout-config
        if: env.ARTIFACT_MODE == 'local'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="0.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          export VERSION
          work="$RUNNER_TEMP/config"; rm -rf "$work"; mkdir -p "$work/haul"
          # Resolve the local prototype's released baseline once; pull only that digest.
          MANIFEST_DIGEST="$(oras manifest fetch --descriptor "${MANIFEST_REPO}:main" | jq -er .digest)"
          export MANIFEST_DIGEST
          oras pull "${MANIFEST_REPO}@${MANIFEST_DIGEST}" -o "$work/haul"
          cp -r deploy "$work/config-artifact"
          python3 tooling/deploy/stamp_config.py \
            --deploy-dir "$work/config-artifact" \
            --haul "$work/haul/haul.yaml" \
            --realm-file helm/keycloak-config-cli/files/scout-realm.json
          tar -C "$work/config-artifact" -czf "$work/scout-config.tar.gz" \
            base flux modes required-vars.txt required-secret-values.txt
          export CONFIG_SOURCE="${CI_REGISTRY}/scout-config" CONFIG_INSECURE=true
          (cd "$work" && oras push --plain-http "${CONFIG_SOURCE}:${VERSION}" \
            --export-manifest "$RUNNER_TEMP/local-config-manifest.json" \
            --annotation "org.opencontainers.image.source=https://github.com/${IDENTITY_REPOSITORY}" \
            --annotation "org.opencontainers.image.revision=${TESTED_SHA}" \
            --annotation "org.opencontainers.image.version=${VERSION}" \
            --annotation "io.scout.build.run-id=${IDENTITY_RUN_ID}" \
            --annotation "io.scout.build.run-attempt=${IDENTITY_RUN_ATTEMPT}" \
            --annotation "io.scout.build.manifest-digest=${MANIFEST_DIGEST}" \
            scout-config.tar.gz:application/gzip)
          COSIGN_PASSWORD="$(openssl rand -hex 16)"
          export COSIGN_PASSWORD
          (cd "$RUNNER_TEMP" && cosign generate-key-pair)
          CONFIG_DIGEST="sha256:$(sha256sum "$RUNNER_TEMP/local-config-manifest.json" | cut -d ' ' -f 1)"
          export CONFIG_DIGEST
          cosign sign --key "$RUNNER_TEMP/cosign.key" --allow-http-registry \
            --use-signing-config=false --tlog-upload=false --yes "${CONFIG_SOURCE}@${CONFIG_DIGEST}"
          rm -f "$RUNNER_TEMP/cosign.key"
          bash .github/ci_resources/flux/verify_config.sh

      - name: Install Flux
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/flux-system"; rm -rf "$dir"; mkdir -p "$dir"
          cp .github/ci_resources/flux/flux-system/*.yaml "$dir/"
          flux install --export > "$dir/gotk-components.yaml"
          kubectl apply --server-side -k "$dir"
          for d in source-controller kustomize-controller helm-controller notification-controller; do
            kubectl -n flux-system rollout status "deploy/$d" --timeout=5m
          done
          # The flags the proof depends on are live, not just rendered.
          kubectl -n flux-system get deploy kustomize-controller -o jsonpath='{.spec.template.spec.containers[0].args}' \
            | grep -q 'StrictPostBuildSubstitutions=true'
          kubectl -n flux-system get deploy helm-controller -o jsonpath='{.spec.template.spec.containers[0].args}' \
            | grep -q 'UseHelm3Defaults=true'
          flux check

      # The site carries cluster-vars, encrypted values, and the digest-pinned source.
      # Both trust keys are bootstrapped directly, outside the site artifact.
      - name: Build, sign and push the site artifact
        shell: bash
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site"; neg="$RUNNER_TEMP/negative"
          rm -rf "$site" "$neg"; mkdir -p "$site" "$neg"
          cp .github/ci_resources/flux/site/kustomization.yaml "$site/"
          sed -e "s|@CONFIG_SOURCE@|${CONFIG_SOURCE}|g" \
            -e "s|@CONFIG_DIGEST@|${CONFIG_DIGEST}|g" \
            -e "s|insecure: false|insecure: ${CONFIG_INSECURE}|g" \
            .github/ci_resources/flux/site/scout-config-source.yaml > "$site/scout-config-source.yaml"
          kubectl create secret generic scout-cosign-pub -n flux-system \
            --from-file=cosign.pub="$RUNNER_TEMP/cosign.pub"
          jq --arg d "$PWD/tests/ingest/staging_test_data" '.extractor_data_dir = $d' \
            .github/ci_resources/flux/cluster-vars.values.json > "$RUNNER_TEMP/cluster-vars.values.json"
          python3 tooling/deploy/gen_cluster_vars.py --values "$RUNNER_TEMP/cluster-vars.values.json" \
            --namespace flux-system -o "$site/cluster-vars.yaml"
          # Ephemeral age key: the private half ends up only in the sops-age Secret.
          umask 077
          age-keygen -o "$RUNNER_TEMP/age.agekey" 2>/dev/null
          recipient="$(age-keygen -y "$RUNNER_TEMP/age.agekey")"
          kubectl -n flux-system create secret generic sops-age --from-file=age.agekey="$RUNNER_TEMP/age.agekey"
          rm -f "$RUNNER_TEMP/age.agekey"
          # Values Secrets are generated owner-only and never printed; an encrypted one is
          # checked for ciphertext only before it leaves this step.
          gen() {  # <file> <name> <namespace>
            python3 tooling/deploy/gen_secret_values.py \
              --values .github/ci_resources/flux/secret-values.json \
              --cluster-vars-values "$RUNNER_TEMP/cluster-vars.values.json" \
              --name "$2" --namespace "$3" -o "$1"
          }
          encrypt() {  # <file>
            sops --disable-version-check --encrypt --age "$recipient" \
              --encrypted-regex '^(data|stringData)$' --in-place "$1"
            python3 .github/ci_resources/flux/assert_encrypted.py "$1" .github/ci_resources/flux/secret-values.json
          }
          if [ "$VALUES_MODE" = plain ]; then
            # Written straight to the cluster, as the vault side would; not in the artifact.
            gen "$RUNNER_TEMP/scout-secret-values.yaml" scout-secret-values flux-system
            kubectl apply -f "$RUNNER_TEMP/scout-secret-values.yaml"
            rm -f "$RUNNER_TEMP/scout-secret-values.yaml"
            sed -i '/scout-secret-values.yaml/d' "$site/kustomization.yaml"
          else
            gen "$site/scout-secret-values.yaml" scout-secret-values flux-system
            encrypt "$site/scout-secret-values.yaml"
          fi
          # The no-decryption negative case's copy, in its own namespace.
          gen "$neg/ci-neg-encrypted.yaml" ci-neg-encrypted ci-negative
          encrypt "$neg/ci-neg-encrypted.yaml"
          flux push artifact "oci://${CI_REGISTRY}/ci-negative:${VERSION}" --path="$neg" \
            --source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --revision="${VERSION}@sha1:${TESTED_SHA}" --insecure-registry
          bash .github/ci_resources/flux/publish_site.sh

      - name: Reconcile the verified site and config sources
        shell: bash
        run: |
          set -euo pipefail
          sed -e "s|@REGISTRY@|${CI_REGISTRY}|g" -e "s|@SITE_DIGEST@|${SITE_DIGEST}|g" \
            .github/ci_resources/flux/roots-site.yaml | kubectl apply -f -
          python3 .github/ci_resources/flux/wait_ready.py scout-site-source 600
          python3 .github/ci_resources/flux/site_trust.py positive \
            --name scout-site --source "oci://${CI_REGISTRY}/scout-site" \
            --digest "$SITE_DIGEST" --key scout-site-cosign-pub
          python3 .github/ci_resources/flux/site_trust.py positive \
            --name scout-config --source "oci://${CONFIG_SOURCE}" \
            --digest "$CONFIG_DIGEST" --key scout-cosign-pub
          # The values Secret holds every key in plaintext (decrypted by kustomize-controller
          # in sops mode). Counts only; no value is printed.
          kubectl -n flux-system get secret scout-secret-values -o json | python3 -c '
          import base64, json, sys
          d = json.load(sys.stdin)["data"]
          enc = [k for k, v in d.items() if base64.b64decode(v).startswith(b"ENC[")]
          print(len(d), "values in Secret flux-system/scout-secret-values,", len(enc), "still ciphertext")
          sys.exit(1 if enc else 0)
          '

      - name: Reject untrusted site artifacts
        id: site-trust-negative
        shell: bash
        run: |
          set -euo pipefail
          sed -e "s|@REGISTRY@|${CI_REGISTRY}|g" \
            -e "s|@SITE_GOOD_DIGEST@|${SITE_GOOD_DIGEST}|g" \
            -e "s|@SITE_TAMPERED_DIGEST@|${SITE_TAMPERED_DIGEST}|g" \
            .github/ci_resources/flux/site-trust-negative.yaml > "$RUNNER_TEMP/site-trust-negative.yaml"
          python3 .github/ci_resources/flux/site_trust.py negative \
            --manifest "$RUNNER_TEMP/site-trust-negative.yaml"

      - name: Negative cases
        id: negative
        continue-on-error: true # prototype: record the verdict, keep going, fail at the end
        shell: bash
        run: |
          set -euo pipefail
          sed -e "s|@REGISTRY@|${CI_REGISTRY}|g" -e "s|@VERSION@|${VERSION}|g" \
            .github/ci_resources/flux/negative.yaml > "$RUNNER_TEMP/negative.yaml"
          python3 .github/ci_resources/flux/negative_cases.py "$RUNNER_TEMP/negative.yaml" \
            .github/ci_resources/flux/secret-values.json

      - name: Reconcile the ingest leg
        id: reconcile
        shell: bash
        run: |
          set -euo pipefail
          kubectl apply -f .github/ci_resources/flux/roots-apps.yaml
          python3 .github/ci_resources/flux/wait_ready.py "$(cat .github/ci_resources/flux/ingest-kustomizations.txt)" 2700
      # An air-gapped site pulls through the staging Harbor's proxies only.
      - name: Images come from mirrored registries
        id: images
        continue-on-error: true # prototype: record the verdict, keep going, fail at the end
        run: python3 .github/ci_resources/flux/check_images.py
      - name: 'Wait for Gradle cache warming'
        shell: bash
        run: |
          while [ ! -f /tmp/gradle-warm.rc ]; do sleep 5; done
          cat /tmp/gradle-warm.log
          exit "$(cat /tmp/gradle-warm.rc)"
      - name: 'Run tests'
        shell: bash
        run: |
          cp .github/ci_resources/test_config_template.json tests/ingest/src/test/resources/config/local.json
          sed -i "s:WORK_DIR:$(pwd):" .github/ci_resources/tests-job.yaml
          kubectl apply -f .github/ci_resources/tests-job.yaml
          kubectl wait --for=condition=complete --timeout=1800s job/ci-tests -n scout-extractor &
          completion_pid=$!
          kubectl wait --for=condition=failed --timeout=1800s job/ci-tests -n scout-extractor && exit 1 &
          failure_pid=$!
          wait -n $completion_pid $failure_pid
      - name: Test Logs
        if: always() && steps.reconcile.outcome == 'success'
        shell: bash
        run: kubectl -n scout-extractor logs job/ci-tests
      - name: Test Summary
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
        if: always() && steps.reconcile.outcome == 'success'
        with:
          paths: 'tests/ingest/**/TEST-*.xml'
          show: 'fail, skip'
      - name: Logging (extractor)
        if: always() && steps.reconcile.outcome == 'success'
        shell: bash
        run: |
          kubectl -n scout-extractor logs deployment/hl7log-extractor --tail=200
          kubectl -n scout-extractor logs deployment/hl7-transformer --tail=200
      - name: Diagnostics
        if: failure() || steps.negative.outcome == 'failure' || steps.images.outcome == 'failure'
        shell: bash
        run: bash .github/ci_resources/flux/diagnose.sh
      # Sizing record for the platform leg (5c-2): what the ingest leg asked for and used.
      - name: Node capacity
        if: always() && steps.reconcile.outcome != 'skipped'
        shell: bash
        run: |
          kubectl describe node | sed -n '/Allocated resources/,/Events:/p'
          kubectl top pods -A --sort-by=memory 2>&1 | head -40
          free -m
      - name: Verdict
        if: always()
        shell: bash
        env:
          NEGATIVE: ${{ steps.negative.outcome }}
          IMAGES: ${{ steps.images.outcome }}
        run: |
          rc=0
          if [ "$NEGATIVE" = "failure" ]; then echo "::error::the negative cases failed (see that step)"; rc=1; fi
          if [ "$IMAGES" = "failure" ]; then echo "::error::an image comes from an unmirrored registry"; rc=1; fi
          exit $rc

  published-status:
    name: Report the published artifact proof
    needs: [identity, ingest]
    if: >-
      always() &&
      github.event_name == 'workflow_run' &&
      github.repository == 'washu-tag/scout' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == 'washu-tag/scout' &&
      (needs.identity.result != 'success' || needs.identity.outputs.present == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # This is the only writer. Never checkout/download artifacts or run repository code here.
    permissions:
      statuses: write
    steps:
      - name: Report against the tested producer commit
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_SHA: ${{ github.event.workflow_run.head_sha }}
          IDENTITY_RESULT: ${{ needs.identity.result }}
          INGEST_RESULT: ${{ needs.ingest.result }}
        run: |
          set -euo pipefail
          state=failure
          description='Published config identity or Flux ingest proof failed'
          if [ "$IDENTITY_RESULT" = success ] && [ "$INGEST_RESULT" = success ]; then
            state=success
            description='Exact published config passed the Flux ingest proof'
          fi
          gh api --method POST "/repos/washu-tag/scout/statuses/${PRODUCER_SHA}" \
            -f state="$state" -f context='on-prem/flux-ingest' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

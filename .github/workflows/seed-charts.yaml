name: Seed charts

# One-time go-live seed for the build-lane haul (ADR 0033).
#
# publish-charts (ci.yaml) is changed-only, so a never-changed chart is absent
# from GHCR and the haul's fail-closed carry rejects it. This publishes + signs
# all 14 charts once, THEN leaves a complete haul predecessor: it carries the 8
# images from the current :main haul (seeded by bootstrap-haul.yaml) and folds in
# the 14 fresh chart digests, so the next ci.yaml run carries all 22 normally.
# Publishing the charts to GHCR alone is NOT enough -- build_haul carries strictly
# from the predecessor manifest, not a live registry lookup, so the charts must be
# IN the predecessor haul, which is what this workflow's tail writes.
#
# Run once at go-live, after bootstrap-haul.yaml has seeded the 8 images. The
# saved bundle omits the 9 upstream images (re-resolved on every real build, never
# carried); the next ci.yaml run republishes a complete bundle. Its purpose is to
# seed the carry predecessor, not to be transported.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  MANIFEST_REPO: ghcr.io/washu-tag/manifests/scout-manifest
  BUNDLE_REPO: ghcr.io/washu-tag/manifests/scout

jobs:
  seed:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install hauler and oras
        uses: ./.github/actions/install-hauler-oras
      - name: Package, push, and sign all 14 charts, recording each digest as fresh
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="0.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          printf '%s' "${REGISTRY_TOKEN}" | helm registry login "${REGISTRY}" -u "${ACTOR}" --password-stdin
          mkdir -p digests
          # name dir  (name = Chart.yaml name == charts/<name> repo, per components.txt)
          while read -r name dir; do
            [ -n "${name}" ] || continue
            helm package "${dir}" --version "${VERSION}" --destination "${RUNNER_TEMP}"
            helm push "${RUNNER_TEMP}/${name}-${VERSION}.tgz" "oci://${REGISTRY}/washu-tag/charts"
            ref="${REGISTRY}/washu-tag/charts/${name}:${VERSION}"
            digest="$(docker buildx imagetools inspect "${ref}" --format '{{json .Manifest}}' | jq -r '.digest')"
            [ "${digest#sha256:}" != "${digest}" ] || { echo "::error::no digest for ${name}"; exit 1; }
            cosign sign --key env://COSIGN_PRIVATE_KEY --use-signing-config=false \
              --tlog-upload=false --yes "${REGISTRY}/washu-tag/charts/${name}@${digest}"
            printf '%s %s@%s\n' "${name}" "${ref}" "${digest}" > "digests/${name}.txt"
            echo "seeded ${ref}@${digest}"
          done <<'CHARTS'
          hl7-transformer helm/extractor/hl7-transformer
          dcm4chee helm/dcm4chee
          hive-metastore helm/hive-metastore
          hl7-listener helm/hl7-listener
          hl7log-extractor helm/extractor/hl7log-extractor
          keycloak-config-cli helm/keycloak-config-cli
          launchpad helm/launchpad
          open-webui-bootstrap helm/open-webui-bootstrap
          orthanc helm/orthanc
          report-viewer helm/report-viewer
          scout-dashboards helm/scout-dashboards
          scout-opa helm/scout-opa
          temporal-bootstrap helm/temporal-bootstrap
          voila helm/voila
          CHARTS
      - name: Render the haul manifest (14 fresh charts + carry the images)
        run: |
          set -euo pipefail
          mkdir -p predecessor
          # bootstrap-haul.yaml seeded the 8 images into :main; carry them.
          oras pull "${MANIFEST_REPO}:main" -o predecessor
          python3 tooling/manifest/build_haul.py \
            --digests-dir digests \
            --components tooling/manifest/components.txt \
            --predecessor predecessor/haul.yaml \
            --name scout > haul.yaml
          echo "--- haul.yaml ---"; cat haul.yaml
      - name: Publish the seed haul
        uses: ./.github/actions/publish-haul
        with:
          version: ${{ env.VERSION }}
          core-manifest: haul.yaml
          manifest-repo: ${{ env.MANIFEST_REPO }}
          bundle-repo: ${{ env.BUNDLE_REPO }}
          cosign-private-key: ${{ secrets.COSIGN_PRIVATE_KEY }}
          cosign-password: ${{ secrets.COSIGN_PASSWORD }}

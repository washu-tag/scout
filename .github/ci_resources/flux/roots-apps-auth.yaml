# Authentication leg: the dependency closure of launchpad, edge-on-prem, trino-ro,
# and keycloak-fragment-reconciler. It uses the production Flux DAG and signed
# config source; CI owns only the retry and suspension policies here.
# Roots remain siblings of scout-site-source, with wait=false: children carry
# their own waits and health checks, so parent readiness cannot deadlock them.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-scout
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  sourceRef:
    kind: OCIRepository
    name: scout-config
  path: ./flux
  prune: true
  wait: false
  timeout: 5m
  dependsOn:
    - name: scout-site-source
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  patches:
    - target:
        kind: Kustomization
      patch: |
        - op: add
          path: /spec/retryInterval
          value: 1m
    - target:
        kind: Kustomization
        name: ^(extractor|temporal-server|temporal-bootstrap|trino-rw|superset-server|superset-dashboards)$
      patch: |
        - op: add
          path: /spec/suspend
          value: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-scout-on-prem
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  sourceRef:
    kind: OCIRepository
    name: scout-config
  path: ./modes/on-prem
  prune: true
  wait: false
  timeout: 5m
  dependsOn:
    - name: scout-site-source
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  patches:
    - target:
        kind: Kustomization
      patch: |
        - op: add
          path: /spec/retryInterval
          value: 1m

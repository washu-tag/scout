apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The CI site artifact, shaped like a site's own config: cluster-vars, the SOPS-encrypted
# scout-secret-values, and the signed scout-config source. The workflow writes the inputs
# at run time and signs the directory with an independent site key. Both verification
# keys are bootstrapped directly into the cluster, outside this artifact.
resources:
  - cluster-vars.yaml
  - scout-secret-values.yaml
  - scout-config-source.yaml

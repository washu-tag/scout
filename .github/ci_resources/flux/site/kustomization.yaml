apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The CI site artifact, shaped like a site's own config: cluster-vars, the SOPS-encrypted
# scout-secret-values, and the signed scout-config source with its verify key. The workflow
# writes the first three at run time and pushes the directory to the in-job registry.
resources:
  - cluster-vars.yaml
  - scout-secret-values.yaml
  - scout-cosign-pub.yaml
  - scout-config-source.yaml

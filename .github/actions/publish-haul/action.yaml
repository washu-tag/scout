name: Publish haul
description: >-
  Sync a rendered Hauler manifest into a signed .tar.zst bundle and publish the
  bundle + manifest to GHCR; only a validated producer plan may advance :main. The
  core manifest is synced with cosign --key verification, fail-closed. Callers
  render the manifest(s) and install hauler/oras/cosign + log in to GHCR first.
inputs:
  version:
    description: Build version tag for the artifacts (digests are authoritative).
    required: true
  core-manifest:
    description: Rendered kind:Images manifest of cosign-signed components.
    required: false
    default: haul.yaml
  upstream-manifest:
    description: >-
      Optional manifest of third-party images synced WITHOUT --key (trusted by
      immutable digest, not our signature). Empty string to skip.
    required: false
    default: ''
  manifest-repo:
    description: GHCR repo for the manifest artifact.
    required: true
  manifest-layout:
    description: Tested OCI manifest layout; copied without rebuilding when supplied.
    default: ''
  bundle-repo:
    description: GHCR repo for the .tar.zst bundle artifact.
    required: true
  cosign-private-key:
    description: cosign signing key (env:// material).
    required: true
  cosign-password:
    description: cosign key password.
    required: true
  producer-plan:
    description: Frozen producer snapshot directory; required to mark validated carry ancestry.
    required: false
    default: ''
  advance-main:
    description: Advance the carry aliases; only the serialized main producer may opt in.
    required: false
    default: 'false'
outputs:
  manifest-digest:
    description: Digest of this invocation's signed manifest artifact.
    value: ${{ steps.publish.outputs.manifest-digest }}
  bundle-digest:
    description: Digest of this invocation's signed bundle artifact.
    value: ${{ steps.publish.outputs.bundle-digest }}
runs:
  using: composite
  steps:
    - id: publish
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        CORE_MANIFEST: ${{ inputs.core-manifest }}
        UPSTREAM_MANIFEST: ${{ inputs.upstream-manifest }}
        MANIFEST_REPO: ${{ inputs.manifest-repo }}
        MANIFEST_LAYOUT: ${{ inputs.manifest-layout }}
        BUNDLE_REPO: ${{ inputs.bundle-repo }}
        COSIGN_PRIVATE_KEY: ${{ inputs.cosign-private-key }}
        COSIGN_PASSWORD: ${{ inputs.cosign-password }}
        SOURCE_REPOSITORY: ${{ github.repository }}
        SOURCE_REVISION: ${{ github.sha }}
        PRODUCER_PLAN: ${{ inputs.producer-plan }}
        ADVANCE_MAIN: ${{ inputs.advance-main }}
      run: |
        set -euo pipefail
        if [ -n "$PRODUCER_PLAN" ]; then
          python3 tooling/manifest/producer_plan.py validate --snapshot "$PRODUCER_PLAN"
        elif [ "$ADVANCE_MAIN" = true ]; then
          echo "::error::advancing :main requires the current attempt's producer plan"
          exit 1
        fi
        # hauler 2.0.2 SKIPS an image it can't verify yet still exits 0, so an
        # exit-code or failure-string check fails OPEN. Fail CLOSED: require one
        # "signature verified" line per image in the core manifest (dash-anchored
        # count so metadata.name isn't included). (Strings are 2.0.2's; recheck on bump.)
        # Derive the public key from the signing key -- no separate COSIGN_PUBLIC_KEY secret.
        cosign public-key --key env://COSIGN_PRIVATE_KEY > cosign.pub
        expected=$(grep -cE '^[[:space:]]*-[[:space:]]+name:' "${CORE_MANIFEST}" || true)
        hauler store sync -f "${CORE_MANIFEST}" --key cosign.pub 2>&1 | tee sync.log
        verified=$(grep -cF 'signature verified for image [' sync.log || true)
        if [ "$expected" -lt 1 ] || [ "$verified" -ne "$expected" ]; then
          echo "::error::cosign verification incomplete: ${verified}/${expected} components verified; the haul would be missing unverified images"
          exit 1
        fi
        manifests=("${CORE_MANIFEST}:application/yaml")
        if [ -n "${UPSTREAM_MANIFEST}" ]; then
          # Third-party upstream images: sync WITHOUT --key (trusted by digest, not
          # our signature) into the same store so the saved bundle is complete.
          hauler store sync -f "${UPSTREAM_MANIFEST}"
          manifests+=("${UPSTREAM_MANIFEST}:application/yaml")
        fi
        hauler store save -f "scout-${VERSION}.tar.zst"
        # Publish both signatures before advancing either :main pointer. The two
        # pointer updates are separate registry operations, not an atomic promotion.
        annotations=(
          --annotation "org.opencontainers.image.source=https://github.com/${SOURCE_REPOSITORY}"
          --annotation "org.opencontainers.image.revision=${SOURCE_REVISION}"
          --annotation "org.opencontainers.image.version=${VERSION}"
          --annotation "io.scout.build.run-id=${GITHUB_RUN_ID}"
          --annotation "io.scout.build.run-attempt=${GITHUB_RUN_ATTEMPT}"
        )
        if [ -n "$PRODUCER_PLAN" ]; then
          predecessor_digest="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["predecessorDigest"])' "$PRODUCER_PLAN/plan.json")"
          annotations+=(
            --annotation "io.scout.build.carry-policy=predecessor-v1"
            --annotation "io.scout.build.predecessor-digest=${predecessor_digest}"
          )
        fi
        if [ -n "$MANIFEST_LAYOUT" ]; then
          manifest_digest="$(oras manifest fetch --oci-layout --descriptor "${MANIFEST_LAYOUT}:${VERSION}" | jq -er .digest)"
          oras copy --from-oci-layout "${MANIFEST_LAYOUT}@${manifest_digest}" "${MANIFEST_REPO}:${VERSION}"
          published_digest="$(oras manifest fetch --descriptor "${MANIFEST_REPO}:${VERSION}" | jq -er .digest)"
          test "$published_digest" = "$manifest_digest"
        else
          oras push "${MANIFEST_REPO}:${VERSION}" "${manifests[@]}" "${annotations[@]}" \
            --export-manifest "$RUNNER_TEMP/haul-manifest.json"
          manifest_digest="sha256:$(sha256sum "$RUNNER_TEMP/haul-manifest.json" | cut -d ' ' -f 1)"
        fi
        oras push "${BUNDLE_REPO}:${VERSION}" \
          --artifact-type application/vnd.hauler.bundle.v1+zstd \
          "scout-${VERSION}.tar.zst:application/zstd" "${annotations[@]}" \
          --annotation "io.scout.build.manifest-digest=${manifest_digest}" \
          --export-manifest "$RUNNER_TEMP/haul-bundle.json"
        bundle_digest="sha256:$(sha256sum "$RUNNER_TEMP/haul-bundle.json" | cut -d ' ' -f 1)"
        cosign sign --key env://COSIGN_PRIVATE_KEY \
          --use-signing-config=false --tlog-upload=false --yes "${MANIFEST_REPO}@${manifest_digest}"
        cosign sign --key env://COSIGN_PRIVATE_KEY \
          --use-signing-config=false --tlog-upload=false --yes "${BUNDLE_REPO}@${bundle_digest}"
        if [ "$ADVANCE_MAIN" = true ]; then
          oras tag "${MANIFEST_REPO}@${manifest_digest}" main
          oras tag "${BUNDLE_REPO}@${bundle_digest}" main
        fi
        echo "manifest-digest=${manifest_digest}" >> "$GITHUB_OUTPUT"
        echo "bundle-digest=${bundle_digest}" >> "$GITHUB_OUTPUT"

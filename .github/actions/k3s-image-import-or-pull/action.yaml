name: 'K3s image import or pull'
description: 'Imports a required current-attempt image artifact, or pulls an unchanged image'
inputs:
  subproject:
    description: 'Subdirectory for microservice'
    required: true
  image-name:
    description: 'Name for docker image'
    required: true
  artifact-required:
    description: 'Whether CI scheduled this image for rebuilding; missing artifacts must fail'
    required: true
    default: 'true'
  registry:
    description: 'Container registry (default: ghcr.io)'
    required: false
    default: 'ghcr.io'
  registry-namespace:
    description: 'Registry namespace (default: washu-tag)'
    required: false
    default: 'washu-tag'
runs:
  using: 'composite'
  steps:
    - name: 'Derive version'
      id: derive-version
      uses: ./.github/actions/derive-version
      with:
        subproject: ${{ inputs.subproject }}

    - name: Download artifact
      if: inputs.artifact-required == 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.image-name }}-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}

    - name: Import from artifact or pull from registry
      shell: bash
      # REGISTRY tag uses VERSION (demo-suffixed on demo-* branches to keep
      # demo images from clobbering main/release tags). LOCAL tag uses
      # RAW_VERSION so Ansible role defaults — which reference raw tags —
      # resolve identically on every branch.
      # Values passed via env: (not ${{ }} inside run:) to avoid workflow
      # script injection — CodeQL flags the inline expansion pattern.
      env:
        VERSION: ${{ steps.derive-version.outputs.version }}
        RAW_VERSION: ${{ steps.derive-version.outputs.raw-version }}
        IMAGE_NAME: ${{ inputs.image-name }}
        REGISTRY: ${{ inputs.registry }}
        NAMESPACE: ${{ inputs.registry-namespace }}
        ARTIFACT_REQUIRED: ${{ inputs.artifact-required }}
      run: |
        set -euo pipefail
        REGISTRY_IMAGE="${REGISTRY}/${NAMESPACE}/${IMAGE_NAME}:${VERSION}"
        LOCAL_IMAGE="docker.io/local/${NAMESPACE}/${IMAGE_NAME}:${RAW_VERSION}"
        TAR_FILE="${RUNNER_TEMP}/${IMAGE_NAME}.tar"

        if [ "$ARTIFACT_REQUIRED" = true ]; then
          if [ ! -f "$TAR_FILE" ]; then
            echo "::error::Missing current-attempt image artifact for ${IMAGE_NAME}; rerun all jobs"
            exit 1
          fi
          echo "Importing newly built image from artifact..."
          sudo k3s ctr -n k8s.io images import \
            --index-name "${LOCAL_IMAGE}" \
            "${TAR_FILE}"
          echo "Successfully imported as ${LOCAL_IMAGE}"
        elif [ "$ARTIFACT_REQUIRED" = false ]; then
          echo "Image was not rebuilt, pulling existing image from registry..."
          echo "Pulling ${REGISTRY_IMAGE}..."
          sudo k3s ctr -n k8s.io images pull "${REGISTRY_IMAGE}"
          echo "Successfully pulled ${REGISTRY_IMAGE}"

          # Alias to raw tag for in-cluster use
          sudo k3s ctr -n k8s.io images tag \
            "${REGISTRY_IMAGE}" \
            "${LOCAL_IMAGE}"
          echo "Tagged as ${LOCAL_IMAGE}"
        else
          echo "::error::artifact-required must be true or false"
          exit 1
        fi

        # docker.io/local/* tags don't exist in any remote registry, so a
        # kubelet image-GC eviction is unrecoverable mid-deploy. Pin via
        # containerd's CRI label — kubelet skips pinned images regardless
        # of disk-pressure thresholds. See PR #405 / run 26583982205 for
        # the failure mode this prevents.
        sudo k3s ctr -n k8s.io images label \
          "${LOCAL_IMAGE}" \
          io.cri-containerd.pinned=pinned

name: 'Check if Docker image exists in registry'
description: 'Checks if a Docker image with the specified version exists in GitHub Container Registry'
inputs:
  subproject:
    description: 'Subdirectory for microservice'
    required: true
  image-name:
    description: 'Name for docker image'
    required: true
outputs:
  exists:
    description: 'Whether the image exists (true/false)'
    value: ${{ steps.check-registry.outputs.exists }}
runs:
  using: 'composite'
  steps:
    - name: 'Derive version'
      id: derive-version
      uses: ./.github/actions/derive-version
      with:
        subproject: ${{ inputs.subproject }}

    - name: Check if image exists in registry
      id: check-registry
      shell: bash
      env:
        VERSION: ${{ steps.derive-version.outputs.version }}
        IMAGE_NAME: ${{ inputs.image-name }}
      # An ambiguous registry answer exits non-zero rather than reporting a
      # "false" nobody can trust -- a wrong "false" here rebuilds the image and,
      # in ci.yaml's publish job, pushes it over the tag that is already there.
      run: |
        set -euo pipefail
        exists="$(bash "${GITHUB_WORKSPACE}/.github/scripts/ghcr-tag-published.sh" \
          "${IMAGE_NAME}" "${VERSION}")"
        echo "exists=${exists}" >> "$GITHUB_OUTPUT"
        echo "Image ${IMAGE_NAME}:${VERSION} exists=${exists}"

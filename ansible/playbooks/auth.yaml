---
- name: Install auth components
  hosts: server
  gather_facts: false
  environment: '{{ cluster_k8s_environment }}'
  roles:
    - role: keycloak
    - role: oauth2-proxy
    # After keycloak because it needs the base realm's tier roles, and after
    # oauth2-proxy because it waits on readiness -- a reconciler that will not
    # start should not hold up the edge gate every login goes through.
    - role: keycloak_fragment_reconciler

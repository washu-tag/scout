---
- name: Install auth components
  hosts: server
  gather_facts: false
  environment: '{{ cluster_k8s_environment }}'
  roles:
    # Order is load-bearing under sole-writer (ADR 0037). keycloak publishes the
    # base realm document but no longer applies it, so app_manager has to run in
    # this play for the realm to exist at all -- and after keycloak, because the
    # reconciler refuses until the document is there.
    - role: keycloak
    - role: app_manager
    - role: oauth2-proxy

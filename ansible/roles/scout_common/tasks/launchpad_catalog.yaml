---
# Publish a launchpad catalog ConfigMap (ADR 0034).
#
# The launchpad's discovery sidecar imports any ConfigMap labelled
# `scout.washu.edu/launchpad-apps: "1"` from any namespace; each data key
# holds one catalog document. Components that own a chip publish it next to
# themselves so presence on the landing page follows installation.
#
# Include with:
#
#   - name: Publish launchpad catalog entry
#     ansible.builtin.include_role:
#       name: scout_common
#       tasks_from: launchpad_catalog
#     vars:
#       catalog_configmap_name: my-service-launchpad
#       catalog_namespace: '{{ my_service_namespace }}'
#       catalog_document:
#         apiVersion: scout.washu.edu/v1alpha1
#         chips: [...]
#
# Removal is deletion: uninstalling a component should delete its catalog
# ConfigMap (charts that template the ConfigMap themselves get this for free).
- name: Publish launchpad catalog ConfigMap {{ catalog_configmap_name }}
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: '{{ catalog_configmap_name }}'
        namespace: '{{ catalog_namespace }}'
        labels:
          scout.washu.edu/launchpad-apps: '1'
      data:
        apps.yaml: '{{ catalog_document | to_nice_yaml(indent=2) }}'

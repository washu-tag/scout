---
# Copy the certificate Traefik serves into a Secret in another namespace, so a service
# there can trust it when it calls Scout's own hosts through the ingress.
#
# Usage:
#   - name: Mirror Traefik TLS cert into my namespace as a CA bundle
#     when: my_trust_traefik_ca | bool
#     ansible.builtin.include_role:
#       name: scout_common
#       tasks_from: traefik_ca_secret
#     vars:
#       traefik_ca_secret_name: my-trusted-ca
#       traefik_ca_secret_namespace: '{{ my_namespace }}'
#       traefik_ca_secret_key: public.crt # optional, default ca.crt

- name: Read Traefik TLS secret
  no_log: true
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: '{{ traefik_tls_secret_name }}'
    namespace: '{{ traefik_namespace }}'
  register: _traefik_tls_secret

- name: Create the CA secret {{ traefik_ca_secret_name }}
  no_log: true
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: '{{ traefik_ca_secret_name }}'
        namespace: '{{ traefik_ca_secret_namespace }}'
      data: >-
        {{ {traefik_ca_secret_key | default('ca.crt'): _traefik_tls_secret.resources[0].data['tls.crt']} }}

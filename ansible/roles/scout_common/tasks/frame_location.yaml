---
# Publish the script that tells the launchpad which page a framed app is on, so
# the launchpad's address bar follows navigation inside the app. The file's
# extension picks how it is wrapped for the app: .js (a plain script), .html
# (Jinja, carrying the page's CSP nonce) or .jar (an XNAT header template, GET
# pages only, packed so it loads from XNAT's plugins directory). The value
# `labextension` instead publishes a JupyterLab prebuilt extension, package.json
# and remoteEntry.js, to mount as the extension's directory. remoteEntry.js stays
# out of static/, which JupyterLab serves as immutable for a year.
#
# Include with:
#
#   - name: Publish launchpad frame-location script
#     ansible.builtin.include_role:
#       name: scout_common
#       tasks_from: frame_location
#     vars:
#       frame_location_configmap: my-service-frame-location
#       frame_location_namespace: '{{ my_service_namespace }}'
#       frame_location_file: loader.js
#
# then mount that key where the app loads it.
- name: Publish frame-location ConfigMap {{ frame_location_configmap }}
  when: frame_location_file is not match('.*\.jar$') and frame_location_file != 'labextension'
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: '{{ frame_location_configmap }}'
        namespace: '{{ frame_location_namespace }}'
      data: >-
        {{ {frame_location_file: lookup('ansible.builtin.template',
        'frame-location' ~ (frame_location_file | splitext | last) ~ '.j2')} }}

- name: Publish frame-location JupyterLab extension ConfigMap {{ frame_location_configmap }}
  when: frame_location_file == 'labextension'
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: '{{ frame_location_configmap }}'
        namespace: '{{ frame_location_namespace }}'
      data: >-
        {{ {'package.json': lookup('ansible.builtin.template', 'frame-location-labextension.json.j2'),
        'remoteEntry.js': lookup('ansible.builtin.template', 'frame-location-labextension.js.j2')} }}

- name: Publish frame-location jar ConfigMap {{ frame_location_configmap }}
  when: frame_location_file is match('.*\.jar$')
  block:
    - name: Create a frame-location build directory
      ansible.builtin.tempfile:
        state: directory
      register: _frame_location_build

    - name: Create the XNAT header template directory
      ansible.builtin.file:
        path: '{{ _frame_location_build.path }}/META-INF/resources/templates/screens/header'
        state: directory
        mode: '0755'

    - name: Render the XNAT header template
      ansible.builtin.template:
        src: frame-location.vm.j2
        dest: '{{ _frame_location_build.path }}/META-INF/resources/templates/screens/header/scout-frame-location.vm'
        mode: '0644'

    - name: Pack the header template into a jar
      community.general.archive:
        path: '{{ _frame_location_build.path }}/META-INF'
        dest: '{{ _frame_location_build.path }}/{{ frame_location_file }}'
        format: zip
        mode: '0644'

    - name: Read the jar
      ansible.builtin.slurp:
        src: '{{ _frame_location_build.path }}/{{ frame_location_file }}'
      register: _frame_location_jar

    - name: Publish the jar
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: '{{ frame_location_configmap }}'
            namespace: '{{ frame_location_namespace }}'
          binaryData: '{{ {frame_location_file: _frame_location_jar.content} }}'
  always:
    - name: Remove the frame-location build directory
      when: _frame_location_build.path is defined
      ansible.builtin.file:
        path: '{{ _frame_location_build.path }}'
        state: absent

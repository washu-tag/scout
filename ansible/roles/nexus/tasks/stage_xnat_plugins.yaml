---
# Stage `stage_from` XNAT plugins from S3 into the hosted Maven repo (ADR 0040).
- name: Validate staged XNAT plugin declarations
  vars:
    _bad: >-
      {{ xnat_staged_plugin_sources
         | rejectattr('type', 'equalto', 'coordinates') | list
         + xnat_staged_plugin_sources | selectattr('repo_url', 'defined') | list
         + xnat_staged_plugin_sources | rejectattr('stage_from', 'match', '^s3://[^/]+/.+') | list }}
  ansible.builtin.assert:
    that:
      - _bad | length == 0
    fail_msg: >-
      xnat_plugins entries with source.stage_from must use type: coordinates, a
      stage_from of the form s3://bucket/key, and no repo_url (the jar is served from
      the {{ nexus_maven_hosted_repo.name }} repo). Offending sources: {{ _bad }}
    quiet: true

- name: Validate S3 credentials for staged XNAT plugins
  no_log: true
  ansible.builtin.assert:
    that:
      - xnat_plugin_stage_s3_region | length > 0
      - xnat_plugin_stage_s3_access_key_id | length > 0
      - xnat_plugin_stage_s3_secret_access_key | length > 0
    fail_msg: >-
      xnat_plugins declares stage_from plugins, so xnat_plugin_stage_s3_region,
      xnat_plugin_stage_s3_access_key_id and xnat_plugin_stage_s3_secret_access_key
      must be set (vault-encrypted) in the staging group's vars.
    quiet: true

- name: Wait for the hosted XNAT plugin repo to exist
  ansible.builtin.uri:
    url: '{{ nexus_api_base_url }}/service/rest/v1/repositories/maven/hosted/{{ nexus_maven_hosted_repo.name }}'
    user: admin
    password: '{{ nexus_root_password }}'
    force_basic_auth: true
    status_code: 200
  register: _hosted_repo
  until: _hosted_repo.status == 200
  retries: 30
  delay: 10

- name: Stage each XNAT plugin
  ansible.builtin.include_tasks: stage_xnat_plugin.yaml
  loop: '{{ xnat_staged_plugin_sources }}'
  loop_control:
    loop_var: _plugin_source
    label: '{{ _plugin_source.coordinates }}'

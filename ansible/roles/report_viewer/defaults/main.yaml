---
# Report viewer service role defaults
# User-configurable settings are in inventory.yaml

report_viewer_namespace: '{{ chatbot_namespace }}'

# Helm
report_viewer_helm_chart_ref: '{{ scout_repo_dir }}/helm/report-viewer'
report_viewer_helm_release_name: report-viewer

# Image
report_viewer_image_repository: ghcr.io/washu-tag/report-viewer
report_viewer_image_tag: latest

# Ingress
report_viewer_subdomain: report-viewer
report_viewer_host: '{{ report_viewer_subdomain }}.{{ server_hostname }}'

# Chat origin the SPA postMessages to. Mirrors open-webui's ingress host.
report_viewer_chat_origin: 'https://chat.{{ server_hostname }}'

# Database - Postgres user/db are created via scout_common/create_db_with_owner
# against the shared CNPG cluster (postgres_cluster_name).
report_viewer_database: report_viewer
report_viewer_db_user: report_viewer
# `report_viewer_db_password` is required and must be set in inventory

# Replicas + resources
report_viewer_replicas: 1
report_viewer_resources_default:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 2
    memory: 4Gi

# Trino connection
report_viewer_trino_host: 'trino.{{ trino_namespace }}'
report_viewer_trino_port: '{{ trino_https_port }}'
report_viewer_trino_scheme: https
report_viewer_trino_catalog: delta
report_viewer_trino_schema: default
report_viewer_trino_ca_cert: ''
report_viewer_trino_auth_token_url: '{{ keycloak_internal_url }}/realms/{{ keycloak_realm_name }}/protocol/openid-connect/token'
report_viewer_trino_auth_client_id: report_viewer_svc
report_viewer_trino_auth_client_secret: '{{ keycloak_report_viewer_svc_client_secret }}'

# Query-result cache (#806): search cohorts, charts and accession lists, per
# user, in the cache Valkey as the `report-viewer` ACL user
# (valkey_cache_report_viewer_password). How long an entry may be served;
# 0 turns caching off. Permission, policy and data changes invalidate entries
# sooner on their own.
report_viewer_cache_ttl_seconds: 14400
report_viewer_valkey_url: 'redis://{{ valkey_cache_helm_release_name }}.{{ valkey_namespace }}:6379'
# OPA, for each user's permissions fingerprint (scout.cache_fingerprint).
report_viewer_opa_url: 'http://opa-trino.{{ opa_namespace }}:8181'
# Every OPA replica (the chart's headless Service): a result is cached only when
# they all agree on the user's permissions.
report_viewer_opa_replicas_host: 'opa-trino-replicas.{{ opa_namespace }}'
# A result is cached only if the user bundle was at least this old when its
# query started, which must outlast OPA replicas disagreeing about it.
report_viewer_cache_bundle_age_seconds: '{{ opa_bundle_max_delay_seconds | int + 5 }}'

# Site-admin-authorable action buttons (helm/report-viewer's
# actions.custom - see that chart's values.yaml for the full field
# reference). Set from inventory.yaml, e.g.:
#
# report_viewer_custom_actions:
#   - id: my-app
#     title: Open in My App
#     actionType: backend-call
#     endpointUrl: http://my-app.<namespace>.svc.cluster.local:8000/invoke
#     invokeToken: "{{ vault_my_app_invoke_token }}"
report_viewer_custom_actions: []

# Gating for the two built-in actions (helm/report-viewer's
# actions.explainSearch/actions.downloadCsv). Deep-merged with an
# inventory.yaml override, so a site only needs to set the field it wants
# to change, e.g.:
#
# report_viewer_explain_search:
#   requiredRole: report-viewer-admin
# report_viewer_download_csv:
#   enabled: false
report_viewer_explain_search_default:
  enabled: true
  requiredRole: ''
report_viewer_download_csv_default:
  enabled: true
  requiredRole: ''

# Buttons other charts publish as labeled ConfigMaps (helm/report-viewer's
# actions.discovery). Deep-merged like the two above, e.g. to scope it:
#
# report_viewer_action_discovery:
#   namespace: datasets,xnat-explore-poc
report_viewer_action_discovery_default:
  enabled: true
  namespace: ALL
  ttlSeconds: 30

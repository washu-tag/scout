---
# The realm template consumes keycloak_xnat_client_secret inside its
# enable_xnat-gated client block, and the auth play runs before the xnat role
# (whose own assert can therefore never fire first) — fail here with a clear
# message instead of a raw AnsibleUndefinedVariable mid-template.
- name: Validate XNAT client secret is set when enable_xnat is true
  ansible.builtin.assert:
    that:
      - keycloak_xnat_client_secret is defined
      - keycloak_xnat_client_secret | length > 0
    fail_msg: >
      keycloak_xnat_client_secret is required when enable_xnat is true: the
      Keycloak realm provisions the xnat client. Set it in your inventory.yaml
      (use vault encryption).
      Example: openssl rand -hex 16 | ansible-vault encrypt_string --vault-password-file vault/pwd.sh
    quiet: true
  when: enable_xnat | default(false) | bool

- name: Assemble the Keycloak client secrets
  no_log: true
  ansible.builtin.set_fact:
    keycloak_client_secrets: "{{ lookup('template', 'keycloak-client-secrets.yaml.j2') | from_yaml }}"

# An undefined variable already fails the template above. An empty one would
# not: config-cli substitutes it, and the client ends up with a blank
# credential rather than a broken deploy. Catch that here, where the operator
# is still watching.
- name: Validate no Keycloak client secret is empty
  ansible.builtin.assert:
    that: keycloak_empty_client_secrets | length == 0
    fail_msg: >
      Empty Keycloak client secret(s): {{ keycloak_empty_client_secrets | join(', ') }}.
      These name keys of the keycloak-client-secrets Secret; each comes from the
      matching keycloak_*_client_secret in your inventory.yaml. An empty value
      would be installed as the client's credential.
    quiet: true
  vars:
    keycloak_empty_client_secrets: >-
      {{ keycloak_client_secrets | dict2items | rejectattr('value') | map(attribute='key') | list }}

# Two documents, deliberately split. The realm carries `$(env:...)` tokens and
# no credentials, so it can be read, hashed and diffed by anything. The
# credentials live here, and reach config-cli through the Job environment.
- name: Create Secret for Keycloak client secrets
  delegate_to: localhost
  no_log: true
  kubernetes.core.k8s:
    state: present
    namespace: '{{ keycloak_namespace }}'
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: keycloak-client-secrets
      data: '{{ keycloak_client_secrets }}'
    kubeconfig: '{{ local_kubeconfig_yaml }}'

# Rendered through a set_fact, like the client secrets above, because that is
# what fails loudly on a variable the template expects and the inventory does
# not set. The same lookup inline in a task argument yields null and carries on.
- name: Parse Helm values
  ansible.builtin.set_fact:
    keycloak_config_cli_values: "{{ lookup('template', 'keycloak-config-cli-values.yaml.j2') | from_yaml }}"

# Stamped after the render because it covers the render: a change to the realm
# document, to any value it is rendered from, or to a client secret is a new
# attempt at applying it. The apply Job is a Helm hook with a fixed name, so
# without this it would be reused verbatim.
- name: Stamp the values with a config hash
  ansible.builtin.set_fact:
    keycloak_config_cli_values: >-
      {{ keycloak_config_cli_values
         | combine({'annotations': {'config-hash': keycloak_config_hash}}) }}
  vars:
    keycloak_config_hash: >-
      {{ (lookup('file', keycloak_config_cli_helm_chart_ref ~ '/files/scout-realm.json')
          ~ (keycloak_config_cli_values | to_json)
          ~ (keycloak_client_secrets | dictsort | to_json))
         | hash("sha256") | truncate(8, True, "") }}

# TEMPORARY -- drop both of these after the next major release.
#
# The realm used to be published as a Secret with every client credential
# inlined in it. Nothing writes or reads it now, so an upgraded site would keep
# a dump of its pre-rotation credentials in the namespace forever.
- name: Remove the superseded realm Secret
  delegate_to: localhost
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Secret
    namespace: '{{ keycloak_namespace }}'
    name: keycloak-config
    kubeconfig: '{{ local_kubeconfig_yaml }}'

# And the base realm ConfigMap was created by this role rather than by the
# chart. Helm refuses to adopt an object it did not create, so on a site that
# already has one the release below fails outright until it is handed over --
# which is what these two annotations and the label mean.
- name: Look for a base realm ConfigMap Helm does not own
  delegate_to: localhost
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    namespace: '{{ keycloak_namespace }}'
    name: keycloak-base-realm
    kubeconfig: '{{ local_kubeconfig_yaml }}'
  register: keycloak_existing_base_realm

- name: Hand the base realm ConfigMap over to Helm
  delegate_to: localhost
  kubernetes.core.k8s:
    state: patched
    api_version: v1
    kind: ConfigMap
    namespace: '{{ keycloak_namespace }}'
    name: keycloak-base-realm
    definition:
      metadata:
        labels:
          app.kubernetes.io/managed-by: Helm
        annotations:
          meta.helm.sh/release-name: keycloak-config-cli
          meta.helm.sh/release-namespace: '{{ keycloak_namespace }}'
    kubeconfig: '{{ local_kubeconfig_yaml }}'
  when: keycloak_existing_base_realm.resources | length > 0

# This release publishes the base realm ConfigMap and applies it. The GitOps
# lane installs the same chart and the same file; the two differ only in where
# the realm values come from.
- name: Run Keycloak Config CLI
  ansible.builtin.include_role:
    name: scout_common
    tasks_from: deploy_helm_chart
  vars:
    helm_chart_name: keycloak-config-cli
    helm_chart_ref: '{{ keycloak_config_cli_helm_chart_ref }}'
    helm_chart_namespace: '{{ keycloak_namespace }}'
    helm_chart_create_namespace: true
    helm_chart_wait: true
    helm_chart_timeout: '5m'
    helm_chart_values: '{{ keycloak_config_cli_values }}'

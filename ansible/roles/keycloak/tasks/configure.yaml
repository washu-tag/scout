---
# The realm template consumes keycloak_xnat_client_secret inside its
# enable_xnat-gated client block, and the auth play runs before the xnat role
# (whose own assert can therefore never fire first) — fail here with a clear
# message instead of a raw AnsibleUndefinedVariable mid-template.
- name: Validate XNAT client secret is set when enable_xnat is true
  ansible.builtin.assert:
    that:
      - keycloak_xnat_client_secret is defined
      - keycloak_xnat_client_secret | length > 0
    fail_msg: >
      keycloak_xnat_client_secret is required when enable_xnat is true: the
      Keycloak realm provisions the xnat client. Set it in your inventory.yaml
      (use vault encryption).
      Example: openssl rand -hex 16 | ansible-vault encrypt_string --vault-password-file vault/pwd.sh
    quiet: true
  when: enable_xnat | default(false) | bool

- name: Assemble the Keycloak client secrets
  no_log: true
  ansible.builtin.set_fact:
    keycloak_client_secrets: "{{ lookup('template', 'keycloak-client-secrets.yaml.j2') | from_yaml }}"

# An undefined variable already fails the template above. An empty one would
# not: config-cli substitutes it, and the client ends up with a blank
# credential rather than a broken deploy. Catch that here, where the operator
# is still watching.
- name: Validate no Keycloak client secret is empty
  ansible.builtin.assert:
    that: keycloak_empty_client_secrets | length == 0
    fail_msg: >
      Empty Keycloak client secret(s): {{ keycloak_empty_client_secrets | join(', ') }}.
      These name keys of the keycloak-client-secrets Secret; each comes from the
      matching keycloak_*_client_secret in your inventory.yaml. An empty value
      would be installed as the client's credential.
    quiet: true
  vars:
    keycloak_empty_client_secrets: >-
      {{ keycloak_client_secrets | dict2items | rejectattr('value') | map(attribute='key') | list }}

# Two documents, deliberately split. The realm carries `$(env:...)` tokens and
# no credentials, so it can be read, hashed and diffed by anything — which is
# what lets the app manager treat it as an ordinary input (ADR XXXX). The
# credentials live here, and reach config-cli through the Job environment.
- name: Create Secret for Keycloak client secrets
  delegate_to: localhost
  no_log: true
  kubernetes.core.k8s:
    state: present
    namespace: '{{ keycloak_namespace }}'
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: keycloak-client-secrets
      data: '{{ keycloak_client_secrets }}'
    kubeconfig: '{{ local_kubeconfig_yaml }}'

# A ConfigMap, not a Secret: the document names every credential as
# `$(env:...)` and carries none of them. The app manager reads it from here by
# name, and watches it, so a re-rendered realm reaches the reconciler without
# waiting out its resync floor.
#
# The GitOps lane publishes the same name from the chart. It has to be the same
# name, because the reconciler reads it by name and there is one reconciler.
#
# `| string` is not decoration. Without it Ansible's convert-data runs
# safe_eval over any value starting with `{`, and a realm that happened to
# render without a bare `true`/`false`/`null` would arrive as a dict, which the
# API rejects.
- name: Create ConfigMap for Scout Keycloak Realm
  delegate_to: localhost
  kubernetes.core.k8s:
    state: present
    namespace: '{{ keycloak_namespace }}'
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: '{{ keycloak_base_realm_configmap }}'
      data:
        scout-realm.json: "{{ lookup('template', 'scout-realm.json.j2') | string }}"
    kubeconfig: '{{ local_kubeconfig_yaml }}'

# TEMPORARY -- drop this task after the next major release. The realm used to be
# published as a Secret of this name with every client credential inlined in it.
# Nothing has written it since the document moved to a ConfigMap of named
# credentials, so an upgraded site would keep a dump of its pre-rotation
# credentials in the namespace indefinitely.
- name: Remove the superseded realm Secret
  delegate_to: localhost
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Secret
    namespace: '{{ keycloak_namespace }}'
    name: keycloak-config
    kubeconfig: '{{ local_kubeconfig_yaml }}'

- name: Run Keycloak Config CLI
  ansible.builtin.include_role:
    name: scout_common
    tasks_from: deploy_helm_chart
  vars:
    helm_chart_name: keycloak-config-cli
    helm_chart_ref: '{{ keycloak_config_cli_helm_chart_ref }}'
    helm_chart_namespace: '{{ keycloak_namespace }}'
    helm_chart_create_namespace: true
    helm_chart_wait: true
    helm_chart_timeout: '5m'
    helm_chart_values:
      image:
        repository: '{{ keycloak_config_cli_image }}'
        tag: '{{ keycloak_config_cli_image_tag }}'
      # The task above already published the realm, so the chart renders no
      # realm of its own (`config` stays empty) and only mounts this one.
      realmConfigMap: '{{ keycloak_base_realm_configmap }}'
      annotations:
        # Force a re-deploy on a change to either input. The secrets have to be
        # in here now that the realm document no longer moves when one is
        # rotated — without them a rotation would leave Keycloak on the old
        # credential while every consumer had already switched.
        config-hash: >-
          {{ (lookup("template", "scout-realm.json.j2") ~ (keycloak_client_secrets | dictsort | to_json))
             | hash("sha256") | truncate(8, True, "") }}
      env:
        KEYCLOAK_URL: 'http://keycloak-service.{{ keycloak_namespace }}:8080/'
        KEYCLOAK_USER: '{{ keycloak_bootstrap_admin_user }}'
        # Every client URL in the realm is written against this (the GitOps lane
        # has done so since ADR 0031); it is site configuration, not a secret.
        server_hostname: '{{ server_hostname }}'
        # Without var-substitution the `$(env:...)` tokens are installed
        # verbatim as client credentials and redirect URIs.
        SPRING_APPLICATION_JSON: '{"import":{"var-substitution":{"enabled":true}}}'
      envFrom:
        - secretRef:
            name: keycloak-client-secrets
      existingSecret: keycloak-admin-secret

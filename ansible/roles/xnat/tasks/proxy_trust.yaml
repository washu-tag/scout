---
# Air-gapped clusters fetch coordinates and s3 plugins from the staging node's
# Nexus: check each is there before the deploy, and give the installer the CA the
# self-signed Nexus is served with.

- name: Preflight - plugins are in Nexus (air-gapped)
  when: air_gapped | default(false) | bool
  block:
    - name: HEAD each plugin at the Nexus URL its init container fetches
      ansible.builtin.uri:
        url: >-
          {{ (maven_proxy_url ~ '/' ~ (item.source.coordinates | maven_artifact_path))
             if item.source.type == 'coordinates' else
             (xnat_s3_plugin_mirror_url ~ '/' ~ (item.source.s3_uri | s3_object_path)) }}
        method: HEAD
        ca_path: /etc/pki/ca-trust/source/anchors/staging-ca.crt
        status_code: [200]
      loop: "{{ xnat_plugins_all | selectattr('source.type', 'in', ['coordinates', 's3']) | list }}"
      loop_control:
        label: '{{ item.name }}'
  rescue:
    - name: Fail with guidance when a plugin is not in Nexus
      vars:
        _missing: >-
          {{ ansible_failed_result.results | default([])
             | rejectattr('status', 'equalto', 200)
             | map(attribute='item.name') | join(', ') }}
      ansible.builtin.fail:
        msg: >-
          These XNAT plugins are not in Nexus: {{ _missing or '(see the failed task above)' }}.
          `make install-staging` puts them there, proxying each coordinates plugin's
          repo and copying each s3 plugin from S3. Make sure each is declared in
          all.vars, run `make install-staging`, then re-run the XNAT deploy.

# Staging cert trust (per ADR-0016)
- name: Create the staging CA Secret for the installer
  ansible.builtin.include_role:
    name: scout_common
    tasks_from: staging_ca_secret
  vars:
    staging_ca_namespace: '{{ xnat_namespace }}'

- name: Set staging CA facts for the installer templates
  ansible.builtin.set_fact:
    _xnat_needs_staging_cert: '{{ _staging_ca_needed }}'

# The chart mounts the CA itself (pluginInstaller.caCertSecret), so the role only
# has to create the Secret above and flag that it exists.

# Nothing mounts the xnat-maven-settings ConfigMap now that coordinates resolve to
# a URL. Removed so a redeploy onto an existing cluster does not leave a stale one.
- name: Remove the obsolete Maven settings.xml ConfigMap
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: ConfigMap
    name: xnat-maven-settings
    namespace: '{{ xnat_namespace }}'

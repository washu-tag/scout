---
# Repository trust for coordinate-resolved plugins.
#
# The chart resolves each coordinate to a URL and hands it to a stock curl init
# container, so the repository reaches the deploy as a plain value
# (plugins.<name>.mavenUrl in templates/values.yaml.j2) rather than a mounted
# settings.xml. What remains here is the air-gapped preflight and, air-gapped
# against the self-signed Nexus, the CA the installer trusts.

# Air-gapped preflight: every coordinate plugin must resolve through the Nexus
# group, via maven_proxy_url (the init container's path), before the deploy.
- name: Preflight - coordinate plugins resolve through the Nexus group (air-gapped)
  when: air_gapped | default(false) | bool
  block:
    - name: HEAD each coordinate plugin artifact through the Nexus group
      ansible.builtin.uri:
        url: '{{ maven_proxy_url }}/{{ item.source.coordinates | maven_artifact_path }}'
        method: HEAD
        ca_path: /etc/pki/ca-trust/source/anchors/staging-ca.crt
        status_code: [200]
      loop: "{{ xnat_plugins_all | selectattr('source.type', 'equalto', 'coordinates') | list }}"
      loop_control:
        label: '{{ item.name }}'
  rescue:
    - name: Fail with guidance when a plugin is not in Nexus
      vars:
        _missing: >-
          {{ ansible_failed_result.results | default([])
             | rejectattr('status', 'equalto', 200)
             | map(attribute='item.source') | list }}
        _missing_staged: "{{ _missing | selectattr('stage_from', 'defined') | map(attribute='coordinates') | list }}"
        _missing_proxied: "{{ _missing | rejectattr('stage_from', 'defined') | map(attribute='coordinates') | list }}"
      ansible.builtin.fail:
        msg: >-
          {% if _missing_staged %}These stage_from plugins are not in Nexus yet:
          {{ _missing_staged | join(', ') }}. Run `make install-staging` to stage them
          from S3, then re-run the XNAT deploy.
          {% endif %}{% if _missing_proxied or not _missing %}These coordinate plugins
          could not be resolved through the Nexus group ({{ maven_proxy_url }}):
          {{ _missing_proxied | join(', ') if _missing_proxied else '(see the failed task above)' }}.
          Their repo is most likely not yet proxied by the scout-maven group. Ensure
          the plugin is declared in `xnat_plugins` in all.vars, then re-run
          `make install-staging` before re-running the XNAT deploy.{% endif %}

# Staging cert trust (per ADR-0016)
- name: Create the staging CA Secret for the installer
  ansible.builtin.include_role:
    name: scout_common
    tasks_from: staging_ca_secret
  vars:
    staging_ca_namespace: '{{ xnat_namespace }}'

- name: Set staging CA facts for the installer templates
  ansible.builtin.set_fact:
    _xnat_needs_staging_cert: '{{ _staging_ca_needed }}'

# The chart mounts the CA itself (pluginInstaller.caCertSecret), so the role only
# has to create the Secret above and flag that it exists.

# Nothing mounts the xnat-maven-settings ConfigMap now that coordinates resolve to
# a URL. Removed so a redeploy onto an existing cluster does not leave a stale one.
- name: Remove the obsolete Maven settings.xml ConfigMap
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: ConfigMap
    name: xnat-maven-settings
    namespace: '{{ xnat_namespace }}'

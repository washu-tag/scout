---
# Make each receiver in xnat_dicom_scp_receivers match its declaration in XNAT:
# create it when missing, update only the fields that differ. Receivers that are
# not listed are left alone.

- name: Wait for the XNAT REST API to answer
  ansible.builtin.include_tasks: wait_for_api.yaml

- name: Read the DICOM SCP receivers
  ansible.builtin.include_tasks: xnat_api.yaml
  vars:
    _xnat_api_requests: [{ label: receivers, method: GET, path: /xapi/dicomscp }]

- name: Plan the DICOM SCP receiver changes
  vars:
    _xnat_scp_current: "{{ _xnat_api_responses.results[0].stdout.split('\n', 1) | last | from_json }}"
  ansible.builtin.set_fact:
    _xnat_scp_plan: "{{ lookup('template', 'dicom-scp-plan.json.j2') | from_json }}"

- name: Apply the DICOM SCP receiver changes
  when: _xnat_scp_plan | length > 0
  ansible.builtin.include_tasks: xnat_api.yaml
  vars:
    _xnat_api_requests: '{{ _xnat_scp_plan }}'

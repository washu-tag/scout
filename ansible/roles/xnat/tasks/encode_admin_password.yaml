---
# XNAT 1.10.1 inserts this preference directly into an encoded-password column.
# Preserve a matching bcrypt value so re-runs retain the Secret/checksum.
- name: Check the controller's required bcrypt library
  delegate_to: localhost
  become: false
  vars:
    ansible_connection: local
    ansible_become: false
    ansible_python_interpreter: '{{ ansible_playbook_python }}'
  ansible.builtin.command:
    argv:
      - '{{ ansible_playbook_python }}'
      - -c
      - import bcrypt
  check_mode: false
  changed_when: false
  failed_when: false
  register: _xnat_bcrypt_runtime

- name: Require bcrypt in the controller Python environment
  ansible.builtin.assert:
    that:
      - _xnat_bcrypt_runtime.rc == 0
    fail_msg: 'Install bcrypt in the controller Python environment used by ansible-playbook.'
    quiet: true

- name: Prepare the native first-boot administrator password encoding
  no_log: true
  block:
    - name: Read the existing native first-boot Secret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        namespace: '{{ xnat_namespace }}'
        name: xnat-prefs-init
      register: _xnat_existing_prefs_init

    - name: Encode or reuse the approved password privately on the controller
      delegate_to: localhost
      become: false
      vars:
        ansible_connection: local
        ansible_become: false
        ansible_python_interpreter: '{{ ansible_playbook_python }}'
      ansible.builtin.command:
        argv:
          - '{{ ansible_playbook_python }}'
          - '{{ role_path }}/files/encode_admin_password.py'
        stdin: >-
          {{ {'password': xnat_admin_password,
              'previous_encoded': _xnat_encoded_admin_password | default(''),
              'previous_ini': (_xnat_existing_prefs_init.resources[0].data['prefs-init.ini'] | b64decode)
                  if _xnat_existing_prefs_init.resources | length else ''} | to_json }}
      check_mode: false
      changed_when: false
      register: _xnat_password_encoding

    - name: Retain the native encoded preference for Secret and checksum rendering
      ansible.builtin.set_fact:
        _xnat_encoded_admin_password: '{{ _xnat_password_encoding.stdout }}'

---
# Launchpad role defaults
# User-configurable settings are in inventory.yaml

# Helm configuration
launchpad_helm_chart_ref: '{{ scout_repo_dir }}/helm/launchpad'

# Custom Launchpad image (override from inventory for CI/CD)
launchpad_image_repository: ghcr.io/washu-tag/launchpad
launchpad_image_tag: latest
launchpad_image_pull_policy: IfNotPresent

# Environment label shown next to the Scout brand on the Launchpad
# (e.g. "synthetic", "production"). Empty falls back to "local".
scout_env: ''

# Institution/organization name shown in the Launchpad footer copyright
# line. Empty hides the line and only the "Powered by Scout" credit shows.
deployer_name: ''

# On envs where Traefik serves a self-signed cert (CI), the launchpad's server
# needs to trust it to reach Keycloak over HTTPS. Off on envs with public certs.
launchpad_trust_traefik_ca: false

# Launchpad nextauth cookie secret, override from inventory for production
launchpad_nextauth_secret: changeme-nextauth-secret

# In-app notices (enable_notifications). The database and role are created on
# the platform Postgres (db_host), which the URL must reach directly, not
# through a transaction pooler. `launchpad_postgres_password` is required.
launchpad_database: launchpad
launchpad_postgres_user: launchpad
# Comma-separated Keycloak client ids whose notices are refused and hidden.
launchpad_notification_disabled_senders: ''

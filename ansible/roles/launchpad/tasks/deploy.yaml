---
- name: Create namespace
  ansible.builtin.include_role:
    name: scout_common
    tasks_from: namespace
  vars:
    ns: '{{ launchpad_namespace }}'

- name: Mirror Traefik TLS cert into the launchpad namespace as a CA bundle
  when: launchpad_trust_traefik_ca | bool
  block:
    - name: Read Traefik TLS secret
      no_log: true
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: '{{ traefik_tls_secret_name }}'
        namespace: '{{ traefik_namespace }}'
      register: _traefik_tls_secret
    - name: Create launchpad-trusted-ca secret
      no_log: true
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: launchpad-trusted-ca
            namespace: '{{ launchpad_namespace }}'
          data:
            ca.crt: '{{ _traefik_tls_secret.resources[0].data["tls.crt"] }}'

- name: Read the launchpad's security headers middleware
  kubernetes.core.k8s_info:
    api_version: traefik.io/v1alpha1
    kind: Middleware
    name: security-headers-app-csp
    namespace: '{{ traefik_namespace }}'
  register: _launchpad_headers_middleware

# Traefik drops a route whose middleware is missing, which would take the launchpad down.
- name: Require the launchpad's security headers middleware
  ansible.builtin.assert:
    that: _launchpad_headers_middleware.resources | length > 0
    fail_msg: >-
      Middleware {{ traefik_namespace }}/security-headers-app-csp is missing. Run
      `make config-traefik` before `make install-launchpad`.
    quiet: true

- name: Deploy Launchpad
  ansible.builtin.include_role:
    name: scout_common
    tasks_from: deploy_helm_chart
  vars:
    helm_chart_name: launchpad
    helm_chart_ref: '{{ launchpad_helm_chart_ref }}'
    helm_chart_namespace: '{{ launchpad_namespace }}'
    helm_chart_values_files:
      - '{{ scout_repo_dir }}/helm/launchpad/values.yaml'
    helm_chart_values:
      catalog:
        discovery:
          image:
            repository: '{{ launchpad_sidecar_image }}'
            tag: '{{ launchpad_sidecar_image_tag }}'
      scoutEnv: '{{ scout_env }}'
      deployerName: '{{ deployer_name }}'
      docsUrl: '{{ scout_docs_url }}'
      image:
        repository: '{{ launchpad_image_repository }}'
        tag: '{{ launchpad_image_tag }}'
        pullPolicy: '{{ launchpad_image_pull_policy }}'
      auth:
        keycloak:
          enabled: true
          clientId: 'launchpad'
          clientSecret: '{{ keycloak_launchpad_client_secret }}'
          issuer: '{{ keycloak_realm_url }}'
        nextAuthUrl: 'https://{{ server_hostname }}/api/auth'
        nextAuthSecret: '{{ launchpad_nextauth_secret }}'
        sessionMaxAge: '{{ keycloak_token_lifespan }}'
        oauth2ProxySignOutUrl: '{{ oauth2_proxy_signout_url }}'
      ingress:
        enabled: true
        className: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.middlewares: >-
            kube-system-oauth2-proxy-error@kubernetescrd,
            kube-system-oauth2-proxy-auth@kubernetescrd,
            kube-system-security-headers-app-csp@kubernetescrd
        hosts:
          - host: '{{ server_hostname }}'
            paths:
              - path: /
                pathType: Prefix
      # Serve /favicon.ico unauthenticated so logged-out visitors get the
      # browser-tab icon (issue #557); everything else stays behind oauth2-proxy.
      faviconPublicRoute:
        enabled: true
        host: '{{ server_hostname }}'
      env: >-
        {{ [{'name': 'NODE_EXTRA_CA_CERTS', 'value': '/etc/pki/trust/ca.crt'}]
        if launchpad_trust_traefik_ca | bool else [] }}
      volumes: >-
        {{ [{'name': 'trusted-ca', 'secret': {'secretName': 'launchpad-trusted-ca'}}]
        if launchpad_trust_traefik_ca | bool else [] }}
      volumeMounts: >-
        {{ [{'name': 'trusted-ca', 'mountPath': '/etc/pki/trust', 'readOnly': true}]
        if launchpad_trust_traefik_ca | bool else [] }}

# A top-level page load of a Scout service URL goes to the launchpad, which opens it
# inside the shell at the same page (ADR 0042): a bookmark or shared link, a new tab
# from another app, a sign-in callback. Frame loads, form posts and API clients (which
# send no Sec-Fetch headers) reach the service directly, as does same-origin navigation
# everywhere but JupyterHub, whose VS Code and terminal pages can't reopen themselves.
# Created here, after the launchpad that serves /open is up, so no link is sent to a
# launchpad without it.
- name: Create open-in-launchpad Middleware
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: traefik.io/v1alpha1
      kind: Middleware
      metadata:
        name: open-in-launchpad
        namespace: '{{ traefik_namespace }}'
      spec:
        redirectRegex:
          regex: '^https://((?:[a-z0-9-]+\.)?[a-z0-9-]+\.{{ server_hostname | regex_escape }})/(.*)'
          replacement: 'https://{{ server_hostname }}/open/${1}/${2}'
          permanent: false

- name: Create open-in-launchpad IngressRoute
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata:
        name: open-in-launchpad
        namespace: '{{ traefik_namespace }}'
      spec:
        entryPoints:
          - websecure
        routes:
          - kind: Rule
            match: >-
              HostRegexp(`^[a-z0-9-]+\.{{ server_hostname | regex_escape }}$`)
              && !Host(`{{ keycloak_subdomain }}.{{ server_hostname }}`)
              && !Host(`{{ oauth2_proxy_subdomain }}.{{ server_hostname }}`)
              && Method(`GET`)
              && Header(`Sec-Fetch-Dest`, `document`)
              && HeaderRegexp(`Sec-Fetch-Site`, `^(none|cross-site|same-site)$`)
            priority: 10000
            middlewares:
              - name: security-headers
              - name: open-in-launchpad
            services:
              - kind: TraefikService
                name: noop@internal
          - kind: Rule
            match: >-
              HostRegexp(`^([a-z0-9-]+\.)?jupyter\.{{ server_hostname | regex_escape }}$`)
              && Method(`GET`)
              && Header(`Sec-Fetch-Dest`, `document`)
              && HeaderRegexp(`Sec-Fetch-Site`, `^(none|cross-site|same-site|same-origin)$`)
            priority: 10000
            middlewares:
              - name: security-headers
              - name: open-in-launchpad
            services:
              - kind: TraefikService
                name: noop@internal
        tls: {}

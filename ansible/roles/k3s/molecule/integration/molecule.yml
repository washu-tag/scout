---
# Molecule Integration Test Configuration for k3s Role
# Uses Docker driver to test actual k3s installation in containers with systemd
role_name_check: 2
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: k3s-rockylinux9
    hostname: baseline-k3s
    image: geerlingguy/docker-rockylinux9-ansible:latest
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    published_ports:
      - '127.0.0.1:6443:6443'
    pre_build_image: true
    groups:
      - server
provisioner:
  name: ansible
  config_options:
    defaults:
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/..
      callbacks_enabled: ansible.posix.profile_tasks
  inventory:
    group_vars:
      all:
        # Use online mode for integration tests (simpler, tests real download)
        air_gapped: false
        k3s_selinux_enabled: true
        k3s_token: test-token-for-molecule
        k3s_api_host: 127.0.0.1
        local_kubeconfig_dir: '{{ lookup("env", "MOLECULE_EPHEMERAL_DIRECTORY") }}/kubeconfig'
        local_kubeconfig_yaml: '{{ local_kubeconfig_dir }}/config'
        # Use native snapshotter for Docker container environment (overlayfs doesn't work in nested containers)
        k3s_extra_args: '--snapshotter=native'
verifier:
  name: ansible

---
# Molecule Integration Test - Verify
# Verifies k3s is actually installed and running
- name: Verify
  hosts: all
  gather_facts: true
  tasks:
    - name: Verify k3s binary is installed
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_binary
      failed_when: not k3s_binary.stat.exists

    - name: Verify k3s service is running
      ansible.builtin.systemd:
        name: k3s
      register: k3s_service
      failed_when: k3s_service.status.ActiveState != 'active'

    - name: Verify k3s cluster is responsive
      ansible.builtin.command: k3s kubectl get nodes
      register: k3s_nodes
      changed_when: false
      failed_when: k3s_nodes.rc != 0

    - name: Display k3s node status
      ansible.builtin.debug:
        var: k3s_nodes.stdout_lines

    - name: Verify node is Ready
      ansible.builtin.assert:
        that:
          - "'Ready' in k3s_nodes.stdout"
        fail_msg: 'k3s node is not in Ready state'
        success_msg: 'k3s cluster is healthy'

    - name: Verify kubeconfig exists and has correct permissions
      ansible.builtin.stat:
        path: /etc/rancher/k3s/k3s.yaml
      register: kubeconfig
      failed_when: >
        not kubeconfig.stat.exists or
        kubeconfig.stat.mode != '0640'

    - name: Verify CoreDNS is running
      ansible.builtin.command: k3s kubectl get deployment coredns -n kube-system
      register: coredns_status
      changed_when: false
      failed_when: coredns_status.rc != 0

    - name: Verify API certificate through the configured hostname
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - --kubeconfig=/etc/rancher/k3s/k3s.yaml
          - '--server=https://{{ k3s_api_host }}:6443'
          - get
          - --raw=/readyz
      changed_when: false

    - name: Read server kubeconfig
      no_log: true
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: server_kubeconfig_raw

    - name: Verify external kubeconfig retains CA verification
      no_log: true
      ansible.builtin.assert:
        that:
          - external_config.clusters[0].cluster.server == 'https://' ~ k3s_api_host ~ ':6443'
          - external_config.clusters[0].cluster['certificate-authority-data'] == server_config.clusters[0].cluster['certificate-authority-data']
          - not (external_config.clusters[0].cluster['insecure-skip-tls-verify'] | default(false) | bool)
          - external_config.users == server_config.users
          - external_config.contexts == server_config.contexts
      vars:
        server_config: '{{ server_kubeconfig_raw.content | b64decode | from_yaml }}'
        external_config: '{{ lookup("file", local_kubeconfig_yaml) | from_yaml }}'

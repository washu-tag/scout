---
# K3s server installation and configuration

- name: Require a hostname or IPv4 address for the external API
  ansible.builtin.assert:
    that:
      - k3s_api_host is string
      - k3s_api_host is match('^[A-Za-z0-9][A-Za-z0-9.-]*$')
    fail_msg: k3s_api_host must be a hostname or IPv4 address without a scheme or port.
  when: ansible_control_node_external_to_cluster

- name: Create directory for K3s data
  ansible.builtin.file:
    path: '{{ base_dir }}'
    state: directory
    mode: '0755'

- name: Configure API certificate names
  when: ansible_control_node_external_to_cluster
  block:
    - name: Create native K3s configuration directory
      ansible.builtin.file:
        path: /etc/rancher/k3s/config.yaml.d
        state: directory
        mode: '0755'

    - name: Include external API names in the serving certificate
      ansible.builtin.copy:
        content: "{{ {'tls-san+': [k3s_api_host, inventory_hostname] | unique} | to_nice_yaml }}"
        dest: /etc/rancher/k3s/config.yaml.d/zz-scout-api-san.yaml
        mode: '0644'
      register: k3s_api_san_config

- name: Install k3s server
  ansible.builtin.command:
    cmd: '{{ k3s_install_script_path }}'
    creates: /usr/local/bin/k3s-uninstall.sh
  environment:
    INSTALL_K3S_SKIP_DOWNLOAD: "{{ 'true' if air_gapped | default(false) | bool else omit }}"
    INSTALL_K3S_EXEC: >-
      --default-local-storage-path={{ base_dir }}
      {{ k3s_extra_args }}
    INSTALL_K3S_VERSION: '{{ k3s_version | default("") }}'
    K3S_TOKEN: '{{ k3s_token }}'
    UNINSTALL_K3S_SH: /usr/local/bin/k3s-uninstall.sh
    KUBECONFIG: '{{ kubeconfig_yaml }}'
    K3S_KUBECONFIG_MODE: '0640'
    K3S_KUBECONFIG_GROUP: '{{ kubeconfig_group }}'
  register: k3s_install_result

- name: Restart k3s to apply configuration changes
  ansible.builtin.systemd:
    name: k3s
    state: restarted
  when:
    - registry_config_changed | default(false) or k3s_api_san_config.changed | default(false)
    - not k3s_install_result.changed

- name: Update kubeconfig group permissions since write-kubeconfig-group/K3S_KUBECONFIG_GROUP isn't working
  ansible.builtin.file:
    path: '{{ kubeconfig_yaml }}'
    state: file
    mode: '0640'
    group: '{{ kubeconfig_group }}'

- name: Ensure k3s control plane server is started
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: true
    scope: system
  register: k3s_systemd_start_k3s
  until: k3s_systemd_start_k3s is succeeded
  retries: 3
  delay: 3
  failed_when:
    - k3s_systemd_start_k3s is not succeeded
    - not ansible_check_mode
  changed_when: false

- name: Check that the server is available to accept connections
  ansible.builtin.wait_for:
    port: 6443
    host: 127.0.0.1
    delay: 5
    sleep: 5
    timeout: 300
  changed_when: false

- name: Check that server is ready
  ansible.builtin.command:
    cmd: kubectl get nodes
  changed_when: false
  failed_when: >-
    kubectl_get_nodes_result.stdout.find("was refused") != -1 or
    kubectl_get_nodes_result.stdout.find("ServiceUnavailable") != -1
  register: kubectl_get_nodes_result
  until:
    - kubectl_get_nodes_result.rc == 0
    - kubectl_get_nodes_result.stdout.find("NotReady") == -1
  retries: 30
  delay: 5

- name: Setup kubeconfig for remote control node
  when: ansible_control_node_external_to_cluster
  block:
    - name: Fetch k3s kubeconfig
      no_log: true
      ansible.builtin.slurp:
        src: '{{ kubeconfig_yaml }}'
      register: k3s_kubeconfig_raw

    - name: Parse kubeconfig
      no_log: true
      ansible.builtin.set_fact:
        k3s_kubeconfig: '{{ k3s_kubeconfig_raw.content | b64decode | from_yaml }}'

    - name: Require a verified kubeconfig
      no_log: true
      ansible.builtin.assert:
        that:
          - k3s_kubeconfig.clusters[0].cluster['certificate-authority-data'] | default('') | length > 0
          - not (k3s_kubeconfig.clusters[0].cluster['insecure-skip-tls-verify'] | default(false) | bool)

    - name: Update server address in kubeconfig
      no_log: true
      ansible.builtin.set_fact:
        modified_kubeconfig: '{{ k3s_kubeconfig | combine(cluster_update, recursive=True) }}'
      vars:
        cluster_update:
          clusters: >-
            {{ [k3s_kubeconfig.clusters[0] | combine({
              'cluster': k3s_kubeconfig.clusters[0].cluster | combine({
                'server': 'https://' ~ k3s_api_host ~ ':6443'
              })
            })] + k3s_kubeconfig.clusters[1:] }}

    - name: Create local kubeconfig directory on jump node
      ansible.builtin.file:
        path: '{{ local_kubeconfig_dir }}'
        state: directory
        mode: '0700'
      delegate_to: localhost
      become: false

    - name: Validate and publish the external kubeconfig
      when: not ansible_check_mode
      delegate_to: localhost
      become: false
      no_log: true
      ansible.builtin.copy:
        content: '{{ modified_kubeconfig | to_nice_yaml }}'
        dest: '{{ local_kubeconfig_yaml }}'
        mode: '0600'
        follow: true
        validate: kubectl --kubeconfig=%s --request-timeout=10s get --raw=/readyz
      register: k3s_external_api_ready
      until: k3s_external_api_ready is succeeded
      retries: 12
      delay: 5

- name: Apply taint to control plane node
  kubernetes.core.k8s_taint:
    name: '{{ inventory_hostname }}'
    state: present
    taints:
      - key: node-role.kubernetes.io/control-plane
        effect: PreferNoSchedule
  # Skip taint on single-node clusters (needs to run workloads on control plane)
  when:
    - "'staging' not in group_names"
    - (groups['k3s_cluster'] | default([]) | length) > 1

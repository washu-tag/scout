---
- name: Validate the app manager runs in the Keycloak namespace
  ansible.builtin.assert:
    that: app_manager_namespace == keycloak_namespace
    fail_msg: >
      app_manager_namespace is {{ app_manager_namespace }} but keycloak_namespace
      is {{ keycloak_namespace }}, and the two have to match: the reconciler
      reads the base realm ConfigMap, keycloak-client-secrets and
      keycloak-admin-secret from its own namespace -- and runs the apply Job
      there -- with no way to point it at another. Deployed split it would
      refuse every reconcile and fail this play's realm-applied gate. Drop the
      override, or move both by setting keycloak_namespace.
    quiet: true

- name: Create namespace
  ansible.builtin.include_role:
    name: scout_common
    tasks_from: namespace
  vars:
    ns: '{{ app_manager_namespace }}'

- name: Parse Helm values
  ansible.builtin.set_fact:
    app_manager_helm_chart_values: "{{ lookup('template', 'values.yaml.j2') | from_yaml }}"

- name: Deploy app manager
  ansible.builtin.include_role:
    name: scout_common
    tasks_from: deploy_helm_chart
  vars:
    helm_chart_name: '{{ app_manager_helm_release_name }}'
    helm_chart_ref: '{{ app_manager_helm_chart_ref }}'
    helm_chart_namespace: '{{ app_manager_namespace }}'
    helm_chart_values: '{{ app_manager_helm_chart_values }}'
    helm_chart_timeout: 10m

# Everything below is the deploy gate, and it cannot be the pod's readiness.
# `helm --wait` above only proves the pod went Ready, and Ready is deliberately
# blind to fragments -- a fragment waiting out its retraction grace with no
# cached copy leaves the realm unapplied and the pod Ready, because one
# component's chart upgrade must not fail the platform's auth deploy. On top of
# that, an upgrade that did not change the chart values never restarts the pod
# at all, so the reconcile behind that Ready may predate this play entirely.
#
# So: read back the document that was published and wait for the reconciler to
# report having applied exactly that one. Reading it from the cluster rather
# than re-rendering the template keeps this correct under
# `make install-app-manager` on its own, and lane-agnostic.
- name: Read the published base realm
  delegate_to: localhost
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    namespace: '{{ keycloak_namespace }}'
    name: '{{ keycloak_base_realm_configmap }}'
    kubeconfig: '{{ local_kubeconfig_yaml }}'
  register: app_manager_base_realm

- name: Validate the base realm is published
  ansible.builtin.assert:
    that: app_manager_base_realm.resources | length > 0
    fail_msg: >
      ConfigMap {{ keycloak_namespace }}/{{ keycloak_base_realm_configmap }} does
      not exist, so there is no realm for the app manager to apply. The
      keycloak-config-cli release publishes it, so run `make install-auth` first.
    quiet: true

- name: Wait for the app manager to apply the published realm
  vars:
    # The reconciler publishes sha256 over the document's *bytes* precisely so
    # that a deploy can compute it; observedBaseHash is over the canonicalised
    # parse and is not reproducible from here.
    expected: >-
      sha256:{{ app_manager_base_realm.resources[0].data[keycloak_base_realm_key] | hash('sha256') }}
    # A failed lookup, an absent ConfigMap, an absent key and unparseable
    # content all collapse to {}, which fails the conditions below rather than
    # erroring the play. `default([])` has to come first: `| first` on an
    # undefined `resources` raises, and a later `| default({})` cannot rescue
    # an expression that already blew up.
    published: >-
      {{ ((app_manager_status.resources | default([]) | first | default({}))
          .data | default({})).status | default('{}') | from_yaml }}
    # Both must hold, as one expression so the poll and the assert cannot drift
    # apart. Every use is `applied | bool`: this renders to the *string*
    # "False", and a bare conditional on a non-empty string is true.
    applied: >-
      {{ (published.observedBaseSourceHash | default('') == expected)
         and (published.phase | default('') == 'Applied') }}
  block:
    - name: Poll the app manager's status
      delegate_to: localhost
      kubernetes.core.k8s_info:
        api_version: v1
        kind: ConfigMap
        namespace: '{{ app_manager_namespace }}'
        name: '{{ app_manager_status_configmap }}'
        kubeconfig: '{{ local_kubeconfig_yaml }}'
      register: app_manager_status
      until: applied | bool
      retries: '{{ (app_manager_realm_wait_seconds | int // 5) | int }}'
      delay: 5
      # The retry loop exhausting is not the message anyone should read; the
      # assert below says what is actually wrong and how to look at it.
      failed_when: false

    - name: Validate the app manager applied the published realm
      ansible.builtin.assert:
        that: applied | bool
        fail_msg: >
          The app manager has not applied the realm this play published, after
          {{ app_manager_realm_wait_seconds }}s. It is the only thing that writes
          the realm, so every Keycloak client is still whatever the last
          successful apply left -- including the ones this deploy was meant to
          change. Reported phase
          "{{ published.phase | default('(no status published)') }}":
          Refused means the realm names a credential keycloak-client-secrets does
          not resolve, Holding means a fragment is absent with no cached copy to
          compose in its place, Failed means the apply Job did not succeed. Full
          detail:
          kubectl exec -n {{ app_manager_namespace }} deploy/{{ app_manager_helm_release_name }}
          -c reconciler -- scout-app-manager status
        quiet: true

---
- name: Validate pluggable app entry
  ansible.builtin.assert:
    that:
      - pluggable_app.name | default('') | length > 0
      - pluggable_app.namespace | default('') | length > 0
      - pluggable_app.state | default('present') in ['present', 'absent']
      - pluggable_app.state | default('present') == 'absent' or pluggable_app.chart | default('') | length > 0
      - pluggable_app.chart | default('') is not match('oci://') or pluggable_app.version is defined
    fail_msg: >-
      Each pluggable_apps entry needs a name and a namespace, a chart unless state is absent,
      and a version when the chart is an oci:// reference.
    quiet: true

- name: Remove the image policy for {{ pluggable_app.name }}
  kubernetes.core.k8s:
    state: absent
    api_version: admissionregistration.k8s.io/v1
    kind: '{{ item }}'
    name: pluggable-app-{{ pluggable_app.name }}
  loop: [MutatingAdmissionPolicyBinding, MutatingAdmissionPolicy]
  when: >-
    pluggable_app.state | default('present') == 'absent' or
    (pluggable_app.registry is not defined and pluggable_app.registries is not defined)

- name: Prepare {{ pluggable_app.name }}
  when: pluggable_app.state | default('present') == 'present'
  vars:
    _pluggable_app_logins: >-
      {{ {'name': pluggable_app.name, 'chart': pluggable_app.chart,
          'registry': pluggable_app.registry | default(none),
          'registries': pluggable_app.registries | default(none)} | pluggable_app_logins }}
    _pluggable_app_chart_login: '{{ _pluggable_app_logins | pluggable_app_login_for(pluggable_app.chart) }}'
  block:
    # Not no_log, so a bad declaration's error shows. The errors never include credentials.
    - name: Check registry logins for {{ pluggable_app.name }}
      ansible.builtin.assert:
        that: _pluggable_app_logins is sequence
        quiet: true

    - name: Create namespace for {{ pluggable_app.name }}
      ansible.builtin.include_role:
        name: scout_common
        tasks_from: namespace
      vars:
        ns: '{{ pluggable_app.namespace }}'

    - name: Create secrets for {{ pluggable_app.name }}
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          type: Opaque
          metadata:
            name: '{{ pluggable_app_secret.key }}'
            namespace: '{{ pluggable_app.namespace }}'
          stringData: "{{ dict(pluggable_app_secret.value.keys() | zip(pluggable_app_secret.value.values() | map('string'))) }}"
      loop: '{{ pluggable_app.secrets | default({}) | dict2items }}'
      loop_control:
        loop_var: pluggable_app_secret
        label: '{{ pluggable_app_secret.key }}'
      no_log: true

    - name: Create database for {{ pluggable_app.name }}
      ansible.builtin.include_role:
        name: scout_common
        tasks_from: create_db_with_owner
      vars:
        db_name: '{{ pluggable_app.database.name }}'
        db_owner: '{{ pluggable_app.database.owner }}'
        db_owner_pass: '{{ pluggable_app.database.password }}'
      when: pluggable_app.database is defined

    # Runs where deploy_helm_chart runs helm for an OCI chart.
    - name: Log in to the chart registry for {{ pluggable_app.name }}
      kubernetes.core.helm_registry_auth:
        host: "{{ pluggable_app.chart | regex_replace('^oci://([^/]+)/.*$', '\\1') }}"
        username: '{{ _pluggable_app_chart_login.username }}'
        password: '{{ _pluggable_app_chart_login.password }}'
      delegate_to: localhost
      no_log: true
      when: _pluggable_app_chart_login is not none

    - name: Create the image pull Secret for {{ pluggable_app.name }}
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          type: kubernetes.io/dockerconfigjson
          metadata:
            name: '{{ pluggable_app.name }}-registry'
            namespace: '{{ pluggable_app.namespace }}'
          data:
            .dockerconfigjson: '{{ _pluggable_app_logins | pluggable_app_auths | to_json | b64encode }}'
      no_log: true
      when:
        - _pluggable_app_logins | length > 0
        - not (air_gapped | default(false) | bool)

    - name: Proxy {{ pluggable_app.name }}'s private images through Harbor
      ansible.builtin.include_role:
        name: harbor
        tasks_from: app_projects
      vars:
        harbor_app_logins: '{{ _pluggable_app_logins }}'
        harbor_hostname: '{{ _pluggable_apps_harbor_hostname }}'
        harbor_admin_password: '{{ _pluggable_apps_staging_vars.harbor_admin_password }}'
      when:
        - _pluggable_app_logins | length > 0
        - air_gapped | default(false) | bool

    - name: Create the image policy for {{ pluggable_app.name }}
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('ansible.builtin.template', 'image-policy.yaml.j2') | from_yaml_all | list }}"
      when: _pluggable_app_logins | length > 0

- name: Helm release for {{ pluggable_app.name }}
  ansible.builtin.include_role:
    name: scout_common
    tasks_from: deploy_helm_chart
    apply:
      no_log: true
  vars:
    helm_chart_name: '{{ pluggable_app.name }}'
    helm_chart_ref: '{{ pluggable_app.chart | default(omit) }}'
    helm_chart_version: '{{ pluggable_app.version | default(omit) }}'
    helm_chart_namespace: '{{ pluggable_app.namespace }}'
    helm_chart_values: "{{ pluggable_app.get('values', {}) }}"
    helm_chart_timeout: "{{ pluggable_app.timeout | default('5m') }}"
    helm_chart_state: "{{ pluggable_app.state | default('present') }}"

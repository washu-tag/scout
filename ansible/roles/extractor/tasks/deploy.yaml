---
# Kubernetes deployment tasks for Extractor services
# These tasks run on the server host (which has access to k3s_cluster inventory variables)

- name: Initialize extractor database
  ansible.builtin.include_role:
    name: scout_common
    tasks_from: create_db_with_owner
  vars:
    db_name: '{{ ingest_postgres_table_name }}'
    db_owner: '{{ postgres_user }}'
    db_owner_pass: '{{ postgres_password }}'

- name: Create namespace
  kubernetes.core.k8s:
    name: '{{ extractor_namespace }}'
    api_version: v1
    kind: Namespace
    state: present

- name: Create Postgres secret
  no_log: true
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: postgres-secret
        namespace: '{{ extractor_namespace }}'
      type: Opaque
      stringData:
        DB_HOST: '{{ db_host }}'
        DB_PORT: '{{ db_port | string }}'
        DB_NAME: '{{ ingest_postgres_table_name }}'
        DB_USER: '{{ postgres_user }}'
        DB_PASSWORD: '{{ postgres_password }}'

- name: Create S3 secret
  no_log: true
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: s3-secret
        namespace: '{{ extractor_namespace }}'
      type: Opaque
      stringData:
        AWS_ACCESS_KEY_ID: '{{ s3_lake_writer }}'
        AWS_SECRET_ACCESS_KEY: '{{ s3_lake_writer_secret }}'

- name: Create S3 configmap
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: s3-env
        namespace: '{{ extractor_namespace }}'
      data:
        AWS_ENDPOINT_URL: '{{ s3_endpoint }}'
        AWS_ALLOW_HTTP: 'true'
        AWS_REGION: '{{ s3_region }}'

# The hl7-transformer chart now owns the modality-mapping ConfigMap and ships the
# default map (helm/extractor/hl7-transformer/files/modality_mapping_codes.csv,
# ADR 0031), so a map change reaches clusters as a chart bump instead of a
# hand-created ConfigMap. Ansible only handles a custom override: when
# modality_map_source_file is set it is validated here and passed to the chart as
# modalityMapping.data (see hl7-transformer.values.yaml.j2).
- name: Validate the custom modality mapping override exists
  ansible.builtin.stat:
    path: '{{ modality_map_source_file }}'
  register: modality_map_stat
  delegate_to: localhost
  when: modality_map_source_file | length > 0

- name: Fail if the custom modality mapping override is missing
  ansible.builtin.fail:
    msg: |
      Custom modality mapping file not found at: {{ modality_map_source_file }}

      The chart ships a default map; set 'modality_map_source_file' only to
      override it with a file path on the Ansible controller.
  when:
    - modality_map_source_file | length > 0
    - not modality_map_stat.stat.exists

- name: Deploy HL7Log Extractor
  ansible.builtin.include_role:
    name: scout_common
    tasks_from: deploy_helm_chart
  vars:
    helm_chart_name: hl7log-extractor
    # Pull the published OCI chart from GHCR (ADR 0030/0031). Dev/CI override:
    # hl7log_extractor_chart_path points helm at a local chart dir, in which case
    # no --version is passed (helm rejects --version with a local path).
    helm_chart_ref: '{{ hl7log_extractor_chart_path | default(hl7log_extractor_chart_oci_ref) }}'
    helm_chart_version: '{{ hl7log_extractor_chart_version if hl7log_extractor_chart_path is not defined else omit }}'
    helm_chart_namespace: '{{ extractor_namespace }}'
    helm_chart_create_namespace: false
    helm_chart_values: "{{ lookup('template', 'hl7log-extractor.values.yaml.j2') | from_yaml }}"

- name: Deploy HL7 Transformer
  ansible.builtin.include_role:
    name: scout_common
    tasks_from: deploy_helm_chart
  vars:
    helm_chart_name: hl7-transformer
    # Pull the published OCI chart from GHCR (ADR 0030/0031). Dev/CI override:
    # hl7_transformer_chart_path points helm at a local chart dir, in which case
    # no --version is passed (helm rejects --version with a local path).
    helm_chart_ref: '{{ hl7_transformer_chart_path | default(hl7_transformer_chart_oci_ref) }}'
    helm_chart_version: '{{ hl7_transformer_chart_version if hl7_transformer_chart_path is not defined else omit }}'
    helm_chart_namespace: '{{ extractor_namespace }}'
    helm_chart_create_namespace: false
    helm_chart_values: "{{ lookup('template', 'hl7-transformer.values.yaml.j2') | from_yaml }}"

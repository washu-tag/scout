---
# Default values for Extractor deployment

# Extractor Helm charts, published to GHCR by this repo's CI (ADR 0030/0031 phase 0).
# Pulled by helm from the OCI ref pinned to the matching *_chart_version
# (group_vars/all/versions.yaml). Dev/CI override: set the matching *_chart_path
# to a local chart dir, in which case no --version is passed.
hl7_transformer_chart_oci_ref: oci://ghcr.io/washu-tag/charts/hl7-transformer
hl7log_extractor_chart_oci_ref: oci://ghcr.io/washu-tag/charts/hl7log-extractor

hl7log_extractor_timezone: '{{ timezone }}'

# Custom extractor images (override from inventory for CI/CD)
hl7log_extractor_image_repository: ghcr.io/washu-tag/hl7log-extractor
hl7log_extractor_image_tag: latest
hl7_transformer_image_repository: ghcr.io/washu-tag/hl7-transformer
hl7_transformer_image_tag: latest

# Extractor configuration
hl7log_extractor_timeout: 480
hl7log_extractor_heartbeat_timeout: 30
hl7log_extractor_concurrency: 150
hl7_transformer_timeout: 480
# HL7 Transformer resources
# Memory: requests = spark_memory, limits = 4x spark_memory to account for Spark overhead
# Memory is computed in templates using jvm_memory_to_k8s filter (not computable here in defaults)
hl7_transformer_spark_memory: 1G
hl7_transformer_cpu_request: 100m
hl7_transformer_cpu_limit: 4

# Resource configuration (dev defaults - CI friendly)
hl7log_extractor_resources_default:
  requests:
    cpu: 100m
    memory: 1Gi
  limits:
    cpu: 2
    memory: 2Gi
# Recommended to be low in CI because there is significantly less memory available, so
# less memory can be allocated to the heap itself.
hl7log_extractor_jvm_heap_max_ram_percentage: 60

# Container paths
hl7logs_root_dir: /data

# Optional custom modality-map override. Empty by default: the hl7-transformer
# chart ships and mounts its own default map (files/modality_mapping_codes.csv).
# Set this to a CSV path on the Ansible controller only to override it.
modality_map_source_file: ''

# S3 paths
hl7_path: 's3://{{ lake_bucket }}/hl7'

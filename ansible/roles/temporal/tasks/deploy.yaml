---
# Kubernetes deployment tasks for Temporal cluster
# These tasks run on the server host (which has access to k3s_cluster inventory variables)
# NOTE: This role expects Cassandra and Elasticsearch to already be deployed

- name: Create namespace
  kubernetes.core.k8s:
    name: '{{ scout_extractor_namespace }}'
    api_version: v1
    kind: Namespace
    state: present

# Deploy Temporal
- name: Parse Helm values
  ansible.builtin.set_fact:
    temporal_helm_chart_values: "{{ lookup('template', 'values.yaml.j2') | from_yaml }}"

- name: Deploy Temporal
  ansible.builtin.include_role:
    name: scout_common
    tasks_from: deploy_helm_chart
  vars:
    helm_chart_name: temporal
    helm_chart_ref: temporal/temporal
    helm_chart_version: '{{ temporal_version }}'
    helm_chart_namespace: '{{ scout_extractor_namespace }}'
    helm_repo_name: temporal
    helm_repo_url: https://raw.githubusercontent.com/temporalio/helm-charts/refs/heads/gh-pages/
    helm_chart_timeout: 15m
    helm_chart_values: '{{ temporal_helm_chart_values }}'

- name: Wait for Temporal schema job to complete
  shell: >-
    JOB_NAME=$(kubectl -n {{ scout_extractor_namespace }} get jobs -l app.kubernetes.io/component=schema
    --sort-by='.metadata.creationTimestamp'
    -o jsonpath='{.items[-1].metadata.name}' 2>/dev/null || echo "");
    if [ -n "$JOB_NAME" ]; then
      kubectl -n {{ scout_extractor_namespace }} wait --for=condition=complete --timeout=300s job/$JOB_NAME;
    fi
  register: temporal_schema
  changed_when: false

# Idempotent Temporal setup (namespace retention, issue #432) via a small
# Scout-owned chart of Helm-hook Jobs (temporal-bootstrap), mirroring the
# scout-dashboards model. kubernetes.core.helm won't upgrade a local chart on
# file-only edits (it keys on chart version + values, not rendered templates),
# so hash the chart files and pass the digest as a value to force the upgrade,
# which re-runs the hooks.
- name: Hash temporal-bootstrap chart files (drives redeploy on file edits)
  ansible.builtin.find:
    paths: '{{ temporal_bootstrap_helm_chart_ref }}'
    file_type: file
    recurse: true
    get_checksum: true
  register: _temporal_bootstrap_files
  delegate_to: localhost

- name: Compute temporal-bootstrap config checksum
  ansible.builtin.set_fact:
    temporal_bootstrap_config_checksum: "{{ _temporal_bootstrap_files.files | map(attribute='checksum') | sort | join('') | hash('sha1') }}"

# Pin the admin-tools image to the Temporal chart's appVersion so the `temporal`
# CLI always matches the installed server (e.g. chart 1.2.0 -> appVersion
# 1.31.0), rather than a hand-maintained tag that can drift out of step.
- name: Resolve admin-tools image tag from the Temporal chart appVersion
  ansible.builtin.shell:
    cmd: >-
      helm show chart temporal
      --repo https://raw.githubusercontent.com/temporalio/helm-charts/refs/heads/gh-pages/
      --version '{{ temporal_version }}'
      | awk '/^appVersion:/ {gsub(/"/,"",$2); print $2}'
  register: _temporal_chart_appversion
  changed_when: false
  failed_when: (_temporal_chart_appversion.stdout | trim | length) == 0
  delegate_to: localhost

- name: Pin admin-tools image tag to the Temporal server version
  ansible.builtin.set_fact:
    temporal_admin_tools_image_tag: '{{ _temporal_chart_appversion.stdout | trim }}'

- name: Deploy temporal-bootstrap chart
  ansible.builtin.include_role:
    name: scout_common
    tasks_from: deploy_helm_chart
  vars:
    helm_chart_name: temporal-bootstrap
    helm_chart_ref: '{{ temporal_bootstrap_helm_chart_ref }}'
    helm_chart_namespace: '{{ scout_extractor_namespace }}'
    helm_chart_values:
      # Changes when any chart file changes so the helm module runs the upgrade
      # (see note above); not consumed by the chart templates.
      configChecksum: '{{ temporal_bootstrap_config_checksum }}'
      image:
        repository: '{{ temporal_admin_tools_image_repository }}'
        tag: '{{ temporal_admin_tools_image_tag }}'
      temporalAddress: 'temporal-internal-frontend.{{ scout_extractor_namespace }}:7236'
      namespace:
        name: default
        retention: '{{ temporal_default_namespace_retention }}'

# Set up scheduled tasks
- name: Construct cron schedule
  when: scheduled_ingest_cron is undefined and scheduled_ingest_hour is defined
  set_fact:
    scheduled_ingest_cron: '0 {{ scheduled_ingest_hour }} * * *'

- name: Add scheduled task for prospective report indexing
  when: scheduled_ingest_cron is defined
  kubernetes.core.k8s:
    state: present
    wait: true
    wait_timeout: 120
    wait_condition:
      type: Complete
      status: 'True'
    definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        generateName: 'add-prospective-indexing-'
        namespace: '{{ scout_extractor_namespace }}'
        labels:
          app: prospective-indexing
      spec:
        ttlSecondsAfterFinished: 3600
        backoffLimit: 5
        template:
          metadata:
            labels:
              app: prospective-indexing
          spec:
            restartPolicy: Never
            containers:
              - name: prospective-indexing-setup
                image: temporalio/admin-tools
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 1000
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop:
                      - ALL
                  seccompProfile:
                    type: RuntimeDefault
                env:
                  - name: TEMPORAL_ADDRESS
                    value: 'temporal-internal-frontend.{{ scout_extractor_namespace }}:7236'
                  - name: HOME
                    value: /tmp
                command:
                  - /bin/sh
                  - -c
                  - |
                    if temporal schedule describe --schedule-id ScheduledReportIngest 2>/dev/null; then
                      temporal schedule update \
                        --schedule-id ScheduledReportIngest \
                        --workflow-id ScheduledReportIngest \
                        --task-queue ingest-hl7-log \
                        --type IngestHl7LogWorkflow \
                        --cron '{{ scheduled_ingest_cron }}'
                    else
                      temporal schedule create \
                        --schedule-id ScheduledReportIngest \
                        --workflow-id ScheduledReportIngest \
                        --task-queue ingest-hl7-log \
                        --type IngestHl7LogWorkflow \
                        --cron '{{ scheduled_ingest_cron }}'
                    fi
                volumeMounts:
                  - name: tmp
                    mountPath: /tmp
            volumes:
              - name: tmp
                emptyDir: {}

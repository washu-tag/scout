---
# Shared native bootstrap values for Ansible seeding and private Flux preparation.
# The image fact is either discovered from the running Pod or supplied by exact-pin preparation.
- name: Prepare native Open WebUI bootstrap chart values
  no_log: true
  ansible.builtin.set_fact:
    open_webui_bootstrap_helm_chart_values:
      image:
        ref: '{{ _owui_bootstrap_image }}'
      owuiBaseUrl: 'http://open-webui.{{ chatbot_namespace }}:80'
      bootstrap:
        email: '{{ open_webui_bootstrap_email }}'
        name: '{{ open_webui_bootstrap_name }}'
      # secretName is left at the chart default (open-webui-secrets) — the
      # open-webui role creates that Secret in create_secret.yaml before this
      # Helm install runs.
      persistentConfig:
        tool_server_connections: '{{ tool_server_connections | default([]) }}'
        default_model_id: '{{ open_webui_default_model_id | default("") }}'
        task_model_id: '{{ open_webui_task_model_id | default("") }}'
        jwt_expires_in: '{{ keycloak_token_lifespan }}s'
      filterFunctions: '{{ open_webui_filter_functions | default([]) }}'
      eventFunctions: '{{ open_webui_event_functions | default([]) }}'
      toolFunctions: '{{ open_webui_tool_functions | default([]) }}'
      scoutModels: '{{ scout_models | default([]) }}'
      scoutDefaults:
        systemPromptFile: '{{ open_webui_scout_system_prompt_file }}'
        profileImageFile: scout-logo-128.png.b64
        toolIds: '{{ open_webui_scout_tool_ids }}'
        suggestionPrompts: '{{ open_webui_scout_default_suggestion_prompts }}'
        capabilities: '{{ open_webui_scout_default_capabilities }}'
        builtinTools: '{{ open_webui_scout_default_builtin_tools }}'
        functionCalling: '{{ open_webui_scout_default_function_calling }}'
        reasoningEffort: '{{ open_webui_scout_default_reasoning_effort }}'
        keepAliveResident: '{{ open_webui_scout_keep_alive_resident }}'
        keepAliveCold: '{{ open_webui_scout_keep_alive_cold_load }}'
        hideBaseModels: '{{ open_webui_hide_base_models | default(true) | bool }}'

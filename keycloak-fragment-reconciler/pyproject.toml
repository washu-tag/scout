[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scout-keycloak-fragment-reconciler"
version = "5.0.0"
description = "Reconciles Keycloak realm fragments published by pluggable apps into the Scout realm"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.13.5,<3",
  "pydantic-settings>=2.15,<3",
  "PyYAML>=6.0.3,<7",
  "httpx2>=2.13,<3",
  "prometheus-client>=0.26,<1",
]

[project.optional-dependencies]
test = ["pytest>=9.1,<10"]

[project.scripts]
keycloak-fragment-reconciler = "scout_keycloak_fragment_reconciler.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

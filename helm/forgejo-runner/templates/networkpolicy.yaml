{{- if .Values.networkPolicy.enabled }}
# Runners reach DNS, Forgejo through Traefik and the listed destinations, nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forgejo-runner
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "forgejo-runner.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.traefikNamespace | quote }} }
          podSelector:
            matchLabels: { app.kubernetes.io/name: traefik }
      ports:
        - { protocol: TCP, port: {{ .Values.networkPolicy.traefikPort }} }
    {{- with .Values.networkPolicy.egressCIDRs }}
    - to:
        {{- range . }}
        - ipBlock: { cidr: {{ . | quote }} }
        {{- end }}
      ports:
        - { protocol: TCP, port: 443 }
    {{- end }}
{{- end }}

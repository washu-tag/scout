apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "scout-opa.fullname" . }}-policy
  labels:
    {{- include "scout-opa.objectLabels" . | nindent 4 }}
data:
  policy.rego: |
{{ include "scout-opa.rego" . | indent 4 }}
  authz.rego: |
{{ include "scout-opa.authz" . | indent 4 }}
  scout.rego: |
{{ include "scout-opa.scout" . | indent 4 }}
  {{- /* fromJson returns {"Error": ...} rather than failing; data.json without its
  filters would turn off every row filter and mask. */}}
  {{- $data := .Values.data.json | fromJson }}
  {{- if hasKey $data "Error" }}
  {{- fail (printf "data.json must be a JSON object: %v" $data.Error) }}
  {{- end }}
  data.json: |
{{ $data | merge (dict "policy_revision" (include "scout-opa.policyRevision" .)) | toPrettyJson | indent 4 }}
  config.yaml: |
{{ .Values.config.yaml | indent 4 }}

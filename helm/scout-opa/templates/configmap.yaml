apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "scout-opa.fullname" . }}-policy
  labels:
    {{- include "scout-opa.objectLabels" . | nindent 4 }}
data:
  policy.rego: |
{{ include "scout-opa.rego" . | indent 4 }}
  authz.rego: |
{{ include "scout-opa.authz" . | indent 4 }}
  scout.rego: |
{{ include "scout-opa.scout" . | indent 4 }}
  data.json: |
{{ .Values.data.json | fromJson | merge (dict "policy_revision" (include "scout-opa.policyRevision" .)) | toPrettyJson | indent 4 }}
  config.yaml: |
{{ .Values.config.yaml | indent 4 }}

{{- if .Values.serviceAccount.create -}}
# Created only in aws mode (serviceAccount.create=true) so OPA's bundle plugin
# reads from S3 via IRSA (the eks.amazonaws.com/role-arn annotation); on-prem uses
# the bundle-reader Secret and the chart-default SA.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "scout-opa.serviceAccountName" . }}
  labels:
    {{- include "scout-opa.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}

# Default values for scout-opa. Production values rendered by ansible/roles/opa.

replicaCount: 2

image:
  repository: openpolicyagent/opa
  tag: latest
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Rendered into the OPA policy ConfigMap; policy-hash annotation rolls the
# Deployment on any change. Empty policy.rego falls back to chart-owned
# files/main.rego (authoritative Trino policy, ADR 0020).
policy:
  rego: ''
data:
  json: '{}'
config:
  yaml: ''

# Bundle-reader Secret managed outside this chart; Deployment mounts it via
# envFrom. credsHash feeds the rolling-hash so rotation rolls pods without
# re-reading the Secret values into the chart.
bundleReader:
  secretName: opa-bundle-reader
  credsHash: ''

service:
  port: 8181

# Ingress NetworkPolicy admitting only the Trino coordinator. Default off so a
# bare `helm install` (chart tests, no Trino coordinator) stays reachable.
networkPolicy:
  enabled: false

# Default values for report-viewer.

replicaCount: 1

image:
  repository: ghcr.io/washu-tag/report-viewer
  # Empty falls through to .Chart.AppVersion, which helm package stamps at publish
  # time (ADR 0030 section 2). Ansible sets this explicitly; report-viewer is not
  # in the GitOps deploy base yet.
  tag: ''
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ''

podAnnotations: {}
podLabels: {}

# K8s "restricted" Pod Security Standard. UID/GID must match the
# searchs user in report-viewer/Dockerfile.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: traefik
  annotations: {}
  host: ''
  tls: []

# Defence-in-depth only: the bearer path is already cryptographic
# (Keycloak-signed, JWKS-verified), so this just narrows who can reach the
# service at the network layer too.
networkPolicy:
  enabled: true
  traefikNamespace: kube-system
  # Optional additional pod selectors that may reach the service on
  # service.port - e.g. the OWUI tool pod once it talks to us directly.
  # Each entry becomes one `from:` block in the NetworkPolicy.
  extraFrom: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 2
    memory: 4Gi

# Issue #739: search-detail toolbar actions, rendered into a
# ConfigMap and mounted at /app/action-catalog/catalog.yaml (matches
# scout_report_viewer.config.Settings.action_catalog_path's default).
# explainSearch/downloadCsv are objects, not plain booleans, specifically
# so a site can override just `enabled` or `requiredRole` on one of them
# (Helm deep-merges map values) without needing to fully restate the
# other, or anything in `custom` - unlike `custom`, which is a list and
# therefore replaced wholesale by any site override, not merged.
actions:
  explainSearch:
    enabled: true
    # Keycloak client role required to see this button, checked against
    # the caller's resource_access.report-viewer.roles Bearer JWT claim
    # (#739). Empty = visible to every authenticated user.
    requiredRole: ''
  downloadCsv:
    enabled: true
    requiredRole: ''
  # Site-admin-authorable buttons - no report-viewer code change or image
  # rebuild needed, just a values change + helm upgrade. Two shapes:
  #
  # actionType: open-url (default if omitted) - a static link. id/title/
  # url required; weight falls back to actions.py's own field default if
  # omitted; requiredRole gates the button behind that Keycloak client
  # role (checked against the caller's resource_access.report-viewer.roles
  # Bearer JWT claim, #739), same as any other action.
  #
  #   custom:
  #     - id: pacs-viewer
  #       title: Open in PACS
  #       url: https://pacs.example.org/
  #       weight: 50
  #       requiredRole: report-viewer-admin
  #
  # actionType: backend-call - the SPA POSTs the search's context to
  # endpointUrl (a genuinely separate, independently deployed service -
  # #595's "Apps" tier) and opens whatever result URL it returns.
  # invokeToken, if set, is forwarded as X-Report-Viewer-Action-Token -
  # proves only that the caller knows a shared secret, not who the end
  # user is. assertionKey, if set, signs a short-lived
  # X-Report-Viewer-User-Assertion JWT (sub/roles/search_id/action_id,
  # 60s expiry) the target can verify independently - a DIFFERENT value
  # from invokeToken on purpose, since invokeToken travels on every call
  # and can leak via logs, while assertionKey never goes over the wire.
  # Both are rendered into a Secret keyed by this entry's id
  # (actions-secret.yaml), never into the action-catalog ConfigMap or any
  # API response - see actions.py's load_invoke_token()/
  # mint_user_assertion().
  #
  # What this does and doesn't prove: the NetworkPolicy above, the invoke
  # token, and the assertion's signature together constrain who can reach
  # endpointUrl and as whom (a fixed sub/roles, only within the 60s
  # window). None of that additionally guarantees the specific `reports`
  # list in the request body is the one report-viewer actually resolved -
  # a party that has already obtained a valid assertion + invoke token
  # could substitute a different reports list for the same identity. That
  # gap is only reachable by bypassing report-viewer entirely (it's not
  # exposed through the SPA's own UI, which never trusts client-supplied
  # report ids - see invoke_search_action's visible_report_ids handling).
  # A target wanting a stronger guarantee here needs to query Trino
  # directly rather than trust this payload.
  #
  #   custom:
  #     - id: explore-xnat
  #       title: Explore in XNAT
  #       actionType: backend-call
  #       endpointUrl: http://xnat-explore-poc.<namespace>.svc.cluster.local:8000/invoke
  #       invokeToken: <matches xnat-explore-poc's invokeToken value>
  #       assertionKey: <matches xnat-explore-poc's assertionKey value>
  #
  # "client" actions (page-specific logic, e.g. Download CSV) can't be
  # added this way at all - they need a handler already registered in
  # report-viewer's own frontend, so there's structurally no values field
  # for one.
  custom: []

# Env vars injected as REPORT_VIEWER_* - see scout_report_viewer.config.Settings.
# Populated by the Ansible role's values.yaml.j2 in production.
env: {}

# Optional envFrom, appended verbatim to the container's envFrom list.
envFrom: []

# Map of envVarName -> {secretName, key, optional} rendered as
# valueFrom.secretKeyRef entries on the main container.
secretEnv: {}

# REPORT_VIEWER_DATABASE_URL is sensitive; chart can render a Secret from this
# value, or leave empty to let the role manage the Secret externally.
databaseUrl: ''

# Trino CA cert (PEM). When set, the chart renders a Secret and mounts it
# at /etc/trino-ca/ca.crt so the service can verify HTTPS Trino.
trinoCaCert: ''

# report_viewer_svc client_secret for outbound Trino auth (ADR 0022).
trinoAuthClientSecret: ''

# Extra CA bundle mounted into the main container for outbound HTTPS
# (Trino, Keycloak, anything behind the staging cert).
trustedCaSecret:
  name: ''
  key: 'ca.crt'

nodeSelector: {}
tolerations: []
affinity: {}

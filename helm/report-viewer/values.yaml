# Default values for report-viewer.

replicaCount: 1

image:
  repository: ghcr.io/washu-tag/report-viewer
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ''

podAnnotations: {}
podLabels: {}

# K8s "restricted" Pod Security Standard. UID/GID must match the
# searchs user in report-viewer/Dockerfile.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: traefik
  annotations: {}
  host: ''
  tls: []

# Defence-in-depth only: the bearer path is cryptographic and the header path
# is gated by gatewaySecret, so this just narrows who can reach the service.
networkPolicy:
  enabled: true
  traefikNamespace: kube-system
  # Optional additional pod selectors that may reach the service on
  # service.port - e.g. the OWUI tool pod once it talks to us directly.
  # Each entry becomes one `from:` block in the NetworkPolicy.
  extraFrom: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 2
    memory: 4Gi

# Issue #739 PoC: search-detail toolbar actions, rendered into a
# ConfigMap and mounted at /app/action-catalog/catalog.yaml (matches
# scout_report_viewer.config.Settings.action_catalog_path's default).
# Disabling one just omits it from the rendered catalog - see
# templates/actions-configmap.yaml.
actions:
  explainSearch: true
  downloadCsv: true
  # Site-admin-authorable buttons - no report-viewer code change or image
  # rebuild needed, just a values change + helm upgrade. Two shapes:
  #
  # actionType: open-url (default if omitted) - a static link. id/title/
  # url required; weight falls back to actions.py's own field default if
  # omitted; requiredGroup gates the button behind membership in that
  # Keycloak group (checked against the caller's X-Auth-Request-Groups
  # header, #739), same as any other action.
  #
  #   custom:
  #     - id: pacs-viewer
  #       title: Open in PACS
  #       url: https://pacs.example.org/
  #       weight: 50
  #       requiredGroup: scout-admin
  #
  # actionType: backend-call - the SPA POSTs the search's context to
  # endpointUrl (a genuinely separate, independently deployed service -
  # #595's "Apps" tier) and opens whatever result URL it returns.
  # invokeToken, if set, is forwarded as X-Report-Viewer-Action-Token and
  # never round-trips to the browser (see actions.py's ActionDescriptor).
  #
  #   custom:
  #     - id: explore-xnat
  #       title: Explore in XNAT
  #       actionType: backend-call
  #       endpointUrl: http://xnat-explore-poc.<namespace>.svc.cluster.local:8000/invoke
  #       invokeToken: <matches xnat-explore-poc's invokeToken value>
  #
  # "client" actions (page-specific logic, e.g. Download CSV) can't be
  # added this way at all - they need a handler already registered in
  # report-viewer's own frontend, so there's structurally no values field
  # for one.
  custom: []

# Env vars injected as REPORT_VIEWER_* - see scout_report_viewer.config.Settings.
# Populated by the Ansible role's values.yaml.j2 in production.
env: {}

# Optional envFrom, appended verbatim to the container's envFrom list.
envFrom: []

# Map of envVarName -> {secretName, key, optional} rendered as
# valueFrom.secretKeyRef entries on the main container.
secretEnv: {}

# REPORT_VIEWER_DATABASE_URL is sensitive; chart can render a Secret from this
# value, or leave empty to let the role manage the Secret externally.
databaseUrl: ''

# Trino CA cert (PEM). When set, the chart renders a Secret and mounts it
# at /etc/trino-ca/ca.crt so the service can verify HTTPS Trino.
trinoCaCert: ''

# report_viewer_svc client_secret for outbound Trino auth (ADR 0022).
trinoAuthClientSecret: ''

# Shared secret Traefik injects as X-Report-Viewer-Gateway; gates the header
# path. Rendered into both the Secret and the gateway Middleware.
gatewaySecret: ''

# Extra CA bundle mounted into the main container for outbound HTTPS
# (Trino, Keycloak, anything behind the staging cert).
trustedCaSecret:
  name: ''
  key: 'ca.crt'

nodeSelector: {}
tolerations: []
affinity: {}

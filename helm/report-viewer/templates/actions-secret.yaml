# Issue #739: invoke tokens and assertion-signing keys for actions.custom
# backend-call entries live here, never in actions-configmap.yaml's
# ConfigMap - a ConfigMap has no access-control distinction from
# ordinary application config, so secret material placed there is
# readable by anyone with ConfigMap-read RBAC in the namespace, not just
# Secret-read. Always rendered (possibly empty) so the Deployment's
# volume mount never depends on whether any custom action sets either.
#
# invokeToken and assertionKey are deliberately DIFFERENT values, not one
# reused for both roles: invokeToken is transmitted on every invoke call
# and can leak via logs/traces; assertionKey never travels over the
# wire, only its signature output does. Reusing one value for both would
# let anyone who obtained the (much more exposed) invoke token forge
# whatever user/group assertion they wanted, defeating the point of
# signing one at all.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "report-viewer.fullname" . }}-action-tokens
  labels:
    {{- include "report-viewer.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range .Values.actions.custom }}
  {{- if .invokeToken }}
  {{ required "actions.custom entries need an id" .id }}: {{ .invokeToken | quote }}
  {{- end }}
  {{- if .assertionKey }}
  {{ required "actions.custom entries need an id" .id }}.assertion-key: {{ .assertionKey | quote }}
  {{- end }}
  {{- end }}

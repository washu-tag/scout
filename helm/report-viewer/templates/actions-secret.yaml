# Invoke tokens and assertion-signing keys for actions.custom backend-call
# entries live here, never in actions-configmap.yaml's ConfigMap - a
# ConfigMap has no access-control distinction from ordinary application
# config, so secret material placed there is readable by anyone with
# ConfigMap-read RBAC in the namespace, not just Secret-read. Always
# rendered (possibly empty) so the Deployment's volume mount never depends
# on whether any custom action sets either.
#
# invokeToken and assertionKey are deliberately different values - see
# scout_report_viewer.actions.mint_user_assertion's docstring for why.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "report-viewer.fullname" . }}-action-tokens
  labels:
    {{- include "report-viewer.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range .Values.actions.custom }}
  {{- if .invokeToken }}
  {{ required "actions.custom entries need an id" .id }}: {{ .invokeToken | quote }}
  {{- end }}
  {{- if .assertionKey }}
  {{ required "actions.custom entries need an id" .id }}.assertion-key: {{ .assertionKey | quote }}
  {{- end }}
  {{- end }}

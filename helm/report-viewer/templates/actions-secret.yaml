# Invoke tokens for actions.custom backend-call entries live here, never
# in actions-configmap.yaml's ConfigMap - a ConfigMap has no access-control
# distinction from ordinary application config, so secret material placed
# there is readable by anyone with ConfigMap-read RBAC in the namespace,
# not just Secret-read. Always rendered (possibly empty) so the
# Deployment's volume mount never depends on whether any custom action
# sets one.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "report-viewer.fullname" . }}-action-tokens
  labels:
    {{- include "report-viewer.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range .Values.actions.custom }}
  {{- if .invokeToken }}
  {{ required "actions.custom entries need an id" .id }}: {{ .invokeToken | quote }}
  {{- end }}
  {{- end }}

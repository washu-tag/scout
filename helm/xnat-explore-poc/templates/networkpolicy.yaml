{{- if .Values.networkPolicy.enabled }}
# In-cluster only: no Ingress exists for this service at all (it's never
# called by a browser), so the only legitimate caller is report-viewer's
# own backend-call proxy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "xnat-explore-poc.fullname" . }}-ingress
  labels:
    {{- include "xnat-explore-poc.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "xnat-explore-poc.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ required "networkPolicy.reportViewerNamespace is required" .Values.networkPolicy.reportViewerNamespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml (required "networkPolicy.reportViewerPodSelector is required" .Values.networkPolicy.reportViewerPodSelector) | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
{{- end }}

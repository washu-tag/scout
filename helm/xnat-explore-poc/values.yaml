# Default values for xnat-explore-poc.
# Issue #739 PoC: a totally fake report-viewer "backend-call" action
# target. See src/xnat_explore_poc/app.py - no real XNAT integration.

replicaCount: 1

image:
  repository: ghcr.io/washu-tag/xnat-explore-poc
  tag: latest
  pullPolicy: IfNotPresent

nameOverride: ''
fullnameOverride: ''

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

service:
  port: 8000

# In-cluster only - called by report-viewer's backend-call proxy, never by
# a browser. No Ingress, no oauth2-proxy/Traefik middleware needed.
networkPolicy:
  enabled: true
  # Namespace report-viewer itself deploys into, so its pod can reach this
  # service. Set to match the report-viewer deployment.
  reportViewerNamespace: ''

# Bundled XNAT's browser-facing base URL - what /invoke's response points at.
xnatBaseUrl: ''

# Shared secret report-viewer sends as X-Report-Viewer-Action-Token
# (rendered into a real Secret - see templates/secret.yaml - not a plain
# env value). Must match the same value configured on report-viewer's
# side for this action's actions.custom[].invokeToken. Proves only that
# the caller knows this value, not who the end user is - see
# assertionKey below for that.
invokeToken: ''

# Verifies X-Report-Viewer-User-Assertion, report-viewer's short-lived
# signed claim of who an invoke is for. Must match report-viewer's
# actions.custom[].assertionKey for this action - and must be a
# DIFFERENT value from invokeToken, since invokeToken travels on every
# call and can leak via logs, while this key never goes over the wire.
assertionKey: ''

# Keycloak group the asserted caller must be a member of, or empty to
# skip this check (the assertion's signature/expiry are still verified
# either way). Set this to whatever requiredGroup gates this action on
# report-viewer's side - not read from there automatically, since this
# App has no notion of report-viewer's action catalog.
requiredGroup: ''

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

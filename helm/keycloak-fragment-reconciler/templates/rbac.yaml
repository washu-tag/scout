{{/*
ConfigMaps are cluster-wide because RBAC cannot express a label selector: once
`watchedNamespaces` is set at all, it narrows what is read, never what is
granted. `patch` is absent on purpose -- a fragment arrives on a Flux- or
Helm-managed object, so writing status back onto one starts a revert loop.

Secrets are absent entirely: each app's chart grants access to its own
credential, scoped by `resourceNames`.

Unlike the ServiceAccount, the cluster read is conditional, so the default
values install a reconciler holding no cluster permissions at all.
*/}}
{{- if .Values.watchedNamespaces }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "keycloak-fragment-reconciler.clusterName" . }}
  labels:
    {{- include "keycloak-fragment-reconciler.labels" . | nindent 4 }}
rules:
  - apiGroups: ['']
    resources: ['configmaps']
    verbs: ['get', 'list', 'watch']
  # Written into whichever namespace the fragment came from, so the grant
  # cannot be narrower.
  - apiGroups: ['', 'events.k8s.io']
    resources: ['events']
    verbs: ['create', 'patch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "keycloak-fragment-reconciler.clusterName" . }}
  labels:
    {{- include "keycloak-fragment-reconciler.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "keycloak-fragment-reconciler.clusterName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "keycloak-fragment-reconciler.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

{{/*
One replica, strategy Recreate, no leader election. Two reconcilers writing the
same realm objects is the failure this service exists to avoid, and `Recreate`
is what stops a rolling update from briefly running two; the in-memory orphan
grace clock assumes one process for the same reason. An outage here is only ever
a delay, so there is nothing worth trading that for.
*/}}
{{- $credentialDir := "/var/run/secrets/keycloak-fragment-reconciler" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "keycloak-fragment-reconciler.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keycloak-fragment-reconciler.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "keycloak-fragment-reconciler.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- /*
      Scrape annotations rather than a scrape job in the Prometheus config:
      both deploy lanes discover pods by these annotations, so one place
      covers both, and `drift_repairs_total` is the signal that the base
      realm's tier roles are reaping fragment grants -- which presents to
      users as app roles that come and go, not as an outage, so nobody will
      think to go looking for it.
      */}}
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: {{ .Values.service.port | quote }}
        prometheus.io/path: '/metrics'
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "keycloak-fragment-reconciler.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "keycloak-fragment-reconciler.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: reconciler
          image: '{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}'
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: KEYCLOAK_FRAGMENT_RECONCILER_KEYCLOAK_URL
              value: {{ .Values.keycloak.url | quote }}
            - name: KEYCLOAK_FRAGMENT_RECONCILER_REALM
              value: {{ .Values.keycloak.realm | quote }}
            - name: KEYCLOAK_FRAGMENT_RECONCILER_CLIENT_ID
              value: {{ .Values.keycloak.clientId | quote }}
            - name: KEYCLOAK_FRAGMENT_RECONCILER_CLIENT_SECRET_FILE
              value: {{ printf "%s/%s" $credentialDir .Values.keycloak.existingSecretKey | quote }}
            - name: KEYCLOAK_FRAGMENT_RECONCILER_SERVER_HOSTNAME
              value: {{ required "serverHostname is required: fragments' redirect URIs are validated against it" .Values.serverHostname | quote }}
            - name: KEYCLOAK_FRAGMENT_RECONCILER_TIER_ROLES
              value: {{ join "," .Values.tierRoles | quote }}
            - name: KEYCLOAK_FRAGMENT_RECONCILER_WATCHED_NAMESPACES
              value: {{ join "," .Values.watchedNamespaces | quote }}
            - name: KEYCLOAK_FRAGMENT_RECONCILER_RESYNC_SECONDS
              value: {{ .Values.reconcile.resyncSeconds | quote }}
            - name: KEYCLOAK_FRAGMENT_RECONCILER_ORPHAN_GRACE_SECONDS
              value: {{ .Values.reconcile.orphanGraceSeconds | quote }}
            - name: KEYCLOAK_FRAGMENT_RECONCILER_DEBOUNCE_SECONDS
              value: {{ .Values.reconcile.debounceSeconds | quote }}
            - name: KEYCLOAK_FRAGMENT_RECONCILER_DRY_RUN
              value: {{ .Values.reconcile.dryRun | quote }}
            - name: KEYCLOAK_FRAGMENT_RECONCILER_PORT
              value: {{ .Values.service.port | quote }}
            - name: KEYCLOAK_FRAGMENT_RECONCILER_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          {{/*
            Liveness asks only whether the process is up; readiness asks
            whether the tier realm roles exist. The other way round, a Keycloak
            outage would crashloop this pod for no benefit.
          */}}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: client-credential
              mountPath: {{ $credentialDir | quote }}
              readOnly: true
      {{- /*
      Mounted rather than injected as an env var, which is fixed at container
      start: kubelet rewrites a mounted Secret in place, so a rotated
      credential reaches the running process without a pod roll in either
      deploy lane. One key, not the whole Secret -- keycloak-client-secrets
      holds every service's credential.
      */}}
      volumes:
        - name: client-credential
          secret:
            secretName: {{ .Values.keycloak.existingSecret | quote }}
            items:
              - key: {{ .Values.keycloak.existingSecretKey | quote }}
                path: {{ .Values.keycloak.existingSecretKey | quote }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

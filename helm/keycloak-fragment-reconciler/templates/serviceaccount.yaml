{{/*
Unconditional, and with no `create` toggle: the Deployment runs as it and every
app binds its own client credential to it by name, so a site that switched it
off would break every installed fragment. The token is mounted because reading
fragments from the API server is the whole job.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "keycloak-fragment-reconciler.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keycloak-fragment-reconciler.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}

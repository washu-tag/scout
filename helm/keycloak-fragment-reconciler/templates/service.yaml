{{/* Health and metrics only. No ingress: nothing outside the cluster needs it. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "reconciler.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "reconciler.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "reconciler.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP

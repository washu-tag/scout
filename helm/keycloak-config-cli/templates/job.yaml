{{- /*
Break-glass only. The app manager is the realm's only writer (ADR 0037), so
this Job does not render unless applyRealm is explicitly turned on. Leaving it
here rather than deleting it is the point: sole-writer is a policy, and an
operator whose reconciler is broken needs the core realm back without editing
a chart.

Turning it on also restores the old readiness semantics for free, because it is
a Helm hook -- `helm --wait` and a Flux HelmRelease both wait for it.

The gate is a string comparison, not a truth test, and that is not fussiness:
values reach this chart as strings from both lanes (Flux cluster-vars, and
Ansible's own template output), and every non-empty string is truthy in helm --
so a plain `if` renders this Job for the literal "false" and quietly leaves two
writers on the realm. Same reason the realm gates on `eq "true"`.
*/}}
{{- if eq (.Values.applyRealm | toString | lower) "true" }}
---
apiVersion: batch/v1
kind: Job
metadata:
  {{- with .Values.annotations }}
  annotations:
  {{- toYaml . | nindent 4 }}
  {{- end }}
  name: {{ template "keycloak-config-cli.fullname" . }}
  labels:
  {{- include "keycloak-config-cli.labels" . | nindent 4 }}
spec:
  backoffLimit: {{ .Values.backoffLimit }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
      {{- . | nindent 8 }}
      {{- end }}
      labels:
      {{- include "keycloak-config-cli.selectorLabels" . | nindent 8 }}
      {{- with .Values.podLabels }}
    {{- toYaml . | nindent 8 }}
    {{- end }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      containers:
        - name: keycloak-config-cli
          image: "{{ .Values.image.repository }}:{{ tpl .Values.image.tag $ }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.resources }}
          resources:
          {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- range $name, $value := .Values.env }}
            - name: {{ $name | quote }}
              value: {{ tpl $value $ | quote }}
            {{- end }}
            {{- range $name, $value := .Values.secrets }}
            - name: {{ $name | quote }}
              valueFrom:
                secretKeyRef:
                  name: "{{ template "keycloak-config-cli.fullname" $ }}"
                  key: {{ $name | quote }}
            {{- end }}
            {{- if and .Values.existingSecret .Values.existingSecretKey }}
            - name: "KEYCLOAK_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: "{{ tpl .Values.existingSecret . }}"
                  key: "{{ .Values.existingSecretKey }}"
            {{- end }}
            {{- if .Values.existingSecrets }}
            {{- range .Values.existingSecrets }}
            - name: {{ .envVar }}
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key }}
            {{- end }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
          {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
          {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
            {{- with .Values.extraVolumeMounts }}
            {{- tpl . $ | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: "{{ include "keycloak-config-cli.realmConfigMap" . }}"
            defaultMode: 0555
        {{- with .Values.extraVolumes }}
        {{- tpl . $ | nindent 8 }}
        {{- end }}
      {{- with .Values.serviceAccount }}
      serviceAccountName: "{{ tpl . $ }}"
      {{- end }}
      {{- with .Values.securityContext }}
      securityContext:
      {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

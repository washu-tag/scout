---
fullnameOverride: ''
nameOverride: ''

image:
  repository: docker.io/adorsys/keycloak-config-cli
  tag: 'v{{ .Chart.AppVersion }}-11.0.3'
  pullPolicy: IfNotPresent
  ## Optionally specify an array of imagePullSecrets.
  ## Secrets must be manually created in the namespace.
  ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  ##
  pullSecrets: []
  # - myRegistryKeySecretName

# Count of re(!)tries. A value of 2 means 3 tries in total.
backoffLimit: 1

# annotations of the Job. Define helm post hook here
annotations:
  'helm.sh/hook': 'post-install,post-upgrade,post-rollback'
  'helm.sh/hook-delete-policy': 'hook-succeeded,before-hook-creation'
  'helm.sh/hook-weight': '5'

labels: {}

resources:
  {}
  # limits:
  #   cpu: "100m"
  #   memory: "1024Mi"
  # requests:
  #   cpu: "100m"
#   memory: "1024Mi"

env:
  KEYCLOAK_URL: http://keycloak:8080
  KEYCLOAK_USER: admin
  IMPORT_PATH: /config/

# Pulled into the Job env in bulk (e.g. a client-secrets Secret whose keys are the
# $(env:...) names the realm var-substitutes).
envFrom: []

# --- Scout realm config (consumed by files/scout-realm.json) ---
# Values arrive as strings via Flux cluster-vars, so the realm gates on eq "true".
# The realm's own name, and its displayName titlecased from it. Launchpad hardcodes
# `scout`, so this is not really a site knob -- it is a value so that the lane which
# does carry it as one (Ansible's keycloak_realm_name) can pass it rather than
# disagree with the realm silently.
realmName: scout
# Seconds. ssoSession drives the realm's ssoSessionIdleTimeout + ssoSessionMaxLifespan
# (the Scout-wide 8h session, matched by the oauth2-proxy cookie); accessToken is the
# end-user access token, set explicitly so consumers that must stay in step with it
# can read one value. The two client-level ones default to ssoSession, so raising the
# session raises them with it; trinoServiceToken is deliberately independent (ADR
# 0022 service principals, ~4h, keeping token minting off the per-query hot path).
lifespans:
  ssoSession: '28800'
  accessToken: '300'
  temporalToken: ''
  minioToken: ''
  trinoServiceToken: '14400'
# Provision the XNAT client, role, and group binding.
enableXnat: 'false'
# Identity providers (creds come via envFrom; see required-secrets.md). The browser
# flow redirects to defaultProvider.
github:
  enabled: 'true'
microsoft:
  enabled: 'false'
defaultProvider: github
# Comma-separated full ALB-OIDC hostnames the oauth2-proxy client accepts
# /oauth2/idpresponse from (AWS sites, e.g. superset.<domain>). On-prem uses the
# oauth2-proxy callback the realm builds from server_hostname, so this can stay empty.
albOidcHosts: ''
# Realm SMTP (dev default is mailhog; a real site overrides host + from).
smtp:
  host: mailhog-service.mailhog
  port: '1025'
  from: example@example.com
  fromDisplayName: Scout
  replyTo: ''
  replyToDisplayName: ''
  envelopeFrom: ''
  auth: ''
  ssl: 'false'
  starttls: 'false'
  debug: 'false'
# Terms-of-use localization overrides (realm messageBundles.en).
termsLocalizations: {}
# Trino AuthZ user-profile attributes (OPA data-access dimensions). The realm reads
# display_name/options/max_length/value_pattern per attribute; column is the OPA
# side of the same map (unused here). options set per site turns an attribute into a
# validated pick-list.
trinoAttributeFilters:
  allowed_facilities:
    column: sending_facility

secrets: {}
#  KEYCLOAK_PASSWORD:

# Specifies an existing secret to be used for the admin password
existingSecret: ''

# The key in the existing secret that stores the password
existingSecretKey: password

securityContext: {}
containerSecurityContext: {}

## Additional pod labels
## ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

## Extra Annotations to be added to pod
podAnnotations: {}
# New section for existing secrets
existingSecrets:
# - name: my-existing-secret
#   key: my-secret-key
#   envVar: MY_ENV_VAR

# The realm documents this chart publishes into realmConfigMap. The data key is
# the name here plus `.json`, and readers find it by that key (the app manager
# by `scout-realm.json`), so the key name is a contract, not a knob.
#
# `file` is a path in the chart, rendered through `tpl`; the Scout realm below
# is what both lanes install, and files/scout-realm.json is the only copy of it.
# `inline` is a structure, for a test or a one-off. Adding either here merges
# with this default and imports both; to replace it, set `scout-realm: null`
# alongside.
config:
  scout-realm:
    file: files/scout-realm.json

# Scout addition, replacing upstream's existingConfigSecret/existingConfigMap.
# The realm document names its credentials as `$(env:...)` and carries none of
# them, so it does not have to be a Secret -- and as a ConfigMap the app manager
# can read it by name (ADR 0037). Both lanes publish to this one name because
# that is what the reconciler reads; only who writes it differs.
realmConfigMap: keycloak-base-realm

# Add additional volumes, e.g. for custom secrets
extraVolumes: ''

# Add additional volumes mounts, e. g. for custom secrets
extraVolumeMounts: ''

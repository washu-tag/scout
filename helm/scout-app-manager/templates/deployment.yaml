---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "appmanager.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "appmanager.labels" . | nindent 4 }}
spec:
  # Exactly one. The reconciler drives config-cli Jobs against a single realm;
  # a second replica would be a second writer.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "appmanager.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "appmanager.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "appmanager.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: reconciler
          image: '{{ .Values.image.repository }}:{{ .Values.image.tag }}'
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: APP_MANAGER_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: APP_MANAGER_FRAGMENT_DIR
              value: /fragments
            - name: APP_MANAGER_BASE_REALM
              value: /base-realm/{{ .Values.manager.baseRealmKey }}
            - name: APP_MANAGER_DOMAIN
              value: {{ required "manager.domain is required" .Values.manager.domain | quote }}
            - name: APP_MANAGER_APPLY_MODE
              value: {{ .Values.manager.applyMode | quote }}
            - name: APP_MANAGER_KEYCLOAK_URL
              value: {{ .Values.manager.keycloakUrl | quote }}
            - name: APP_MANAGER_SIGNOUT_URL
              value: {{ .Values.manager.signoutUrl | quote }}
            - name: APP_MANAGER_ADMIN_SECRET
              value: {{ .Values.manager.adminSecret | quote }}
            - name: APP_MANAGER_COMPOSED_SECRET
              value: {{ .Values.manager.composedSecret | quote }}
            - name: APP_MANAGER_CONFIG_CLI_IMAGE
              value: {{ .Values.manager.configCliImage | quote }}
            - name: APP_MANAGER_STATUS_CONFIGMAP
              value: {{ include "appmanager.fullname" . }}-status
            - name: APP_MANAGER_RESYNC_SECONDS
              value: {{ .Values.manager.resyncSeconds | quote }}
            - name: APP_MANAGER_DEBOUNCE_SECONDS
              value: {{ .Values.manager.debounceSeconds | quote }}
            - name: APP_MANAGER_RETRACTION_GRACE_SECONDS
              value: {{ .Values.manager.retractionGraceSeconds | quote }}
            - name: APP_MANAGER_JOB_TIMEOUT_SECONDS
              value: {{ .Values.manager.jobTimeoutSeconds | quote }}
            - name: APP_MANAGER_JOB_TTL_SECONDS
              value: {{ .Values.manager.jobTtlSeconds | quote }}
            - name: APP_MANAGER_LOG_LEVEL
              value: {{ .Values.manager.logLevel | quote }}
            - name: APP_MANAGER_PORT
              value: '8080'
            - name: APP_MANAGER_RELOAD_PORT
              value: '8082'
          ports:
            - name: http
              containerPort: 8080
          # Liveness is the process, readiness is the realm.
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: fragments
              mountPath: /fragments
              readOnly: true
            - name: base-realm
              mountPath: /base-realm
              readOnly: true
        # Discovery is the sidecar's job, so the reconciler itself never needs
        # a cluster-wide watch in its own code (ADR 0034's pattern).
        - name: discovery
          image: '{{ .Values.discovery.image.repository }}:{{ .Values.discovery.image.tag }}'
          imagePullPolicy: {{ .Values.discovery.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: LABEL
              value: {{ .Values.discovery.label | quote }}
            - name: LABEL_VALUE
              value: {{ .Values.discovery.labelValue | quote }}
            - name: FOLDER
              value: /fragments
            - name: NAMESPACE
              value: {{ .Values.discovery.namespace | quote }}
            - name: RESOURCE
              value: configmap
            - name: METHOD
              value: WATCH
            # The sidecar's own health server defaults to 8080, which the
            # reconciler already owns in this pod's network namespace. Left
            # alone it logs "Address in use" and runs without a health probe.
            - name: HEALTH_PORT
              value: '8081'
            # Provenance has to survive the trip to disk: a fragment is
            # identified by the namespace and name of its ConfigMap.
            - name: UNIQUE_FILENAMES
              value: 'true'
            # Push-notify: called after the sidecar writes. Loopback only,
            # because it triggers a realm write.
            - name: REQ_URL
              value: http://127.0.0.1:8082/reload
            - name: REQ_METHOD
              value: POST
            # Fire on the initial sync too, not just on later changes.
            - name: REQ_SKIP_INIT
              value: 'false'
            - name: REQ_TIMEOUT
              value: '10'
            - name: REQ_RETRY_TOTAL
              value: '5'
          livenessProbe:
            httpGet: {path: /healthz, port: 8081}
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.discovery.resources | nindent 12 }}
          volumeMounts:
            - name: fragments
              mountPath: /fragments
      volumes:
        - name: fragments
          emptyDir:
            sizeLimit: 10Mi
        - name: base-realm
          secret:
            secretName: {{ .Values.manager.baseRealmSecret }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

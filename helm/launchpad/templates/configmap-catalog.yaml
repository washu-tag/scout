# The launchpad's own chips, as a catalog document (ADR 0034). Delivered by a
# direct volume mount rather than sidecar discovery: the kubelet guarantees it
# exists before the app starts, so the floor when discovery is broken is
# "core page, optional chips stale or missing" — never an empty page.
#
# Only what the launchpad itself owns lives here: the core and admin section
# definitions, the chips that point at platform-wide services (Analytics,
# Notebooks), and the launchpad's own Users console. Every other chip ships
# with its owning component as a labelled ConfigMap in that component's
# namespace — the same schema, discovered by the sidecar.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "launchpad.fullname" . }}-catalog
  labels:
    {{- include "launchpad.labels" . | nindent 4 }}
data:
  core.yaml: |
    apiVersion: scout.washu.edu/v1alpha1
    groups:
      - id: core
        title: Core Services
        description: Essential tools for data exploration and analysis
        icon: cube
        weight: 10
        layout: cards
        footerLink:
          text: New to Scout? Check out our documentation
          url: {{ .Values.docsUrl | default "https://washu-scout.readthedocs.io/en/latest" | quote }}
      - id: admin
        title: Admin Tools
        description: Infrastructure and user management
        icon: cog
        weight: 30
        layout: tiles
        width: half
        audience: admin
    chips:
      - id: analytics
        title: Analytics
        description: Visual dashboards, business intelligence, and SQL queries
        icon: chart-bar
        tone: amber
        link: { subdomain: superset }
        group: core
        weight: 20
      - id: notebooks
        title: Notebooks
        description: Interactive data analysis and coding with Jupyter
        icon: python
        tone: indigo
        link: { subdomain: jupyter }
        group: core
        weight: 30
      - id: admin-users
        title: Users
        description: Approve requests and manage user access
        icon: clipboard-check
        tone: indigo
        link: { path: /admin/users }
        group: admin
        weight: 10
        audience: admin

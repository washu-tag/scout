apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "launchpad.fullname" . }}
  labels:
    {{- include "launchpad.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "launchpad.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "launchpad.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "launchpad.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          env:
            {{- if .Values.auth.keycloak.enabled }}
            - name: KEYCLOAK_CLIENT_ID
              value: {{ .Values.auth.keycloak.clientId | quote }}
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.keycloak.existingSecret | default (printf "%s-keycloak-secret" (include "launchpad.fullname" .)) }}
                  key: {{ .Values.auth.keycloak.existingSecretKey | default "client-secret" }}
            - name: KEYCLOAK_ISSUER
              value: {{ .Values.auth.keycloak.issuer | quote }}
            - name: NEXTAUTH_URL
              value: {{ .Values.auth.nextAuthUrl | quote }}
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingNextAuthSecret | default (printf "%s-nextauth-secret" (include "launchpad.fullname" .)) }}
                  key: {{ .Values.auth.existingNextAuthSecretKey | default "secret" }}
            - name: NEXTAUTH_SESSION_MAX_AGE
              value: {{ .Values.auth.sessionMaxAge | quote }}
            {{- if .Values.auth.oauth2ProxySignOutUrl }}
            - name: OAUTH2_PROXY_SIGN_OUT_URL
              value: {{ .Values.auth.oauth2ProxySignOutUrl | quote }}
            {{- end }}
            {{- end }}
            - name: LAUNCHPAD_CATALOG_DIRS
              value: "/app/config/catalog{{ if .Values.catalog.discovery.enabled }}:/app/config/discovered{{ end }}"
            {{- if .Values.scoutEnv }}
            - name: SCOUT_ENV
              value: {{ .Values.scoutEnv | quote }}
            {{- end }}
            {{- if .Values.deployerName }}
            - name: DEPLOYER_NAME
              value: {{ .Values.deployerName | quote }}
            {{- end }}
            {{- if .Values.docsUrl }}
            - name: SCOUT_DOCS_URL
              value: {{ .Values.docsUrl | quote }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: catalog
              mountPath: /app/config/catalog
              readOnly: true
            {{- if .Values.catalog.discovery.enabled }}
            - name: discovered
              mountPath: /app/config/discovered
              readOnly: true
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- if .Values.catalog.discovery.enabled }}
        - name: catalog-sidecar
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: '{{ .Values.catalog.discovery.image.repository }}:{{ .Values.catalog.discovery.image.tag }}'
          imagePullPolicy: {{ .Values.catalog.discovery.image.pullPolicy }}
          env:
            # The discovery label is the publisher/sidecar contract (ADR
            # 0034) — the same fixed string appears in the scout_common
            # launchpad_catalog task and the authoring docs. Changing it is
            # an API migration, not a configuration.
            - name: LABEL
              value: launchpad.scout.xnat.org/catalog
            - name: LABEL_VALUE
              value: 'true'
            - name: FOLDER
              value: /app/config/discovered
            - name: NAMESPACE
              value: {{ .Values.catalog.discovery.namespace | quote }}
            - name: RESOURCE
              value: configmap
            - name: UNIQUE_FILENAMES
              value: 'true'
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
          resources:
            {{- toYaml .Values.catalog.discovery.resources | nindent 12 }}
          volumeMounts:
            - name: discovered
              mountPath: /app/config/discovered
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
        {{- end }}
      volumes:
        - name: catalog
          configMap:
            name: {{ include "launchpad.fullname" . }}-catalog
        {{- if .Values.catalog.discovery.enabled }}
        - name: discovered
          emptyDir:
            sizeLimit: {{ .Values.catalog.discovery.sizeLimit }}
        - name: kube-api-access
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3607
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

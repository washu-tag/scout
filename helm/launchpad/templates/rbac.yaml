{{- if .Values.catalog.discovery.enabled }}
# The catalog sidecar watches labelled ConfigMaps across namespaces
# (ADR 0034). ServiceAccounts are pod-scoped, so this grant is shared by both
# containers. It is authored here — rather than inherited from an upstream
# chart's defaults, as Grafana's equivalent grant is — so the cluster-wide
# read stays visible and reviewable.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "launchpad.fullname" . }}-catalog-reader
  labels:
    {{- include "launchpad.labels" . | nindent 4 }}
rules:
  - apiGroups: ['']
    resources: ['configmaps']
    verbs: ['get', 'list', 'watch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "launchpad.fullname" . }}-catalog-reader
  labels:
    {{- include "launchpad.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "launchpad.fullname" . }}-catalog-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "launchpad.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

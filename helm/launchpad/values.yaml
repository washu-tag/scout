# Default values for launchpad.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

# Runtime catalog discovery (ADR 0034): a kiwigrid/k8s-sidecar container
# watches ConfigMaps labelled `launchpad.scout.xnat.org/catalog: "true"` and
# materializes their data keys into a shared emptyDir the app reads alongside
# the mounted core catalog. The label is part of the catalog contract — fixed
# in the deployment template, the scout_common publisher task, and the user
# docs together, deliberately not a value. Requires the chart's ClusterRole
# (templates/rbac.yaml): the pod's ServiceAccount gains cluster-wide
# ConfigMap read.
catalog:
  discovery:
    enabled: true
    # ALL, or a comma-separated namespace list for a tighter posture.
    namespace: ALL
    image:
      repository: quay.io/kiwigrid/k8s-sidecar
      # Placeholder, matching the app image convention: Ansible injects the
      # pinned, Renovate-monitored version from group_vars/all/versions.yaml
      # (launchpad_sidecar_image_tag, ADR 0015).
      tag: latest
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
    sizeLimit: 10Mi

# Environment label shown next to the Scout brand (e.g. "synthetic", "production").
# Empty string falls back to "local" in the UI.
scoutEnv: ''

# Name of the institution/organization running this deployment, shown in the
# footer copyright line. Empty string hides the copyright line.
deployerName: ''

# Base URL for Scout documentation links (no trailing slash). Empty string
# falls back to the latest published docs.
docsUrl: ''

image:
  repository: ghcr.io/washu-tag/launchpad
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ''

podAnnotations: {}
podLabels: {}

podSecurityContext:
  {}
  # fsGroup: 2000

securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: traefik
  annotations:
    {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    []
    #- host: chart-example.local
    #  paths:
    #    - path: /
    #      pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# Public (unauthenticated) route for /favicon.ico. The launchpad is behind the
# oauth2-proxy ForwardAuth gate, which blocks /favicon.ico for logged-out
# visitors so their browser tab shows no icon (issue #557). When enabled, an
# exact-path annotated Ingress serves just the favicon with security-headers but
# WITHOUT the auth middleware. Keep the match exact and host-scoped.
faviconPublicRoute:
  enabled: false
  # Host to match. Empty falls back to the first ingress host.
  host: ''
  # Must outrank the launchpad PathPrefix(`/`) router.
  priority: 1000
  # Cross-namespace ref is fine from an Ingress annotation (unlike an
  # IngressRoute); this is the same middleware the launchpad Ingress uses.
  securityHeadersMiddleware:
    name: security-headers
    namespace: kube-system

resources:
  {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe:
  httpGet:
    path: /
    port: 3000
readinessProbe:
  httpGet:
    path: /
    port: 3000

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# Authentication configuration
auth:
  keycloak:
    enabled: true
    clientId: 'launchpad-client'
    clientSecret: 'changeme'
    # When set, the chart skips creating the keycloak Secret and reads the OIDC
    # client secret from this existing Secret instead (GitOps: seeded by ESO).
    existingSecret: ''
    existingSecretKey: client-secret
    issuer: 'https://keycloak.example.com/auth/realms/scout'
  nextAuthUrl: 'https://launchpad.example.com'
  nextAuthSecret: 'changeme'
  # When set, the chart skips creating the next-auth Secret and reads it from
  # this existing Secret instead.
  existingNextAuthSecret: ''
  existingNextAuthSecretKey: secret
  # next-auth session lifetime (seconds). Must match the Keycloak SSO session
  # lifetime so the cookie can't outlive the refresh token it carries (8h).
  sessionMaxAge: 28800
  oauth2ProxySignOutUrl: 'https://launchpad.example.com/oauth2/sign_out'

# Additional environment variables
env: []

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hl7-transformer.fullname" . }}
  labels:
    {{- include "hl7-transformer.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "hl7-transformer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pod when mounted config content changes. The maps are subPath
        # mounts, which do NOT hot-reload, so without this a data-only change
        # (same chart version) would leave the pod on the stale map.
        checksum/modality-mapping: {{ include (print $.Template.BasePath "/modality-mapping-configmap.yaml") . | sha256sum }}
        {{- if .Values.sparkDefaults.enabled }}
        checksum/spark-defaults: {{ include (print $.Template.BasePath "/spark-defaults-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "hl7-transformer.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "hl7-transformer.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.image.args }}
          args: 
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.ports }}
          ports:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: modality-mapping
              mountPath: /config/modality_mapping_codes.csv
              subPath: modality_mapping_codes.csv
              readOnly: true
            {{- if .Values.sparkDefaults.enabled }}
            - name: spark-defaults
              mountPath: /opt/spark/conf/spark-defaults.conf
              subPath: spark-defaults.conf
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- with .Values.env }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
            - name: SPARK_EXECUTOR_MEMORY
              value: "{{ .Values.spark.executor.memory }}"
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}

      volumes:
        - name: modality-mapping
          configMap:
            name: {{ include "hl7-transformer.fullname" . }}-modality-mapping
        {{- if .Values.sparkDefaults.enabled }}
        - name: spark-defaults
          configMap:
            name: {{ include "hl7-transformer.fullname" . }}-spark-defaults
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{- $host := include "forgejo.host" . }}
{{- $db := .Values.database }}
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-scout-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "forgejo.labels" . | nindent 4 }}
type: Opaque
stringData:
  server: |
    DOMAIN={{ $host }}
    ROOT_URL=https://{{ $host }}/
  database: |
    DB_TYPE=postgres
    HOST={{ required "database.host is required" $db.host }}:{{ $db.port }}
    NAME={{ $db.name }}
    USER={{ $db.user }}
    SSL_MODE={{ $db.sslMode }}
  {{- with .Values.packageStorage }}
  {{- if .enabled }}
  storage.packages: |
    STORAGE_TYPE=minio
    MINIO_ENDPOINT={{ required "packageStorage.endpoint is required" .endpoint }}
    MINIO_BUCKET={{ .bucket }}
    MINIO_ACCESS_KEY_ID={{ required "packageStorage.accessKey is required" .accessKey }}
    MINIO_SECRET_ACCESS_KEY={{ required "packageStorage.secretKey is required" .secretKey }}
    MINIO_USE_SSL={{ .useSSL }}
  {{- end }}
  {{- end }}

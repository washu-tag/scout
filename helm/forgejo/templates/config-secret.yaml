{{- $host := include "forgejo.host" . }}
{{- $db := .Values.database }}
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-scout-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "forgejo.labels" . | nindent 4 }}
type: Opaque
stringData:
  server: |
    DOMAIN={{ $host }}
    ROOT_URL=https://{{ $host }}/
  database: |
    DB_TYPE=postgres
    HOST={{ required "database.host is required" $db.host }}:{{ $db.port }}
    NAME={{ $db.name }}
    USER={{ $db.user }}
    SSL_MODE={{ $db.sslMode }}

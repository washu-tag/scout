# Everything below is bundled inside the upstream
# quay.io/jupyter/scipy-notebook base image (or vendored inside its
# dependencies' assets, including pip's), not code we write. There is no fixed
# release to bump to and no rebuilt base adopting the fixes yet. Recurring
# linux-libc-dev kernel-header CVEs are handled separately, by package, in
# .trivyignore.rego — not enumerated here. Revisit when a newer
# scipy-notebook base ships these fixes.
vulnerabilities:
  # MathJax 2.7.9 ReDoS — vendored static asset inside the nbclassic package
  # (nbclassic/static/components/MathJax/). MathJax 2.x is end-of-life with no
  # 2.x fix (the fix is MathJax 3, which nbclassic does not ship), and the
  # classic-notebook UI it serves is not Scout's interface (JupyterLab is).
  - id: CVE-2023-39663 # mathjax 2.7.9 (vendored in nbclassic)
  # underscore.js ReDoS — vendored static asset inside the nbclassic package
  # (nbclassic/static/components/underscore/). The fix (1.13.8) exists upstream
  # in underscore.js but cannot be delivered into this vendored JS copy from
  # our layer without patching base contents; bumping nbclassic does not
  # re-vendor it.
  - id: CVE-2026-27601 # underscore 1.13.7 -> 1.13.8 (vendored in nbclassic)
  # setuptools + msgpack flagged from pip's bundled install-time deps
  # (site-packages/pip/_vendor/vendor.txt), surfaced only on a fresh full
  # rebuild. pip is required for the JupyterLab UX (users pip-install in
  # notebooks), so it cannot be dropped, and the vendored copies are not
  # independently bumpable (the real top-level msgpack is already 1.2.1). Not
  # runtime app deps. Drop when a pip release re-vendors the fixes.
  - id: CVE-2025-47273 # setuptools 70.3.0 (vendored in pip)
  - id: GHSA-6v7p-g79w-8964 # msgpack 1.1.2 (vendored in pip)
  # pip's embedded SBOM reports this vendor without a filesystem path.
  # Keep the application urllib3 floor in the Dockerfile at >=2.8.0.
  - id: CVE-2026-97687
    purls:
      - pkg:pypi/urllib3@2.7.0
    expired_at: 2026-12-01
    statement: >-
      pip 26.2.2 still vendors urllib3 2.7.0. Scout uses an HTTPS package index,
      not the advisory's separately configured HTTPS forwarding proxy.
      Accept residual risk for user-supplied proxy settings until pip re-vendors.
  - id: CVE-2026-97689
    purls:
      - pkg:pypi/urllib3@2.7.0
    expired_at: 2026-12-01
    statement: >-
      pip 26.2.2 still vendors urllib3 2.7.0. A malicious package server can exhaust
      a pip process through an unbounded chunk-size line. Accept this install-time
      DoS risk temporarily; remove when released pip vendors urllib3 >=2.8.0.
  - id: CVE-2026-114613
    purls:
      - pkg:pypi/msgpack@1.1.2
    expired_at: 2026-12-01
    statement: >-
      msgpack 1.1.2 vendored in pip 26.2.2, used only to read pip's own HTTP
      cache. pip 26.3 vendors msgpack 1.2.4 but is not on conda-forge yet; raise
      the pip floor in the Dockerfile and remove this when it is.

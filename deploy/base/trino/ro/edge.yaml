# Per-mode storage/identity for trino-ro, merged into the HelmRelease via
# valuesFrom (ADR 0035). service_mode picks one by name; both ship, the unused
# one is inert. Each carries the full catalog + envFrom so the merge is a clean
# override (Flux merges valuesFrom under inline spec.values). trino-authz-env
# (keystore + internal-comm) stays in both modes; only the S3 creds differ.
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-ro-edge-on-prem
  namespace: '${scout_analytics_namespace}'
data:
  # MinIO: path-style + endpoint, creds from trino-s3 via Trino's $${ENV:VAR}.
  values.yaml: |
    envFrom:
      - secretRef:
          name: trino-s3
      - secretRef:
          name: trino-authz-env
    catalogs:
      delta: |
        connector.name=delta_lake
        hive.metastore.uri=${hive_metastore_endpoint_readonly}
        delta.security=READ_ONLY
        fs.native-s3.enabled=true
        s3.region=${s3_region}
        s3.aws-access-key=$${ENV:S3_ACCESS_KEY}
        s3.aws-secret-key=$${ENV:S3_SECRET_KEY}
        s3.endpoint=${s3_endpoint}
        s3.path-style-access=${s3_path_style_access}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-ro-edge-aws
  namespace: '${scout_analytics_namespace}'
data:
  # IRSA lake-reader SA + S3 default endpoint (no MinIO endpoint/keys); path-style
  # off. trino-authz-env still injected; trino-s3 dropped (credentials via IRSA).
  values.yaml: |
    serviceAccount:
      create: true
      annotations:
        eks.amazonaws.com/role-arn: '${lake_reader_role_arn}'
    envFrom:
      - secretRef:
          name: trino-authz-env
    catalogs:
      delta: |
        connector.name=delta_lake
        hive.metastore.uri=${hive_metastore_endpoint_readonly}
        delta.security=READ_ONLY
        fs.native-s3.enabled=true
        s3.region=${s3_region}
        s3.path-style-access=${s3_path_style_access}

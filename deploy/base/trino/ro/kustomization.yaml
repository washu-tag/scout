apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - resources.yaml
  # Per-mode edge ConfigMaps (both modes; the HR selects one via service_mode).
  - edge.yaml
# Config shared by trino-ro and trino-rw (metrics, JVM truststore) so it can't drift.
components:
  - ../_shared-metrics
  - ../_shared-jvm-trust

# Scout-owned OCI chart (helm/hive-metastore, published to GHCR). Namespaced
# HelmRepository of type oci; both metastore releases pull the same chart.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: scout-charts
  namespace: "${hive_namespace}"
spec:
  type: oci
  interval: 1h
  url: oci://ghcr.io/washu-tag/charts
---
# Write metastore — serves Trino RW + data ingestion (Delta writes). Connects to
# the hive DB as the `hive` owner over the -rw endpoint; S3 creds = lake-writer.
# On-prem path (S3_PATH_STYLE_ACCESS=true, MinIO endpoint); the aws_deployment
# IRSA ServiceAccount + WebIdentity HADOOP_OPTS branch is intentionally omitted.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hive-metastore
  namespace: "${hive_namespace}"
spec:
  interval: 30m
  # chart version stamped into the config artifact at publish (build-lane haul);
  # placeholder here until the stamping job lands (matches postgres base).
  chart:
    spec:
      chart: hive-metastore
      version: "0.0.0"
      sourceRef:
        kind: HelmRepository
        name: scout-charts
        namespace: "${hive_namespace}"
  values:
    replicaCount: 1
    image:
      repository: starburstdata/hive
      pullPolicy: IfNotPresent
      # hive_image_tag in versions.yaml (Renovate-tracked, regex-pinned to the
      # plain multi-arch tags). Overrides the chart appVersion.
      tag: "3.1.3-e.15"
    fullnameOverride: hive-metastore
    service:
      type: ClusterIP
      port: 9083
    ingress:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        cpu: 2
        memory: 2Gi
    readinessProbe:
      tcpSocket:
        port: 9083
      initialDelaySeconds: 5
      periodSeconds: 5
    livenessProbe:
      tcpSocket:
        port: 9083
      initialDelaySeconds: 5
      periodSeconds: 10
    env:
      - name: HIVE_METASTORE_DRIVER
        value: org.postgresql.Driver
      - name: HIVE_METASTORE_JDBC_URL
        value: "jdbc:postgresql://${postgres_cluster_name}-rw.${postgres_cluster_namespace}:5432/hive"
      - name: HIVE_METASTORE_USER
        value: hive
      - name: HIVE_METASTORE_WAREHOUSE_DIR
        value: "${delta_lake_path}"
      - name: S3_PATH_STYLE_ACCESS
        value: "true"
      - name: S3_ENDPOINT
        value: "${s3_endpoint}"
      - name: S3_ACCESS_KEY
        value: lake-writer
      - name: REGION
        value: "${s3_region}"
      - name: HIVE_METASTORE_USERS_IN_ADMIN_ROLE
        value: admin
      # All of these empty values must be present (image entrypoint requirement).
      - name: GOOGLE_CLOUD_KEY_FILE_PATH
        value: ""
      - name: AZURE_ADL_CLIENT_ID
        value: ""
      - name: AZURE_ADL_CREDENTIAL
        value: ""
      - name: AZURE_ADL_REFRESH_URL
        value: ""
      - name: AZURE_ABFS_STORAGE_ACCOUNT
        value: ""
      - name: AZURE_ABFS_ACCESS_KEY
        value: ""
      - name: AZURE_WASB_STORAGE_ACCOUNT
        value: ""
      - name: AZURE_ABFS_OAUTH
        value: ""
      - name: AZURE_ABFS_OAUTH_TOKEN_PROVIDER
        value: ""
      - name: AZURE_ABFS_OAUTH_CLIENT_ID
        value: ""
      - name: AZURE_ABFS_OAUTH_SECRET
        value: ""
      - name: AZURE_ABFS_OAUTH_ENDPOINT
        value: ""
      - name: AZURE_WASB_ACCESS_KEY
        value: ""
    # S3_SECRET_KEY (+ HIVE_METASTORE_PASSWORD) sourced from the fixed-name secret;
    # seeded by CI/site (Phase 3) or ESO (Phase 4), never committed.
    envFrom:
      - secretRef:
          name: hive-metastore-secret
---
# Readonly metastore — serves the user-facing (read-only) Trino. Same hive DB,
# but connects as the SELECT-only `hive_readonly` role; S3 creds = lake-reader.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hive-metastore-readonly
  namespace: "${hive_namespace}"
spec:
  interval: 30m
  chart:
    spec:
      chart: hive-metastore
      version: "0.0.0"
      sourceRef:
        kind: HelmRepository
        name: scout-charts
        namespace: "${hive_namespace}"
  values:
    replicaCount: 1
    image:
      repository: starburstdata/hive
      pullPolicy: IfNotPresent
      tag: "3.1.3-e.15"
    fullnameOverride: hive-metastore-readonly
    service:
      type: ClusterIP
      port: 9083
    ingress:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        cpu: 2
        memory: 2Gi
    readinessProbe:
      tcpSocket:
        port: 9083
      initialDelaySeconds: 5
      periodSeconds: 5
    livenessProbe:
      tcpSocket:
        port: 9083
      initialDelaySeconds: 5
      periodSeconds: 10
    env:
      - name: HIVE_METASTORE_DRIVER
        value: org.postgresql.Driver
      - name: HIVE_METASTORE_JDBC_URL
        value: "jdbc:postgresql://${postgres_cluster_name}-rw.${postgres_cluster_namespace}:5432/hive"
      - name: HIVE_METASTORE_USER
        value: hive_readonly
      - name: HIVE_METASTORE_WAREHOUSE_DIR
        value: "${delta_lake_path}"
      - name: S3_PATH_STYLE_ACCESS
        value: "true"
      - name: S3_ENDPOINT
        value: "${s3_endpoint}"
      - name: S3_ACCESS_KEY
        value: lake-reader
      - name: REGION
        value: "${s3_region}"
      - name: HIVE_METASTORE_USERS_IN_ADMIN_ROLE
        value: admin
      # All of these empty values must be present (image entrypoint requirement).
      - name: GOOGLE_CLOUD_KEY_FILE_PATH
        value: ""
      - name: AZURE_ADL_CLIENT_ID
        value: ""
      - name: AZURE_ADL_CREDENTIAL
        value: ""
      - name: AZURE_ADL_REFRESH_URL
        value: ""
      - name: AZURE_ABFS_STORAGE_ACCOUNT
        value: ""
      - name: AZURE_ABFS_ACCESS_KEY
        value: ""
      - name: AZURE_WASB_STORAGE_ACCOUNT
        value: ""
      - name: AZURE_ABFS_OAUTH
        value: ""
      - name: AZURE_ABFS_OAUTH_TOKEN_PROVIDER
        value: ""
      - name: AZURE_ABFS_OAUTH_CLIENT_ID
        value: ""
      - name: AZURE_ABFS_OAUTH_SECRET
        value: ""
      - name: AZURE_ABFS_OAUTH_ENDPOINT
        value: ""
      - name: AZURE_WASB_ACCESS_KEY
        value: ""
    envFrom:
      - secretRef:
          name: hive-metastore-readonly-secret

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Flux target path. scout-charts HelmRepository and the edge ConfigMaps declared ONCE
# here, not in _base (both overlays build _base, which would emit them twice).
resources:
  - helmrepository.yaml
  - edge.yaml
  - overlays/write
  - overlays/readonly

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Aggregator (the Flux target path). The scout-charts HelmRepository is declared
# ONCE here (not in _base, which both overlays build — that would emit it twice
# and create a second owner). Overlays render the write + readonly HelmReleases.
resources:
  - helmrepository.yaml
  - overlays/write
  - overlays/readonly

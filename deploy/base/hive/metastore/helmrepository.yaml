# Scout-owned OCI chart (helm/hive-metastore, published to GHCR). Namespaced
# HelmRepository of type oci; both metastore releases pull the same chart.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: scout-charts
  namespace: '${hive_namespace}'
spec:
  type: oci
  interval: 1h
  url: oci://ghcr.io/washu-tag/charts

# Write metastore — serves Trino RW + data ingestion (Delta writes). Connects to
# the hive DB as the `hive` owner over the -rw endpoint; S3 creds = lake-writer.
# Mode-parameterized via cluster-vars (ADR 0035): on-prem sets s3_path_style_access=true
# + a MinIO endpoint/key; aws sets path-style=false, empty endpoint/key, and
# irsa_role_prefix-hive-metastore for the IRSA ServiceAccount; `mode` adds aws S3A creds + SSE.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hive-metastore
  namespace: '${hive_namespace}'
spec:
  interval: 30m
  # chart version stamped into the config artifact at publish (build-lane haul);
  # placeholder here until the stamping job lands (matches postgres base).
  chart:
    spec:
      chart: hive-metastore
      version: '0.0.0'
      sourceRef:
        kind: HelmRepository
        name: scout-charts
        namespace: '${hive_namespace}'
  values:
    replicaCount: 1
    mode: '${service_mode}'
    sseType: '${s3_sse_type:=NONE}'
    image:
      repository: starburstdata/hive
      pullPolicy: IfNotPresent
      # hive_image_tag in versions.yaml (Renovate-tracked, regex-pinned to the
      # plain multi-arch tags). Overrides the chart appVersion.
      # renovate: datasource=docker depName=starburstdata/hive versioning=regex:^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)(?<compatibility>-e\.)(?<build>\d+)$
      tag: '3.1.3-e.15'
    fullnameOverride: hive-metastore
    # The image's cacerts minus the anchors the compromised intermediates chain to (CVE-2026-91403),
    # mounted over the JDK's own; fails closed, including when an image bump moves the JDK path.
    initContainers:
      - name: jvm-trust
        image: '{{ include "hive-metastore.image" . }}'
        env:
          - name: CACERTS
            value: /opt/java/openjdk/lib/security/cacerts
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        command:
          - sh
          - -c
          - |
            set -eu
            jks="$(java -XshowSettings:properties -version 2>&1 | sed -n 's/^ *java.home = //p')/lib/security/cacerts"
            [ "$jks" = "$CACERTS" ] || { printf 'JDK cacerts is %s, not %s: drop this init if that JDK is fixed (Temurin 25.0.5+, 21.0.13+), else update CACERTS and the mount\n' "$jks" "$CACERTS" >&2; exit 1; }
            ks=/opt/jvm-trust/cacerts
            cp "$CACERTS" "$ks"
            bad() {
              out="$(keytool -list -v -keystore "$ks" -storepass changeit 2>&1)" || { printf '%s\n' "$out" >&2; return 1; }
              case "$out" in *"Alias name: "*"Owner: CN="*) ;; *) printf 'unexpected keytool output for %s\n%s\n' "$ks" "$out" >&2; return 1 ;; esac
              printf '%s\n' "$out" | while IFS= read -r l; do
                case "$l" in "Alias name: "*) a=$${l#Alias name: } ;;
                  "Owner: "*"emSign ECC Root CA - G3"*|"Owner: "*"AAA Certificate Services"*) printf '%s\n' "$a" ;; esac
              done
            }
            aliases="$(bad)"
            printf '%s\n' "$aliases" | while IFS= read -r a; do [ -z "$a" ] || keytool -delete -alias "$a" -keystore "$ks" -storepass changeit; done
            left="$(bad)"
            [ -z "$left" ] || { printf 'anchors still in %s: %s\n' "$ks" "$left" >&2; exit 1; }
        volumeMounts:
          - name: jvm-trust
            mountPath: /opt/jvm-trust
    volumes:
      - name: jvm-trust
        emptyDir: {}
    volumeMounts:
      - name: jvm-trust
        mountPath: /opt/java/openjdk/lib/security/cacerts
        subPath: cacerts
        readOnly: true
    # aws: IRSA SA via ${irsa_role_prefix}-hive-metastore. on-prem has no IRSA webhook, so the empty
    # role-arn annotation is inert and the SA just runs the pod.
    serviceAccount:
      create: true
      annotations:
        eks.amazonaws.com/role-arn: '${irsa_role_prefix}-hive-metastore'
    service:
      type: ClusterIP
      port: 9083
    ingress:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        cpu: 2
        memory: 2Gi
    readinessProbe:
      tcpSocket:
        port: 9083
      initialDelaySeconds: 5
      periodSeconds: 5
    livenessProbe:
      tcpSocket:
        port: 9083
      initialDelaySeconds: 5
      periodSeconds: 10
    # Chart appends the empty cloud-provider env stubs (opt-in; see helm/hive-metastore).
    cloudEnvStubs: true
    env:
      - name: HIVE_METASTORE_DRIVER
        value: org.postgresql.Driver
      - name: HIVE_METASTORE_JDBC_URL
        value: 'jdbc:postgresql://${postgres_host}:5432/hive'
      - name: HIVE_METASTORE_USER
        value: hive
      - name: HIVE_METASTORE_WAREHOUSE_DIR
        value: '${delta_lake_path}'
      - name: S3_PATH_STYLE_ACCESS
        value: '${s3_path_style_access}'
      - name: S3_ENDPOINT
        value: '${s3_endpoint}'
      - name: S3_ACCESS_KEY
        value: '${s3_lake_writer}'
      - name: REGION
        value: '${s3_region}'
      - name: HIVE_METASTORE_USERS_IN_ADMIN_ROLE
        value: admin
    # S3_SECRET_KEY (+ HIVE_METASTORE_PASSWORD) sourced from the fixed-name secret;
    # seeded by CI/site (Phase 3) or ESO (Phase 4), never committed.
    envFrom:
      - secretRef:
          name: hive-metastore-secret

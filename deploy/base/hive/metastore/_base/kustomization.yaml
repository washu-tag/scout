apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Shared metastore HelmRelease carrying the WRITE identity as the concrete default
# (name/fullnameOverride hive-metastore, HIVE_METASTORE_USER hive, S3_ACCESS_KEY
# ${s3_lake_writer}, envFrom hive-metastore-secret). The readonly overlay is the
# single ADR-visible diff. Built standalone by validate-deploy, so it is valid alone.
resources:
  - helmrelease.yaml

# Grants the SELECT-only hive_readonly role access to the hive database's tables.
# The hive + hive_readonly roles and the hive database are now provisioned
# declaratively by CNPG (postgres/cluster: spec.managed.roles + kind: Database);
# this Job carries only the table/default-privilege grants that managed.roles and
# the Database CR cannot express. ALTER DEFAULT PRIVILEGES FOR ROLE hive covers the
# tables the write metastore's schematool creates on first boot, so readonly works
# even though this runs before the metastore. Superuser-only now: it no longer
# creates roles, so the two hive password secrets are gone.
#
# hive/db dependsOn postgres-cluster, whose health gate waits for the hive Database
# (status.applied), which implies the hive role exists. hive_readonly is a non-owner
# managed role reconciled in the same pass and normally present by then; backoffLimit
# gives margin if the grant lands a moment before the role. Grants are idempotent.
apiVersion: batch/v1
kind: Job
metadata:
  name: hive-db-init
  namespace: '${hive_namespace}'
  annotations:
    # Immutable Job fields (spec.template) change when this SQL changes; force lets
    # Flux recreate the Job instead of erroring on the immutable-field update.
    kustomize.toolkit.fluxcd.io/force: 'Enabled'
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hive-db-init
    spec:
      restartPolicy: Never
      containers:
        - name: psql
          image: postgres:16
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: HOME
              value: /tmp
            - name: PGHOST
              value: '${postgres_cluster_name}-rw.${postgres_cluster_namespace}'
            - name: PGPORT
              value: '5432'
            - name: PGSSLMODE
              value: require
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: superuser-secret
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: superuser-secret
                  key: password
          command:
            - sh
            - -ec
            - |
              # SELECT-only grants for hive_readonly on the hive DB. Delta Lake keeps
              # its own txn log, so no lock-table access is needed.
              psql --no-psqlrc -v ON_ERROR_STOP=1 --dbname hive <<'SQL'
              GRANT CONNECT ON DATABASE hive TO hive_readonly;
              GRANT USAGE ON SCHEMA public TO hive_readonly;
              GRANT SELECT ON ALL TABLES IN SCHEMA public TO hive_readonly;
              GRANT SELECT ON ALL SEQUENCES IN SCHEMA public TO hive_readonly;
              ALTER DEFAULT PRIVILEGES FOR ROLE hive IN SCHEMA public GRANT SELECT ON TABLES TO hive_readonly;
              ALTER DEFAULT PRIVILEGES FOR ROLE hive IN SCHEMA public GRANT SELECT ON SEQUENCES TO hive_readonly;
              SQL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

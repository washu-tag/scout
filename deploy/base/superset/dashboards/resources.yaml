# Scout dashboards import (ADR 0030/0031). Scout-owned OCI chart `scout-dashboards`
# renders the bundles into a ConfigMap and runs a Helm-hook import Job that loads
# them into the running Superset via its CLI.
#
# The Job reuses the superset-server layer's fixed-name artifacts (hence dependsOn
# superset-server): envFrom `superset-env`, mounts `superset-config` (rendered
# superset_config.py with DB_CONNECTION_MUTATOR), reads REDIS_PASSWORD from
# `superset-valkey-auth`, mounts `trino-tls` to verify Trino's self-signed cert
# during dataset validation. Namespace ${scout_analytics_namespace} + scout-charts
# HelmRepository owned by scout-analytics-foundation (dependsOn), not redeclared.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: scout-dashboards
  namespace: '${scout_analytics_namespace}'
spec:
  interval: 30m
  # Import Job validates every dataset against Trino and can take a while.
  timeout: 15m
  # Scout-owned, CI-built chart (ADR 0030); not in versions.yaml, not Renovate-tracked
  # (self-reference). Placeholder version; concrete version stamped from the
  # build-lane haul at config-artifact publish.
  chart:
    spec:
      chart: scout-dashboards
      version: '0.0.0'
      sourceRef:
        kind: HelmRepository
        name: scout-charts
        namespace: '${scout_analytics_namespace}'
  values:
    # Superset image (same CLI + deps; build-lane-stamped, literal here, matches server).
    image:
      repository: ghcr.io/washu-tag/superset
      tag: '5.0.0'
    # AuthZ-enabled user-facing Trino HTTPS listener. DB_CONNECTION_MUTATOR (from
    # mounted superset-config) adds JWT + CA verify; scheme https selects it.
    trino:
      user: '${trino_user}'
      namespace: '${scout_analytics_namespace}'
      port: '${trino_https_port}'
      scheme: https
    supersetRelease:
      # Trino TLS bundle; Job mounts its ca.crt so DB_CONNECTION_MUTATOR verifies
      # Trino's self-signed cert during validation. Fixed name (CI/site), never in git.
      trinoCaSecret: trino-tls
    # bundles.enabled left to chart default (core + patients); a site overlay tunes
    # it (a list, not a scalar cluster-var).

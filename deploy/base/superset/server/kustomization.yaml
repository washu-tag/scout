apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The generated ConfigMap lands in the analytics namespace (idempotent on the
# resources.yaml objects that already set it); its ${scout_analytics_namespace} is
# resolved by Flux post-build substitution.
namespace: '${scout_analytics_namespace}'
resources:
  - resources.yaml
# Single-source the two Superset config .py the Ansible role also reads (the real
# files live here; ansible/roles/superset/files/* symlink to them). valuesFrom in
# the HelmRelease deep-sets them into configOverrides.trino_auth /
# configOverrides.prometheus_metrics. Both files are envsubst-clean (no $ tokens).
configMapGenerator:
  - name: superset-config-overrides
    files:
      - superset_trino_auth.py
      - superset_metrics.py
generatorOptions:
  # Fixed name: referenced by name in the HelmRelease valuesFrom. Flux re-reconciles
  # on ConfigMap content change, so a .py edit still rolls the release.
  disableNameSuffixHash: true

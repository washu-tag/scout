# Per-mode ingress + security-headers for Superset via valuesFrom (ADR 0035). on-prem:
# Traefik chart ingress + the oauth2-proxy/security-headers middleware chain (ADR 0012).
# aws: chart ingress off (the ALB serves), ADR-0012 headers app-side via Talisman.
apiVersion: v1
kind: ConfigMap
metadata:
  name: superset-edge-on-prem
  namespace: '${scout_analytics_namespace}'
data:
  values.yaml: |
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.middlewares: >-
          ${oauth2_proxy_namespace}-oauth2-proxy-error@kubernetescrd,
          ${oauth2_proxy_namespace}-oauth2-proxy-auth@kubernetescrd,
          kube-system-security-headers@kubernetescrd
      path: /
      hosts:
        - 'superset.${server_hostname}'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: superset-edge-aws
  namespace: '${scout_analytics_namespace}'
data:
  # ADR-0012 headers app-side via Talisman (ALB can't inject); force_https False (ALB
  # terminates TLS). NOTE: validate CSP on the running Superset (too-strict blanks the UI).
  values.yaml: |
    ingress:
      enabled: false
    configOverrides:
      security_headers: |
        TALISMAN_ENABLED = True
        TALISMAN_CONFIG = {
            "force_https": False,
            "strict_transport_security": True,
            "strict_transport_security_max_age": 31536000,
            "strict_transport_security_include_subdomains": True,
            "frame_options": "DENY",
            "content_security_policy": {
                "default-src": "'self'",
                "script-src": "'self' 'unsafe-inline' 'unsafe-eval'",
                "style-src": "'self' 'unsafe-inline'",
                "img-src": "'self' data: blob:",
                "font-src": "'self' data:",
                "connect-src": "'self' ws: wss: https://keycloak.${server_hostname}",
                "form-action": "'self' https://keycloak.${server_hostname}",
                "frame-ancestors": "'none'",
            },
        }
        HTTP_HEADERS = {
            "X-Content-Type-Options": "nosniff",
            "Permissions-Policy": "camera=(), microphone=(), geolocation=(), payment=()",
            "Cross-Origin-Opener-Policy": "same-origin",
        }

# Superset server (Scout Analytics BI, ADR 0030/0031). The upstream apache/superset
# chart, plus the Scout-owned side objects the Ansible role creates around it:
# the metadata-DB bootstrap Job, the StatsD-exporter Service + mapping, and the
# statsd/branding/OAuth wiring folded into the chart's superset_config.py.
#
# The ${scout_analytics_namespace} Namespace is owned solely by
# scout-analytics-foundation (a dependsOn), not declared here. The trino/keycloak
# dependsOn edges gate readiness, not namespace creation.
#
# Secret handling (never in git): the chart's own env Secret is disabled
# (secretEnv.create=false) so BOTH the server and the scout-dashboards import Job
# consume ONE externally-seeded, fixed-name Secret `superset-env` via envFrom.
# CI/site (Phase 3) or ESO (Phase 4) seeds it; it carries the full runtime env the
# chart's superset_config.py reads with os.getenv:
#   connection: DB_HOST/DB_PORT/DB_USER/DB_PASS/DB_NAME,
#               REDIS_HOST/REDIS_PORT/REDIS_USER/REDIS_PROTO/REDIS_DB/REDIS_CELERY_DB/REDIS_PASSWORD
#   secrets:    SUPERSET_SECRET_KEY, KEYCLOAK_SUPERSET_CLIENT_SECRET (user OAuth),
#               KEYCLOAK_SUPERSET_SVC_CLIENT_SECRET (Trino svc token)
#   svc config: KEYCLOAK_TOKEN_URL, KEYCLOAK_SUPERSET_SVC_CLIENT_ID, TRINO_CA_CERT
# Other fixed-name refs (seeded by CI/site, never in git):
#   superuser-secret        -- CNPG basic-auth (username/password); used by the DB Job
#   superset-valkey-auth    -- REDIS_PASSWORD; read by the dashboards import Job
#   trino-tls               -- cert-manager CA bundle for the user-facing Trino's TLS
#                              listener; mounted so DB_CONNECTION_MUTATOR can verify it
#   scout-logo (ConfigMap)  -- binary Scout logo/favicon branding assets (like the
#                              extractor's s3-env, a fixed-name CM seeded by CI/site,
#                              not embedded in git)
# Upstream apache/superset chart (normal HelmRepository).
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: superset
  namespace: '${scout_analytics_namespace}'
spec:
  interval: 1h
  url: https://apache.github.io/superset
---
# StatsD-exporter mapping for the sidecar. Single-sourced in spirit from
# ansible/roles/superset/files/statsd_mapping.yaml (kept byte-identical modulo the
# escaping below), but INLINE rather than a generated ConfigMap: its literal
# $1/$2/$3 statsd_exporter backrefs need substitute:disabled while its
# ${scout_analytics_namespace} needs substitution, and one Flux annotation can't do
# both. The $$1/$$2/$$3 are $$-escaped so drone/envsubst leaves a literal $1/$2/$3
# (a digit-led $N is otherwise a substitution target -- the nginx rewrite footgun).
apiVersion: v1
kind: ConfigMap
metadata:
  name: superset-statsd-mapping
  namespace: '${scout_analytics_namespace}'
data:
  statsd_mapping.yaml: |
    mappings:
      # --------------------------------------------------------------------------
      # REST API timings
      # Pattern: superset.<XRestApi>.<method>.time
      # --------------------------------------------------------------------------
      - match: "superset\\.(\\w+RestApi)\\.(\\w+)\\.time"
        match_type: regex
        name: 'superset_api_request_duration_ms'
        labels:
          api: '$$1'
          method: '$$2'
        observer_type: histogram
        histogram_options:
          buckets: [10, 50, 100, 250, 500, 1000, 2500]

      # --------------------------------------------------------------------------
      # REST API counters
      # Pattern: superset.<XRestApi>.<method>.<status>
      # --------------------------------------------------------------------------
      - match: "superset\\.(\\w+RestApi)\\.(\\w+)\\.(\\w+)"
        match_type: regex
        name: 'superset_api_requests_total'
        labels:
          api: '$$1'
          method: '$$2'
          status: '$$3'

      # --------------------------------------------------------------------------
      # Drop everything else
      # --------------------------------------------------------------------------
      - match: '.'
        match_type: regex
        action: drop
        name: 'dropped'
---
# Prometheus scrape target for the statsd-exporter sidecar (port 9102).
apiVersion: v1
kind: Service
metadata:
  name: superset-statsd-metrics
  namespace: '${scout_analytics_namespace}'
  labels:
    app: superset
    component: statsd-exporter
spec:
  type: ClusterIP
  selector:
    app: superset
  ports:
    - name: metrics
      port: 9102
      targetPort: 9102
      protocol: TCP
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  # Release name is `superset` so the chart fullname is `superset`; that fixes the
  # env/config Secret names (superset-env / superset-config) the dashboards import
  # Job consumes by fixed name.
  name: superset
  namespace: '${scout_analytics_namespace}'
spec:
  interval: 30m
  # Mirrors the Ansible helm timeout: the chart's init Job (db upgrade + admin
  # bootstrap) runs at install and takes a while.
  timeout: 15m
  # Version pinned in versions.yaml (superset_helm_chart_version), Renovate-tracked;
  # stamped into the config artifact at publish. Literal here until stamping lands.
  chart:
    spec:
      chart: superset
      version: '0.15.5'
      sourceRef:
        kind: HelmRepository
        name: superset
        namespace: '${scout_analytics_namespace}'
  # The two large configOverrides copies (trino_auth, prometheus_metrics) and the
  # statsd mapping are single-sourced from files in this base via a
  # configMapGenerator (kustomization.yaml); valuesFrom deep-sets the two leaves
  # into configOverrides, merging with the inline keys below. Flux re-reconciles
  # on ConfigMap content change, so a .py edit still rolls the release.
  valuesFrom:
    - kind: ConfigMap
      name: superset-config-overrides
      valuesKey: superset_trino_auth.py
      targetPath: configOverrides.trino_auth
    - kind: ConfigMap
      name: superset-config-overrides
      valuesKey: superset_metrics.py
      targetPath: configOverrides.prometheus_metrics
  values:
    # Scout's custom Superset image (build-lane-stamped at publish; literal here).
    image:
      repository: ghcr.io/washu-tag/superset
      tag: '5.0.0'
    # Disable the chart's generated env Secret so both the server and the
    # dashboards import Job read the externally-seeded, fixed-name `superset-env`
    # (see header). envFromSecret defaults to `<fullname>-env` = `superset-env`.
    secretEnv:
      create: false
    # Embedded Redis off -- the centralized Valkey instance backs cache + Celery.
    redis:
      enabled: false
    # No bundled Postgres; metadata DB is the shared CNPG cluster (see DB Job).
    postgresql:
      enabled: false
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        # oauth2-proxy pair tracks ${oauth2_proxy_namespace}; security-headers is
        # traefik-owned (kube-system), created outside this base at node bootstrap.
        traefik.ingress.kubernetes.io/router.middlewares: >-
          ${oauth2_proxy_namespace}-oauth2-proxy-error@kubernetescrd,
          ${oauth2_proxy_namespace}-oauth2-proxy-auth@kubernetescrd,
          kube-system-security-headers@kubernetescrd
      path: /
      hosts:
        - 'superset.${server_hostname}'
    supersetNode:
      connections:
        # The actual connection values arrive at runtime from `superset-env`
        # (the chart's superset_config.py reads them with os.getenv); db_type
        # defaults to postgresql. The one value needed at render time is a
        # non-empty redis_password, so the chart templates the password INTO the
        # Redis URLs -- the real REDIS_PASSWORD comes from superset-env at
        # runtime and this placeholder value itself is never used.
        redis_password: 'placeholder'
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: 2
          memory: 2Gi
      extraContainers:
        - name: statsd-exporter
          # Pinned in versions.yaml (superset_statsd_exporter_tag).
          image: prom/statsd-exporter:v0.29.0
          args:
            - --statsd.listen-udp=:9125
            - --statsd.listen-tcp=
            - --web.listen-address=:9102
            - --statsd.mapping-config=/etc/statsd-exporter/statsd_mapping.yaml
          ports:
            - name: statsd-udp
              containerPort: 9125
              protocol: UDP
            - name: metrics
              containerPort: 9102
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: statsd-mapping
              mountPath: /etc/statsd-exporter
              readOnly: true
    init:
      # Override the chart's default admin display name so the local fallback admin
      # shows as "Scout Admin". Only applied on first install (init Job creates the
      # admin row if absent); OAuth via Keycloak is the real login path. Password is
      # left to the chart default -- a real credential can't be sourced from a
      # Secret through the render-time initscript, so it is not set here.
      adminUser:
        firstname: Scout
        lastname: Admin
        email: admin@scout.local
    configOverrides:
      branding: |
        APP_NAME = "Scout Analytics"
        APP_ICON = "/static/assets/images/scout.png"
        APP_ICON_WIDTH = 200
        LOGO_TARGET_PATH = "https://${server_hostname}"
        LOGO_TOOLTIP = "Scout Launchpad"
        FAVICONS = [{"href": "/static/assets/images/favicon.ico"}]
      custom_routing: |
        from flask import redirect, url_for
        from flask_appbuilder import expose, IndexView

        from superset.superset_typing import FlaskResponse

        class SupersetIndexView(IndexView):
            @expose("/")
            def index(self) -> FlaskResponse:
                return redirect(url_for("Superset.dashboard", dashboard_id_or_slug="scout"))

        FAB_INDEX_VIEW = f"{SupersetIndexView.__module__}.{SupersetIndexView.__name__}"
      sql_alchemy: |
        SQLALCHEMY_ENGINE_OPTIONS = {
            "pool_size": 30,
            "max_overflow": 30,
            "pool_timeout": 60,
        }
      enable_oauth: |
        from flask_appbuilder.security.manager import AUTH_OAUTH
        from flask_appbuilder.security.views import AuthOAuthView, expose
        from superset.security import SupersetSecurityManager
        from superset.errors import ErrorLevel, SupersetError, SupersetErrorType
        from superset.exceptions import SupersetSecurityException
        from flask import g, redirect, session
        import logging
        OAUTH_PROVIDERS = OPENID_PROVIDERS = [
            {
                "name": "keycloak",
                "icon": "fa-key",
                "token_key": "access_token",
                "remote_app": {
                    "client_id": "${keycloak_superset_client_id}",
                    # Confidential-client secret sourced from the env (superset-env),
                    # never inlined into config committed to git.
                    "client_secret": os.environ.get("KEYCLOAK_SUPERSET_CLIENT_SECRET"),
                    "client_kwargs": {"scope": "openid microprofile-jwt"},
                    "api_base_url": "https://keycloak.${server_hostname}/realms/${keycloak_realm_name}/protocol/",
                    "access_token_url": "https://keycloak.${server_hostname}/realms/${keycloak_realm_name}/protocol/openid-connect/token",
                    "authorize_url": "https://keycloak.${server_hostname}/realms/${keycloak_realm_name}/protocol/openid-connect/auth",
                    "jwks_uri": "https://keycloak.${server_hostname}/realms/${keycloak_realm_name}/protocol/openid-connect/certs",
                    "request_token_url": None
                },
            }
        ]
        AUTH_ROLES_MAPPING = {
            "superset_admin": ["Admin"],
            "superset_alpha": ["Alpha"],
            "superset_gamma": ["Gamma"],
            "superset_sql_lab": ["sql_lab"]
        }
        AUTH_TYPE = AUTH_OAUTH
        AUTH_USER_REGISTRATION = True
        AUTH_USER_REGISTRATION_ROLE = 'Alpha'
        AUTH_ROLES_SYNC_AT_LOGIN = True
        class KeycloakOAuthView(AuthOAuthView):
            """
            Custom Auth View to handle Keycloak login and logout redirection
            """
            @expose("/login/")
            def login(self, provider="keycloak"):
                # Hacky workaround to remove stale 'Access is Denied' error messages from session.
                # When an unauthenticated user tries to access a protected page, Superset queues an 'Access is Denied' popup message.
                # With OAuth, the user is redirected to an external login page, so the error is not shown immediately.
                # After successful login, the old error message is displayed, which is confusing since the user now has access.
                flashes = session.get('_flashes', [])
                logging.debug(f"Flashes before cleanup: {flashes}")
                session['_flashes'] = [f for f in flashes if f != ('danger', 'Access is Denied')]
                logging.debug(f"Flashes after cleanup: {session.get('_flashes', [])}")
                return super().login(provider=provider)
            @expose('/logout/', methods=['GET', 'POST'])
            def logout(self):
                super().logout()
                return redirect('https://${oauth2_proxy_subdomain}.${server_hostname}/oauth2/sign_out')
        class KeycloakSecurityManager(SupersetSecurityManager):
            """
            Create a new SecurityManager that uses the KeycloakOAuthView and Keycloak role mapping
            """
            def __init__(self, appbuilder):
                super(KeycloakSecurityManager, self).__init__(appbuilder)
                app = self.appbuilder.get_app
                app.config.setdefault("AUTH_ROLES_MAPPING", AUTH_ROLES_MAPPING)
                app.config.setdefault("AUTH_TYPE", AUTH_OAUTH)
                self.authoauthview = KeycloakOAuthView
            def raise_for_access(self, **kwargs) -> None:
                # The base check only confirms the caller can use the (shared) Trino
                # database, not that they ran the query, so any signed-in user could
                # download another user's SQL Lab results via its guessable id.
                # Require query ownership unless the caller has all_query_access.
                super().raise_for_access(**kwargs)
                query = kwargs.get("query")
                if (
                    query is not None
                    and not self.can_access("all_query_access", "all_query_access")
                    and query.user_id != g.user.id
                ):
                    raise SupersetSecurityException(
                        SupersetError(
                            error_type=SupersetErrorType.QUERY_SECURITY_ACCESS_ERROR,
                            message="You do not have access to this query.",
                            level=ErrorLevel.ERROR,
                        )
                    )
        CUSTOM_SECURITY_MANAGER = KeycloakSecurityManager
      proxy_configuration: |
        PREFERRED_URL_SCHEME = "https"
        ENABLE_PROXY_FIX = True
      feature_flags: |
        # Key cached chart/dashboard results by user so a broad-access user's
        # cached copy is never served to a narrower-access viewer (refs #502).
        FEATURE_FLAGS = {
            "CACHE_QUERY_BY_USER": True,
        }
      statsd_logging: |
        from superset.stats_logger import StatsdStatsLogger
        STATS_LOGGER = StatsdStatsLogger(
            host='localhost',
            port=9125,
            prefix='superset'
        )
    extraVolumes:
      - name: scout-logo
        configMap:
          name: scout-logo
          defaultMode: 0644
      - name: statsd-mapping
        configMap:
          name: superset-statsd-mapping
      # CA cert from the same Secret cert-manager populates for the user-facing
      # Trino's TLS listener. DB_CONNECTION_MUTATOR passes /etc/trino-ca/ca.crt as
      # the http_session.verify so Trino's self-signed cert is trusted.
      - name: trino-ca
        secret:
          secretName: trino-tls
          items:
            - key: ca.crt
              path: ca.crt
    extraVolumeMounts:
      - name: scout-logo
        mountPath: /app/superset/static/assets/images/scout.png
        subPath: scout.png
        readOnly: true
      - name: scout-logo
        mountPath: /app/superset/static/assets/images/favicon.ico
        subPath: favicon.ico
        readOnly: true
      - name: trino-ca
        mountPath: /etc/trino-ca
        readOnly: true

# Per-namespace foundation (ADR 0031): sole owner of the ${scout_data_namespace}
# Namespace, shared by the MinIO tenant and Hive (both resolve to scout_data_namespace).
# Co-declaring it across their prune:true Kustomizations would let a mistimed prune
# cascade-delete the namespace, so each dependsOn this foundation.
apiVersion: v1
kind: Namespace
metadata:
  name: '${scout_data_namespace}'
  # A site may pre-create it so secrets land before the DAG; never cascade-delete it.
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled

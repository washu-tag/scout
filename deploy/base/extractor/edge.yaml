# Per-mode storage/identity for the extractor workers via valuesFrom (ADR 0035):
# on-prem = hostPath logs + s3-secret; aws = IRSA lake-writer SA + emptyDir, s3-secret
# dropped. Each carries the full envFrom + volumes (Flux replaces lists). Both ship.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hl7log-extractor-edge-on-prem
  namespace: '${scout_extractor_namespace}'
data:
  # HL7 logs from the node (hostPath + HostToContainer); creds from s3-secret.
  values.yaml: |
    envFrom:
      - secretRef:
          name: s3-secret
      - configMapRef:
          name: s3-env
    volumes:
      - name: data
        hostPath:
          path: '${extractor_data_dir}'
    volumeMounts:
      - name: data
        mountPath: /data
        readOnly: true
        mountPropagation: HostToContainer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hl7log-extractor-edge-aws
  namespace: '${scout_extractor_namespace}'
data:
  # IRSA lake-writer SA; s3-secret dropped (static keys can't shadow the role).
  values.yaml: |
    serviceAccount:
      create: true
      annotations:
        eks.amazonaws.com/role-arn: '${irsa_role_prefix}-hl7log-extractor'
    envFrom:
      - configMapRef:
          name: s3-env
    volumes:
      - name: data
        emptyDir: {}
    volumeMounts:
      - name: data
        mountPath: /data
        readOnly: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hl7-transformer-edge-on-prem
  namespace: '${scout_extractor_namespace}'
data:
  # HL7 logs from the node; creds from s3-secret; postgres-secret for the DB.
  values.yaml: |
    envFrom:
      - secretRef:
          name: s3-secret
      - configMapRef:
          name: s3-env
      - secretRef:
          name: postgres-secret
    volumes:
      - name: data
        hostPath:
          path: '${extractor_data_dir}'
    volumeMounts:
      - name: data
        mountPath: /data
        readOnly: true
        mountPropagation: HostToContainer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hl7-transformer-edge-aws
  namespace: '${scout_extractor_namespace}'
data:
  # IRSA lake-writer SA (Spark WebIdentity); s3-secret dropped, postgres-secret kept.
  values.yaml: |
    serviceAccount:
      create: true
      annotations:
        eks.amazonaws.com/role-arn: '${irsa_role_prefix}-hl7-transformer'
    envFrom:
      - configMapRef:
          name: s3-env
      - secretRef:
          name: postgres-secret
    volumes:
      - name: data
        emptyDir: {}
    volumeMounts:
      - name: data
        mountPath: /data
        readOnly: true

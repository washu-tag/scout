# Extractor: the HL7-log ingest workers (ADR 0030/0031). Two Scout-owned OCI
# charts pulled from ghcr.io/washu-tag/charts:
#   - hl7log-extractor : Java/Temporal worker that splits daily HL7 log files and
#                        uploads them to the lake, then triggers ingest.
#   - hl7-transformer  : Spark/Python worker that parses HL7 -> Delta Lake.
# Both land in scout-extractor alongside Temporal (temporal-internal-frontend),
# which is why they dependsOn temporal-bootstrap; they also need the CNPG ingest
# DB (postgres-cluster) and the MinIO lake (minio-tenant).
#
# Fixed-name refs, seeded by CI/site (Phase 3) or SOPS/ESO (Phase 4), NEVER in git:
#   - postgres-secret (Secret): DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD for the
#     ingest DB; consumed by the transformer (envFrom) and the extractor
#     (SPRING_DATASOURCE_PASSWORD via secretKeyRef). extractor-db-init reads its
#     DB_PASSWORD to set the ingest role's password.
#   - s3-secret (Secret): AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY (lake writer).
#   - superuser-secret (Secret): CNPG basic-auth (username/password) for extractor-db-init.
# The s3-env ConfigMap (non-secret S3 endpoint config) and extractor-db-init Job
# (ingest DB + owner role in the shared CNPG cluster, replacing the Ansible
# scout_common create_db_with_owner) are defined below.
#
# The modality-mapping map is chart-owned (hl7-transformer files/modality_mapping_codes.csv);
# no modality ConfigMap is created. On-prem rendering: MinIO S3 (path-style), HL7 logs
# mounted from the node at ${extractor_data_dir}.
# S3 connection env (non-secret) both workers envFrom; the creds ride the s3-secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: s3-env
  namespace: '${scout_extractor_namespace}'
data:
  AWS_ENDPOINT_URL: '${s3_endpoint}'
  AWS_ALLOW_HTTP: 'true'
  AWS_REGION: '${s3_region}'
---
# Ingest DB + owner role in the shared CNPG cluster, replacing the Ansible
# scout_common create_db_with_owner. Connects over the network to the -rw endpoint
# in ${postgres_cluster_namespace} as the CNPG superuser. Idempotent: role/db are
# guarded by SELECT ... WHERE NOT EXISTS \gexec so psql's :'..' interpolates the
# password (a DO block would not); the runtime password env is $$-escaped so Flux's
# envsubst leaves it for the shell. On-prem CNPG superuser is a real superuser, so the
# aws_deployment GRANT/REVOKE dance is omitted.
apiVersion: batch/v1
kind: Job
metadata:
  name: extractor-db-init
  namespace: '${scout_extractor_namespace}'
  annotations:
    kustomize.toolkit.fluxcd.io/force: 'Enabled'
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: extractor-db-init
    spec:
      restartPolicy: Never
      containers:
        - name: psql
          image: postgres:16
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: HOME
              value: /tmp
            - name: PGHOST
              value: '${postgres_cluster_name}-rw.${postgres_cluster_namespace}'
            - name: PGPORT
              value: '5432'
            - name: PGSSLMODE
              value: require
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: superuser-secret
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: superuser-secret
                  key: password
            - name: INGEST_PW
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_PASSWORD
          command:
            - sh
            - -ec
            - |
              psql --no-psqlrc -v ON_ERROR_STOP=1 -v ingest_pw="$$INGEST_PW" \
                --dbname postgres <<'SQL'
              SELECT format('CREATE USER %I WITH PASSWORD %L', '${postgres_user}', :'ingest_pw')
              WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '${postgres_user}')
              \gexec
              SELECT format('CREATE DATABASE %I OWNER %I', '${ingest_postgres_table_name}', '${postgres_user}')
              WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = '${ingest_postgres_table_name}')
              \gexec
              SQL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hl7log-extractor
  namespace: '${scout_extractor_namespace}'
spec:
  interval: 30m
  # Chart pinned in versions.yaml (hl7log_extractor_chart_version); this repo's CI
  # publishes it and the GitOps lane owns the real version via its OCIRepository
  # (ADR 0030/0031). Literal placeholder here until the stamping job lands.
  chart:
    spec:
      chart: hl7log-extractor
      version: '0.0.0'
      sourceRef:
        kind: HelmRepository
        name: scout-charts
        namespace: '${scout_extractor_namespace}'
  values:
    # Image repository/tag are build-lane-stamped at config-artifact publish;
    # literal placeholder in git (matches the chart's own default).
    image:
      repository: ghcr.io/washu-tag/hl7log-extractor
      tag: latest
    service:
      type: ClusterIP
      port: 8080
    envFrom:
      - secretRef:
          name: s3-secret
      - configMapRef:
          name: s3-env
    env:
      - name: TZ
        value: '${timezone}'
      - name: JAVA_TOOL_OPTIONS
        value: '-XX:MaxRAMPercentage=${hl7log_extractor_jvm_heap_max_ram_percentage} -XX:+UseContainerSupport'
      # Datasource password comes from the fixed-name postgres-secret; Spring's
      # env override beats application.yaml so no credential is inlined below.
      - name: SPRING_DATASOURCE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: postgres-secret
            key: DB_PASSWORD
    resources:
      requests:
        cpu: '${hl7log_extractor_resources_requests_cpu}'
        memory: '${hl7log_extractor_resources_requests_memory}'
      limits:
        cpu: '${hl7log_extractor_resources_limits_cpu}'
        memory: '${hl7log_extractor_resources_limits_memory}'
    # HL7 log files are mounted from the node (on-prem); readOnly + HostToContainer
    # so newly-rotated logs on the host become visible to the worker.
    volumes:
      - name: data
        hostPath:
          path: '${extractor_data_dir}'
    volumeMounts:
      - name: data
        mountPath: /data
        readOnly: true
        mountPropagation: HostToContainer
    livenessProbe:
      httpGet:
        path: /actuator/health/liveness
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 10
    readinessProbe:
      httpGet:
        path: /actuator/health/readiness
        port: 8080
      initialDelaySeconds: 15
      periodSeconds: 10
    config:
      application:
        management:
          metrics:
            tags:
              namespace: '${scout_extractor_namespace}'
        s3:
          endpoint: '${s3_endpoint}'
          region: '${s3_region}'
          path-style-access: true
        spring:
          datasource:
            url: 'jdbc:postgresql://${postgres_cluster_name}-rw.${postgres_cluster_namespace}:${db_port}/${ingest_postgres_table_name}'
            username: '${postgres_user}'
          temporal:
            connection:
              target: 'temporal-internal-frontend.${scout_extractor_namespace}:7236'
        scout:
          workflowArgDefaults:
            ingestHl7Log:
              logsRootPath: ${hl7logs_root_dir}
              scratchSpaceRootPath: '${scratch_path}'
              hl7OutputPath: '${hl7_path}'
              splitAndUploadTimeout: ${hl7log_extractor_timeout}
              splitAndUploadHeartbeatTimeout: ${hl7log_extractor_heartbeat_timeout}
              splitAndUploadConcurrency: ${hl7log_extractor_concurrency}
            ingestHl7ToDeltaLake:
              deltaIngestTimeout: ${hl7_transformer_timeout}
              deriveDeltaTablesTimeout: ${hl7_transformer_derive_timeout}
              reportTableName: '${report_delta_table_name}'
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hl7-transformer
  namespace: '${scout_extractor_namespace}'
spec:
  interval: 30m
  # Chart pinned in versions.yaml (hl7_transformer_chart_version); this repo's CI
  # publishes it and the GitOps lane owns the real version via its OCIRepository
  # (ADR 0030/0031). Literal placeholder here until the stamping job lands.
  chart:
    spec:
      chart: hl7-transformer
      version: '0.0.0'
      sourceRef:
        kind: HelmRepository
        name: scout-charts
        namespace: '${scout_extractor_namespace}'
  values:
    # Image repository/tag are build-lane-stamped at config-artifact publish;
    # literal placeholder in git (matches the chart's own default).
    image:
      repository: ghcr.io/washu-tag/hl7-transformer
      tag: latest
    initContainers:
      # Guard the Temporal-before-DNS startup race: block until the frontend
      # resolves, using the app image (same glibc resolver as the main process).
      # imagePullPolicy is explicit because init containers specified via values
      # otherwise default to Always for a :latest tag, which breaks air-gapped/k3s
      # nodes that have the image loaded locally but no registry to pull from.
      - name: wait-for-temporal-dns
        image: ghcr.io/washu-tag/hl7-transformer:latest
        imagePullPolicy: IfNotPresent
        command:
          - python3
          - -c
          - |
            import socket, time
            while True:
                try:
                    socket.gethostbyname('temporal-internal-frontend')
                    break
                except OSError:
                    print('waiting for dns...', flush=True)
                    time.sleep(2)
    envFrom:
      - secretRef:
          name: s3-secret
      - configMapRef:
          name: s3-env
      - secretRef:
          name: postgres-secret
    env:
      - name: TEMPORAL_ADDRESS
        value: 'temporal-internal-frontend.${scout_extractor_namespace}:7236'
      - name: TEMPORAL_NAMESPACE
        value: default
      - name: REPORT_DELTA_TABLE_NAME
        value: '${report_delta_table_name}'
      - name: TRINO_HOST
        value: '${trino_rw_endpoint_host}'
      - name: TRINO_PORT
        value: '${trino_rw_endpoint_port}'
      - name: TRINO_USER
        value: '${trino_user}'
      - name: TRINO_CATALOG
        value: delta
      - name: TRINO_SCHEME
        value: http
      - name: TRINO_VIEW_ENABLED
        value: '${trino_view_enabled}'
    # Memory: requests = spark_memory (1G -> 1Gi), limits = 4x for Spark off-heap.
    resources:
      requests:
        cpu: '${hl7_transformer_cpu_request}'
        memory: '${hl7_transformer_memory_request}'
      limits:
        cpu: '${hl7_transformer_cpu_limit}'
        memory: '${hl7_transformer_memory_limit}'
    volumes:
      - name: data
        hostPath:
          path: '${extractor_data_dir}'
    volumeMounts:
      - name: data
        mountPath: /data
        readOnly: true
        mountPropagation: HostToContainer
    ports:
      - containerPort: 8000
    readinessProbe:
      httpGet:
        path: /healthz
        port: 8000
      initialDelaySeconds: 15
      periodSeconds: 10
    livenessProbe:
      httpGet:
        path: /healthz
        port: 8000
      initialDelaySeconds: 30
      periodSeconds: 30
    spark:
      executor:
        memory: '${hl7_transformer_spark_memory}'
    # Chart-owned spark-defaults.conf (ADR 0031). on-prem mode = MinIO + path-style;
    # S3 creds come from the s3-secret envFrom, never from this block. The
    # modality-mapping map is left to the chart's bundled default (no override).
    sparkDefaults:
      enabled: true
      mode: on-prem
      shufflePartitions: ${spark_sql_shuffle_partitions}
      hiveMetastoreUri: '${hive_metastore_endpoint}'
      warehouseDir: '${delta_lake_path}'
      s3Region: '${s3_region}'
      s3Endpoint: '${s3_endpoint}'

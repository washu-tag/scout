apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# aws ingress edge (ADR 0035), wired by flux/aws/edge.yaml (not the shared DAG).
# Public ALB-OIDC Ingresses; mirrors the live AWS cluster. Layer-0: the AWS LB Controller +
# `alb` IngressClass. On EKS Auto, IngressClassParams sets the scheme and group.name is
# ignored (each Ingress gets its own ALB; grouping applies only on standard EKS).
resources:
  - keycloak-ingress.yaml
  - superset-ingress.yaml
  - launchpad-ingress.yaml
  - alb-oidc-rbac.yaml

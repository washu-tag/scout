apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# aws ingress edge (ADR 0035). NOT in the shared flux/ DAG; a site running in aws
# mode reconciles it via a scout-edge Kustomization pointing at ./base/edge-aws.
# Public ALBs with ALB-native OIDC against the Keycloak scout realm; the on-prem
# Traefik forwardAuth model lives in ../edge-on-prem. Mirrors the live adapt-dev
# pattern (gitops apps/scout-core/ingress.yaml). Assumes cluster-provided Layer-0:
# the AWS LB Controller + the `alb` IngressClass (scheme set via IngressClassParams,
# which overrides the per-ingress scheme annotation on EKS Auto).
resources:
  - keycloak-ingress.yaml
  - superset-ingress.yaml
  - alb-oidc-rbac.yaml

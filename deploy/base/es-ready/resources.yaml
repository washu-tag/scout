# Mode-agnostic `es-ready` gate (ADR 0036): the name the ES consumer (temporal) dependsOn,
# provided per-mode from modes/{aws,on-prem}/. aws = this inert marker (ES is a managed
# OpenSearch domain at ${es_host}); on-prem = the real ECK Elasticsearch. Just gives
# wait:true a Ready object.
apiVersion: v1
kind: ConfigMap
metadata:
  name: es-ready
  namespace: flux-system
data:
  mode: '${service_mode}'

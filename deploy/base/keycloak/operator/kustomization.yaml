apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Keycloak Operator + CRDs (Phase 3, ADR 0031), vendored from keycloak-k8s-resources at
# keycloak_version into upstream/ by tooling/deploy/vendor_keycloak_operator.py
# (raw.githubusercontent is unfetchable air-gapped + a supply-chain risk). Renovate re-runs
# it on Keycloak bumps, and CI fails if the copy and keycloak_version differ. The script
# owns the resources: list below, which follows the release's own kustomization.yml.
# The *.k8s.keycloak.org-v1.yml files are the cluster-scoped CRDs; kubernetes.yml is the
# namespace-less upstream operator, placed into ${keycloak_namespace} by the namespace
# transformer below (CRDs are cluster-scoped and left untouched). The ${keycloak_namespace}
# Namespace is owned by scout-core-foundation.
namespace: '${keycloak_namespace}'
resources:
  - upstream/keycloakoidcclients.k8s.keycloak.org-v1.yml
  - upstream/keycloakrealmimports.k8s.keycloak.org-v1.yml
  - upstream/keycloaks.k8s.keycloak.org-v1.yml
  - upstream/keycloaksamlclients.k8s.keycloak.org-v1.yml
  - upstream/kubernetes.yml

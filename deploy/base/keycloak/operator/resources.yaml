# Keycloak Operator + CRDs (Phase 3, ADR 0031). Mirrors roles/keycloak deploy.yaml,
# which applies three raw upstream manifests from keycloak-k8s-resources at the
# pinned keycloak_version (group_vars/all/versions.yaml, Renovate-tracked):
#   keycloaks.k8s.keycloak.org-v1.yml          — Keycloak CRD
#   keycloakrealmimports.k8s.keycloak.org-v1.yml — KeycloakRealmImport CRD
#   kubernetes.yml                              — the operator (SA/Role/RoleBinding/
#                                                 Deployment/Service, namespace-less;
#                                                 the role applies it with -n)
# These three manifests are VENDORED into upstream/ and referenced from
# kustomization.yaml `resources:` (not raw.githubusercontent URLs): a
# kustomize-controller in an air-gapped cluster (and a network-restricted CI) cannot
# fetch them, and an unpinned URL is a supply-chain risk. Refresh upstream/ in
# lockstep with keycloak_version.
#
# This file declares only the Namespace; the operator's namespaced resources are
# placed into it by the kustomization's `namespace:` transformer (the upstream
# kubernetes.yml is namespace-less by design). The CRDs are cluster-scoped and the
# transformer leaves them untouched.
#
# The operator's air-gapped image-pull-policy override (KC_OPERATOR_KEYCLOAK_IMAGE_
# PULL_POLICY, keyed off keycloak_image_pull_policy in the role) is deliberately
# omitted: it is conditional/site-specific, so a site overlay patches the
# keycloak-operator Deployment rather than baking it into the base.
apiVersion: v1
kind: Namespace
metadata:
  name: '${keycloak_namespace}'

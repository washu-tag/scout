# Keycloak realm import via keycloak-config-cli (Scout OCI chart). Split from the
# instance base so keycloak-realm dependsOn keycloak-instance (health-gated on the
# Keycloak CR Ready): the import runs only after Keycloak is up, no first-boot race.
# The realm ships in the chart (files/scout-realm.json); the chart's tpl builds the
# per-site oauth2-proxy redirects from albOidcHosts, and config-cli var-substitutes
# $(env:server_hostname) + the client/IdP secrets from the Job env at import. Uses the
# keycloak-admin-secret admin creds. Namespace owned by scout-core-foundation.
---
# scout-charts OCI source for the config-cli HelmRelease.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: scout-charts
  namespace: '${keycloak_namespace}'
spec:
  type: oci
  interval: 1h
  url: oci://ghcr.io/washu-tag/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak-config-cli
  namespace: '${keycloak_namespace}'
spec:
  interval: 30m
  timeout: 5m
  # First-boot race is handled by the DAG gate (keycloak-realm dependsOn
  # keycloak-instance, Ready-gated), so retries is just a fast retry for a transient
  # post-Ready blip instead of waiting the 30m interval.
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # Scout-owned OCI chart (ADR 0030); placeholder version stamped from the haul at
  # config-artifact publish (self-reference, so not Renovate-tracked).
  chart:
    spec:
      chart: keycloak-config-cli
      version: '0.0.0'
      sourceRef:
        kind: HelmRepository
        name: scout-charts
        namespace: '${keycloak_namespace}'
  values:
    # Upstream config-cli image, pinned in versions.yaml (keycloak_config_cli_image[_tag]).
    image:
      repository: docker.io/adorsys/keycloak-config-cli
      tag: 6.5.1-26.5.5
    # The realm is the chart's files/scout-realm.json (helm tpl renders it: the
    # oauth2-proxy redirect URIs are built by ranging over albOidcHosts).
    config:
      scout:
        file: files/scout-realm.json
    # Scout realm config (cluster-vars; arrive as strings, the realm gates on eq "true").
    # enableXnat provisions the XNAT client/role; github/microsoft toggle the IdPs;
    # albOidcHosts is the comma-separated full ALB-OIDC host list (AWS sites; empty
    # on-prem, which uses the oauth2-proxy callback the realm builds from server_hostname).
    # SMTP, terms localizations, and trino AuthZ attributes use the chart defaults
    # (site overlay overrides them; see values.yaml).
    enableXnat: '${keycloak_enable_xnat}'
    github:
      enabled: '${keycloak_github_enabled}'
    microsoft:
      enabled: '${keycloak_microsoft_enabled}'
    defaultProvider: '${keycloak_default_provider}'
    albOidcHosts: '${keycloak_alb_oidc_hosts}'
    annotations:
      # config-hash: CI stamps the realm file's truncated sha256 at publish so a
      # realm-only change re-runs the import (mirrors the role's config-hash).
      config-hash: '0'
    env:
      # Merged over the chart defaults (IMPORT_PATH=/config/ preserved).
      KEYCLOAK_URL: 'http://keycloak-service.${keycloak_namespace}:8080/'
      KEYCLOAK_USER: '${keycloak_bootstrap_admin_user}'
      # config-cli var-substitutes $(env:server_hostname) into every client URL.
      server_hostname: '${server_hostname}'
      # config-cli rails (Spring Boot; keys = exact import.* props). var-substitution
      # resolves $(env:...) from the Job env. managed *=no-delete on EVERY prune-capable
      # type makes the import additive: config-cli creates/updates from this realm but
      # never deletes a live entity (remote-state does NOT reliably scope this -- a first
      # run against a populated realm otherwise prunes live clients, IdP mappers, scope
      # mappings, roles, etc. not present here). So a takeover leaves any live brokered IdP
      # + its mappers, app-owned clients, and operator flows intact; stale cleanup is deliberate.
      # (config-cli never manages users, so they are always untouched.)
      SPRING_APPLICATION_JSON: >-
        {"import":{"var-substitution":{"enabled":true},"managed":{"client":"no-delete","client-scope":"no-delete","client-scope-mapping":"no-delete","scope-mapping":"no-delete","role":"no-delete","group":"no-delete","identity-provider":"no-delete","identity-provider-mapper":"no-delete","required-action":"no-delete","authentication-flow":"no-delete","component":"no-delete","sub-component":"no-delete"}}}
    # Client + GitHub-IdP secrets the realm var-substitutes ($(env:oauth2_proxy),
    # $(env:github_client_id), ...). Site-materialized fixed-name Secret whose keys
    # are the $(env:...) names (see required-secrets.md).
    envFrom:
      - secretRef:
          name: keycloak-client-secrets
    existingSecret: keycloak-admin-secret

# The Scout base realm document (keycloak-config-cli, a Scout OCI chart). This
# release renders the realm and publishes it to the keycloak-base-realm
# ConfigMap; the app manager beside it composes that with the discovered
# fragments and is the only thing that applies a realm to Keycloak (ADR 0037).
# The realm ships in the chart (files/scout-realm.json); the chart's tpl builds the
# per-site oauth2-proxy redirects from albOidcHosts, and the apply Job
# var-substitutes $(env:server_hostname) + the client/IdP secrets at import.
# Split from the instance base so keycloak-realm dependsOn keycloak-instance
# (health-gated on the Keycloak CR Ready). Namespace owned by scout-core-foundation.
---
# scout-charts OCI source for the realm HelmRelease.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: scout-charts
  namespace: '${keycloak_namespace}'
spec:
  type: oci
  interval: 1h
  url: oci://ghcr.io/washu-tag/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak-config-cli
  namespace: '${keycloak_namespace}'
spec:
  interval: 30m
  timeout: 5m
  # First-boot race is handled by the DAG gate (keycloak-realm dependsOn
  # keycloak-instance, Ready-gated), so retries is just a fast retry for a transient
  # post-Ready blip instead of waiting the 30m interval.
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # Scout-owned OCI chart (ADR 0030); placeholder version stamped from the haul at
  # config-artifact publish (self-reference, so not Renovate-tracked).
  chart:
    spec:
      chart: keycloak-config-cli
      version: '0.0.0'
      sourceRef:
        kind: HelmRepository
        name: scout-charts
        namespace: '${keycloak_namespace}'
  values:
    # Scout realm config (cluster-vars; arrive as strings, the realm gates on eq "true").
    # enableXnat provisions the XNAT client/role; github/microsoft toggle the IdPs;
    # albOidcHosts is the comma-separated full ALB-OIDC host list (AWS sites; empty
    # on-prem, which uses the oauth2-proxy callback the realm builds from server_hostname).
    # Token lifespans, SMTP, terms localizations, and trino AuthZ attributes use
    # the chart defaults (site overlay overrides them; see values.yaml). realmName
    # and oauth2ProxySubdomain must match what the rest of the lane substitutes.
    realmName: '${keycloak_realm_name}'
    oauth2ProxySubdomain: '${oauth2_proxy_subdomain}'
    enableXnat: '${keycloak_enable_xnat}'
    github:
      enabled: '${keycloak_github_enabled}'
    microsoft:
      enabled: '${keycloak_microsoft_enabled}'
    defaultProvider: '${keycloak_default_provider}'
    albOidcHosts: '${keycloak_alb_oidc_hosts}'
    annotations:
      # config-hash: CI stamps the realm file's truncated sha256 at publish, so
      # the published ConfigMap says which build's realm it holds (mirrors the
      # role's config-hash).
      config-hash: '0'

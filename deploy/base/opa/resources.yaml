# OPA: Trino access-control policy engine (ADRs 0020/0021), scout-opa OCI chart
# as Deployment + Service in the Trino namespace (opa_namespace == trino_namespace).
# Static AuthZ (Rego + inventory-rendered data doc) is baked in below; per-user
# attributes come at runtime via the bundle plugin (ADR 0021).
#
# The bundle store is mode-selected (ADR 0035) by the opa-edge-${service_mode}
# ConfigMap via valuesFrom: on-prem reads from the in-cluster MinIO with the
# fixed-name opa-bundle-reader Secret (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY /
# AWS_REGION, seeded by CI/site or ESO, mirrors ${s3_opa_bundle_reader}-creds); aws
# reads from S3 via an IRSA ServiceAccount (no MinIO, no static Secret).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: scout-opa
  namespace: '${scout_analytics_namespace}'
spec:
  interval: 30m
  # Scout-owned OCI chart; GitOps lane owns real version via OCIRepository
  # (ADR 0030/0031). Literal 0.0.0 placeholder until the stamping job lands.
  chart:
    spec:
      chart: scout-opa
      version: '0.0.0'
      sourceRef:
        kind: HelmRepository
        name: scout-charts
        namespace: '${scout_analytics_namespace}'
  # Bundle store differs by mode (ADR 0035): service_mode selects the on-prem (MinIO
  # + reader Secret) or aws (IRSA SA + S3) edge ConfigMap, supplying bundleReader +
  # the OPA config.yaml (+ the aws ServiceAccount).
  valuesFrom:
    - kind: ConfigMap
      name: 'opa-edge-${service_mode}'
  values:
    replicaCount: 2
    # Same-namespace NetworkPolicy locks OPA's unauthenticated API to the Trino coordinator.
    networkPolicy:
      enabled: true
    # Tag pinned in versions.yaml (opa_image_tag), Renovate-tracked there. Literal
    # mirror (upstream image, not stamped); keep in lockstep with versions.yaml.
    image:
      repository: openpolicyagent/opa
      tag: '1.16.2'
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    # bundleReader (the opa-bundle-reader Secret) is mode-specific -> edge ConfigMap.
    # Static data document. Only ${report_delta_table_name} is a shared cluster-var;
    # baseline_hidden_tables derives from it so a renamed report table can't leave
    # the patient-mapping table unhidden.
    data:
      json: |
        {
          "filtered_tables": [
            { "catalog": "delta", "schema": "default", "table_prefix": "${report_delta_table_name}" }
          ],
          "baseline_hidden_tables": [
            { "catalog": "delta", "schema": "default", "table": "${report_delta_table_name}_report_patient_mapping" },
            { "catalog": "delta", "schema": "default", "table": "${report_delta_table_name}_report_patient_mapping_history" }
          ],
          "hidden_tables": [],
          "view_owner_principals": ["trino"],
          "attribute_filters": {
            "allowed_facilities": { "column": "sending_facility" }
          },
          "masked_columns": ["patient_name", "full_patient_name", "zip_or_postal_code"]
        }
    # Bundle plugin config (ADR 0021) is mode-specific (MinIO on-prem vs S3 aws) ->
    # the edge ConfigMap. `persist: true` there keeps the last good bundle so a
    # restart during a store outage doesn't drop OPA to deny-all; 5-10s poll meets
    # ADR 0020 real-time-offboarding.

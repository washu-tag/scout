# OPA: the policy engine that enforces Scout's Trino access-control policy
# (ADRs 0020/0021). Deployed from the Scout-owned OCI chart scout-opa
# (ghcr.io/washu-tag/charts/scout-opa) as a Deployment + Service in the Trino
# namespace (opa_namespace == trino_namespace, ADR 0020), so the coordinator ->
# OPA decision path stays in-cluster and the chart's NetworkPolicy admits only
# the Trino coordinator.
#
# Static AuthZ (the Rego policy + the inventory-rendered data document) is baked
# into the release below. Per-user attributes are layered on at runtime by OPA's
# bundle plugin (ADR 0021): the Keycloak SPI listener publishes a bundle to MinIO
# and OPA polls it every 5-10s, atomically swapping the data.users subtree. That
# is why this base dependsOn minio-tenant -- OPA reads its bundle from the MinIO
# lake and the bundle-reader IAM user is provisioned by the minio-tenant bootstrap.
#
# Fixed-name Secret, seeded by CI/site (Phase 3) or SOPS/ESO (Phase 4), NEVER in git:
#   - opa-bundle-reader (Secret): AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY /
#     AWS_REGION for the bundle pull. OPA's environment_credentials reads these
#     env vars (AWS_REGION is required even against MinIO -- the SDK credential
#     resolver fails closed without it). The access/secret pair are the same
#     values the minio-tenant base seeds into the ${s3_opa_bundle_reader}-creds
#     Secret in scout-data; mirrored here by fixed name so the cross-namespace
#     dependency stays explicit. The chart mounts it via envFrom.
# Release name mirrors the Ansible role's helm_chart_name (scout-opa).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: scout-opa
  namespace: '${scout_analytics_namespace}'
spec:
  interval: 30m
  # Scout-owned OCI chart; this repo's CI publishes it and the GitOps lane owns the
  # real version via its OCIRepository (ADR 0030/0031). Literal 0.0.0 placeholder
  # here until the stamping job lands (same pattern as the extractor base).
  chart:
    spec:
      chart: scout-opa
      version: '0.0.0'
      sourceRef:
        kind: HelmRepository
        name: scout-charts
        namespace: '${scout_analytics_namespace}'
  values:
    replicaCount: 2
    # Lock OPA's unauthenticated API down to the Trino coordinator (the chart
    # renders a same-namespace NetworkPolicy; see helm/scout-opa/templates/networkpolicy.yaml).
    networkPolicy:
      enabled: true
    # Upstream OPA image, tag pinned in versions.yaml (opa_image_tag), Renovate-tracked;
    # stamped at config-artifact publish. Literal here until the stamping job lands.
    image:
      repository: openpolicyagent/opa
      tag: '1.16.2'
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    bundleReader:
      # Fixed-name Secret (above); envFrom-mounted by the chart's Deployment.
      # bundleReader.credsHash (the Ansible role's rollout trigger on credential
      # rotation) is intentionally omitted: hashing secret values in git is not
      # allowed, and rotation-triggered rollout is deferred to Phase 4 (ESO/Reloader).
      secretName: opa-bundle-reader
    # Static data document, rendered by the opa Ansible role from inventory. Only
    # ${report_delta_table_name} is a shared site scalar (a cluster-var, also used
    # by the extractor base); the rest are the role's default policy config. The
    # baseline_hidden_tables pair derives from ${report_delta_table_name} so a
    # renamed report table can't leave the patient-mapping table unhidden.
    data:
      json: |
        {
          "filtered_tables": [
            { "catalog": "delta", "schema": "default", "table_prefix": "${report_delta_table_name}" }
          ],
          "baseline_hidden_tables": [
            { "catalog": "delta", "schema": "default", "table": "${report_delta_table_name}_report_patient_mapping" },
            { "catalog": "delta", "schema": "default", "table": "${report_delta_table_name}_report_patient_mapping_history" }
          ],
          "hidden_tables": [],
          "view_owner_principals": ["trino"],
          "attribute_filters": {
            "allowed_facilities": { "column": "sending_facility" }
          },
          "masked_columns": ["patient_name", "full_patient_name", "zip_or_postal_code"]
        }
    # Bundle plugin config (ADR 0021). `services.minio` + `bundles.scout-users`
    # wire the bundle plugin to the MinIO endpoint (headless `-hl` service so DNS
    # resolves to all tenant pods); the resource is the bundle object the Keycloak
    # SPI listener publishes. `persist: true` writes the last good bundle to the
    # pod-local emptyDir so a restart during a MinIO outage doesn't drop OPA to
    # deny-all. Polling 5-10s meets ADR 0020's real-time-offboarding requirement.
    config:
      yaml: |
        services:
          minio:
            url: http://${minio_tenant_name}-hl.${minio_tenant_namespace}:9000
            credentials:
              s3_signing:
                environment_credentials: {}
        bundles:
          scout-users:
            service: minio
            resource: ${opa_bundles_bucket}/${opa_bundle_object_key}
            polling:
              min_delay_seconds: 5
              max_delay_seconds: 10
            persist: true
        decision_logs:
          console: true
          reporting:
            min_delay_seconds: 5
            max_delay_seconds: 15
        status:
          console: true

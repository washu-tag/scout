# Per-mode bundle-store wiring for OPA, merged into the scout-opa HelmRelease via
# valuesFrom (ADR 0035). on-prem = in-cluster MinIO + the static opa-bundle-reader
# Secret; aws = real S3 via an IRSA ServiceAccount (no MinIO, no static Secret), so
# an aws cluster runs no MinIO at all. service_mode picks one; both ship, the unused
# one is inert. OPA's native bundle plugin needs an explicit service URL (the
# SDK-default-endpoint trick is SDK-only), so aws points at the regional S3 host.
apiVersion: v1
kind: ConfigMap
metadata:
  name: opa-edge-on-prem
  namespace: '${scout_analytics_namespace}'
data:
  values.yaml: |
    bundleReader:
      secretName: opa-bundle-reader
    config:
      yaml: |
        services:
          bundle-store:
            # Same endpoint the Keycloak writer uses (opa_bundle_s3_endpoint) so
            # reader + writer can't drift; on-prem = the in-cluster MinIO -hl service.
            url: ${opa_bundle_s3_endpoint}
            credentials:
              s3_signing:
                environment_credentials: {}
        bundles:
          scout-users:
            service: bundle-store
            resource: ${opa_bundles_bucket}/${opa_bundle_object_key}
            polling:
              min_delay_seconds: 5
              max_delay_seconds: 10
            persist: true
        decision_logs:
          console: true
          reporting:
            min_delay_seconds: 5
            max_delay_seconds: 15
        status:
          console: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opa-edge-aws
  namespace: '${scout_analytics_namespace}'
data:
  # IRSA reader SA -> web_identity_credentials (AWS_ROLE_ARN + projected token from
  # the EKS pod-identity webhook). bundleReader.secretName empty -> chart mounts no
  # static-cred Secret. Regional S3 URL (bucket-in-path via the resource key).
  values.yaml: |
    serviceAccount:
      create: true
      annotations:
        eks.amazonaws.com/role-arn: '${opa_bundle_reader_role_arn}'
    bundleReader:
      secretName: ''
    config:
      yaml: |
        services:
          bundle-store:
            url: https://s3.${s3_region}.amazonaws.com
            credentials:
              s3_signing:
                web_identity_credentials:
                  aws_region: ${s3_region}
        bundles:
          scout-users:
            service: bundle-store
            resource: ${opa_bundles_bucket}/${opa_bundle_object_key}
            polling:
              min_delay_seconds: 5
              max_delay_seconds: 10
            persist: true
        decision_logs:
          console: true
          reporting:
            min_delay_seconds: 5
            max_delay_seconds: 15
        status:
          console: true

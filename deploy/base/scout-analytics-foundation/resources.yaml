# Per-namespace foundation (ADR 0031): the sole owner of the ${scout_analytics_namespace}
# Namespace and the shared scout-charts HelmRepository. opa, superset, and trino-ro all
# live in this namespace and pull the scout-dashboards/scout-opa charts from scout-charts;
# co-declaring either resource across their prune:true Kustomizations makes them fight over
# ownership (a delete of one prunes the shared resource out from under the others). Each
# analytics component Kustomization instead dependsOn scout-analytics-foundation.
apiVersion: v1
kind: Namespace
metadata:
  name: "${scout_analytics_namespace}"
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: scout-charts
  namespace: "${scout_analytics_namespace}"
spec:
  type: oci
  interval: 1h
  url: oci://ghcr.io/washu-tag/charts

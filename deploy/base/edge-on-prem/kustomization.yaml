apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# on-prem ingress edge (ADR 0035). NOT in the shared flux/ DAG; a site running in
# on-prem mode reconciles it via a scout-edge Kustomization pointing at
# ./base/edge-on-prem. Holds the mode-specific ingress/auth resources that cannot
# ship in the shared base -- here the oauth2-proxy forwardAuth Middlewares, which
# are Traefik CRDs an aws cluster has no controller for. The aws counterpart
# (ALB-native OIDC) lives in ../edge-aws.
resources:
  - oauth2-proxy-middlewares.yaml

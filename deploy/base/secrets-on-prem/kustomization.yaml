apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# On-prem fixed-name Secrets (ADR 0031 section 3), filled from the site's one
# scout-secret-values Secret by the secrets-ready Kustomization. Each placeholder is
# wrapped as ${sq}...${sq}: kustomize-controller re-serializes before substituting, so
# quotes written in the template are dropped and a value like 0123 or true changes type.
commonAnnotations:
  # Adopted Secrets must survive a renamed or deleted Kustomization.
  kustomize.toolkit.fluxcd.io/prune: disabled
resources:
  - scout-core.yaml
  - scout-data.yaml
  - scout-extractor.yaml
  - scout-analytics.yaml
  - oauth2-proxy.yaml

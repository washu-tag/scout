# Per-namespace foundation (ADR 0031): sole owner of the ${scout_operators_namespace}
# Namespace, shared by the CNPG and MinIO operators (all resolve to
# scout_operators_namespace). Co-declaring it across their prune:true Kustomizations would
# let a mistimed prune cascade-delete the namespace, so each dependsOn this foundation.
apiVersion: v1
kind: Namespace
metadata:
  name: '${scout_operators_namespace}'

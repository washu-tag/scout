apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: elastic
  namespace: '${eck_operator_namespace}'
spec:
  interval: 1h
  url: https://helm.elastic.co
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: eck-operator
  namespace: '${eck_operator_namespace}'
spec:
  interval: 30m
  # Version pinned in versions.yaml (eck_operator_version), Renovate-tracked;
  # stamped into the config artifact at publish. Literal here until the stamping
  # job lands.
  chart:
    spec:
      chart: eck-operator
      version: '3.2.0'
      sourceRef:
        kind: HelmRepository
        name: elastic
        namespace: '${eck_operator_namespace}'
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    # Scope the operator's watch/RBAC to the namespace that holds the
    # Elasticsearch CR (the cluster base creates it).
    managedNamespaces:
      - '${scout_extractor_namespace}'

apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: elastic
  namespace: '${eck_operator_namespace}'
spec:
  interval: 1h
  url: https://helm.elastic.co
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: eck-operator
  namespace: '${eck_operator_namespace}'
spec:
  interval: 30m
  # Version pinned in versions.yaml (eck_operator_version), Renovate-tracked there.
  # Literal mirror (not stamped); keep in lockstep with versions.yaml.
  chart:
    spec:
      chart: eck-operator
      version: '3.2.0'
      sourceRef:
        kind: HelmRepository
        name: elastic
        namespace: '${eck_operator_namespace}'
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    # Scope operator watch/RBAC to the namespace holding the Elasticsearch CR.
    managedNamespaces:
      - '${scout_extractor_namespace}'

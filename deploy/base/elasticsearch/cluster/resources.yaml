# Single-node Elasticsearch (ECK); HTTP TLS disabled for internal access. Heap fixed
# via ES_JAVA_OPTS (Xms == Xmx); pod memory tracks it (heap <= 50%): requests = 2x
# heap, limits = 8x heap for burst.
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: '${elasticsearch_cluster_name}'
  namespace: '${scout_extractor_namespace}'
spec:
  version: '9.2.3'
  http:
    tls:
      selfSignedCertificate:
        disabled: true
  nodeSets:
    - name: default
      count: 1
      config:
        node.store.allow_mmap: false
      podTemplate:
        spec:
          securityContext:
            runAsNonRoot: true
          containers:
            - name: elasticsearch
              securityContext:
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              env:
                - name: ES_JAVA_OPTS
                  value: '-Xms${elasticsearch_max_heap} -Xmx${elasticsearch_max_heap}'
              resources:
                requests:
                  cpu: '${elasticsearch_cpu_request}'
                  memory: '${elasticsearch_memory_request}'
                limits:
                  cpu: '${elasticsearch_cpu_limit}'
                  memory: '${elasticsearch_memory_limit}'
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: '${elasticsearch_storage_size}'

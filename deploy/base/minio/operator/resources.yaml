apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: minio-operator
  namespace: '${minio_operator_namespace}'
spec:
  interval: 1h
  url: https://operator.min.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio-operator
  namespace: '${minio_operator_namespace}'
spec:
  interval: 30m
  # Version pinned in versions.yaml (minio_version) -- Renovate-tracked there, not in
  # deploy/. Literal mirror (not stamped; the stamper covers only Scout charts/images);
  # keep in lockstep with versions.yaml.
  chart:
    spec:
      chart: operator
      version: '7.1.1'
      sourceRef:
        kind: HelmRepository
        name: minio-operator
        namespace: '${minio_operator_namespace}'
  install:
    crds: Create
  upgrade:
    crds: CreateReplace

# Per-mode ingress for report-viewer via valuesFrom (ADR 0035). on-prem: the chart's
# Traefik ingress + the oauth2-proxy / embeddable-security-headers / gateway middleware
# chain (embeddable headers replace the global security-headers so the chat can iframe
# the viewer). The gateway Middleware is seeded externally alongside the Secret: the
# chart renders it only from an inline gatewaySecret, which never lands in git. aws:
# chart ingress off; the ALB (edge-aws/report-viewer-ingress.yaml) serves the host.
apiVersion: v1
kind: ConfigMap
metadata:
  name: report-viewer-edge-on-prem
  namespace: '${scout_analytics_namespace}'
data:
  values.yaml: |
    ingress:
      enabled: true
      className: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.middlewares: >-
          ${oauth2_proxy_namespace}-oauth2-proxy-error@kubernetescrd,
          ${oauth2_proxy_namespace}-oauth2-proxy-auth@kubernetescrd,
          kube-system-embeddable-security-headers@kubernetescrd,
          ${scout_analytics_namespace}-report-viewer-gateway@kubernetescrd
      host: 'report-viewer.${server_hostname}'
    # NetworkPolicy is on-prem only (Traefik-centric); aws has no Traefik and the ALB
    # hits pods directly, so it stays off there, matching the superset base.
    networkPolicy:
      enabled: true
      traefikNamespace: kube-system
      extraFrom:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: open-webui
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: '${prometheus_namespace}'
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              app.kubernetes.io/component: server
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: report-viewer-edge-aws
  namespace: '${scout_analytics_namespace}'
data:
  values.yaml: |
    ingress:
      enabled: false
    networkPolicy:
      enabled: false

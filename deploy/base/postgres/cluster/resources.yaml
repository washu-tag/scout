# Shared CNPG cluster. Roles + databases provisioned declaratively via
# spec.managed.roles + kind: Database below (not bootstrap.initdb, which only
# covers one DB on an uninitialized cluster); Database CRs reconcile continuously.
# Secrets (fixed names, seeded by CI/site, never committed):
#   superuser-secret — CNPG basic-auth for the operator.
#   cnpg-role-*      — one basic-auth Secret per managed role in THIS namespace.
#     Separate from the app secret because CNPG reads passwordSecret from the
#     Cluster's namespace while each app reads its creds in its own namespace, so
#     the password is carried twice (cnpg-role-hive.password ==
#     hive-metastore-secret.HIVE_METASTORE_PASSWORD). Seed both from one source; a
#     mismatch surfaces only as a role-login failure at runtime (no pre-runtime
#     check). ESO collapses this to one source in Phase 4.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: '${postgres_cluster_name}'
  namespace: '${postgres_cluster_namespace}'
spec:
  instances: 1
  # postgres_image[_tag] in versions.yaml; the psql Jobs run the same image.
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql versioning=regex:^(?<major>\d+)\.(?<minor>\d+)-(?<compatibility>system-trixie)$
  imageName: ghcr.io/cloudnative-pg/postgresql:18.3-system-trixie
  storage:
    size: '${postgres_storage_size}'
  resources:
    requests:
      cpu: '${postgres_cpu_request}'
      memory: '${postgres_memory_request}'
    limits:
      cpu: '${postgres_cpu_limit}'
      memory: '${postgres_memory_limit}'
  enableSuperuserAccess: true
  superuserSecret:
    name: superuser-secret
  postgresql:
    # Only memory/connection knobs vary per env; the rest are a fixed profile
    # matching the Ansible role defaults. The CRD takes strings, and Flux drops template
    # quotes before substituting, so ${sq} quotes the substituted values.
    parameters:
      max_connections: ${sq}${postgres_max_connections}${sq}
      shared_buffers: ${sq}${postgres_shared_buffers}${sq}
      effective_cache_size: ${sq}${postgres_effective_cache_size}${sq}
      maintenance_work_mem: ${sq}${postgres_maintenance_work_mem}${sq}
      checkpoint_completion_target: '0.9'
      wal_buffers: ${sq}${postgres_wal_buffers}${sq}
      default_statistics_target: ${sq}${postgres_default_statistics_target}${sq}
      random_page_cost: '4'
      effective_io_concurrency: '1'
      work_mem: ${sq}${postgres_work_mem}${sq}
      huge_pages: 'try'
      min_wal_size: ${sq}${postgres_min_wal_size}${sq}
      max_wal_size: ${sq}${postgres_max_wal_size}${sq}
      max_worker_processes: '4'
      max_parallel_workers_per_gather: '2'
      max_parallel_workers: '4'
      max_parallel_maintenance_workers: '2'
  # App login roles. Password from each role's cnpg-role-* Secret (see header).
  # hive_readonly owns no database; the hive/db grant Job wires its table
  # privileges (managed.roles can't express those).
  managed:
    roles:
      - name: hive
        ensure: present
        login: true
        passwordSecret:
          name: cnpg-role-hive
      - name: hive_readonly
        ensure: present
        login: true
        passwordSecret:
          name: cnpg-role-hive-readonly
      - name: keycloak
        ensure: present
        login: true
        passwordSecret:
          name: cnpg-role-keycloak
      - name: superset
        ensure: present
        login: true
        passwordSecret:
          name: cnpg-role-superset
      - name: '${postgres_user}'
        ensure: present
        login: true
        passwordSecret:
          name: cnpg-role-extractor
      - name: temporal
        ensure: present
        login: true
        passwordSecret:
          name: cnpg-role-temporal
---
apiVersion: v1
kind: Service
metadata:
  name: '${postgres_cluster_name}-metrics'
  namespace: '${postgres_cluster_namespace}'
spec:
  selector:
    cnpg.io/cluster: '${postgres_cluster_name}'
  ports:
    - name: metrics
      port: 9187
      targetPort: metrics
---
# App databases. databaseReclaimPolicy: retain so a pruned/deleted Database CR
# never drops a PHI-bearing database. Reconciler retries until its owner role
# (above) exists; postgres-ready's health gate (modes/on-prem/postgres.yaml) blocks
# dependents until all six report status.applied. Must live in the Cluster's
# namespace (spec.cluster is a LocalObjectReference), not the app bases.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: hive
  namespace: '${postgres_cluster_namespace}'
spec:
  cluster:
    name: '${postgres_cluster_name}'
  name: hive
  owner: hive
  ensure: present
  databaseReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: keycloak
  namespace: '${postgres_cluster_namespace}'
spec:
  cluster:
    name: '${postgres_cluster_name}'
  name: keycloak
  owner: keycloak
  ensure: present
  databaseReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: superset
  namespace: '${postgres_cluster_namespace}'
spec:
  cluster:
    name: '${postgres_cluster_name}'
  name: superset
  owner: superset
  ensure: present
  databaseReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: extractor-ingest
  namespace: '${postgres_cluster_namespace}'
spec:
  cluster:
    name: '${postgres_cluster_name}'
  name: '${ingest_postgres_table_name}'
  owner: '${postgres_user}'
  ensure: present
  databaseReclaimPolicy: retain
---
# Temporal's two stores (default history + visibility). Underscore in the DB name
# (temporal_visibility) can't be a k8s object name, so metadata.name differs from
# spec.name (as extractor-ingest does).
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: temporal
  namespace: '${postgres_cluster_namespace}'
spec:
  cluster:
    name: '${postgres_cluster_name}'
  name: temporal
  owner: temporal
  ensure: present
  databaseReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: temporal-visibility
  namespace: '${postgres_cluster_namespace}'
spec:
  cluster:
    name: '${postgres_cluster_name}'
  name: temporal_visibility
  owner: temporal
  ensure: present
  databaseReclaimPolicy: retain

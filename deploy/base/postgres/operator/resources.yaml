apiVersion: v1
kind: Namespace
metadata:
  name: "${cnpg_operator_namespace}"
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cnpg
  namespace: "${cnpg_operator_namespace}"
spec:
  interval: 1h
  url: https://raw.githubusercontent.com/cloudnative-pg/charts/refs/heads/gh-pages/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
  namespace: "${cnpg_operator_namespace}"
spec:
  interval: 30m
  # Version pinned in versions.yaml (cnpg_version), Renovate-tracked; stamped into
  # the config artifact at publish. Literal here until the stamping job lands.
  chart:
    spec:
      chart: cloudnative-pg
      version: "0.28.3"
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: "${cnpg_operator_namespace}"
  install:
    crds: Create
  upgrade:
    crds: CreateReplace

# Single-node CassandraDatacenter in ${scout_extractor_namespace} (owned by
# scout-extractor-foundation, shared with cass-operator). serverVersion pinned in
# versions.yaml (cassandra_server_version); literal until the stamping job lands.
apiVersion: cassandra.datastax.com/v1beta1
kind: CassandraDatacenter
metadata:
  name: '${cassandra_datacenter_name}'
  namespace: '${scout_extractor_namespace}'
spec:
  clusterName: '${cassandra_cluster_name}'
  serverType: cassandra
  serverVersion: '5.0.8'
  size: 1
  storageConfig:
    cassandraDataVolumeClaimSpec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: '${cassandra_storage_size}'
  # Single-node: omit racks so cass-operator uses the default rack and this CR adopts a
  # datacenter's existing default-rack PVC instead of provisioning a fresh empty one.
  resources:
    requests:
      cpu: '${cassandra_cpu_request}'
      memory: '${cassandra_memory_request}'
    limits:
      cpu: '${cassandra_cpu_limit}'
      memory: '${cassandra_memory_limit}'
  systemLoggerResources: ${cassandra_system_logger_resources}
  config:
    jvm-server-options:
      initial_heap_size: '${cassandra_init_heap}'
      max_heap_size: '${cassandra_max_heap}'

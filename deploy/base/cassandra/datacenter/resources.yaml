# Single-node Cassandra datacenter (CassandraDatacenter CR) in the shared
# ${scout_extractor_namespace}. cass-operator and this CR share that namespace
# (the operator base creates it), so it is not re-declared here — unlike
# elasticsearch, whose operator sits in a separate namespace. serverVersion is
# pinned in versions.yaml (cassandra_server_version); literal until the stamping
# job lands.
apiVersion: cassandra.datastax.com/v1beta1
kind: CassandraDatacenter
metadata:
  name: '${cassandra_datacenter_name}'
  namespace: '${scout_extractor_namespace}'
spec:
  clusterName: '${cassandra_cluster_name}'
  serverType: cassandra
  serverVersion: '5.0.8'
  size: 1
  storageConfig:
    cassandraDataVolumeClaimSpec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: '${cassandra_storage_size}'
  racks:
    - name: r1
  resources:
    requests:
      cpu: '${cassandra_cpu_request}'
      memory: '${cassandra_memory_request}'
    limits:
      cpu: '${cassandra_cpu_limit}'
      memory: '${cassandra_memory_limit}'
  systemLoggerResources: ${cassandra_system_logger_resources}
  config:
    jvm-server-options:
      initial_heap_size: '${cassandra_init_heap}'
      max_heap_size: '${cassandra_max_heap}'

apiVersion: v1
kind: Namespace
metadata:
  name: "${scout_extractor_namespace}"
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: k8ssandra
  namespace: "${scout_extractor_namespace}"
spec:
  interval: 1h
  url: https://helm.k8ssandra.io/stable
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cass-operator
  namespace: "${scout_extractor_namespace}"
spec:
  interval: 30m
  # Version pinned in versions.yaml (cass_operator_version), Renovate-tracked;
  # stamped into the config artifact at publish. Literal here until the stamping
  # job lands.
  chart:
    spec:
      chart: cass-operator
      version: "0.66.0"
      sourceRef:
        kind: HelmRepository
        name: k8ssandra
        namespace: "${scout_extractor_namespace}"
  install:
    crds: Create
  upgrade:
    crds: CreateReplace

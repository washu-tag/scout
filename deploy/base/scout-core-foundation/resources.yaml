# Per-namespace foundation (ADR 0031): sole owner of the ${scout_core_namespace}
# Namespace, shared by postgres-cluster, keycloak, and valkey (all resolve to
# scout_core_namespace). Co-declaring it across their prune:true Kustomizations would
# let a mistimed prune cascade-delete the namespace, so each dependsOn this foundation.
# No shared HelmRepository here, only the Namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: '${scout_core_namespace}'
  annotations:
    # Never prune the namespace: a namespace DELETION cascades to its PVCs -> PVs ->
    # volumes, which the Database/CR-level reclaim guards don't stop. The stateful data
    # lives here (postgres). Removing scout leaves the namespace, deliberately.
    kustomize.toolkit.fluxcd.io/prune: disabled

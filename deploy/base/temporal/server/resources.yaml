# Temporal server (ingest-slice orchestrator). Persistence is PostgreSQL for both the
# default (history) and visibility stores (ADR 0036; Temporal 1.20+ serves advanced
# visibility on SQL, so no Cassandra/Elasticsearch). Both stores resolve to
# ${postgres_host} (CNPG on-prem, RDS on aws), so dependsOn postgres-ready.
# Namespace owned by scout-extractor-foundation, not declared here (avoids
# co-ownership/prune conflicts). DB password referenced by fixed name (existingSecret).
#
# Auth matches the Ansible temporal_oidc_enabled default: frontend JWT authz on the
# realm `temporal` client's `permissions` claim, plus the UI's own OIDC login with that
# client (secret from the fixed-name temporal-web-oidc Secret). Workers, bootstrap and
# admintools use the internal frontend, which skips authz. Web ingress is mode-selected
# via temporal-edge-${service_mode} (edge.yaml).
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: temporal
  namespace: '${scout_extractor_namespace}'
spec:
  interval: 1h
  url: https://raw.githubusercontent.com/temporalio/helm-charts/refs/heads/gh-pages/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: temporal
  namespace: '${scout_extractor_namespace}'
spec:
  interval: 30m
  # The chart's schema-setup Jobs (setup-schema + update-schema on both Postgres
  # stores) run at install and take a while.
  timeout: 15m
  # Pinned in versions.yaml (temporal_version), Renovate-tracked there. Literal
  # mirror, not stamped (stamper covers only Scout charts); keep in lockstep.
  chart:
    spec:
      chart: temporal
      version: '1.2.0'
      sourceRef:
        kind: HelmRepository
        name: temporal
        namespace: '${scout_extractor_namespace}'
  valuesFrom:
    - kind: ConfigMap
      name: 'temporal-edge-${service_mode}'
  values:
    # k3s/air-gapped: no docker-in-schema-job, no ES index tool (Postgres visibility).
    shims:
      dockerize: false
      elasticsearchTool: false
    server:
      replicaCount: 1
      # Dev defaults for all server roles; overlays tune.
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 2
          memory: 2Gi
      # Internal frontend bypasses public-frontend authz; bootstrap Job + workers use it.
      internal-frontend:
        enabled: true
      config:
        namespaces:
          create: true
        authorization:
          jwtKeyProvider:
            keySourceURIs:
              - '${keycloak_internal_url}/realms/${keycloak_realm_name}/protocol/openid-connect/certs'
            refreshInterval: 1m
          permissionsClaimName: permissions
          authorizer: default
          claimMapper: default
        persistence:
          defaultStore: default
          visibilityStore: visibility
          # DBs are pre-created (CNPG Database CRs on-prem, the site on aws), so
          # createDatabase: false; the chart's schema Job owns the Temporal tables
          # (manageSchema: true). user is the temporal CNPG role.
          datastores:
            default:
              sql:
                pluginName: postgres12
                databaseName: temporal
                connectAddr: '${postgres_host}:${db_port}'
                connectProtocol: tcp
                user: temporal
                existingSecret: temporal-db-secret
                secretKey: password
                createDatabase: false
                manageSchema: true
                maxConns: 20
                maxConnLifetime: '1h'
            visibility:
              sql:
                pluginName: postgres12
                databaseName: temporal_visibility
                connectAddr: '${postgres_host}:${db_port}'
                connectProtocol: tcp
                user: temporal
                existingSecret: temporal-db-secret
                secretKey: password
                createDatabase: false
                manageSchema: true
                maxConns: 10
                maxConnLifetime: '1h'
    web:
      additionalEnv:
        - name: TEMPORAL_AUTH_ENABLED
          value: 'true'
        - name: TEMPORAL_AUTH_PROVIDER_URL
          value: '${keycloak_realm_url}'
        - name: TEMPORAL_AUTH_CLIENT_ID
          value: temporal
        - name: TEMPORAL_AUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: temporal-web-oidc
              key: client-secret
        - name: TEMPORAL_AUTH_CALLBACK_URL
          value: 'https://temporal.${server_hostname}/auth/sso/callback'
        # The UI splits this on commas.
        - name: TEMPORAL_AUTH_SCOPES
          value: openid,email,profile

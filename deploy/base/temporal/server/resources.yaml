# Temporal server (ingest-slice orchestrator). Persistence is PostgreSQL for both the
# default (history) and visibility stores (ADR 0036; Temporal 1.20+ serves advanced
# visibility on SQL, so no Cassandra/Elasticsearch). Both stores resolve to
# ${postgres_host} (CNPG on-prem, RDS on aws), so dependsOn postgres-ready.
# Namespace owned by scout-extractor-foundation, not declared here (avoids
# co-ownership/prune conflicts). Frontend JWT authz + web-UI ingress/OIDC are
# omitted (separate Keycloak-realm/auth-overlay workstream), which is why Keycloak
# is not a dependsOn. DB auth is site-selected via temporal_db_auth (db-auth.yaml).
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: temporal
  namespace: '${scout_extractor_namespace}'
spec:
  interval: 1h
  url: https://raw.githubusercontent.com/temporalio/helm-charts/refs/heads/gh-pages/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: temporal
  namespace: '${scout_extractor_namespace}'
spec:
  interval: 30m
  # The chart's schema-setup Jobs (setup-schema + update-schema on both Postgres
  # stores) run at install and take a while.
  timeout: 15m
  # Pinned in versions.yaml (temporal_version), Renovate-tracked there. Literal
  # mirror, not stamped (stamper covers only Scout charts); keep in lockstep.
  chart:
    spec:
      chart: temporal
      version: '1.2.0'
      sourceRef:
        kind: HelmRepository
        name: temporal
        namespace: '${scout_extractor_namespace}'
  # DB user/credentials + schema ownership come from the temporal_db_auth variant
  # (password by default, or RDS IAM); inline values would override them.
  valuesFrom:
    - kind: ConfigMap
      name: 'temporal-db-auth-${temporal_db_auth:=password}'
  values:
    # k3s/air-gapped: no docker-in-schema-job, no ES index tool (Postgres visibility).
    shims:
      dockerize: false
      elasticsearchTool: false
    server:
      replicaCount: 1
      # Dev defaults for all server roles; overlays tune.
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 2
          memory: 2Gi
      # Internal frontend bypasses public-frontend authz; bootstrap Job + workers use it.
      internal-frontend:
        enabled: true
      config:
        namespaces:
          create: true
        persistence:
          defaultStore: default
          visibilityStore: visibility
          # DBs are pre-created (CNPG Database CRs on-prem, the site on aws), so
          # createDatabase: false.
          datastores:
            default:
              sql:
                pluginName: postgres12
                databaseName: temporal
                connectAddr: '${postgres_host}:${db_port}'
                connectProtocol: tcp
                createDatabase: false
                maxConns: 20
                maxConnLifetime: '1h'
            visibility:
              sql:
                pluginName: postgres12
                databaseName: temporal_visibility
                connectAddr: '${postgres_host}:${db_port}'
                connectProtocol: tcp
                createDatabase: false
                maxConns: 10
                maxConnLifetime: '1h'

# Mode-agnostic storage join point (ADR 0035). The lake consumers (hive, trino,
# extractor, opa) dependsOn a Kustomization named `storage-ready`; that name is
# provided per-mode from flux/edge-${service_mode} (NOT the shared DAG), so the edge
# resolves in both modes with no dangling ref and no name collision:
#   - aws: a storage-ready Kustomization points here -- this inert, immediately-Ready
#     marker (the lake is S3+IRSA; nothing to stand up), so consumers proceed.
#   - on-prem: the storage-ready Kustomization IS the real MinIO tenant (wait:true),
#     so consumers genuinely wait for buckets + IAM before starting.
# This ConfigMap deploys nothing functional; it just gives wait:true a concrete,
# instantly-Ready object in aws.
apiVersion: v1
kind: ConfigMap
metadata:
  name: storage-ready
  namespace: flux-system
data:
  mode: '${service_mode}'

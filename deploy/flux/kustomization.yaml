apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Shared, mode-agnostic Flux DAG (ADR 0035): a site reconciles this set via
# path: ./flux UNION exactly one mode subdir (./flux/aws or ./flux/on-prem).
# EXPLICIT resources, NOT a recursive dir build: a Flux Kustomization whose path
# has no kustomization.yaml builds recursively and pulls in BOTH mode subdirs,
# which each define `storage-ready` -> "already registered id: storage-ready"
# build failure. The mode sets are reconciled on their own paths (aws/, on-prem/).
resources:
  - cassandra.yaml
  - elasticsearch.yaml
  - extractor.yaml
  - foundations.yaml
  - hive.yaml
  - keycloak.yaml
  - opa.yaml
  - postgres.yaml
  - superset.yaml
  - temporal.yaml
  - trino.yaml
  - valkey.yaml

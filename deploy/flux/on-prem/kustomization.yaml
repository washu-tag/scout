apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# on-prem mode-specific Flux set (ADR 0035). NOT in the shared deploy/flux/; an
# on-prem site reconciles this dir via one Kustomization pointing at ./flux/on-prem.
# Provides the real MinIO (operator + tenant, the tenant named `storage-ready` so the
# lake consumers wait on it), the oauth2-proxy workload (aws gates at the ALB
# instead), and the Traefik forwardAuth ingress edge. The aws counterpart is ../aws.
resources:
  - minio.yaml
  - oauth2-proxy.yaml
  - edge.yaml

# Flux Kustomization for oauth2-proxy (Phase 3 DAG). config artifact (OCIRepository
# scout-config) + cluster-vars ${...} subst; dependsOn reproduces Ansible order.

apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: oauth2-proxy
  namespace: flux-system
spec:
  interval: 30m
  path: ./base/oauth2-proxy
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: OCIRepository
    name: scout-config
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  dependsOn:
    - name: valkey
    - name: keycloak-realm

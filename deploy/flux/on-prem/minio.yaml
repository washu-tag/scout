# on-prem MinIO (Phase 3 DAG). operator split from tenant so a CR never reconciles
# before its CRDs exist (ADR: the CRD-ordering deadlock). The tenant is named
# `storage-ready` -- the mode-agnostic gate the shared lake consumers dependsOn -- so
# on-prem they genuinely wait for buckets + IAM (wait:true). aws provides
# storage-ready as an inert marker instead (../aws/storage.yaml).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: minio-operator
  namespace: flux-system
spec:
  interval: 30m
  path: ./base/minio/operator
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: OCIRepository
    name: scout-config
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  dependsOn:
    - name: scout-operators-foundation
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: storage-ready
  namespace: flux-system
spec:
  interval: 30m
  path: ./base/minio/tenant
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: OCIRepository
    name: scout-config
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  dependsOn:
    - name: scout-data-foundation
    - name: minio-operator

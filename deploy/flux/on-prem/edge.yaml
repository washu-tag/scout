# on-prem ingress/auth edge: the oauth2-proxy Traefik forwardAuth Middlewares
# (Traefik CRDs an aws cluster has no controller for). dependsOn oauth2-proxy since
# the Middlewares route to its Service.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: edge-on-prem
  namespace: flux-system
spec:
  interval: 30m
  path: ./base/edge-on-prem
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: OCIRepository
    name: scout-config
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  dependsOn:
    - name: oauth2-proxy

# Flux Kustomizations for cassandra (Phase 3 DAG). Pull config artifact (OCIRepository
# scout-config) + cluster-vars for ${...} subst; dependsOn reproduces Ansible order.
# CRD-owning operator is split so the CR never reconciles before its CRDs exist.

apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cassandra-operator
  namespace: flux-system
spec:
  interval: 30m
  path: ./base/cassandra/operator
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: OCIRepository
    name: scout-config
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  dependsOn:
    - name: scout-extractor-foundation
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cassandra-datacenter
  namespace: flux-system
spec:
  interval: 30m
  path: ./base/cassandra/datacenter
  prune: true
  wait: true
  timeout: 20m
  sourceRef:
    kind: OCIRepository
    name: scout-config
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  dependsOn:
    - name: scout-extractor-foundation
    - name: cassandra-operator
  healthCheckExprs:
    - apiVersion: cassandra.datastax.com/v1beta1
      kind: CassandraDatacenter
      current: status.cassandraOperatorProgress == 'Ready'

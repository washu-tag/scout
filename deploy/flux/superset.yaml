# Flux Kustomizations for superset (Phase 3 DAG). Source OCIRepository scout-config
# + cluster-vars for ${...} subst; dependsOn reproduces Ansible order.

apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: superset-server
  namespace: flux-system
spec:
  interval: 30m
  path: ./base/superset/server
  prune: true
  wait: true
  timeout: 15m
  sourceRef:
    kind: OCIRepository
    name: scout-config
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  dependsOn:
    - name: scout-analytics-foundation
    - name: postgres-ready
    - name: valkey
    - name: trino-ro
    - name: keycloak-realm
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: superset-dashboards
  namespace: flux-system
spec:
  interval: 30m
  path: ./base/superset/dashboards
  prune: true
  wait: true
  timeout: 15m
  sourceRef:
    kind: OCIRepository
    name: scout-config
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  dependsOn:
    - name: scout-analytics-foundation
    - name: superset-server

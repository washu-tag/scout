# Flux Kustomizations for keycloak (Phase 3 DAG). Pulls config artifact (OCIRepository
# scout-config) + cluster-vars for ${...} subst; dependsOn reproduces Ansible order.

apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keycloak-operator
  namespace: flux-system
spec:
  interval: 30m
  path: ./base/keycloak/operator
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: OCIRepository
    name: scout-config
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  dependsOn:
    - name: scout-core-foundation
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keycloak-instance
  namespace: flux-system
spec:
  interval: 30m
  path: ./base/keycloak/instance
  prune: true
  wait: true
  timeout: 15m
  sourceRef:
    kind: OCIRepository
    name: scout-config
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  dependsOn:
    - name: scout-core-foundation
    - name: keycloak-operator
    - name: postgres-ready
  healthCheckExprs:
    - apiVersion: k8s.keycloak.org/v2beta1
      kind: Keycloak
      current: status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
---
# The realm: the base realm document (keycloak-config-cli) and the reconciler that
# applies it (scout-app-manager). Split from keycloak-instance so this dependsOn
# gates it on Keycloak Ready (the instance's healthCheckExprs) -- the import runs
# only after the CR is up, no first-boot race.
#
# oauth2-proxy/trino-ro/superset/launchpad dependsOn this. What that buys them has
# narrowed since ADR 0037 made the reconciler the realm's only writer: Ready here
# means the *base* realm has been applied, which is the closed set of clients this
# artifact declares. A client shipped as a component's fragment is not covered --
# by design, since gating the realm on a fragment the realm does not know about is
# a cycle. Those arrive within a reconcile of the component's own manifests
# landing, which is after this.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keycloak-realm
  namespace: flux-system
spec:
  interval: 30m
  path: ./base/keycloak/realm
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: OCIRepository
    name: scout-config
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  dependsOn:
    - name: keycloak-instance
  # Named explicitly rather than left to `wait: true`, which health-checks every
  # applied object. The two HelmReleases are the whole of it, and the app manager's
  # is the one that matters: its Deployment is Ready only once *that process* has
  # reconciled the realm successfully, so this Kustomization going Ready means the
  # realm was applied -- not merely that a document was written.
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: keycloak-config-cli
      namespace: '${keycloak_namespace}'
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: scout-app-manager
      namespace: '${keycloak_namespace}'

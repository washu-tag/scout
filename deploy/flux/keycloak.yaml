# Flux Kustomizations for keycloak (Phase 3 DAG). Pulls config artifact (OCIRepository
# scout-config) + cluster-vars for ${...} subst; dependsOn reproduces Ansible order.

# Keycloak Operator + CRDs straight from the release, as the upstream Helm charts in
# deploy/ come from their repos. The tag is keycloak_version; Renovate bumps it with the
# rest of Keycloak.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: keycloak-k8s-resources
  namespace: flux-system
spec:
  interval: 1h
  url: https://github.com/keycloak/keycloak-k8s-resources
  ref:
    # renovate: datasource=docker depName=quay.io/keycloak/keycloak
    tag: 26.7.2
  ignore: |
    /*
    !/kubernetes/
---
# Applies the release's own kubernetes/kustomization.yml, so its file set (which changes
# between releases) comes with it. targetNamespace replaces its namespace: keycloak, and
# postBuild resolves ${keycloak_namespace} in the rendered output (upstream's manifests
# carry no $ tokens of their own; one added in a release would fail this build).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keycloak-operator
  namespace: flux-system
spec:
  interval: 30m
  path: ./kubernetes
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: keycloak-k8s-resources
  targetNamespace: ${keycloak_namespace}
  # Flux never prunes the CRDs: deleting one deletes every resource of its kind, the Keycloak
  # CR included, so a CRD a release drops stays until removed by hand.
  patches:
    - target:
        kind: CustomResourceDefinition
      patch: |
        apiVersion: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        metadata:
          name: any
          annotations:
            kustomize.toolkit.fluxcd.io/prune: disabled
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  dependsOn:
    - name: scout-core-foundation
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keycloak-instance
  namespace: flux-system
spec:
  interval: 30m
  path: ./base/keycloak/instance
  prune: true
  wait: true
  timeout: 15m
  sourceRef:
    kind: OCIRepository
    name: scout-config
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  dependsOn:
    - name: scout-core-foundation
    - name: keycloak-operator
    - name: postgres-ready
  healthCheckExprs:
    - apiVersion: k8s.keycloak.org/v2beta1
      kind: Keycloak
      current: status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
---
# Realm import, split from keycloak-instance so this dependsOn gates it on Keycloak
# Ready (the instance's healthCheckExprs) -- the import runs only after the CR is up,
# no first-boot race. oauth2-proxy/trino-ro/superset dependsOn this (they need the
# realm's OIDC clients), not just keycloak-instance.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keycloak-realm
  namespace: flux-system
spec:
  interval: 30m
  path: ./base/keycloak/realm
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: OCIRepository
    name: scout-config
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  dependsOn:
    - name: keycloak-instance

# Flux Kustomizations for minio (Phase 3 DAG). Each pulls the published config
# artifact (OCIRepository scout-config) + cluster-vars for ${...} substitution.
# dependsOn edges reproduce the Ansible deploy order; CRD-owning operators are
# split so a CR never reconciles before its CRDs exist.

apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: minio-operator
  namespace: flux-system
spec:
  interval: 30m
  path: ./deploy/base/minio/operator
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: OCIRepository
    name: scout-config
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: minio-tenant
  namespace: flux-system
spec:
  interval: 30m
  path: ./deploy/base/minio/tenant
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: OCIRepository
    name: scout-config
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  dependsOn:
    - name: minio-operator

# Flux Kustomizations for elasticsearch (Phase 3 DAG). Each pulls the published config
# artifact (OCIRepository scout-config) + cluster-vars for ${...} substitution.
# dependsOn edges reproduce the Ansible deploy order; CRD-owning operators are
# split so a CR never reconciles before its CRDs exist.

apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: elasticsearch-operator
  namespace: flux-system
spec:
  interval: 30m
  path: ./deploy/base/elasticsearch/operator
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: OCIRepository
    name: scout-config
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: elasticsearch-cluster
  namespace: flux-system
spec:
  interval: 30m
  path: ./deploy/base/elasticsearch/cluster
  prune: true
  wait: true
  timeout: 15m
  sourceRef:
    kind: OCIRepository
    name: scout-config
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  dependsOn:
    - name: elasticsearch-operator
  healthCheckExprs:
    - apiVersion: elasticsearch.k8s.elastic.co/v1
      kind: Elasticsearch
      current: status.phase == 'Ready'

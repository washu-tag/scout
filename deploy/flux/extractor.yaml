# Flux Kustomizations for extractor (Phase 3 DAG). Pulls config artifact
# (OCIRepository scout-config) + cluster-vars for ${...} substitution. dependsOn
# reproduces Ansible deploy order; CRD-owning operators split from their CRs.

apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: extractor
  namespace: flux-system
spec:
  interval: 30m
  path: ./base/extractor
  prune: true
  wait: true
  timeout: 15m
  sourceRef:
    kind: OCIRepository
    name: scout-config
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  dependsOn:
    - name: scout-extractor-foundation
    # Ingest DB + owner role now provisioned on the shared CNPG cluster (its health
    # gate waits for the Database); postgres-ready replaces the old extractor-db-init edge.
    - name: postgres-ready
    - name: storage-ready
    # hl7-transformer values hardwire the metastore URI + TRINO_HOST, so wait for both.
    - name: hive-metastore
    - name: trino-rw
    - name: temporal-bootstrap

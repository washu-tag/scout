# Flux Kustomizations for extractor (Phase 3 DAG). Each pulls the published config
# artifact (OCIRepository scout-config) + cluster-vars for ${...} substitution.
# dependsOn edges reproduce the Ansible deploy order; CRD-owning operators are
# split so a CR never reconciles before its CRDs exist.

apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: extractor
  namespace: flux-system
spec:
  interval: 30m
  path: ./deploy/base/extractor
  prune: true
  wait: true
  timeout: 15m
  sourceRef:
    kind: OCIRepository
    name: scout-config
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  dependsOn:
    - name: postgres-cluster
    - name: minio-tenant
    - name: temporal-bootstrap

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# aws mode-specific Flux set (ADR 0035). NOT in the shared, non-recursively
# kubectl-applied deploy/flux/; an aws site reconciles this dir via one Kustomization
# pointing at ./flux/aws. Provides the mode-agnostic `storage-ready` gate (inert here;
# the lake is S3+IRSA) and the ALB-native-OIDC ingress edge. The on-prem counterpart
# (real MinIO + Traefik + oauth2-proxy) is ../on-prem.
resources:
  - storage.yaml
  - edge.yaml

# aws ingress/auth edge: public ALB-native-OIDC Ingresses (keycloak un-gated +
# admin fixed-response; superset, launchpad and temporal ALB-OIDC) + the LBC
# secret-reader RBAC. dependsOn the app Kustomizations so the backing Services exist
# before the ALB provisions.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: edge-aws
  namespace: flux-system
spec:
  interval: 30m
  path: ./base/edge-aws
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: OCIRepository
    name: scout-config
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  dependsOn:
    - name: keycloak-instance
    - name: superset-server
    # Not temporal-server: its UI exits until keycloak-alb (built here) serves OIDC
    # discovery, so waiting on it would deadlock a fresh install.

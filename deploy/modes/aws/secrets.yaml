# aws secrets gate: the site materializes every fixed-name Secret itself (External
# Secrets Operator), so `secrets-ready` is an inert, immediately-Ready marker. Same name
# the shared consumers dependsOn; on-prem renders the Secrets instead (../on-prem).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets-ready
  namespace: flux-system
spec:
  interval: 30m
  path: ./base/secrets-ready
  prune: true
  wait: true
  timeout: 2m
  sourceRef:
    kind: OCIRepository
    name: scout-config
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars

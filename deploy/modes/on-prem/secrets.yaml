# on-prem secrets gate: renders the fixed-name Secrets (base/secrets-on-prem) from the
# site's scout-secret-values Secret, ahead of postgres-ready because CNPG silently creates
# a passwordless role when a passwordSecret is missing. aws: an inert marker (../aws).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets-ready
  namespace: flux-system
spec:
  interval: 30m
  path: ./base/secrets-on-prem
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: OCIRepository
    name: scout-config
  postBuild:
    # sq is the quote wrapper the templates use (see base/secrets-on-prem). Inline
    # values override the substituteFrom sources, so a site cannot redefine it.
    substitute:
      sq: "'"
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
      - kind: Secret
        name: scout-secret-values
  dependsOn:
    - name: scout-core-foundation
    - name: scout-data-foundation
    - name: scout-extractor-foundation
    - name: scout-analytics-foundation

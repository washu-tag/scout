# on-prem elasticsearch: self-hosted ECK (ADR 0036). Operator (L1) then the Elasticsearch
# CR as the mode-agnostic `es-ready` gate (L2a), split so the CR never reconciles before the
# ECK CRDs exist. aws provides es-ready as an inert marker (managed OpenSearch) instead
# (../aws). The ES consumer (temporal) dependsOn es-ready in both modes.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: elasticsearch-operator
  namespace: flux-system
spec:
  interval: 30m
  path: ./base/elasticsearch/operator
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: OCIRepository
    name: scout-config
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  dependsOn:
    - name: scout-operators-foundation
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: es-ready
  namespace: flux-system
spec:
  interval: 30m
  path: ./base/elasticsearch/cluster
  prune: true
  wait: true
  timeout: 15m
  sourceRef:
    kind: OCIRepository
    name: scout-config
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  dependsOn:
    - name: scout-extractor-foundation
    - name: elasticsearch-operator
  healthCheckExprs:
    - apiVersion: elasticsearch.k8s.elastic.co/v1
      kind: Elasticsearch
      current: status.phase == 'Ready'

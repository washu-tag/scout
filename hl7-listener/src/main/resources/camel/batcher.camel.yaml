# Batcher route: consume HL7 messages from Kafka in batches, zip each batch, upload it to object
# storage (bronze), publish the archive's S3 key back to Kafka as a manifest, then commit.
#
# Uses the Camel Kafka batching consumer (batching=true): it accumulates records across polls
# until maxPollRecords OR pollTimeoutMs of inactivity, then delivers the whole batch as one
# exchange (body = List of child exchanges). That lets hl7BatchZipper build the archive in a
# single O(n) pass instead of the O(n^2) rewrite ZipAggregationStrategy incurs per message.
#
# Delivery is at-least-once: autoCommitEnable=false + allowManualCommit=true, and
# kafkaBatchCommitter commits the batch's offsets only at the very end — after the S3 upload and
# manifest publish succeed. A crash mid-batch therefore replays the batch rather than dropping it
# (auto-commit would advance offsets as records enter the route, before the durable write).
#
# breakOnFirstError=true extends that to a batch that fails without a crash (e.g. an S3 upload
# timeout): Camel reconnects the consumer, which resumes from the last committed offset and
# redelivers the batch. Without it Camel logs the failure, discards the batch and keeps polling,
# and the next successful batch commits past the failed one, so it never reaches bronze. A batch
# that keeps failing therefore stalls the batcher (consumer lag grows, Kafka holds the records)
# until the cause is fixed, instead of leaving gaps.
#
# Camel reconnects without a delay, so with a backlog a failing batch would be retried
# back-to-back. The route-scoped onException below pauses before letting the failure through,
# capping retries at about one per hl7.batcher.retry.delay.ms. The pause and the upload attempt
# both run between Kafka polls, and an upload against stalled storage can take 3 minutes to fail,
# so maxPollIntervalMs raises Kafka's 5-minute default, past which the broker evicts the consumer.
#
# Config values are Camel property placeholders resolved from the Deployment env.
#
# Canonical YAML DSL (camel validate normalize); Camel 4.22 warns on the compact form.
- route:
    id: batchHl7Messages
    from:
      uri: kafka
      parameters:
        topic: '{{kafka.hl7.topic}}'
        brokers: '{{kafka.brokers}}'
        groupId: '{{hl7.batcher.group.id}}'
        autoOffsetReset: earliest
        batching: true
        allowManualCommit: true
        autoCommitEnable: false
        breakOnFirstError: true
        maxPollIntervalMs: 900000
        maxPollRecords: '{{hl7.batcher.max.poll.records}}'
        pollTimeoutMs: '{{hl7.batcher.poll.timeout.ms}}'
        batchingIntervalMs: '{{hl7.batcher.batching.interval.ms}}'
      steps:
        # Not handled: after the pause the batch still fails, so breakOnFirstError redelivers it.
        - onException:
            exception:
              - java.lang.Exception
            steps:
              - log:
                  message: 'Batch failed, retrying after {{hl7.batcher.retry.delay.ms:60000}} ms: ${exception.message}'
                  loggingLevel: WARN
              - delay:
                  expression:
                    constant:
                      expression: '{{hl7.batcher.retry.delay.ms:60000}}'
        - setHeader:
            name: CamelAwsS3Key
            expression:
              simple:
                expression: 'hl7-batches/${date:now:yyyy/MM/dd}/batch-${date:now:HHmmssSSS}.zip'
        - process:
            ref: hl7BatchZipper
        - log:
            message: 'Uploading batch to S3: bucket={{s3.bucket}}, key=${header.CamelAwsS3Key}'
        - to:
            uri: aws2-s3
            parameters:
              bucketNameOrArn: '{{s3.bucket}}'
              region: '{{aws.region}}'
              useDefaultCredentialsProvider: '{{s3.use.default.creds}}'
              overrideEndpoint: '{{s3.override.endpoint}}'
              uriEndpointOverride: '{{s3.endpoint:}}'
              forcePathStyle: '{{s3.force.path.style}}'
              useSSES3: '{{s3.use.sse.s3:false}}'
              accessKey: 'RAW({{aws.access.key:}})'
              secretKey: 'RAW({{aws.secret.key:}})'
        - log:
            message: 'S3 upload successful: ${header.CamelAwsS3Key}, eTag=${header.CamelAwsS3ETag}'
        - setBody:
            expression:
              simple:
                expression: '${header.CamelAwsS3Key}'
        - to:
            uri: kafka
            parameters:
              topic: '{{kafka.hl7.batches.topic}}'
              brokers: '{{kafka.brokers}}'
        - log:
            message: 'Published batch manifest to Kafka: topic={{kafka.hl7.batches.topic}}, s3Key=${body}'
        - process:
            ref: kafkaBatchCommitter

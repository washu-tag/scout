# MLLP listener route: accept HL7 v2 over MLLP, parse, key by message control id, and
# publish to Kafka. Config values are Camel property placeholders resolved at runtime from
# environment variables set on the Deployment (see the hl7-listener Ansible role).

# Dead letter: a frame HAPI cannot parse is archived rather than discarded, so there is
# something to inspect afterwards instead of only a log line. onException must come before
# any route in the same RouteBuilder or the context will not start.
#
# Scoped to HL7Exception deliberately: transport failures must keep failing the exchange so
# MLLP NAKs and the sender queues, which is the backpressure ADR 0028 relies on.
#
# Two thresholds apply to an inbound frame and they do not coincide:
#   - no MSH-12 (version): HAPI cannot parse it. Archived here, and still acknowledged.
#   - under 10 MSH fields: Camel cannot build any response out of the header either, so the
#     exchange fails after this handler has already archived the frame, and the sender gets
#     nothing back. It may retransmit, each attempt archived again, and retrying can never
#     succeed because the outcome is deterministic.
#
# The second case is not introduced here -- a NAK is built from the same header a positive
# ACK is -- and it needs a correctly framed payload carrying a non-conformant MSH: every HL7
# version requires MSH-9 and MSH-10, so a real message has at least 10 fields. The
# hl7-dead-letter-burst alert is what catches it if it ever happens.
- onException:
    exception:
      - ca.uhn.hl7v2.HL7Exception
    handled:
      constant: 'true'
    steps:
      - log:
          message: 'Unparseable HL7 frame from ${header.CamelMllpRemoteAddress}, archiving raw: ${exception.message}'
          loggingLevel: WARN
      # Body is still what MLLP delivered; unmarshal throws before replacing it. No kafka.KEY,
      # so Hl7BatchZipper names the entry unknown-<exchangeId>.hl7.
      - to:
          uri: 'kafka:{{kafka.hl7.topic}}?brokers={{kafka.brokers}}'
      # Handling the exception takes these out of camel_exchanges_failed_total, so count them
      # here or the condition goes invisible.
      - to:
          uri: 'micrometer:counter:hl7.dead.letter'

- route:
    id: hl7Listener
    from:
      uri: 'mllp://0.0.0.0:{{hl7.listener.port}}'
      steps:
        - log:
            message: 'Received HL7 message from ${header.CamelMllpRemoteAddress}'
            loggingLevel: INFO
        # Validation off so bronze captures a message even when it violates HAPI's
        # version-conformance rules; with it on, those were answered MSA|AE and lost.
        - unmarshal:
            hl7:
              validate: false
        - log:
            message: 'Parsed HL7 message: controlId=${header.CamelHL7MessageControl}, type=${header.CamelHL7TriggerEvent}, version=${header.CamelHL7VersionId}'
            loggingLevel: INFO
        - setHeader:
            name: kafka.KEY
            expression:
              header: CamelHL7MessageControl
        - to:
            uri: 'kafka:{{kafka.hl7.topic}}?brokers={{kafka.brokers}}'
        - log:
            message: 'Sent to Kafka: topic={{kafka.hl7.topic}}, key=${header.kafka.KEY}'
            loggingLevel: INFO

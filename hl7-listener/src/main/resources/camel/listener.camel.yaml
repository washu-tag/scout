# MLLP listener route: accept HL7 v2 over MLLP, parse, key by message control id, and
# publish to Kafka. Config values are Camel property placeholders resolved at runtime from
# environment variables set on the Deployment (see the hl7-listener Ansible role).

# Dead letter: a frame HAPI cannot parse is archived rather than discarded, so it can be
# inspected afterwards instead of leaving only a log line. Scoped to HL7Exception on purpose:
# transport failures must keep failing the exchange so MLLP NAKs and the upstream interface
# engine queues, which is the backpressure ADR 0028 relies on. Camel requires onException
# ahead of any route in the same RouteBuilder.
#
# A frame whose MSH is too damaged to build an acknowledgement from is archived here too, but
# Camel then fails the exchange when it cannot generate the ACK, so the sender gets no
# response and may retransmit -- each retry archived again. Only reachable from input an
# interface engine does not send.
- onException:
    exception:
      - ca.uhn.hl7v2.HL7Exception
    handled:
      constant: 'true'
    steps:
      # Exception type, not its message: the frame itself is archived below, and HAPI messages
      # can quote field content, which must not reach the logs.
      - log:
          message: 'Unparseable HL7 frame from ${header.CamelMllpRemoteAddress}, archiving raw (${exception.class.simpleName})'
          loggingLevel: WARN
      # Body is still what MLLP delivered; unmarshal throws before replacing it. No kafka.KEY,
      # so Hl7BatchZipper names the entry unknown-<exchangeId>.hl7.
      - to:
          uri: 'kafka:{{kafka.hl7.topic}}?brokers={{kafka.brokers}}'
      # Handling the exception takes these out of camel_exchanges_failed_total, so count them
      # here or the condition goes invisible.
      - to:
          uri: 'micrometer:counter:hl7.dead.letter'

- route:
    id: hl7Listener
    from:
      uri: 'mllp://0.0.0.0:{{hl7.listener.port}}'
      steps:
        - log:
            message: 'Received HL7 message from ${header.CamelMllpRemoteAddress}'
            loggingLevel: INFO
        # Validation off so bronze captures a message even when it violates HAPI's
        # version-conformance rules; with it on, those were answered MSA|AE and lost.
        - unmarshal:
            hl7:
              validate: false
        - log:
            message: 'Parsed HL7 message: controlId=${header.CamelHL7MessageControl}, type=${header.CamelHL7TriggerEvent}, version=${header.CamelHL7VersionId}'
            loggingLevel: INFO
        - setHeader:
            name: kafka.KEY
            expression:
              header: CamelHL7MessageControl
        - to:
            uri: 'kafka:{{kafka.hl7.topic}}?brokers={{kafka.brokers}}'
        - log:
            message: 'Sent to Kafka: topic={{kafka.hl7.topic}}, key=${header.kafka.KEY}'
            loggingLevel: INFO

# MLLP listener route: accept HL7 v2 over MLLP, parse, key by message control id, and
# publish to Kafka. Config values are Camel property placeholders resolved at runtime from
# environment variables set on the Deployment (see the hl7-listener Ansible role).
- route:
    id: hl7Listener
    from:
      uri: 'mllp://0.0.0.0:{{hl7.listener.port}}'
      steps:
        - log:
            message: 'Received HL7 message from ${header.CamelMllpRemoteAddress}'
            loggingLevel: INFO
        # Content validation is off deliberately. HAPI's default validation rejects a
        # message that populates a field its declared version has withdrawn (PID-9 and
        # PID-12 at v2.7, for example). That failed the exchange, so MLLP answered MSA|AE
        # and the message never reached Kafka or bronze -- lost, not quarantined -- and
        # the exception embedded the offending field's value in the service log. Bronze
        # has to capture a message whether or not it satisfies a content-usage rule;
        # parsing and validation belong downstream of collection. This route only needs
        # MSH-10 for the Kafka key and the header values it logs below.
        - unmarshal:
            hl7:
              validate: false
        - log:
            message: 'Parsed HL7 message: controlId=${header.CamelHL7MessageControl}, type=${header.CamelHL7TriggerEvent}, version=${header.CamelHL7VersionId}'
            loggingLevel: INFO
        - setHeader:
            name: kafka.KEY
            expression:
              header: CamelHL7MessageControl
        - to:
            uri: 'kafka:{{kafka.hl7.topic}}?brokers={{kafka.brokers}}'
        - log:
            message: 'Sent to Kafka: topic={{kafka.hl7.topic}}, key=${header.kafka.KEY}'
            loggingLevel: INFO

{{- with .Values.reportViewerAction }}
{{- if .enabled }}
{{- $fullname := include "xnat-explore-poc.fullname" $ }}
{{- $rvNamespace := required "networkPolicy.reportViewerNamespace is required" $.Values.networkPolicy.reportViewerNamespace }}
# This service's button, discovered by report-viewer (ADR 0039). The token stays
# in secret.yaml's Secret; report-viewer's ServiceAccount may get that one
# Secret and nothing else in this namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-report-viewer-actions
  labels:
    {{- include "xnat-explore-poc.labels" $ | nindent 4 }}
    report-viewer.scout.xnat.org/actions: 'true'
data:
  actions.yaml: |
    apiVersion: report-viewer.scout.xnat.org/v1alpha1
    kind: ActionCatalog
    actions:
      - id: {{ .id | quote }}
        title: {{ .title | quote }}
        actionType: backend-call
        endpointUrl: {{ printf "http://%s.%s.svc.cluster.local:%v/invoke" $fullname $.Release.Namespace $.Values.service.port | quote }}
        {{- with .requiredRole }}
        requiredRole: {{ . | quote }}
        {{- end }}
        invokeTokenSecret:
          name: {{ $fullname }}
          key: invokeToken
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-invoke-token-reader
  labels:
    {{- include "xnat-explore-poc.labels" $ | nindent 4 }}
rules:
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get]
    resourceNames: [{{ $fullname }}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-invoke-token-reader
  labels:
    {{- include "xnat-explore-poc.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-invoke-token-reader
subjects:
  - kind: ServiceAccount
    name: {{ .reportViewerServiceAccount }}
    namespace: {{ $rvNamespace }}
{{- end }}
{{- end }}

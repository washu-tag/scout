# Issue #739: invokeToken and assertionKey as real Secrets, not plain env
# values - a Deployment's env: value: is visible via `kubectl get
# deployment/pod -o yaml` and `helm get values` to anyone with
# pod/deployment-read RBAC, not just Secret-read. Deliberately different
# values, not one reused for both: invokeToken travels on every /invoke
# call and can leak via logs/traces, while assertionKey never goes over
# the wire - only its signature output does.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "xnat-explore-poc.fullname" . }}
  labels:
    {{- include "xnat-explore-poc.labels" . | nindent 4 }}
type: Opaque
stringData:
  invokeToken: {{ required "invokeToken is required" .Values.invokeToken | quote }}
  assertionKey: {{ required "assertionKey is required" .Values.assertionKey | quote }}

# invokeToken as a real Secret, not a plain env value - a Deployment's
# env: value: is visible via `kubectl get deployment/pod -o yaml` and
# `helm get values` to anyone with pod/deployment-read RBAC, not just
# Secret-read.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "xnat-explore-poc.fullname" . }}
  labels:
    {{- include "xnat-explore-poc.labels" . | nindent 4 }}
type: Opaque
stringData:
  invokeToken: {{ required "invokeToken is required" .Values.invokeToken | quote }}

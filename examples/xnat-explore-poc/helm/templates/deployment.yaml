apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "xnat-explore-poc.fullname" . }}
  labels:
    {{- include "xnat-explore-poc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "xnat-explore-poc.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pod when invokeToken/assertionKey change - env values are only read at start.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "xnat-explore-poc.labels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: landing
              containerPort: {{ .Values.landingPage.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          env:
            - name: XNAT_EXPLORE_POC_PORT
              value: {{ .Values.service.port | quote }}
            - name: XNAT_EXPLORE_POC_LANDING_PAGE_PORT
              value: {{ .Values.landingPage.port | quote }}
            - name: XNAT_EXPLORE_POC_LANDING_BASE_URL
              value: {{ required "landingBaseUrl is required" .Values.landingBaseUrl | quote }}
            - name: XNAT_EXPLORE_POC_INVOKE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "xnat-explore-poc.fullname" . }}
                  key: invokeToken
            - name: XNAT_EXPLORE_POC_ASSERTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "xnat-explore-poc.fullname" . }}
                  key: assertionKey
            {{- if .Values.requiredGroup }}
            - name: XNAT_EXPLORE_POC_REQUIRED_GROUP
              value: {{ .Values.requiredGroup | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{- if .Values.networkPolicy.enabled }}
---
# The app trusts the identity header only because oauth2-proxy set it. Without
# this policy any in-cluster pod could reach the Service directly and forge it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "example.fullname" . }}-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "example.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "example.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.traefikNamespace | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
{{- end }}

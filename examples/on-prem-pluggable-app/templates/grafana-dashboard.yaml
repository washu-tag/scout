---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "example.fullname" . }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "example.labels" . | nindent 4 }}
    grafana_dashboard: '1'
data:
  {{ include "example.fullname" . }}.json: |-
{{ .Files.Get "files/dashboard.json" | indent 4 }}

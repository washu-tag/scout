{{/*
The client credential lives in the app's own namespace and is created by the
app, not by Keycloak: the fragment carries a reference to this Secret, never a
secret. `lookup` preserves the value across upgrades, so `helm upgrade` does not
rotate the credential out from under a running client.
*/}}
{{- if not .Values.existingSecret }}
{{- $name := include "example.clientSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $secret := "" }}
{{- if $existing }}
{{- $secret = index $existing.data "client-secret" | b64dec }}
{{- else if .Values.clientSecret }}
{{- $secret = .Values.clientSecret }}
{{- else }}
{{- $secret = randAlphaNum 40 }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "example.labels" . | nindent 4 }}
type: Opaque
stringData:
  client-secret: {{ $secret | quote }}
{{- end }}

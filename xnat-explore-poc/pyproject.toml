[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "xnat_explore_poc"
version = "0.0.dev0"
description = "Fake backend-call target proving report-viewer's pluggable action mechanism (#739 PoC) - not a real XNAT integration"
requires-python = ">= 3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings>=2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
